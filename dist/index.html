/* --- 貼文編輯器 --- */
function openNoteEditor(o){
  EDIT = {
    id: o.id || null,
    viewId: o.viewId,
    title: o.title || '',
    segs: o.segs && o.segs.length ? o.segs.slice() : [{s: o.scaffold || 's1', text:''}],
    keywords: (o.keywords || []).join('、'),
    authorIds: o.authorIds || [currentUser().id],
    buildOn: o.buildOn || null,
    contains: o.contains || [],
    refs: o.refs || [],
    kind: o.kind || 'note',
    x: o.x, y: o.y
  };
  renderEditor();
}

function renderEditor(){
  const parent = EDIT.buildOn ? getNote(EDIT.buildOn) : null;
  const others = state.notes.filter(function(n){ return n.id !== EDIT.id; });
  modal(
    '<div class="modal-h"><h3>' + (EDIT.id ? '編輯貼文' : (EDIT.kind === 'rise' ? '建立躍升貼文' : (parent ? '延伸：' + esc(parent.title) : '貼一則新想法'))) + '</h3>' +
    '<button class="btn sm ghost" data-act="close-modal">關閉</button></div>' +
    '<div class="modal-b col">' +
    (parent ? '<div class="ai-out small"><strong>你正在延伸：</strong>' + esc(parent.title) + '<br>' +
      esc(shortStem(noteText(parent))) + '</div>' : '') +
    '<div class="field"><label for="ntitle">標題</label>' +
      '<input id="ntitle" type="text" value="' + esc(EDIT.title) + '" placeholder="用一句話說出你的想法，不要只寫「我的答案」"></div>' +
    '<div><div class="eyebrow" style="margin-bottom:6px">支架段落</div>' +
    EDIT.segs.map(function(g, i){
      const s = scaffold(g.s) || SCAFFOLDS[0];
      return '<div class="sc-seg ' + s.cls + '" style="margin-bottom:12px">' +
        '<div class="row" style="margin-bottom:6px">' +
        '<select data-act="seg-sc" data-i="' + i + '" style="width:auto">' + SCAFFOLDS.map(function(x){
          return '<option value="' + x.id + '"' + (x.id === g.s ? ' selected' : '') + '>' + esc(x.label) + '</option>';
        }).join('') + '</select>' +
        '<span class="muted small">' + esc(s.hint) + '</span><div class="spacer"></div>' +
        (EDIT.segs.length > 1 ? '<button class="btn sm ghost" data-act="seg-del" data-i="' + i + '">移除</button>' : '') +
        '</div>' +
        '<textarea data-act="seg-text" data-i="' + i + '" placeholder="' + esc(s.hint) + '">' + esc(g.text) + '</textarea>' +
        '</div>';
    }).join('') +
    '<button class="btn sm" data-act="seg-add">＋ 再加一個支架段落</button></div>' +
    '<div class="field"><label for="nkw">關鍵詞（用、分隔）</label>' +
      '<input id="nkw" type="text" value="' + esc(EDIT.keywords) + '" placeholder="平方根、負根、反例"></div>' +
    '<div class="field"><label for="nauth">共同作者</label>' +
      '<select id="nauth" multiple size="4">' + state.users.filter(function(u){ return u.role !== 'admin'; }).map(function(u){
        return '<option value="' + u.id + '"' + (EDIT.authorIds.indexOf(u.id) >= 0 ? ' selected' : '') + '>' + esc(u.name) + '</option>';
      }).join('') + '</select><span class="muted small">按住 Ctrl／⌘ 可以多選。知識建構鼓勵共同署名。</span></div>' +

    (EDIT.id ? '<button class="btn danger" data-act="del-note" data-id="' + EDIT.id + '">刪除這則</button>' : '') +
    '<button class="btn primary" data-act="save-note">貼上去</button></div>', {wide:false});
}

function collectEditor(){
  const t = $('#ntitle'); if (t) EDIT.title = t.value;
  const k = $('#nkw'); if (k) EDIT.keywords = k.value;
  const a = $('#nauth');
  if (a) EDIT.authorIds = Array.prototype.slice.call(a.selectedOptions).map(function(o){ return o.value; });
  $$('[data-act="seg-text"]').forEach(function(el){ EDIT.segs[+el.dataset.i].text = el.value; });
  const r = $('#nref'), q = $('#nquote');
  if (r && r.value && q && q.value.trim()){
    EDIT.refs = [{noteId:r.value, quote:q.value.trim()}];
  }
}

function saveEditor(){
  collectEditor();
  if (!EDIT.title.trim()){ toast('請先給這則貼文一個標題。'); return; }
  if (!EDIT.segs.some(function(g){ return g.text.trim(); })){ toast('至少寫一段內容再貼上去。'); return; }
  const kws = EDIT.keywords.split(/[、,，\s]+/).filter(Boolean);
  const payload = {title:EDIT.title.trim(), segs:EDIT.segs.filter(function(g){ return g.text.trim(); }),
                   keywords:kws, authorIds:EDIT.authorIds, refs:EDIT.refs};
  if (EDIT.id){
    updateNote(EDIT.id, payload);
    toast('已更新。');
  } else {
    const n = createNote(Object.assign({viewId:EDIT.viewId, buildOn:EDIT.buildOn, kind:EDIT.kind,
      contains:EDIT.contains, x:EDIT.x, y:EDIT.y}, payload));
    toast('已貼上去。想法現在屬於社群了。');
    closeModal(); EDIT = null; go('#/note/' + n.id); return;
  }
  closeModal(); EDIT = null; render();
}

function viewSynth(vid){

const DUAL_ZONE_STUDENT = {
  A:{name:'你把討論變成了自己的理解',
     desc:'你在課堂上說出來的想法，後測也看得出來變化。繼續這樣讀。'},
  B:{name:'你講了很多，下一步是把它變成自己的',
     desc:'你貼了不少想法。試著挑一則你同意的，寫出「我為什麼也這樣想」的理由，而不只是說「我同意」。'},
  C:{name:'你自己讀懂了，還沒說出來',
     desc:'你的理解有進步。班上有同學正卡在你已經想通的地方，把你的想法貼出去，他們會需要。'},
  D:{name:'這節課還在起步',
     desc:'先挑一題你最有話想說的，用「我的想法」支架貼一則就好。一則就夠。'}
};

function viewMyGrowth(){
  const me = currentUser();
  if (me.role !== 'student') return '<div class="empty"><h3>這一頁是學生看的</h3>' +
    '<a class="btn" href="#/teacher">回教師後台</a></div>';

  /* 不走 dualTrack()：那一份只涵蓋知識建構示範班（settings.kbClassId）的 24 人，
     其餘 72 人會直接撞到空狀態。diagnose 的 roster 是四班 96 人，四個條件都有資料。 */
  const pre  = diagnose(state, 'a-pre');
  const post = diagnose(state, 'a-post');
  const pp = pre  && pre.ready  ? pre.perStudent.find(function(p){ return p.sid === me.id; })  : null;
  const qp = post && post.ready ? post.perStudent.find(function(p){ return p.sid === me.id; }) : null;
  if (!pp && !qp) return '<div class="empty"><h3>還沒有可以看的紀錄</h3>' +
    '<p style="max-width:60ch">你的紀錄要等前測與後測都完成之後才算得出來。</p>' +
    '<a class="btn" href="#/student">回我的作業</a></div>';

  const ds = discourseStats().find(function(s){ return s.sid === me.id; }) || {};
  const myNotes = state.notes.filter(function(n){ return n.authorIds.indexOf(me.id) >= 0; });
  const thetaPre  = pp ? pp.theta : null;
  const thetaPost = qp ? qp.theta : null;
  const delta = (thetaPre != null && thetaPost != null) ? thetaPost - thetaPre : null;
  const q2Pre  = pp ? pp.q[2] : 0;
  const q2Post = qp ? qp.q[2] : 0;

  /* 這一班有沒有討論紀錄。沒有的話走降級版面，但卡片數與尺寸一模一樣，
     四個條件看到的版面幾何必須相同，否則介面差異會混進依變項。 */
  const k = classOfStudent(me.id);
  const mates = k ? k.studentIds : [];
  const classNotes = state.notes.filter(function(n){
    return n.authorIds.some(function(a){ return mates.indexOf(a) >= 0; }); });
  const hasKB = classNotes.length > 0;

  let zone = 'D';
  if (hasKB){
    /* 切點用同班同學的中位數，不用全體 */
    const all = discourseStats().filter(function(s){ return mates.indexOf(s.sid) >= 0; });
    const kbis = all.map(function(s){ return s.kbi; }).sort(function(a, b){ return a - b; });
    const kmed = kbis.length ? kbis[Math.floor(kbis.length / 2)] : 0;
    const deltas = mates.map(function(sid){
      const a = pre  && pre.ready  ? pre.perStudent.find(function(p){ return p.sid === sid; })  : null;
      const b = post && post.ready ? post.perStudent.find(function(p){ return p.sid === sid; }) : null;
      return (a && b) ? b.theta - a.theta : null;
    }).filter(function(x){ return x != null; }).sort(function(a, b){ return a - b; });
    const dmed = deltas.length ? deltas[Math.floor(deltas.length / 2)] : 0;
    const dHigh = delta != null && delta >= dmed;      // 算不出來一律歸「低」
    const kHigh = (ds.kbi || 0) >= kmed;
    zone = dHigh ? (kHigh ? 'A' : 'C') : (kHigh ? 'B' : 'D');
  }
  const Z = DUAL_ZONE_STUDENT[zone];

  return sectionHead('我的學習軌跡', me.name) +
    '<div class="grid g4" style="margin-bottom:16px">' +
      statCard('這次讀懂的程度', thetaPost != null ? fx(thetaPost) : (thetaPre != null ? fx(thetaPre) : '—'),
        '課前 ' + (thetaPre == null ? '—' : fx(thetaPre)) + ' → 課後 ' + (thetaPost == null ? '—' : fx(thetaPost))) +
      statCard('比課前進步多少', (delta == null ? '—' : (delta > 0 ? '+' : '') + fx(delta)),
        delta == null ? '等課後那份做完' : (delta > 0 ? '往上' : '持平或下降'),
        delta != null && delta > 0.15 ? 'good' : (delta != null && delta < -0.15 ? 'crit' : '')) +
      statCard('本來會、卻答錯的題數', q2Pre + ' → ' + q2Post,
        '這些是最值得回頭看的題目', q2Post < q2Pre ? 'good' : '') +
      (hasKB
        ? statCard('討論參與度', ds.kbi || 0, '把想法貼出來、也接住別人的想法')
        : statCard('討論參與度', '—', '你們班的知識建構空間還沒有討論紀錄')) +
    '</div>' +
    '<div class="grid g2">' +
      '<div class="card"><div class="card-p">' +
        (hasKB
          ? '<div class="pill"><span aria-hidden="true">◆</span>' + esc(Z.name) + '</div>' +
            '<p class="small" style="margin-top:10px">' + esc(Z.desc) + '</p>'
          : '<div class="pill"><span aria-hidden="true">◆</span>這節課還在起步</div>' +
            '<p class="small" style="margin-top:10px">你們班的知識建構空間還沒有討論紀錄。' +
            '等大家開始貼想法之後，這裡會告訴你你的想法被接住了幾次。</p>') +
        '<hr class="hr">' +
        '<h4>你在討論裡做了什麼</h4>' +
        '<div class="col" style="margin-top:8px">' +
        [['貼出想法', ds.notes || 0], ['接住別人的想法', ds.buildMade || 0],
         ['你的想法被接住', ds.buildGot || 0], ['讀過別人的貼文', ds.reads || 0],
         ['用過幾種開頭句', (ds.scaffoldKinds || 0) + ' / 6'],
         ['用到的關鍵詞', ds.termCount || 0],
         ['說理的深度', fx(ds.epi, 1) + ' / 4']].map(function(p){
          return '<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--rule-soft);padding-bottom:5px">' +
            '<span class="small">' + p[0] + '</span><span class="num">' + p[1] + '</span></div>';
        }).join('') + '</div>' +
      '</div></div>' +
      '<div class="card"><div class="card-h"><h3>我貼過的想法</h3><span class="muted small">' + myNotes.length + ' 則</span></div>' +
      '<div class="card-p col">' + (myNotes.map(function(n){
        return '<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--rule-soft);padding-bottom:6px">' +
          '<a href="#/note/' + n.id + '">' + esc(n.title) + '</a>' +
          '<span class="pill">第 ' + epistemicLevel(n) + ' 級</span></div>';
      }).join('') || '<div class="muted small">還沒貼過想法。到知識建構空間貼第一則吧。</div>') + '</div></div>' +
    '</div>';
}

let QUIZ = null;    // {aid, answers:{iid:choice}, texts:{iid:string}, strokes:{iid:[]}}

function viewStudent(){

  const k = classOfStudent(me.id);

           也不要提到別班。正面描述他真正要做的事就好。 */
        '<p class="small" style="margin-top:6px">這節課你自己讀、自己想。' +

    '<div class="grid g4" style="margin-bottom:16px">' +
      statCard('待作答', asgs.filter(function(a){ return !submitted(a.id, me.id); }).length, '') +
      statCard('已完成', asgs.filter(function(a){ return submitted(a.id, me.id); }).length, '') +
      (kbLocked(me)
        ? statCard('我貼的想法', myNotes, '交完卷就可以繼續') +
          statCard('知識建構空間', '測驗後開放', '交完卷就會打開')
        : statCard('我貼的想法', myNotes, '在知識建構空間') +
          statCard('未讀貼文', unread, '同學的新想法', unread ? 'warn' : '')) +
    '</div>' +
    '<div class="col">' + asgs.map(function(a){
      const done = submitted(a.id, me.id);
      const n = a.itemIds.length;

        return r.aid === a.id && r.sid === me.id && r.correct === true; }).length;
      return '<div class="card"><div class="card-p"><div class="row" style="justify-content:space-between">' +
        '<div><h3>' + esc(a.title) + '</h3>' +

          '<span>' + n + ' 題</span>' +
          '<span>截止 ' + fmtDate(a.due) + '</span>' +
          (done ? '<span class="pill q1"><span class="dot"></span>已完成 · 選擇題答對 ' + right + '</span>'
                : '<span class="pill">尚未作答</span>') +
        '</div></div>' +
        '<div class="row">' + (done
          ? '<a class="btn" href="#/result/' + a.id + '">查看個人診斷</a>'
          : '<a class="btn primary" href="#/' + (a.aal ? 'aal' : 'quiz') + '/' + a.id + '">' +
            (a.aal ? '開始這節課 →' : '開始作答 →') + '</a>') + '</div>' +

    }).join('') + '</div>' +
    '<div class="card" style="margin-top:16px"><div class="card-p">' +

}

function submitted(aid, sid){
  return state.submissions.some(function(s){ return s.aid === aid && s.sid === sid; });
}

/* --- 作答 --- */
function viewQuiz(aid){
  const a = getAssignment(aid);
  const me = currentUser();
  if (!a) return '<div class="empty"><h3>找不到這份作業</h3><a class="btn" href="#/student">回我的作業</a></div>';

  if (!QUIZ || QUIZ.aid !== aid) QUIZ = {aid:aid, answers:{}, texts:{}, strokes:{}};

  const items = a.itemIds.map(getItem).filter(Boolean);
  const answered = Object.keys(QUIZ.answers).length;
  const mcCount = items.filter(function(i){ return i.type === 'mc'; }).length;

  return sectionHead(a.title, a.desc || '', '<a class="btn" href="#/student">← 回作業列表</a>') +
    '<div class="kb-toolbar"><span class="muted small">已作答 ' + answered + ' / ' + mcCount + ' 題</span>' +
    '<div class="bar" style="flex:1;max-width:280px"><i style="width:' + (100 * answered / Math.max(1, mcCount)) + '%"></i></div>' +
    '<div class="spacer"></div><button class="btn primary sm" data-act="quiz-submit" data-id="' + aid + '">交卷</button></div>' +
    '<div class="col">' + items.map(function(it, idx){
      if (it.type === 'cr'){
        return '<div class="card"><div class="card-p">' +
          '<div class="row" style="justify-content:space-between;margin-bottom:6px">' +
          '<b>第 ' + (idx + 1) + ' 題　非選題</b>' +
          '<span class="row">' + itemPillsStudent(it) + '</span></div>' +
          '<div class="stem">' + esc(it.stem) + '</div>' +
          '<div class="field"><label>請寫出你的解題過程與說明</label>' +
          '<textarea style="min-height:120px" data-act="quiz-text" data-id="' + it.id + '">' + esc(QUIZ.texts[it.id] || '') + '</textarea></div>' +
          '<div class="field" style="margin-top:10px"><label>也可以直接手寫（老師評閱時看得到）</label>' +
          '<canvas class="pad" data-pad="' + it.id + '" height="240"></canvas>' +
          '<div class="row" style="margin-top:6px">' +
            '<label class="small muted">筆色</label><input type="color" value="#12161c" data-act="pad-color" data-id="' + it.id + '" style="width:44px;padding:2px">' +
            '<label class="small muted">筆寬</label><input type="range" min="1" max="8" value="2" data-act="pad-width" data-id="' + it.id + '" style="width:100px">' +
            '<button class="btn sm" data-act="pad-undo" data-id="' + it.id + '">復原</button>' +
            '<button class="btn sm" data-act="pad-clear" data-id="' + it.id + '">清空</button>' +
          '</div></div>' +
          '</div></div>';
      }
      const chosen = QUIZ.answers[it.id];
      return '<div class="card"><div class="card-p">' +
        '<div class="row" style="justify-content:space-between;margin-bottom:6px">' +
        '<b>第 ' + (idx + 1) + ' 題</b>' +
        '<span class="row">' + itemPillsStudent(it) + '</span></div>' +
        '<div class="stem">' + esc(it.stem) + '</div>' +
        '<div class="opts">' + it.options.map(function(o, k){
          return '<label class="opt' + (chosen === k ? ' chosen' : '') + '">' +
            '<input type="radio" name="q-' + it.id + '" data-act="quiz-pick" data-id="' + it.id + '" data-k="' + k + '"' +
            (chosen === k ? ' checked' : '') + '>' +
            '<b>' + String.fromCharCode(65 + k) + '</b><span>' + esc(o) + '</span></label>';
        }).join('') + '</div></div></div>';
    }).join('') + '</div>' +
    '<div class="row" style="margin-top:16px;justify-content:flex-end">' +

/* θ 是 logit，對十歲孩子沒有意義。轉成「和班上比起來」的五顆星，
   純呈現層——原始 θ 只留在 data-theta 與匯出裡，計算完全不動。 */
function readingStars(theta, mean){
  const d = theta - (mean || 0);
  const n = d >= 1 ? 5 : d >= 0.35 ? 4 : d >= -0.35 ? 3 : d >= -1 ? 2 : 1;
  return '<span data-theta="' + fx(theta) + '" aria-label="五顆星裡的第 ' + n + ' 顆">' +
    '★★★★★'.slice(0, n) + '<span style="opacity:.25">' + '★★★★★'.slice(n) + '</span></span>';
}

/* --- 個人診斷 --- */
function viewResult(aid){
  const me = currentUser();
  const a = getAssignment(aid);
  if (!a) return '<div class="empty"><h3>找不到這份作業</h3></div>';
  const diag = diagnose(state, aid);
  const mine = state.responses.filter(function(r){ return r.aid === aid && r.sid === me.id; });
  const mc = mine.filter(function(r){ return r.correct !== null && r.correct !== undefined; });
  const right = mc.filter(function(r){ return r.correct; }).length;
  const ps = diag && diag.ready ? diag.perStudent.find(function(p){ return p.sid === me.id; }) : null;

  return sectionHead('個人診斷', a.title, '<a class="btn" href="#/student">← 回我的作業</a>') +
    /* 學生端不出現 θ、δ (logit)、KIDMAP、迷思象限——十歲孩子看不懂，
       而且「迷思」是個標籤。同一份資料，換一套對他說話的說法；
       底層的 ps.theta、ps.cells 與所有匯出一個字不動。 */
    '<div class="grid g4" style="margin-bottom:16px">' +
      statCard('選擇題答對', right + ' / ' + mc.length, pct(right / Math.max(1, mc.length))) +
      statCard('我這次的閱讀力', ps ? readingStars(ps.theta, diag.meanTheta) : '—',
        ps ? '和班上比起來的位置' : '需要更多人完成') +
      statCard('可惜的題目', ps ? ps.q[2] : '—', '這幾題你其實讀得懂，只是這次沒答對') +
      statCard('厲害的題目', ps ? ps.q[1] : '—', '這幾題比較難，你答對了', 'good') +
    '</div>' +
    (ps ? '<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>你這次的閱讀地圖</h3>' +
      '<span class="muted small">每一個圓點是一題</span></div><div class="card-p">' +
      kidmapSVG(diag, ps, true) + '<div class="row" style="margin-top:10px">' + quadLegendStudent() + '</div>' +
      (ps.q[2] ? '<div class="ai-out" style="margin-top:12px"><p><strong>有 ' + ps.q[2] +
        ' 題很可惜。</strong>看你其他題的表現，這幾題你其實讀得懂。回去把題目再讀一次，' +
        '找找看你當時是漏了哪一句。</p>' +
        '<ul>' + ps.cells.filter(function(c){ return c.q === 2; }).map(function(c){
          const it = getItem(c.iid);
          const v = state.views.find(function(v){ return v.origin && v.origin.iid === it.id; });
          return '<li>第 ' + it.no + ' 題：' + esc(shortStem(it.stem)) +
            (v ? '　<a href="#/kb/' + v.id + '">全班正在討論這題 →</a>' : '') + '</li>';
        }).join('') + '</ul></div>' : '') +
      (ps.q[1] ? '<div class="ai-out" style="margin-top:10px"><p><strong>有 ' + ps.q[1] +
        ' 題你很厲害。</strong>這幾題比較難，你答對了。' +
        '到知識建構空間把你的想法貼出來——班上有同學正卡在同一題。</p></div>' : '') +
      '</div></div>'
      : '<div class="card card-p" style="margin-bottom:16px"><p class="muted small">班上還沒有夠多人做完，' +
        '所以還畫不出你的閱讀地圖。等大家都交了再回來看。</p></div>') +
    '<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>逐題檢視</h3></div>' +
    '<div class="card-p col">' + a.itemIds.map(getItem).filter(function(i){ return i && i.type === 'mc'; }).map(function(it){
      const r = mine.find(function(x){ return x.iid === it.id; });
      const c = diag && diag.ready && ps ? ps.cells.find(function(x){ return x.iid === it.id; }) : null;
      return '<div class="item"><div class="row" style="justify-content:space-between">' +
        '<b>第 ' + it.no + ' 題</b>' +
        (c ? '<span class="pill ' + QUAD[c.q].key + '"><span class="dot"></span>' +
             esc(QUAD_STUDENT[c.q]) + '</span>'
           : (r && r.correct ? '<span class="pill q1"><span class="dot"></span>答對</span>' :
          '<span class="pill q2"><span class="dot"></span>答錯</span>')) + '</div>' +
        '<div class="stem">' + esc(it.stem) + '</div>' +
        '<div class="opts">' + it.options.map(function(o, k){
          const isAns = k === it.answer, isMine = r && r.choice === k;
          return '<div class="opt' + (isAns ? ' right' : (isMine ? ' wrong' : '')) + '"><b>' +
            String.fromCharCode(65 + k) + '</b><span>' + esc(o) +
            (isAns ? '　<span class="muted small">正解</span>' : '') +
            (isMine && !isAns ? '　<span class="muted small">你選的</span>' : '') + '</span></div>';
        }).join('') + '</div>' +
        '<div class="row" style="margin-top:8px"><button class="btn sm" data-act="similar" data-id="' + it.id + '">請 AI 出 3 道相似題</button></div>' +
        '<div id="sim-' + it.id + '"></div>' +
        '</div>';
    }).join('') + '</div></div>' +
    crResultBlock(aid, me.id);
}

function crResultBlock(aid, sid){
  const a = getAssignment(aid);
  const crs = a.itemIds.map(getItem).filter(function(i){ return i && i.type === 'cr'; });
  if (!crs.length) return '';
  return '<div class="card"><div class="card-h"><h3>非選題</h3></div><div class="card-p col">' +
    crs.map(function(it){
      const r = state.responses.find(function(x){ return x.aid === aid && x.sid === sid && x.iid === it.id; });
      return '<div class="note-full"><b>非選第 ' + it.no + ' 題</b>' +
        '<div class="stem">' + esc(it.stem) + '</div>' +
        '<div class="ai-out" style="white-space:pre-wrap;font-size:13px">' + esc((r && r.text) || '（未作答）') + '</div>' +
        '<div class="row" style="margin-top:8px">' +
        (r && r.score !== null && r.score !== undefined
          ? '<span class="pill q1"><span class="dot"></span>得分 ' + r.score + ' / 6</span>'
          : '<span class="pill">等待老師評閱</span>') +
        (r && r.comment ? '<span class="small muted">老師評語：' + esc(r.comment) + '</span>' : '') +
        '</div></div>';
    }).join('') + '</div></div>';
}

/* --- 相似題練習 --- */
async function showSimilar(iid){
  const box = document.getElementById('sim-' + iid);
  if (!box) return;
  box.innerHTML = '<p class="muted small" style="margin-top:8px">出題中……</p>';
  try {
    const items = await aiSimilarItems(getItem(iid));

/* --- 手寫板 --- */
const PADS = {};
function initPads(){
  $$('canvas[data-pad]').forEach(function(cv){
    const id = cv.dataset.pad;
    if (cv._init) return;
    cv._init = true;
    const dpr = window.devicePixelRatio || 1;
    function size(){
      const w = cv.clientWidth || 600;
      cv.width = w * dpr; cv.height = 240 * dpr;
      const ctx = cv.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      redraw(id);
    }
    PADS[id] = PADS[id] || {strokes:[], color:'#12161c', width:2, cv:cv};
    PADS[id].cv = cv;
    size();
    window.addEventListener('resize', size);
    let cur = null;
    cv.addEventListener('pointerdown', function(e){
      cv.setPointerCapture(e.pointerId);
      const r = cv.getBoundingClientRect();
      cur = {color:PADS[id].color, width:PADS[id].width, pts:[[e.clientX - r.left, e.clientY - r.top]]};
      PADS[id].strokes.push(cur);
    });
    cv.addEventListener('pointermove', function(e){
      if (!cur) return;
      const r = cv.getBoundingClientRect();
      cur.pts.push([e.clientX - r.left, e.clientY - r.top]);
      redraw(id);
    });
    cv.addEventListener('pointerup', function(){ cur = null; if (QUIZ) QUIZ.strokes[id] = PADS[id].strokes; });
    cv.addEventListener('pointerleave', function(){ cur = null; });
  });
}
function redraw(id){
  const p = PADS[id]; if (!p || !p.cv) return;
  const ctx = p.cv.getContext('2d');
  ctx.clearRect(0, 0, p.cv.width, p.cv.height);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  p.strokes.forEach(function(s){
    ctx.strokeStyle = s.color; ctx.lineWidth = s.width;
    ctx.beginPath();
    s.pts.forEach(function(pt, i){ if (i) ctx.lineTo(pt[0], pt[1]); else ctx.moveTo(pt[0], pt[1]); });
    ctx.stroke();
  });
}

    '<li>介面詞彙參考自前身平台「會考派題 · 國中數學」與 knowledgeforum.org 的 KF6 介面；' +
    '本版領域已改為國小閱讀理解，部分用語（「單元」「迷思」）是那個階段留下的。</li>' +
    '</ul>' +
    '<p class="muted small" style="margin-top:10px">KAIROS 是研究用的整合原型，與上述任何平台或機構均無隸屬關係。</p>' +
  '</div>';
}

/* ===== src/92-ui-aal.js ===== */
/* ==========================================================================
   92-ui-aal.js — 評量即學習事件的作答介面
   版面：左＝題幹（逐句可標記）＋計算紙；右＝作答區＋AI 夥伴對話區。
   四條件共用同一份版面幾何，對照組僅把對話區換成同尺寸的「我的筆記」。
   ========================================================================== */

let AAL = null;

/* 作答草稿。刻意用獨立的 localStorage key，不擠進 50-kb.js 的 save()——
   那一支會靜默吞掉配額錯誤，而學生的 16 題作答不能靜默遺失。 */
const AAL_DRAFT_KEY = 'kairos-draft';

function aalDraftId(){ return AAL.aid + '|' + AAL.me; }

function aalSave(){
  if (!AAL) return;
  try {
    const all = JSON.parse(localStorage.getItem(AAL_DRAFT_KEY) || '{}');
    all[aalDraftId()] = {idx:AAL.idx, answers:AAL.answers, texts:AAL.texts, notes:AAL.notes,
                         marks:AAL.marks, checks:AAL.checks, savedAt:Date.now()};
    localStorage.setItem(AAL_DRAFT_KEY, JSON.stringify(all));
  } catch (e) { toast('這一題沒能存起來，先不要關掉分頁。'); }
}

function aalDropDraft(){
  try {
    const all = JSON.parse(localStorage.getItem(AAL_DRAFT_KEY) || '{}');
    delete all[aalDraftId()];
    localStorage.setItem(AAL_DRAFT_KEY, JSON.stringify(all));
  } catch (e) {}
}

function aalInit(aid){
  const a = getAssignment(aid);
  const me = currentUser();
  AAL = {
    aid: aid, me: me.id,
    cond: conditionOfStudent(me.id),
    idx: 0,
    items: a.itemIds.map(getItem).filter(Boolean),
    answers: {}, texts: {}, notes: {}, marks: {}, checks: {}, turns: {},
    tele: {}, drafts: {}, t0: Date.now()
  };
  /* 還原草稿。t0 一定重設為現在，並補寫一筆 RESUME，
     讓分析端知道這一場的 rel 時間軸跨了兩次入座、可以排除或另計。 */
  try {
    const all = JSON.parse(localStorage.getItem(AAL_DRAFT_KEY) || '{}');
    const d = all[aalDraftId()];
    if (d){
      AAL.idx = Math.min(d.idx || 0, AAL.items.length - 1);
      AAL.answers = d.answers || {};
      AAL.texts   = d.texts   || {};
      AAL.notes   = d.notes   || {};
      AAL.marks   = d.marks   || {};
      AAL.checks  = d.checks  || {};
      AAL.t0 = Date.now();
      aalLog('RESUME', 'R', {resumed:true, savedAt:d.savedAt || null});
    }
  } catch (e) { /* 草稿壞掉就當作沒有，從頭開始 */ }
}

function aalItem(){ return AAL.items[AAL.idx]; }
function aalTurns(iid){ return AAL.turns[iid] = AAL.turns[iid] || []; }
function aalStudentTurns(iid){
  return aalTurns(iid).filter(function(t){ return t.speaker === 'student'; }).length;
}
function aalTele(iid){
  return AAL.tele[iid] = AAL.tele[iid] || {firstKeyLatency:null, keystrokes:0, deletions:0,
    longPauses:0, lastKey:null, enter:Date.now(), prevLen:0};
}

function aalLog(type, code, extra){
  const it = aalItem();
  const k = classOfStudent(AAL.me);
  const e = {t:Date.now(), rel:Date.now() - AAL.t0, sid:AAL.me, cid:k ? k.id : null,
             cond:AAL.cond, lang:'zh', aid:AAL.aid, iid:it.id, proc:it.process || 'FR',
             type:type, code:code};
  if (extra) Object.keys(extra).forEach(function(x){ e[x] = extra[x]; });
  logEvent(e);
  return e;
}

function viewAaL(aid){
  const a = getAssignment(aid);
  const me = currentUser();
  if (!a) return '<div class="empty"><h3>找不到這個評量事件</h3><a class="btn" href="#/student">回我的作業</a></div>';
  if (me.role !== 'student') return '<div class="empty"><h3>請切換成學生身分</h3>' +
    '<p>評量即學習事件是學生端的畫面。用右上角的身分選單換成班上任何一位同學，就會看到他被分派到的條件。</p></div>';
  if (submitted(aid, me.id)) { go('#/result/' + aid); return ''; }
  if (!AAL || AAL.aid !== aid || AAL.me !== me.id) aalInit(aid);

  const it = aalItem();
  const cond = condition(AAL.cond);
  const text = getText(it.unit);
  const sents = passageSentences(text);
  // 標記是「對這篇文本」的，換題不會消失——學生在同一篇文章上持續累積閱讀痕跡
  const marks = AAL.marks[it.unit] = AAL.marks[it.unit] || [];
  const turns = aalTurns(it.id);
  const used = aalStudentTurns(it.id);
  const maxT = (state.settings && state.settings.maxTurns) || MAX_TURNS;
  const proc = processOf(it.process || 'FR');

  return '<div class="row" style="justify-content:space-between;align-items:flex-end;margin-bottom:12px">' +
      '<div><h2>' + esc(a.title) + '</h2>' +
      /* 不在學生畫面印出實驗條件名。條件資訊由畫面本身承載
         （右欄卡片頭已經是「我的夥伴：…」或「我的筆記」），
         印出「無對象」等於直接告訴對照組他被分到哪一組。
         AAL.cond 與日誌的 cond 欄位照舊寫入，拿掉的只是畫面上的字。 */
      '<div class="muted small">' + esc(me.name) + '　·　' +
      esc((classOfStudent(me.id) || {}).name || '') + '</div></div>' +
      '<div class="row">' +
      '<a class="btn sm" href="#/student">← 先離開（進度會保留）</a>' +
      '<span class="pill">第 ' + (AAL.idx + 1) + ' / ' + AAL.items.length + ' 題</span>' +
      '<span class="pill">' + esc(text.title) + '</span>' +
      '<button class="btn sm" data-act="aal-prev"' + (AAL.idx ? '' : ' disabled') + '>← 上一題</button>' +
      '<button class="btn sm" data-act="aal-next"' + (AAL.idx < AAL.items.length - 1 ? '' : ' disabled') + '>下一題 →</button>' +
      '<button class="btn primary sm" data-act="aal-submit">交卷</button></div>' +
    '</div>' +

    '<div class="aal">' +
    /* ---- 左欄：文本，逐句可標記 ---- */
    /* 一篇文章有 30–40 句，每一句都是可聚焦的按鈕。沒有這顆跳躍鈕，
       鍵盤使用者要按幾十次 Tab 才走得到作答區（WCAG 2.4.1）。 */
    '<div class="aal-text card">' +
      '<button class="skip" data-act="skip-passage" type="button">跳過文章，直接作答</button>' +
      '<div class="card-h"><h3 id="passageTitle" tabindex="-1">' + esc(text.title) + '</h3>' +
      '<span class="pill">' + esc(text.genre) + '</span>' +
      '<span class="pill" id="markCount"' + (marks.length ? '' : ' hidden') + '>已標記 ' +
      '<span id="markCountN">' + marks.length + '</span> 句</span></div>' +
      '<div class="card-p">' +
      /* 隱私要講實話：老師在唯讀重播裡看得到學生標了哪幾句。 */
      '<p class="muted small" id="passageHelp">點一下任何一句，把它標記起來。' +
      '標記不會影響你的分數，換題也不會消失；每一篇文章的標記分開記。' +
      '老師之後可以看到你標了哪幾句，這是為了知道你怎麼讀。</p>' +
      '<div class="passage" role="group" aria-labelledby="passageTitle" aria-describedby="passageHelp">' +
        text.paras.map(function(_, pi){
          return '<p class="para">' + sents.filter(function(s){ return s.para === pi; }).map(function(s){
            const on = marks.indexOf(s.i) >= 0;
            return '<button type="button" class="sent' + (on ? ' on' : '') + '"' +
              ' data-act="aal-mark" data-i="' + s.i + '" aria-pressed="' + on + '">' +
              esc(s.text) + '</button>';
          }).join('') + '</p>';
        }).join('') +
      '</div>' +
    '</div></div>' +

    /* ---- 右欄：題目與作答 ＋ 對話／筆記 ---- */
    '<div class="aal-side">' +
      /* 不對學生顯示歷程標籤：那是相對歷程編碼的判定基準，
         受試者看到基準等於拿到解題策略提示。 */
      '<div class="card" id="aalAnswer" tabindex="-1"><div class="card-h"><h3>第 ' + (AAL.idx + 1) + ' 題</h3></div>' +
      '<div class="card-p">' +
      '<div class="stem">' + esc(it.stem) + '</div>' +
      (it.type === 'mc'
        ? '<fieldset class="opts"><legend class="sr-only">' + esc(it.stem) + '</legend>' + it.options.map(function(o, k){
            return '<label class="opt' + (AAL.answers[it.id] === k ? ' chosen' : '') + '">' +
              '<input type="radio" name="aal-' + it.id + '" data-act="aal-pick" data-k="' + k + '"' +
              (AAL.answers[it.id] === k ? ' checked' : '') + '>' +
              '<b aria-hidden="true">' + String.fromCharCode(65 + k) + '</b><span>' + esc(o) + '</span></label>';
          }).join('') + '</fieldset>'
        : '<div class="field"><label for="crText">寫出你的答案，並說明你的理由</label>' +
          '<textarea id="crText" data-act="aal-text" style="min-height:160px" ' +
          'placeholder="先寫你的看法，再寫你是從文章哪一段看出來的">' +
          esc(AAL.texts[it.id] || '') + '</textarea></div>') +
      '</div></div>' +

      (AAL.cond === 'control' ? aalNotePane(it) : aalDialogPane(it, cond, turns, used, maxT)) +

      '<div class="card"><div class="card-h"><h3>送出前自我檢核</h3>' +
        '<span class="muted small">勾不勾由你決定</span></div><div class="card-p col">' +
        SELF_CHECKS.map(function(c, i){
          const on = (AAL.checks[it.id] || []).indexOf(i) >= 0;
          return '<label class="opt" style="align-items:center"><input type="checkbox" data-act="aal-check" data-i="' + i + '"' +
            (on ? ' checked' : '') + '><span>' + esc(c) + '</span></label>';
        }).join('') +
        '<button class="skip" data-act="back-to-passage" type="button">回到文章</button>' +
      '</div></div>' +
    '</div></div>';
}

function aalDialogPane(it, cond, turns, used, maxT){
  const left = maxT - used;
  return '<div class="card aal-chat"><div class="card-h">' +
    '<h3>我的夥伴：' + esc(cond.name) + '</h3>' +
    '<span class="pill">還可以說 ' + Math.max(0, left) + ' 次</span></div>' +
    '<div class="card-p">' +
    '<div class="chat" id="aalChat">' +
      '<div class="msg agent"><b>' + esc(cond.name) + '</b>' + esc(cond.frame) + '</div>' +
      turns.map(function(t){
        return '<div class="msg ' + (t.speaker === 'student' ? 'me' : 'agent') + '">' +
          (t.speaker === 'agent' ? '<b>' + esc(cond.name) + '</b>' : '') + esc(t.text) + '</div>';
      }).join('') +
      (left <= 0 ? '<div class="msg sys">這一題的對話次數用完了。換下一題會重新計算。</div>' : '') +
    '</div>' +
    '<div class="row pane-bar" style="margin-top:10px;gap:6px">' +
      '<input type="text" id="aalSay" placeholder="' + (left > 0 ? '說說你現在的想法…' : '這一題已經聊完了') +
      '"' + (left > 0 ? '' : ' disabled') + ' style="flex:1">' +
      '<button class="btn primary sm" data-act="aal-say"' + (left > 0 ? '' : ' disabled') + '>送出</button>' +
    '</div>' +
    '<p class="muted small pane-foot" style="margin-top:8px">陪你的這位夥伴是電腦程式，不是真的人。' +
    '它不會告訴你答案，也不會說你對或錯。' +
    '你跟它說的話老師之後看得到，不會拿來打分數。</p>' +
    '</div></div>';
}

/* 對照組的面板。結構刻意與 aalDialogPane 逐項對位：
   卡片頭一個標題 + 一顆計數 pill、內容區高度同為 --pane-h、
   下方一條同高的工具列、footer 說明同樣兩句。
   任何一項不對等，介面差異就會以條件為單位混進依變項。 */
function aalNotePane(it){
  const txt = AAL.notes[it.id] || '';
  return '<div class="card aal-chat"><div class="card-h">' +
    '<h3>我的筆記　·　第 ' + (AAL.idx + 1) + ' 題</h3>' +
    '<span class="pill">已寫 ' + txt.length + ' 字</span></div>' +
    '<div class="card-p">' +
    '<textarea data-act="aal-note" style="height:var(--pane-h)" ' +
    'placeholder="把你想到的、還沒想通的，寫在這裡">' + esc(txt) + '</textarea>' +
    '<div class="row pane-bar" style="margin-top:10px;gap:6px">' +
      '<button class="btn sm" data-act="aal-note-clear">清空</button>' +
      '<span class="muted small" style="flex:1">這一題一份，換題會換成新的一頁。</span>' +
    '</div>' +
    '<p class="muted small pane-foot" style="margin-top:8px">把你想到的、還沒想通的，寫在這裡。' +
    '你寫的字老師之後看得到，不會拿來打分數。</p>' +
    '</div></div>';
}

/* 把整篇文本攤平成可標記的句子清單：{i, para, text} */
function passageSentences(text){
  if (!text) return [];
  const out = [];
  let i = 0;
  (text.paras || []).forEach(function(p, pi){
    splitSentences(p).forEach(function(s){
      out.push({i: i++, para: pi, text: s});
    });
  });
  return out;
}

/* --- 互動處理 --- */
/* 標記與作答都是「每分鐘按十幾次」的微互動。
   這裡刻意不呼叫 render()：整頁重繪會把捲動位置與鍵盤焦點都丟掉，
   學生讀到第 9 段標一句話就被彈回文章開頭。只改真正變動的那幾個節點。 */
function aalMark(i){
  const it = aalItem();
  const m = AAL.marks[it.unit] = AAL.marks[it.unit] || [];
  const k = m.indexOf(i);
  const on = k < 0;
  if (k >= 0) m.splice(k, 1); else m.push(i);
  aalLog('MARK', 'M', {sent:i, textId:it.unit, on: on});
  aalSave();

  const btn = document.querySelector('.passage .sent[data-i="' + i + '"]');
  if (btn){ btn.classList.toggle('on', on); btn.setAttribute('aria-pressed', String(on)); }
  const pill = document.getElementById('markCount');
  const n = document.getElementById('markCountN');
  if (n) n.textContent = m.length;
  if (pill){ if (m.length) pill.removeAttribute('hidden'); else pill.setAttribute('hidden', ''); }
}

function aalPick(k){
  const it = aalItem();
  const first = AAL.answers[it.id] === undefined;
  AAL.answers[it.id] = k;
  if (first) AAL.drafts[it.id] = {first: k, final: k};
  else AAL.drafts[it.id].final = k;
  aalLog('OPTION', 'O', {choice:k, changed: !first});
  aalSave();

  const fs = document.querySelector('.aal-side fieldset.opts');
  if (fs) Array.prototype.forEach.call(fs.querySelectorAll('label.opt'), function(lb, idx){
    lb.classList.toggle('chosen', idx === k);
  });
}

function aalTypeTelemetry(iid, value){
  const t = aalTele(iid);
  const now = Date.now();
  if (t.firstKeyLatency === null) t.firstKeyLatency = now - t.enter;
  if (t.lastKey && now - t.lastKey >= 3000) t.longPauses++;
  t.lastKey = now;
  if (value.length < t.prevLen) t.deletions += (t.prevLen - value.length);
  else t.keystrokes += (value.length - t.prevLen);
  t.prevLen = value.length;
}

async function aalSay(){
  const box = document.getElementById('aalSay');
  if (!box) return;
  const text = box.value.trim();
  if (!text) return;
  const it = aalItem();
  const maxT = (state.settings && state.settings.maxTurns) || MAX_TURNS;
  const used = aalStudentTurns(it.id);
  if (used >= maxT){ toast('這一題的對話次數用完了。'); return; }

  const rel = relativeProcessCode(text, it);
  const sm = sentimentOf(text);
  aalTurns(it.id).push({speaker:'student', text:text, rel:rel, at:Date.now()});
  const e = aalLog('ASK', REL_SHORT[rel], {text:text, rel:rel, turn:used + 1, sent:sm.score});
  state.dialog = state.dialog || [];
  state.dialog.push({t:e.t, sid:AAL.me, cond:AAL.cond, aid:AAL.aid, iid:it.id,
    proc:it.process, turn:used + 1, speaker:'student', text:text, rel:rel,
    ucode:codeUtteranceProcess(text), sent:sm.score});
  box.value = '';
  render();

  let reply;
  if (aiEngine() === 'llm'){
    try {
      const raw = await llmChat([
        {role:'system', content: composePrompt(AAL.cond, it.process || 'FR', TURN_SCHEDULE[Math.min(used, TURN_SCHEDULE.length - 1)])},
        {role:'user', content:'【題目】' + it.stem + '\n【學生剛剛說】' + text}
      ], {max_tokens:200, temperature:0.7});
      const g = leakGuard(raw, it);
      reply = {text:g.text, qfn:TURN_SCHEDULE[Math.min(used, TURN_SCHEDULE.length - 1)],
               sub:null, engine:'llm', blocked:g.blocked, hits:g.hits};
    } catch (err) {
      reply = agentTurn(AAL.cond, it, used);
      reply.fallback = err.message;
    }
  } else {
    reply = agentTurn(AAL.cond, it, used);
  }

  aalTurns(it.id).push({speaker:'agent', text:reply.text, at:Date.now()});
  const ea = aalLog('AI', 'A', {text:reply.text, qfn:reply.qfn, sub:reply.sub,
    turn:used + 1, engine:reply.engine, blocked: !!reply.blocked});
  state.dialog.push({t:ea.t, sid:AAL.me, cond:AAL.cond, aid:AAL.aid, iid:it.id,
    proc:it.process, turn:used + 1, speaker:'agent', text:reply.text,
    qfn:reply.qfn, sub:reply.sub, ucode:reply.process || it.process, sent:0});
  save();
  render();
  const c = document.getElementById('aalChat');
  if (c) c.scrollTop = c.scrollHeight;
}

function aalSubmit(){
  const a = getAssignment(AAL.aid), me = currentUser();
  const mcs = AAL.items.filter(function(i){ return i.type === 'mc'; });
  const missing = mcs.filter(function(i){ return AAL.answers[i.id] === undefined; });
  if (missing.length && !confirm('還有 ' + missing.length + ' 題沒作答，確定要交卷嗎？')) return;

  AAL.items.forEach(function(it){
    state.responses = state.responses.filter(function(r){
      return !(r.aid === AAL.aid && r.sid === me.id && r.iid === it.id); });
    const t = AAL.tele[it.id];
    if (t){
      logEvent({t:Date.now(), rel:Date.now() - AAL.t0, sid:me.id,
        cid:(classOfStudent(me.id) || {}).id, cond:AAL.cond, lang:'zh', aid:AAL.aid,
        iid:it.id, proc:it.process, type:'TELEMETRY',
        firstKeyLatency:t.firstKeyLatency, keystrokes:t.keystrokes,
        deletions:t.deletions, longPauses:t.longPauses});
    }
    const nC = (AAL.checks[it.id] || []).length;
    logEvent({t:Date.now(), rel:Date.now() - AAL.t0, sid:me.id,
      cid:(classOfStudent(me.id) || {}).id, cond:AAL.cond, lang:'zh', aid:AAL.aid,
      iid:it.id, proc:it.process, type:'SUBMIT', code:'S', selfCheck:nC,
      draftFirst:(AAL.drafts[it.id] || {}).first, draftFinal:(AAL.drafts[it.id] || {}).final});

    /* 對照組整節課唯一的產出就是筆記。存進獨立的 state.aalNotes——
       不塞進 state.dialog，因為全站多處文案與分析建立在「對照組 dialog 為空」上。
       欄位與 dialog 對齊，分析端要納入時自己 concat。 */
    if (AAL.cond === 'control' && (AAL.notes[it.id] || '').trim()){
      state.aalNotes = state.aalNotes || [];
      state.aalNotes.push({t:Date.now(), rel:Date.now() - AAL.t0, sid:me.id,
        cid:(classOfStudent(me.id) || {}).id, cond:AAL.cond, lang:'zh',
        aid:AAL.aid, iid:it.id, proc:it.process, text:AAL.notes[it.id],
        ucode:codeUtteranceProcess(AAL.notes[it.id]),
        sent:sentimentOf(AAL.notes[it.id]).score});
    }
    if (it.type === 'cr'){
      state.responses.push({aid:AAL.aid, sid:me.id, iid:it.id, text:AAL.texts[it.id] || '',
        strokes:(PADS['aal-' + it.id] && PADS['aal-' + it.id].strokes.length) ? PADS['aal-' + it.id].strokes : null,
        score:null, comment:'', correct:null});
    } else {
      const c = AAL.answers[it.id];
      state.responses.push({aid:AAL.aid, sid:me.id, iid:it.id,
        choice: c === undefined ? null : c, correct: c === it.answer});
    }
  });
  state.submissions = state.submissions.filter(function(s){ return !(s.aid === AAL.aid && s.sid === me.id); });
  state.submissions.push({aid:AAL.aid, sid:me.id, at:Date.now()});
  save();
  aalDropDraft();          // 交出去了，草稿不用留
  AAL = null;
  toast('已交卷。接下來是這節課的問卷。');
  go('#/survey/post');
}

/* ==========================================================================
   問卷施測
   ========================================================================== */
let SURVEY = null;

/* 這一份問卷實際要作答的所有題鍵。抬頭的題數與送出前的檢查都吃這一個來源，
   否則會出現「抬頭說 47 題、送出只檢查 41 題」，操弄檢核與使用感受整段留白也送得出去。
   cond 參數不可省：對照組不施操弄檢核，否則會被要求填不存在的三題而永遠送不出去。 */
function surveyKeys(phase, cond){
  const ks = [];
  constructsFor(phase).forEach(function(c){
    c.items.forEach(function(_, i){ ks.push(c.id + '_' + i); });
  });
  if (phase === 'post'){
    if (cond !== 'control') MANIP_CHECK.forEach(function(_, i){ ks.push('mc_x_' + i); });
    SUS_ITEMS.forEach(function(_, i){ ks.push('sys_x_' + i); });
  }
  return ks;
}

/* 課後問卷的門檻。操弄檢核問的是「剛剛那位夥伴像什麼」——
   還沒上課就填，答案沒有意義，而它是驗證實驗操弄成功與否的關鍵工具。
   前測不設門檻（它本來就該在課前填）。 */
function surveyGate(phase){
  const me = currentUser();
  if (phase === 'pre') return '';
  if (me.role !== 'student') return '';
  if (submitted('a-post', me.id)) return '';
  const a = getAssignment('a-post');
  if (!a) return '';
  return '<div class="empty"><h3>課後問卷要等這節課上完</h3>' +
    '<p style="max-width:62ch">這份問卷問的是你剛剛上這節課的感覺。' +
    '還沒上完就填，你會不知道要怎麼回答。先把下面這份做完，做完就會自動帶你來這裡。</p>' +
    '<div class="col" style="margin-top:14px;align-items:flex-start">' +
    '<a class="btn primary" href="#/aal/' + a.id + '">' + esc(a.title) + '　開始這份作業 →</a>' +
    '<a class="btn" href="#/student">回我的作業</a></div></div>';
}

function viewSurvey(phase){
  const me = currentUser();
  if (me.role !== 'student') return '<div class="empty"><h3>請切換成學生身分</h3>' +
    '<p>問卷是學生端的畫面。</p></div>';
  const gate = surveyGate(phase); if (gate) return gate;
  const done = surveyOf(me.id, phase);
  if (!SURVEY || SURVEY.phase !== phase || SURVEY.sid !== me.id){
    SURVEY = {phase:phase, sid:me.id, resp: done ? Object.assign({}, done.resp) : {}};
  }
  const cs = constructsFor(phase);
  const cond = conditionOfStudent(me.id);
  const keys = surveyKeys(phase, cond);
  const total = keys.length;
  const answered = keys.filter(function(k){ return SURVEY.resp[k]; }).length;

  function block(title, items, scale, prefix, cls){
    return '<div class="card" style="margin-bottom:14px"><div class="card-h">' +
      '<h3 class="' + (cls || '') + '">' + esc(title) + '</h3>' +
      '<span class="muted small">' + scale.n + ' 點量尺</span></div><div class="card-p col">' +
      items.map(function(txt, i){
        const key = prefix + '_' + i;
        return '<div class="likert"><div class="q">' + (i + 1) + '. ' + esc(txt) + '</div>' +
          '<div class="scale">' + new Array(scale.n).fill(0).map(function(_, v){
            const val = v + 1;
            return '<button class="lk' + (SURVEY.resp[key] === val ? ' on' : '') + '"' +
              ' data-act="sv-pick" data-k="' + key + '" data-v="' + val + '"' +
              ' title="' + esc(scale.labels[v]) + '">' + val + '</button>';
          }).join('') + '</div>' +
          '<div class="scale-lab"><span>' + esc(scale.labels[0]) + '</span>' +
          '<span>' + esc(scale.labels[scale.n - 1]) + '</span></div></div>';
      }).join('') + '</div></div>';
  }

  /* 進度數字要能就地更新，所以不能走 sectionHead 的 sub（那一段會被 esc() 轉義），
     改放在右側動作列裡，用 role="status" 讓報讀器也聽得到進度變化。 */
  return sectionHead(phase === 'pre' ? '課前問卷' : '課後問卷',
      '沒有標準答案，照你真正的感覺選就好。',
      '<span class="pill" role="status" aria-live="polite">已完成 <span id="svDone">' + answered +
      '</span> / 共 ' + total + ' 題</span>' +
      '<button class="btn primary" data-act="sv-submit" data-id="' + phase + '">送出問卷</button>') +
    '<div class="card card-p" style="margin-bottom:14px;border-left:3px solid var(--warn)">' +
    '<p class="small" style="margin:0">本平台內建的題項是<strong>依構念自撰的示範題</strong>，' +
    '用來讓施測與計分流程完整可跑。正式研究請改用已完成中譯與信效度驗證的公開量表，' +
    '並經專家審查與學童認知訪談。</p></div>' +
    cs.map(function(c){ return block(c.name + '（' + c.dim + '）', c.items, c.scale, c.id, c.cls); }).join('') +
    (phase === 'post' && cond !== 'control'
      ? block('角色知覺（操弄檢核）', MANIP_CHECK.map(function(m){ return m.text; }), SCALE6, 'mc_x', '') : '') +
    (phase === 'post' ? block('系統使用感受', SUS_ITEMS.map(function(s){ return s.text; }), SCALE6, 'sys_x', '') : '') +
    '<div class="row" style="justify-content:flex-end;margin-top:16px">' +
    '<button class="btn primary" data-act="sv-submit" data-id="' + phase + '">送出問卷</button></div>';
}

function surveySubmit(phase){
  const me = currentUser();
  const cond = conditionOfStudent(me.id);
  if (surveyGate(phase)){ toast('這節課還沒上完，問卷等一下再填。'); return; }

  const keys = surveyKeys(phase, cond);
  const miss = keys.filter(function(k){ return !SURVEY.resp[k]; });
  if (miss.length){
    /* 先把人帶到第一題沒答的地方，再問——不然他不知道漏在哪 */
    const el = document.querySelector('[data-k="' + miss[0] + '"]');
    if (el){
      const row = el.closest('.likert');
      if (row) row.classList.add('missing');
      el.scrollIntoView({block:'center'});
      el.focus();
    }
    if (!confirm('還有 ' + miss.length + ' 題沒作答（「角色知覺」和「系統使用感受」那兩段也要看一下）。\n\n' +
                 '按「確定」直接送出，按「取消」回去把它填完。')) return;
  }

  // 操弄檢核與使用感受用固定鍵存回原本的 id。
  // 未答一律寫成 null，讓分析端能用「鍵存在但值為 null」區分漏答與未施測；
  // 對照組不建 mc_* 鍵，因為那三題本來就不對他施測。
  const resp = Object.assign({}, SURVEY.resp);
  if (phase === 'post' && cond !== 'control'){
    MANIP_CHECK.forEach(function(m, i){ resp[m.id] = SURVEY.resp['mc_x_' + i] || null; });
  }
  if (phase === 'post'){
    SUS_ITEMS.forEach(function(s, i){ resp[s.id] = SURVEY.resp['sys_x_' + i] || null; });
  }

  state.surveys = (state.surveys || []).filter(function(s){
    return !(s.sid === me.id && s.phase === phase); });
  state.surveys.push({sid:me.id, phase:phase, at:Date.now(), resp:resp});
  save();
  SURVEY = null;
  toast('問卷已送出，謝謝你。');
  go('#/student');
}

/* ==========================================================================
   學生作答與 AI 互動檢視（教師／研究者，唯讀）

   為什麼要有這一頁：評量即學習事件是學生端的畫面，測驗一旦結束就沒有人
   進得去，教師與研究者也就看不到「學生當時實際看到什麼、跟 AI 說了什麼」。
   這裡用與 viewAaL() 相同的版面重播一位學生的作答歷程——同樣的兩欄、
   同樣的文本、同樣的對話卡——差別只在全部唯讀，而且會多顯示對錯與編碼。
   ========================================================================== */
let INSPECT = null;

function inspectInit(aid, sid){
  const a = getAssignment(aid);
  INSPECT = {aid:aid, sid:sid, idx:0,
             items: a ? a.itemIds.map(getItem).filter(Boolean) : []};
}

/* 從事件日誌把這位學生在這篇文本上標記過的句子還原出來（MARK 事件是切換語意） */
function inspectMarks(sid, aid, textId){
  const on = {};
  allLogs().forEach(function(e){
    if (e.sid !== sid || e.aid !== aid || e.code !== 'M') return;
    if (e.textId && e.textId !== textId) return;
    if (e.sent == null) return;
    if (e.on === false) delete on[e.sent]; else on[e.sent] = 1;
  });
  return Object.keys(on).map(Number);
}

function viewInspect(aid, sid){
  if (!isTeacher()) return '<div class="empty"><h3>這一頁只有教師與研究者看得到</h3></div>';
  const a = getAssignment(aid);
  if (!a) return '<div class="empty"><h3>找不到這份派題</h3><a class="btn" href="#/teacher">回教師後台</a></div>';
  const roster = assignmentRoster(a);
  if (!sid || roster.indexOf(sid) < 0) sid = roster[0];
  if (!sid) return '<div class="empty"><h3>這份派題還沒有學生</h3></div>';
  if (!INSPECT || INSPECT.aid !== aid || INSPECT.sid !== sid) inspectInit(aid, sid);

  const k = classOfStudent(sid);
  const cond = condition(conditionOfStudent(sid));
  const it = INSPECT.items[INSPECT.idx];
  if (!it) return '<div class="empty"><h3>這份派題沒有題目</h3></div>';

  const text = getText(it.unit);
  const sents = passageSentences(text);
  const marks = inspectMarks(sid, aid, it.unit);
  const resp = state.responses.find(function(r){
    return r.aid === aid && r.sid === sid && r.iid === it.id; }) || {};
  const turns = allDialog().filter(function(d){
    return d.sid === sid && d.aid === aid && d.iid === it.id; })
    .sort(function(x, y){ return x.t - y.t; });
  const checks = allLogs().filter(function(e){
    return e.sid === sid && e.aid === aid && e.iid === it.id && e.code === 'C'; });
  const done = submitted(aid, sid);

  /* 全部學生的下拉，讓教師不必回上一頁就能換人 */
  const picker = '<select id="inspectWho" data-act="inspect-who" style="width:auto">' +
    roster.map(function(x){
      return '<option value="' + x + '"' + (x === sid ? ' selected' : '') + '>' +
        esc(userName(x)) + '（' + esc(condition(conditionOfStudent(x)).name) + '）</option>';
    }).join('') + '</select>';

  return sectionHead('作答與 AI 互動檢視',
      esc(a.title) + '　·　與學生當時看到的版面相同，此處為唯讀重播。',
      '<a class="btn" href="#/assign/' + aid + '">← 回派題分析</a>') +

    '<div class="card card-p" style="margin-bottom:14px">' +
      '<div class="row" style="gap:14px;flex-wrap:wrap;align-items:center">' +
        '<label class="small muted" for="inspectWho">學生</label>' + picker +
        '<span class="pill">' + esc((k || {}).name || '') + '</span>' +
        '<span class="pill"><span aria-hidden="true">' + esc(cond.mark || '') + '</span>' + esc(cond.name) + '</span>' +
        '<span class="pill">' + (done ? '已交卷' : '未交卷') + '</span>' +
        '<div class="spacer"></div>' +
        '<span class="pill">第 ' + (INSPECT.idx + 1) + ' / ' + INSPECT.items.length + ' 題</span>' +
        '<button class="btn sm" data-act="inspect-prev"' + (INSPECT.idx ? '' : ' disabled') + '>← 上一題</button>' +
        '<button class="btn sm" data-act="inspect-next"' +
          (INSPECT.idx < INSPECT.items.length - 1 ? '' : ' disabled') + '>下一題 →</button>' +
      '</div>' +
      '<p class="muted small" style="margin-top:10px">這一頁不會產生任何事件日誌，也不會改到學生的資料。' +
      '對照組（無對象）沒有對話，右欄顯示的是他自己的筆記區。</p>' +
    '</div>' +

    '<div class="aal">' +
    /* ---- 左欄：文本，重播該生的標記 ---- */
    '<div class="aal-text card"><div class="card-h"><h3 id="passageTitle">' + esc(text.title) + '</h3>' +
      '<span class="pill">' + esc(text.genre) + '</span>' +
      '<span class="pill">他標記了 ' + marks.length + ' 句</span></div>' +
      '<div class="card-p">' +
      '<p class="muted small" id="passageHelp">底色與「▍」記號是這位學生自己標起來的句子，由事件日誌還原。</p>' +
      '<div class="passage" role="group" aria-labelledby="passageTitle" aria-describedby="passageHelp">' +
        text.paras.map(function(_, pi){
          return '<p class="para">' + sents.filter(function(s){ return s.para === pi; }).map(function(s){
            const on = marks.indexOf(s.i) >= 0;
            return '<button type="button" class="sent' + (on ? ' on' : '') + '" disabled' +
              ' aria-pressed="' + on + '">' + esc(s.text) + '</button>';
          }).join('') + '</p>';
        }).join('') +
      '</div>' +
    '</div></div>' +

    /* ---- 右欄：題目與他的作答 ＋ 對話逐字 ---- */
    '<div class="aal-side">' +
      '<div class="card"><div class="card-h"><h3>第 ' + (INSPECT.idx + 1) + ' 題</h3>' +
        procPill(it.process) + subPill(it.sub) + '</div>' +
      '<div class="card-p">' +
      '<div class="stem">' + esc(it.stem) + '</div>' +
      (it.type === 'mc' ? inspectOptions(it, resp) : inspectCR(it, resp)) +
      '</div></div>' +

      (turns.length ? inspectDialogPane(cond, turns) : inspectNotePane(sid, aid, it, cond)) +

      '<div class="card"><div class="card-h"><h3>送出前自我檢核</h3>' +
        '<span class="muted small">勾了 ' + checks.length + ' / ' + SELF_CHECKS.length + ' 項</span></div>' +
        '<div class="card-p col">' +
        SELF_CHECKS.map(function(c, i){
          const on = checks.some(function(e){ return e.idx === i; });
          return '<label class="opt" style="align-items:center"><input type="checkbox" disabled' +
            (on ? ' checked' : '') + '><span>' + esc(c) + '</span></label>';
        }).join('') +
      '</div></div>' +
    '</div></div>';
}

function subPill(sub){
  const s = SUBPROCESSES.find(function(x){ return x.id === sub; });
  return s ? '<span class="pill">' + esc(s.id) + '　' + esc(s.zh) + '</span>' : '';
}

function inspectOptions(it, resp){
  return '<div class="opts">' + it.options.map(function(o, k){
    const chosen = resp.choice === k;
    const right = k === it.answer;
    const tag = right ? '<span class="pill q1">正解</span>'
      : (it.why && it.why[k] ? '<span class="pill q2">' + esc(it.why[k]) + '　' +
          esc((MISCONCEPTIONS.find(function(m){ return m.id === it.why[k]; }) || {}).name || '') + '</span>' : '');
    return '<div class="opt' + (chosen ? ' chosen' : '') + '" style="align-items:flex-start">' +
      '<b aria-hidden="true">' + String.fromCharCode(65 + k) + '</b>' +
      '<span>' + esc(o) + '　' + tag +
      (chosen ? '<span class="pill" style="border-color:var(--accent);color:var(--accent)">他選這個</span>' : '') +
      '</span></div>';
  }).join('') + '</div>' +
  '<p class="small" style="margin-top:8px">' +
    (resp.choice == null ? '<span class="muted">沒有作答。</span>'
      : (resp.correct ? '<b>答對</b>' : '<b>答錯</b>') +
        '　·　依據位置：第 ' + (it.answerPara + 1) + ' 段第 ' + (it.answerSent + 1) + ' 句') +
  '</p>';
}

function inspectCR(it, resp){
  return '<div class="field"><label>他寫的答案</label>' +
    '<div class="note-full" style="white-space:pre-wrap">' +
    (resp.text ? esc(resp.text) : '<span class="muted">沒有作答。</span>') + '</div></div>' +
    '<p class="muted small" style="margin-top:8px">建構反應題不進入 Rasch 估計，評閱在「派題分析 → 建構反應題評閱」。</p>';
}

function inspectDialogPane(cond, turns){
  return '<div class="card aal-chat"><div class="card-h">' +
    '<h3>他的夥伴：' + esc(cond.name) + '</h3>' +
    '<span class="pill">' + turns.filter(function(t){ return t.speaker === 'student'; }).length +
    ' 次發話</span></div>' +
    '<div class="card-p">' +
    '<div class="chat">' +
      '<div class="msg agent"><b>' + esc(cond.name) + '</b>' + esc(cond.frame) + '</div>' +
      turns.map(function(t){
        const meta = t.speaker === 'student'
          ? '<div class="muted small" style="margin-top:4px">' +
            (t.rel ? esc(REL_MARK[t.rel] + ' ' + REL_LABEL[t.rel]) : '') +
            (t.ucode ? '　·　發話歷程 ' + esc(processName(t.ucode)) : '') +
            (t.sent != null ? '　·　情感 ' + fx(t.sent, 2) : '') + '</div>'
          : (t.qfn ? '<div class="muted small" style="margin-top:4px">提問功能 ' + esc(t.qfn) +
              (t.sub ? '　·　' + esc(t.sub) : '') + '</div>' : '');
        return '<div class="msg ' + (t.speaker === 'student' ? 'me' : 'agent') + '">' +
          (t.speaker === 'agent' ? '<b>' + esc(cond.name) + '</b>' : '') + esc(t.text) + meta + '</div>';
      }).join('') +
    '</div>' +
    '<p class="muted small" style="margin-top:8px">灰字是系統的編碼，學生當時看不到。' +
    '相對歷程以這一題官方標定的歷程為基準。</p>' +
    '</div></div>';
}

function inspectNotePane(sid, aid, it, cond){
  /* 優先讀交卷時存下的完整筆記（state.aalNotes）。
     舊資料只有每 4 秒一次的 80 字 NOTE 事件尾巴，作為回退。 */
  const full = (state.aalNotes || []).filter(function(n){
    return n.sid === sid && n.aid === aid && n.iid === it.id; });
  const tail = allLogs().filter(function(e){
    return e.sid === sid && e.aid === aid && e.iid === it.id && e.code === 'N'; });
  const isControl = cond && cond.id === 'control';
  const body = full.length
    ? full.map(function(n){ return '<div class="note-full" style="white-space:pre-wrap">' +
        esc(n.text || '') + '</div>'; }).join('')
    : (tail.length
        ? '<p class="muted small">只有書寫過程的片段（舊資料沒有存完整筆記）：</p>' +
          tail.map(function(e){ return '<div class="note-full" style="white-space:pre-wrap">' +
            esc(e.text || '') + '</div>'; }).join('')
        : '<p class="muted small">這一題沒有留下' + (isControl ? '筆記' : '對話') + '記錄。</p>');
  return '<div class="card aal-chat"><div class="card-h"><h3>' +
    (isControl ? '他的筆記' : '這一題沒有對話') + '</h3>' +
    '<span class="muted small">' + (isControl ? '無對象條件' : '') + '</span></div>' +
    '<div class="card-p">' + body +
    (isControl ? '<p class="muted small" style="margin-top:8px">對照組的版面與其他三班完全一樣，' +
      '只是把對話區換成同樣大小的筆記區——版面幾何恆定，避免介面差異混進依變項。</p>' : '') +
    '</div></div>';
}

/* ===== src/94-ui-research.js ===== */
/* ==========================================================================
   94-ui-research.js — 研究控制台
   條件分派、對話設計（8 個提示模組）、LSA、ENA、情感軌跡、效果檢定、匯出
   ========================================================================== */

let RTAB = 'design';

function viewResearch(){
  const tabs = [['design','對話設計'],['assign','條件分派'],['lsa','序列分析 LSA'],
                ['ena','認知網絡 ENA'],['sent','情感軌跡'],['stats','效果檢定'],['export','資料匯出']];
  let body = '';
  if (RTAB === 'design') body = rDesign();
  else if (RTAB === 'assign') body = rAssign();
  else if (RTAB === 'lsa') body = rLSA();
  else if (RTAB === 'ena') body = rENA();
  else if (RTAB === 'sent') body = rSent();

function doReassign(){
  const seed = Math.floor(Math.random() * 900000) + 100000;
  const rnd = mulberry32(seed);
  const conds = CONDITIONS.map(function(c){ return c.id; });
  const strata = {};
  state.classes.forEach(function(c){ (strata[c.grade] = strata[c.grade] || []).push(c); });
  // 全體條件序列先洗牌，再在各分層內依序發放，確保條件在分層間平均
  let pool = [];
  const per = Math.ceil(state.classes.length / conds.length);
  for (let i = 0; i < per; i++) pool = pool.concat(conds);
  for (let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1)); const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
  }
  let k = 0;
  Object.keys(strata).sort().forEach(function(g){
    strata[g].forEach(function(c){ c.condition = pool[k++]; });
  });
  state.assignmentLog = state.assignmentLog || [];
  state.assignmentLog.push({at:Date.now(), seed:seed, stratify:'grade',
    map: state.classes.map(function(c){ return {cid:c.id, cond:c.condition}; })});
  save();
  buildDemoLogs();
  toast('已重新分派（種子 ' + seed + '）。示範日誌已依新條件重算。');
}

function condColor(id){

function enaSVG(proj){
  const W = 560, H = 460, m = 40;
  const xs = proj.pts.map(function(p){ return p.x; }), ys = proj.pts.map(function(p){ return p.y; });
  const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  const y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  const X = function(v){ return m + (W - 2 * m) * (v - x0) / ((x1 - x0) || 1); };
  const Y = function(v){ return H - m - (H - 2 * m) * (v - y0) / ((y1 - y0) || 1); };
  const p = ['<svg class="kidmap" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="ENA 投影空間">'];
  p.push('<rect class="axis" x="' + m + '" y="' + m + '" width="' + (W - 2 * m) + '" height="' + (H - 2 * m) + '" fill="none"/>');
  p.push('<line class="theta" x1="' + X(0) + '" y1="' + m + '" x2="' + X(0) + '" y2="' + (H - m) + '"/>');
  p.push('<line class="theta" x1="' + m + '" y1="' + Y(0) + '" x2="' + (W - m) + '" y2="' + Y(0) + '"/>');
  // 各條件形心
  CONDITIONS.forEach(function(c){
    const g = proj.pts.filter(function(q){ return q.cond === c.id; });
    if (!g.length) return;
    g.forEach(function(q){
      p.push('<circle cx="' + X(q.x).toFixed(1) + '" cy="' + Y(q.y).toFixed(1) + '" r="4.5" fill="' +
        condColor(c.id) + '" fill-opacity="0.55" stroke="var(--card)" stroke-width="1"><title>' +
        esc(userName(q.sid)) + '（' + esc(condition(c.id).name) + '）</title></circle>');
    });
    const cx = mean(g.map(function(q){ return q.x; })), cy = mean(g.map(function(q){ return q.y; }));
    p.push('<circle cx="' + X(cx).toFixed(1) + '" cy="' + Y(cy).toFixed(1) + '" r="9" fill="none" stroke="' +
      condColor(c.id) + '" stroke-width="2.5"/>');
    p.push('<text x="' + X(cx).toFixed(1) + '" y="' + (Y(cy) - 14).toFixed(1) + '" text-anchor="middle" fill="' +
      condColor(c.id) + '" style="font-weight:600">' + esc(condition(c.id).name) + '</text>');
  });
  p.push('<text x="' + (W / 2) + '" y="' + (H - 10) + '" text-anchor="middle">SVD 第一維</text>');
  p.push('<text x="14" y="' + (H / 2) + '" transform="rotate(-90 14 ' + (H / 2) + ')" text-anchor="middle">SVD 第二維</text>');
  p.push('</svg>');
  return p.join('');
}

function enaNetSVG(acc, v){
  const W = 240, H = 240, cx = 120, cy = 120, R = 82;
  const ids = acc.ids;
  const pos = ids.map(function(_, i){
    const a = -Math.PI / 2 + 2 * Math.PI * i / ids.length;
    return {x:cx + R * Math.cos(a), y:cy + R * Math.sin(a), a:a};
  });
  const mx = Math.max.apply(null, v.concat([1e-9]));
  const p = ['<svg class="sna" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="平均認知網絡">'];
  acc.pairs.forEach(function(pr, i){
    const w = v[i] / mx;
    if (w < 0.06) return;
    p.push('<line x1="' + pos[pr[0]].x.toFixed(1) + '" y1="' + pos[pr[0]].y.toFixed(1) +
      '" x2="' + pos[pr[1]].x.toFixed(1) + '" y2="' + pos[pr[1]].y.toFixed(1) +
      '" stroke="var(--accent)" stroke-opacity="' + (0.15 + w * 0.7).toFixed(2) +
      '" stroke-width="' + (0.6 + w * 4).toFixed(2) + '"><title>' +
      esc(ENA_CODES[pr[0]].name) + ' — ' + esc(ENA_CODES[pr[1]].name) + '</title></line>');
  });
  ids.forEach(function(id, i){
    p.push('<circle cx="' + pos[i].x.toFixed(1) + '" cy="' + pos[i].y.toFixed(1) +
      '" r="4" fill="var(--ink-3)"/>');
    const lx = cx + (R + 16) * Math.cos(pos[i].a), ly = cy + (R + 16) * Math.sin(pos[i].a);
    const an = Math.cos(pos[i].a) > 0.25 ? 'start' : (Math.cos(pos[i].a) < -0.25 ? 'end' : 'middle');
    p.push('<text x="' + lx.toFixed(1) + '" y="' + (ly + 3).toFixed(1) + '" text-anchor="' + an + '">' +
      esc(ENA_CODES[i].name) + '</text>');
  });
  p.push('</svg>');
  return p.join('');
}

function sentTrajSVG(tr){
  const W = 520, H = 260, m = {t:16, r:16, b:34, l:44};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const maxT = 6;
  // 依實際資料自動縮放（最小 ±0.15），否則詞典法的分數都擠在中線附近看不出差異
  const all = [];
  CONDITIONS.forEach(function(c){
    const d = tr[c.id]; if (!d) return;
    d.byTurn.forEach(function(x){ if (x.turn <= maxT) all.push(x.mean); });
  });
  const span = Math.max(0.15, Math.max.apply(null, all.map(Math.abs).concat([0.05])) * 1.25);
  const X = function(t){ return m.l + iw * (t - 1) / (maxT - 1); };
  const Y = function(v){ return m.t + ih * (1 - (v + span) / (2 * span)); };
  const p = ['<svg class="kidmap" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="情緒軌跡">'];
  p.push('<rect class="axis" x="' + m.l + '" y="' + m.t + '" width="' + iw + '" height="' + ih + '" fill="none"/>');
  p.push('<line class="theta" x1="' + m.l + '" y1="' + Y(0) + '" x2="' + (m.l + iw) + '" y2="' + Y(0) + '"/>');
  [span, 0, -span].forEach(function(v){
    p.push('<text x="' + (m.l - 8) + '" y="' + (Y(v) + 3) + '" text-anchor="end">' +
      (v > 0 ? '+' : '') + v.toFixed(2) + '</text>');
  });
  for (let t = 1; t <= maxT; t++){
    p.push('<text x="' + X(t) + '" y="' + (H - 12) + '" text-anchor="middle">' + t + '</text>');
  }
  CONDITIONS.forEach(function(c){
    const d = tr[c.id]; if (!d || !d.byTurn.length) return;
    const pts = d.byTurn.filter(function(x){ return x.turn <= maxT; });
    if (pts.length < 2) return;
    const path = pts.map(function(x, i){
      return (i ? 'L' : 'M') + X(x.turn).toFixed(1) + ' ' + Y(x.mean).toFixed(1); }).join(' ');
    p.push('<path d="' + path + '" fill="none" stroke="' + condColor(c.id) + '" stroke-width="2"/>');
    pts.forEach(function(x){
      p.push('<circle cx="' + X(x.turn).toFixed(1) + '" cy="' + Y(x.mean).toFixed(1) + '" r="3.5" fill="' +
        condColor(c.id) + '"><title>' + esc(c.name) + ' 第 ' + x.turn + ' 回合：' + fx(x.mean, 2) +
        '（n=' + x.n + '）</title></circle>');
    });
  });
  p.push('<text x="' + (m.l + iw / 2) + '" y="' + (H - 2) + '" text-anchor="middle">回合</text>');
  p.push('</svg>');
  return p.join('');
}

function rStats(){
  const rows = analysisDataset();
  const outs = outcomeList();
  const sel = rStats.sel || 'theta_post';
  rStats.sel = sel;
  const o = outs.find(function(x){ return x.id === sel; }) || outs[0];
  const res = ancova(rows, o.get, o.cov);

  const medY = outs.find(function(x){ return x.id === 'theta_post'; });
  const mediators = ['mot_in', 'eff', 'cl_ge', 'eng_c', 'anx'].map(function(id){
    const c = constructById(id);
    return {name:c.name, get:function(r){ return r.post[id]; }};
  });

  return '<div class="card card-p" style="margin-bottom:16px">' +
    '<h3>共變數分析與中介路徑</h3>' +
    '<p class="lead" style="margin-top:8px">以條件為因子、對應的前測分數為共變數，檢定四條件在結果變項上的差異，' +
    '報告 F、p、partial η² 與 Bonferroni 校正後的事後比較；再以平行多重中介的路徑分析估計' +
    '「條件 → 動機性變項 → 表現」的間接效果，信賴區間以百分位 bootstrap 求得。</p>' +
    '<p class="muted small">本模組估計的是<strong>觀察變項</strong>路徑模型，不是含潛在變項的結構方程模型；' +
    'p 值採 Wilson–Hilferty 近似。正式分析請以 lavaan／Mplus 重跑並檢驗測量模型。' +
    '此外，條件在班級層次操弄，嚴謹的分析應採多層次模型處理班級內相依。</p>' +
    '<div class="row" style="margin-top:10px"><label class="small muted">結果變項</label>' +
    '<select data-act="st-out" style="width:auto;max-width:320px">' + outs.map(function(x){
      return '<option value="' + x.id + '"' + (sel === x.id ? ' selected' : '') + '>' + esc(x.name) + '</option>';
    }).join('') + '</select>' +
    (o.cov ? '<span class="muted small">共變數：' + esc(o.covName) + '</span>'
           : '<span class="muted small">無共變數（單因子變異數分析）</span>') + '</div></div>' +

    (res ? '<div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(300px,.85fr);gap:16px">' +
    '<div class="card"><div class="card-h"><h3>' + esc(o.name) + '</h3>' +
    '<span class="pill' + (res.p < .05 ? ' q1' : '') + '">F(' + res.df1 + ', ' + res.df2 + ') = ' +
    res.F.toFixed(2) + '　p ' + fmtP(res.p) + '　ηp² = ' + res.eta.toFixed(3) + '</span></div>' +
    '<div class="tablewrap"><table><thead><tr><th>條件</th><th class="n">n</th>' +
    '<th class="n">原始 M</th><th class="n">SD</th>' + (res.covariate ? '<th class="n">共變數 M</th>' : '') +
    '<th class="n">調整後 M</th><th>相對位置</th></tr></thead><tbody>' +
    res.desc.slice().sort(function(a, b){ return b.adj - a.adj; }).map(function(d){
      const lo = Math.min.apply(null, res.desc.map(function(x){ return x.adj; }));
      const hi = Math.max.apply(null, res.desc.map(function(x){ return x.adj; }));
      const w = hi > lo ? (d.adj - lo) / (hi - lo) * 100 : 50;
      return '<tr><td><span class="pill ' + (condition(d.cond).cls || '') + '">' +
        esc(condition(d.cond).name) + '</span></td>' +
        '<td class="n">' + d.n + '</td><td class="n">' + fx(d.m) + '</td><td class="n">' + fx(d.sd) + '</td>' +
        (res.covariate ? '<td class="n">' + fx(d.xm) + '</td>' : '') +
        '<td class="n" style="font-weight:600">' + fx(d.adj) + '</td>' +
        '<td style="min-width:120px"><div class="bar"><i style="width:' + w.toFixed(0) + '%"></i></div></td></tr>';
    }).join('') + '</tbody></table></div>' +
    '<div class="card-p"><p class="muted small">調整後平均＝在共變數的總平均處的預測值。' +
    'partial η² 的常用參考值：.01 小、.06 中、.14 大。</p></div></div>' +

    '<div class="card"><div class="card-h"><h3>事後比較</h3>' +
    '<span class="muted small">Bonferroni 校正</span></div>' +
    '<div class="tablewrap"><table><thead><tr><th>比較</th><th class="n">差異</th><th class="n">t</th>' +
    '<th class="n">p(調整)</th><th class="n">d</th></tr></thead><tbody>' +
    res.pairs.slice().sort(function(a, b){ return a.pAdj - b.pAdj; }).map(function(pr){
      return '<tr' + (pr.pAdj < .05 ? ' style="background:var(--q1-bg)"' : '') + '>' +
        '<td class="small">' + esc(condition(pr.a).name) + ' − ' + esc(condition(pr.b).name) + '</td>' +
        '<td class="n">' + fx(pr.diff) + '</td><td class="n">' + fx(pr.t) + '</td>' +
        '<td class="n">' + fmtP(pr.pAdj) + '</td><td class="n">' + fx(pr.d) + '</td></tr>';
    }).join('') + '</tbody></table></div></div></div>'
    : '<div class="empty"><h3>資料不足</h3><p>需要更多完成作答與問卷的學生。</p></div>') +

    '<div class="card" style="margin-top:16px"><div class="card-h"><h3>平行多重中介：條件 → 動機性變項 → 後測 θ</h3>' +
    '<span class="muted small">各角色 vs. 對照組</span></div>' +
    '<div class="card-p col">' + ['tutor', 'tutee', 'peer'].map(function(cid){
      const md = mediation(rows, cid, medY.get, mediators, medY.cov, 1200);
      if (!md) return '<div class="muted small">' + esc(condition(cid).name) + '：資料不足。</div>';
      return '<div class="note-full"><div class="row" style="justify-content:space-between;margin-bottom:8px">' +
        '<b class="' + condition(cid).cls + '">' + esc(condition(cid).name) + ' vs. 對照</b>' +
        '<span class="muted small">n = ' + md.n + '　·　bootstrap ' + md.boot + ' 次</span></div>' +
        '<div class="tablewrap"><table><thead><tr><th>中介變項</th><th class="n">a</th><th class="n">b</th>' +
        '<th class="n">a×b</th><th class="n">95% CI</th></tr></thead><tbody>' +
        md.paths.map(function(p){
          return '<tr' + (p.sig ? ' style="background:var(--q1-bg)"' : '') + '>' +
            '<td>' + esc(p.name) + '</td><td class="n">' + fx(p.a) + '</td><td class="n">' + fx(p.b) + '</td>' +
            '<td class="n" style="font-weight:600">' + fx(p.ind) + '</td>' +
            '<td class="n small">[' + fx(p.lo) + ', ' + fx(p.hi) + ']</td></tr>';
        }).join('') +
        '<tr><td><b>總間接效果</b></td><td class="n">—</td><td class="n">—</td>' +
        '<td class="n" style="font-weight:600">' + fx(md.total.ind) + '</td>' +
        '<td class="n small">[' + fx(md.total.lo) + ', ' + fx(md.total.hi) + ']</td></tr>' +
        '</tbody></table></div>' +
        '<div class="muted small" style="margin-top:6px">總效果 c = ' + fx(md.c) +

        '</div>';
    }).join('') + '</div></div>';
}

<title>KIDFORUM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ==========================================================================
   KIDFORUM — 設計語彙
   色彩：全站唯一有顏色的東西都「有意義」。品牌保持墨色中性，
        彩度只留給 KIDMAP 四象限與知識建構支架。
   字體：宋體(Noto Serif TC) 標題＝測驗卷／課本的聲音；
        系統黑體＝介面；IBM Plex Mono＝所有心理計量數值。
   版面：頂列（角色與情境）＋ 左側工作區軌道 ＋ 主舞台。
        量化介面鋪冷色方格紙，論述介面鋪暖灰再生紙點陣。
   ========================================================================== */

:root {
  color-scheme: light;
  --ink:      #12161c;
  --ink-2:    #2b333e;
  --ink-3:    #5a6472;
  --ink-4:    #8b95a3;
  --rule:     #d5dbe3;
  --rule-soft:#e7ebf0;
  --paper:    #f3f4f0;
  --card:     #ffffff;
  --cool:     #eef1f5;
  --grid:     #e4e9ef;
  --shade:    #f7f8fa;
  --accent:   #1f3350;
  --accent-ink:#ffffff;
  --focus:    #2e6be6;
  --shadow:   0 1px 2px rgba(18,22,28,.06), 0 8px 24px -16px rgba(18,22,28,.22);

  --q1:#2e7d5b; --q1-bg:#e3f0e9; --q1-line:#a8d3bf;
  --q2:#be3a2b; --q2-bg:#f9e7e4; --q2-line:#e5b0a8;
  --q3:#78829a; --q3-bg:#eceff4; --q3-line:#c3cad6;
  --q4:#4a72ae; --q4-bg:#e6edf7; --q4-line:#b3c6e0;

  --sc-1:#3e6fb0; --sc-2:#a86f1c; --sc-3:#2e7d5b;
  --sc-4:#be3a2b; --sc-5:#6a4a9e; --sc-6:#0e7c86;

  --good:#2e7d5b; --warn:#a86f1c; --crit:#be3a2b;

  --f-display:"Noto Serif TC","Songti TC","Source Han Serif TC",serif;
  --f-body:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Hiragino Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --r-s:4px; --r-m:7px; --r-l:12px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ink:#e7ebf1; --ink-2:#c3cbd6; --ink-3:#98a2b0; --ink-4:#6f7987;
    --rule:#2d353f; --rule-soft:#242b34;
    --paper:#14181d; --card:#1a1f26; --cool:#12161b; --grid:#222932; --shade:#1d232b;
    --accent:#b9cdea; --accent-ink:#101821; --focus:#7aa7ff;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
    --q1:#63c295; --q1-bg:#16302a; --q1-line:#2c5c48;
    --q2:#e2705f; --q2-bg:#341d1a; --q2-line:#6b3730;
    --q3:#98a3b8; --q3-bg:#222831; --q3-line:#3d4653;
    --q4:#7fa5da; --q4-bg:#1a2434; --q4-line:#35486a;
    --sc-1:#7fa5da; --sc-2:#d3a44e; --sc-3:#63c295;
    --sc-4:#e2705f; --sc-5:#a98cd8; --sc-6:#49b3bd;
    --good:#63c295; --warn:#d6a44e; --crit:#e2705f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ink:#e7ebf1; --ink-2:#c3cbd6; --ink-3:#98a2b0; --ink-4:#6f7987;
  --rule:#2d353f; --rule-soft:#242b34;
  --paper:#14181d; --card:#1a1f26; --cool:#12161b; --grid:#222932; --shade:#1d232b;
  --accent:#b9cdea; --accent-ink:#101821; --focus:#7aa7ff;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
  --q1:#63c295; --q1-bg:#16302a; --q1-line:#2c5c48;
  --q2:#e2705f; --q2-bg:#341d1a; --q2-line:#6b3730;
  --q3:#98a3b8; --q3-bg:#222831; --q3-line:#3d4653;
  --q4:#7fa5da; --q4-bg:#1a2434; --q4-line:#35486a;
  --sc-1:#7fa5da; --sc-2:#d3a44e; --sc-3:#63c295;
  --sc-4:#e2705f; --sc-5:#a98cd8; --sc-6:#49b3bd;
  --good:#63c295; --warn:#d6a44e; --crit:#e2705f;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-display); font-weight:700; text-wrap:balance; margin:0; line-height:1.32; letter-spacing:.01em}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px} h4{font-size:14px}
p{margin:0 0 .8em}
a{color:var(--accent); text-underline-offset:3px}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:3px}
button,input,select,textarea{font:inherit; color:inherit}
.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums}

/* ---------- 外殼 ----------
   刻意採用「文件自然捲動」而非固定視窗高度的 app shell：
   這個頁面會被嵌在別的容器裡（Artifact 檢視器、投影、列印），
   內層自訂捲動區與視窗高度單位在那些環境容易出問題。        */
.app{ display:flex; flex-direction:column; min-height:100vh }
.main{ display:flex; align-items:flex-start; flex:1 }
.topbar{
  position:sticky; top:0; height:54px; display:flex; align-items:center; gap:14px; padding:0 16px;
  background:var(--card); border-bottom:1px solid var(--rule); z-index:20;
}
.brand{display:flex; align-items:baseline; gap:9px; margin-right:4px}
.brand b{font-family:var(--f-display); font-size:18px; letter-spacing:.06em}
.brand span{font-size:11.5px; color:var(--ink-3); letter-spacing:.06em}
.spacer{flex:1}
.chip-demo{
  font-size:11px; letter-spacing:.06em; color:var(--ink-3);
  border:1px dashed var(--rule); border-radius:100px; padding:2px 9px; white-space:nowrap;
}

.rail{
  position:sticky; top:54px; align-self:flex-start; flex:0 0 236px; width:236px;
  min-height:calc(100vh - 54px); max-height:calc(100vh - 54px); overflow-y:auto;
  background:var(--card); border-right:1px solid var(--rule);
  padding:12px 10px 24px; display:flex; flex-direction:column; gap:2px;
}
.rail-group{font-size:10.5px; letter-spacing:.14em; color:var(--ink-4); padding:14px 10px 6px}
.rail a{
  display:flex; align-items:center; gap:9px; padding:7px 10px; border-radius:var(--r-m);
  color:var(--ink-2); text-decoration:none; font-size:13.5px; border:1px solid transparent;
}
.rail a:hover{background:var(--shade)}
.rail a[aria-current="page"]{background:var(--shade); border-color:var(--rule); color:var(--ink); font-weight:600}
.rail .glyph{width:18px; text-align:center; color:var(--ink-4); font-family:var(--f-mono); font-size:12px}
.rail a[aria-current="page"] .glyph{color:var(--ink)}
.rail .badge{margin-left:auto; font-family:var(--f-mono); font-size:11px; color:var(--ink-3); background:var(--shade); border:1px solid var(--rule-soft); border-radius:100px; padding:0 6px}

.stage{flex:1; min-width:0; position:relative; min-height:calc(100vh - 54px)}
.stage.measure{background:var(--cool);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px}
.stage.discourse{background:var(--paper); background-image:radial-gradient(var(--grid) 1.1px,transparent 1.1px); background-size:19px 19px}
.wrap{max-width:1160px; margin:0 auto; padding:22px 22px 72px}
.wrap.narrow{max-width:790px}

/* ---------- 元件 ---------- */
.card{background:var(--card); border:1px solid var(--rule); border-radius:var(--r-l); box-shadow:var(--shadow)}
.card-p{padding:18px}
.card-h{display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--rule-soft)}
.card-h h3{flex:1}
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.col{display:flex; flex-direction:column; gap:10px}
.eyebrow{font-size:10.5px; letter-spacing:.16em; color:var(--ink-4); font-family:var(--f-mono)}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.hr{height:1px; background:var(--rule-soft); border:0; margin:16px 0}
.lead{font-size:15px; color:var(--ink-2); line-height:1.8; max-width:66ch}

.btn{
  display:inline-flex; align-items:center; gap:7px; padding:7px 13px; border-radius:var(--r-m);
  border:1px solid var(--rule); background:var(--card); color:var(--ink); cursor:pointer;
  font-size:13.5px; line-height:1.4; transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--shade)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.btn.primary:hover{filter:brightness(1.14)}
.btn.ghost{border-color:transparent; background:transparent}
.btn.ghost:hover{background:var(--shade)}
.btn.sm{padding:4px 9px; font-size:12.5px}
.btn.danger{color:var(--crit); border-color:var(--q2-line)}

.field{display:flex; flex-direction:column; gap:5px}
.field > label{font-size:12px; color:var(--ink-3)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=datetime-local],select,textarea{
  width:100%; padding:7px 10px; border:1px solid var(--rule); border-radius:var(--r-m);
  background:var(--card); color:var(--ink);
}
textarea{resize:vertical; min-height:80px; line-height:1.7}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus); border-color:transparent}

.pill{display:inline-flex; align-items:center; gap:5px; border-radius:100px; padding:1px 9px; font-size:11.5px; border:1px solid var(--rule); background:var(--shade); color:var(--ink-2); white-space:nowrap}
.pill .dot{width:7px; height:7px; border-radius:50%; background:currentColor}
.q1{color:var(--q1); background:var(--q1-bg); border-color:var(--q1-line)}
.q2{color:var(--q2); background:var(--q2-bg); border-color:var(--q2-line)}
.q3{color:var(--q3); background:var(--q3-bg); border-color:var(--q3-line)}
.q4{color:var(--q4); background:var(--q4-bg); border-color:var(--q4-line)}

.stat{padding:14px 16px; background:var(--card); border:1px solid var(--rule); border-radius:var(--r-l)}
.stat .k{font-size:11px; letter-spacing:.1em; color:var(--ink-4); font-family:var(--f-mono)}
.stat .v{font-family:var(--f-mono); font-size:27px; font-weight:600; line-height:1.25; letter-spacing:-.01em}
.stat .s{font-size:12px; color:var(--ink-3)}
.stat.crit{border-left:3px solid var(--crit)}
.stat.good{border-left:3px solid var(--good)}
.stat.warn{border-left:3px solid var(--warn)}

.tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; font-size:13px}
th,td{text-align:left; padding:7px 10px; border-bottom:1px solid var(--rule-soft); vertical-align:middle}
th{font-size:11px; letter-spacing:.08em; color:var(--ink-4); font-weight:600; white-space:nowrap; background:var(--card)}
tbody tr:hover{background:var(--shade)}
td.n,th.n{text-align:right; font-family:var(--f-mono); font-variant-numeric:tabular-nums}

.bar{height:7px; background:var(--shade); border-radius:100px; overflow:hidden; min-width:52px; border:1px solid var(--rule-soft)}
.bar i{display:block; height:100%; background:var(--accent)}

.tabs{display:flex; gap:2px; border-bottom:1px solid var(--rule); margin-bottom:18px; overflow-x:auto}
.tabs button{
  border:0; background:transparent; padding:9px 13px; cursor:pointer; color:var(--ink-3);
  border-bottom:2px solid transparent; font-size:13.5px; white-space:nowrap;
}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent); font-weight:600}

.steps{display:flex; gap:8px; align-items:center; margin-bottom:18px; flex-wrap:wrap}
.step{display:flex; align-items:center; gap:7px; padding:5px 12px; border:1px solid var(--rule); border-radius:100px; font-size:13px; color:var(--ink-3); background:var(--card)}
.step b{font-family:var(--f-mono); font-size:11px; width:17px; height:17px; border-radius:50%; display:grid; place-items:center; background:var(--shade); color:var(--ink-3)}
.step.on{color:var(--ink); border-color:var(--accent)}
.step.on b{background:var(--accent); color:var(--accent-ink)}

.empty{text-align:center; padding:44px 20px; color:var(--ink-3)}
.empty h3{margin-bottom:6px; color:var(--ink)}

.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:200;
  background:var(--ink); color:var(--card); padding:9px 16px; border-radius:100px;
  font-size:13px; box-shadow:var(--shadow); max-width:88vw;
}
.modal-back{position:fixed; inset:0; background:rgba(10,14,20,.45); z-index:100; display:grid; place-items:center; padding:18px}
.modal{background:var(--card); border:1px solid var(--rule); border-radius:var(--r-l); box-shadow:var(--shadow); width:min(760px,100%); max-height:88dvh; overflow:auto}
.modal.wide{width:min(1060px,100%)}
.modal-h{display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--rule-soft); position:sticky; top:0; background:var(--card); z-index:2}
.modal-h h3{flex:1}
.modal-b{padding:18px}
.modal-f{display:flex; gap:9px; justify-content:flex-end; padding:14px 18px; border-top:1px solid var(--rule-soft); position:sticky; bottom:0; background:var(--card); flex-wrap:wrap}

/* ---------- 試題 ---------- */
.item{border:1px solid var(--rule); border-radius:var(--r-m); background:var(--card); padding:13px 15px}
.item .stem{margin:6px 0 9px; line-height:1.85}
.opts{display:grid; gap:6px}
.opt{display:flex; gap:9px; align-items:flex-start; padding:6px 10px; border:1px solid var(--rule-soft); border-radius:var(--r-m); cursor:pointer; background:var(--card)}
.opt:hover{background:var(--shade)}
.opt input{margin-top:4px; accent-color:var(--accent)}
.opt b{font-family:var(--f-mono); color:var(--ink-3)}
.opt.right{border-color:var(--q1-line); background:var(--q1-bg)}
.opt.wrong{border-color:var(--q2-line); background:var(--q2-bg)}
.opt.chosen{outline:2px solid var(--focus); outline-offset:-2px}

/* ---------- KIDMAP ---------- */
.kidmap{width:100%; height:auto; display:block; overflow:visible}
.kidmap text{font-family:var(--f-mono); font-size:10px; fill:var(--ink-3)}
.kidmap .axis{stroke:var(--rule); stroke-width:1}
.kidmap .theta{stroke:var(--accent); stroke-width:1.4; stroke-dasharray:5 4}
.kidmap .qlabel{font-size:10.5px; letter-spacing:.06em; font-weight:600}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-3)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.swatch{width:10px; height:10px; border-radius:2px; display:inline-block}

/* ---------- 知識建構 ---------- */
.kb-toolbar{display:flex; gap:9px; align-items:center; flex-wrap:wrap; padding:10px 14px; background:var(--card); border:1px solid var(--rule); border-radius:var(--r-l); margin-bottom:14px; box-shadow:var(--shadow)}
.canvas{
  position:relative; height:660px; border:1px solid var(--rule); border-radius:var(--r-l);
  background:var(--card); background-image:radial-gradient(var(--grid) 1.1px,transparent 1.1px); background-size:19px 19px;
  overflow:auto; touch-action:pan-x pan-y;
}
.canvas-inner{position:relative; width:1600px; height:1100px}
.note{
  position:absolute; width:216px; background:var(--card); border:1px solid var(--rule);
  border-left:4px solid var(--ink-4); border-radius:var(--r-m); padding:9px 11px; cursor:grab;
  box-shadow:var(--shadow); user-select:none;
}
.note:active{cursor:grabbing}
.note.sel{outline:2px solid var(--focus); outline-offset:1px}
.note .nt{font-weight:600; font-size:13.5px; line-height:1.45; margin-bottom:3px; font-family:var(--f-display)}
.note .nb{font-size:12px; color:var(--ink-3); line-height:1.55; max-height:54px; overflow:hidden}
.note .nf{display:flex; gap:7px; align-items:center; margin-top:7px; font-size:11px; color:var(--ink-4); font-family:var(--f-mono); flex-wrap:wrap}
.note.unread{box-shadow:var(--shadow),inset 0 3px 0 var(--accent)}
.note.problem{border-left-color:var(--q2); background:var(--q2-bg)}
.note.rise{border-left-color:var(--sc-6); box-shadow:var(--shadow),0 0 0 3px var(--card),0 0 0 4px var(--sc-6)}
.edges{position:absolute; inset:0; pointer-events:none; overflow:visible; width:100%; height:100%}
.edges path{fill:none; stroke-width:1.4}
.edges path.build{stroke:var(--accent); opacity:.45}
.edges path.ref{stroke:var(--sc-5); stroke-dasharray:3 3; opacity:.6}
.edges path.rise{stroke:var(--sc-6); stroke-dasharray:6 3; opacity:.65}

.sc-btns{display:flex; gap:6px; flex-wrap:wrap}
.sc-btn{border:1px solid var(--rule); background:var(--card); border-radius:100px; padding:3px 11px; font-size:12.5px; cursor:pointer; border-left-width:4px}
.sc-btn:hover{background:var(--shade)}
.sc-seg{border-left:3px solid var(--rule); padding:2px 0 2px 10px; margin:0 0 10px}
.sc-seg .lab{font-size:11px; letter-spacing:.05em; font-weight:600; display:block; margin-bottom:1px}
.sc1{border-left-color:var(--sc-1)} .sc1 .lab,.sc-btn.sc1{color:var(--sc-1)}
.sc2{border-left-color:var(--sc-2)} .sc2 .lab,.sc-btn.sc2{color:var(--sc-2)}
.sc3{border-left-color:var(--sc-3)} .sc3 .lab,.sc-btn.sc3{color:var(--sc-3)}
.sc4{border-left-color:var(--sc-4)} .sc4 .lab,.sc-btn.sc4{color:var(--sc-4)}
.sc5{border-left-color:var(--sc-5)} .sc5 .lab,.sc-btn.sc5{color:var(--sc-5)}
.sc6{border-left-color:var(--sc-6)} .sc6 .lab,.sc-btn.sc6{color:var(--sc-6)}

.thread{border-left:2px solid var(--rule-soft); padding-left:14px; margin-left:6px; margin-top:10px; display:flex; flex-direction:column; gap:10px}
.note-full{border:1px solid var(--rule); border-radius:var(--r-m); padding:13px 15px; background:var(--card)}
.note-full .meta{font-size:11.5px; color:var(--ink-4); font-family:var(--f-mono); display:flex; gap:9px; flex-wrap:wrap; align-items:center}

.ai-out{background:var(--shade); border:1px solid var(--rule-soft); border-radius:var(--r-m); padding:14px 16px; font-size:13.5px; line-height:1.78}
.ai-out h3,.ai-out h4,.ai-out h5,.ai-out h6{margin:15px 0 6px; font-size:14px}
.ai-out h3{font-size:15.5px}
.ai-out h3:first-child,.ai-out h4:first-child,.ai-out h5:first-child{margin-top:0}
.ai-out ul,.ai-out ol{margin:0 0 10px; padding-left:20px}
.ai-out li{margin-bottom:3px}
.ai-out code{font-family:var(--f-mono); font-size:12.5px; background:var(--card); padding:1px 5px; border-radius:3px; border:1px solid var(--rule-soft)}
.ai-out strong{color:var(--ink)}
.ai-out table{margin-bottom:10px}

.rub-row{display:grid; grid-template-columns:130px 1fr 54px; gap:10px; align-items:center; font-size:13px}
.rub-row .lv{font-family:var(--f-mono); font-size:12px; text-align:right; color:var(--ink-3)}

canvas.pad{border:1px solid var(--rule); border-radius:var(--r-m); background:var(--card); touch-action:none; display:block; width:100%; cursor:crosshair}

.sna{width:100%; height:auto; display:block}
.sna text{font-family:var(--f-body); font-size:9.5px; fill:var(--ink-3)}
.sna line{stroke:var(--rule)}
.sna circle{stroke:var(--card); stroke-width:1.5}

.delta.up{color:var(--good)} .delta.down{color:var(--crit)} .delta.flat{color:var(--ink-4)}

/* ---------- 評量即學習事件 ----------
   四條件共用同一份版面幾何：對照組只是把對話卡換成同尺寸的筆記卡，

.aal{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(330px,.95fr); gap:16px; align-items:start}
.aal-text{position:sticky; top:70px}
.aal-side{display:flex; flex-direction:column; gap:16px; min-width:0}
.aal-chat .card-p{display:flex; flex-direction:column}
.sentences{line-height:2.1; font-size:15.5px}
.sent{cursor:pointer; padding:1px 2px; border-radius:3px; border-bottom:1px dashed var(--rule)}
.sent:hover{background:var(--shade)}
.sent.on{background:var(--q4-bg); border-bottom:2px solid var(--q4); color:var(--ink)}
.chat{display:flex; flex-direction:column; gap:8px; height:300px; overflow-y:auto; padding-right:4px}
.msg{max-width:88%; padding:8px 12px; border-radius:12px; font-size:13.5px; line-height:1.6}
.msg b{display:block; font-size:11px; letter-spacing:.04em; color:var(--ink-4); font-weight:600; margin-bottom:2px}
.msg.agent{align-self:flex-start; background:var(--shade); border:1px solid var(--rule-soft); border-bottom-left-radius:3px}
.msg.me{align-self:flex-end; background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:3px}
.msg.sys{align-self:center; background:transparent; border:1px dashed var(--rule); color:var(--ink-3); font-size:12.5px}

/* ---------- 問卷 ---------- */
.likert{padding:10px 0; border-bottom:1px solid var(--rule-soft)}
.likert:last-child{border-bottom:0}
.likert .q{font-size:14px; margin-bottom:7px; line-height:1.6}
.scale{display:flex; gap:6px; flex-wrap:wrap}
.lk{width:38px; height:34px; border:1px solid var(--rule); background:var(--card); border-radius:var(--r-m);
    cursor:pointer; font-family:var(--f-mono); font-size:13px; color:var(--ink-3)}
.lk:hover{background:var(--shade)}
.lk.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.scale-lab{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-4); margin-top:4px; max-width:270px}

pre.prompt{
  font-family:var(--f-mono); font-size:11.5px; line-height:1.65; white-space:pre-wrap; word-break:break-word;
  background:var(--shade); border:1px solid var(--rule-soft); border-radius:var(--r-m);
  padding:11px 13px; margin:0; color:var(--ink-2);
}

.principle{display:grid; grid-template-columns:26px 1fr; gap:12px; padding:10px 0; border-bottom:1px solid var(--rule-soft)}
.principle .no{font-family:var(--f-mono); font-size:12px; color:var(--ink-4); padding-top:3px}
.principle b{display:block; margin-bottom:2px}

@media (max-width:900px){
  .main{flex-direction:column; align-items:stretch}
  .rail{position:static; width:auto; flex:0 0 auto; max-height:none; min-height:0;
        flex-direction:row; overflow-x:auto; border-right:0; border-bottom:1px solid var(--rule); padding:8px 10px; gap:6px}
  .stage{min-height:0}
  .rail-group{display:none}
  .rail a{white-space:nowrap}
  .rail .badge{display:none}
  .wrap{padding:16px 14px 60px}
  .brand span{display:none}
  .aal{grid-template-columns:1fr}
  .aal-text{position:static}
}

/* --- 固定種子亂數（mulberry32），確保示範資料可重現 --- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function crText(it, s, mode, rnd){
  const strong = s.thetaTrue > 0.4;
  const grew = mode === 'post' && s.engage > 0.45;
  if (it.id === 'C01'){
    if (strong || grew){
      return '2x²−7x+3=0\n用十字交乘：(2x−1)(x−3)=0\n所以 2x−1=0 或 x−3=0\nx=1/2 或 x=3\n檢驗：2×(1/2)²−7×(1/2)+3=0.5−3.5+3=0 ✓；2×9−21+3=0 ✓';
    }
    if (s.thetaTrue > -0.6){
      return '2x²−7x+3=0\n用公式解 x=(7±√(49−24))/4=(7±5)/4\nx=3 或 x=1/2\n（沒有檢驗）';
    }
    return '2x²−7x+3=0\n我把 3 移過去變 2x²−7x=−3\n然後 x(2x−7)=−3\n所以 x=−3 或 2x−7=−3 → x=2';
  }
  // C02
  if (s.held.indexOf('M1') >= 0 && !(mode === 'post' && s.engage > 0.5)){
    return '我覺得小明是對的，因為 5×5=25，所以 x=5。';
  }
  if (strong || grew){

}

/* ==========================================================================
   離線對話引擎
   角色只改社會框架，提問功能與子歷程提問庫三角色共用，
   因此不需要語言模型也能忠實產生三條件的對話。
   ========================================================================== */

const ROLE_OPENER = {
  tutor: ['這一題我們一起想。', '好，我聽你說。', '我想確認你怎麼想的。', '先不要急著算。'],
  tutee: ['我也在看這一題，可是我卡住了。', '這裡我不太懂耶。', '我剛剛好像想錯了。', '你這樣說我有一點懂了。'],
  peer:  ['我先講我想到哪裡。', '我也在做這一題。', '我的想法跟你可能不一樣。', '欸我們對一下。']
};
const ROLE_STEM = {
  tutor: function(q){ return q; },
  tutee: function(q){ return '你可以說給我聽嗎——' + q; },
  peer:  function(q){ return '那你呢？' + q; }
};

/* 依回合排程挑一個子歷程（不看學生說了什麼，只看回合數與該題的官方歷程標定） */
function pickSubprocess(processId, item, turn){
  const subs = subprocessesOf(processId).filter(function(s){
    if (s.fit === '皆可') return true;
    if (s.fit === '計算') return item.type === 'mc';
    if (s.fit === '應用') return (item.tags || []).indexOf('應用問題') >= 0;
    if (s.fit === '幾何') return (item.tags || []).indexOf('畢氏定理') >= 0;
    return true;
  });
  const pool = subs.length ? subs : subprocessesOf(processId);
  return pool[turn % pool.length];
}

/* 產生一則 AI 回應（離線引擎）。回傳含研究所需的完整中繼資料。 */
function agentTurn(conditionId, item, turn, rnd){
  const r = rnd || Math.random;
  const qfnId = TURN_SCHEDULE[Math.min(turn, TURN_SCHEDULE.length - 1)];
  const pid = item.process || 'K';
  let sub = null, body = '';

  if (qfnId === 'F1'){
    body = '這一題到底在問什麼？用你自己的話說一次。';
  } else if (qfnId === 'F2'){
    body = '你剛剛的判斷，用到題目裡的哪一個條件？';
  } else if (qfnId === 'F3'){
    sub = pickSubprocess(pid, item, turn);
    body = sub.q;
  } else if (qfnId === 'F4'){
    body = '什麼情況下你這個做法會不成立？想一個會出問題的例子。';
  } else if (qfnId === 'F5'){
    // 延伸：優先往上一層歷程取一個子歷程，沒有上一層就回到同層另一個
    const up = PROCESSES.find(function(p){ return p.order === processOrder(pid) + 1; });
    sub = pickSubprocess(up ? up.id : pid, item, turn + 2);
    body = sub.q;
  } else {
    body = '現在如果只能講一句話說你的想法，你會怎麼說？';
  }

  const openers = ROLE_OPENER[conditionId] || [''];
  const opener = openers[Math.floor(r() * openers.length)];
  const text = (opener ? opener + ' ' : '') + (ROLE_STEM[conditionId] || function(q){ return q; })(body);

  return {
    text: leakGuard(text, item).text,
    qfn: qfnId,
    sub: sub ? sub.id : null,
    process: sub ? sub.p : pid,
    engine: 'builtin'
  };
}

/* --- 防洩答攔截 ---
   規則引擎本來就不會產生答案，但外部語言模型會。輸出後一律過這一關，
   攔截次數本身就是一項可報告的忠實度指標。 */
const VERDICT_WORDS = ['答對', '答錯', '正確答案', '你錯了', '你對了', '正解是', '應該選', '答案是', '選項是'];
function leakGuard(text, item){
  let t = String(text), hits = [];
  VERDICT_WORDS.forEach(function(w){ if (t.indexOf(w) >= 0) hits.push(w); });
  if (item && item.type === 'mc' && item.options){
    const ans = item.options[item.answer];
    if (ans && t.indexOf(ans) >= 0) hits.push('正解字串');
    const letter = String.fromCharCode(65 + item.answer);
    if (new RegExp('(選|答案|正解)\\s*' + letter + '\\b').test(t)) hits.push('正解代號');
  }
  if (hits.length){
    return {text:'這個我不能說喔。換個方式問你：你剛剛是從題目的哪一句得到這個想法的？',
            blocked:true, hits:hits};
  }
  return {text:t, blocked:false, hits:[]};
}

/* ==========================================================================
   相對歷程編碼（對應研究構想 RQ4）
   以「試題官方標定之歷程」為判定基準，把學生的每一次發話編碼為
   低於（BELOW）／等於（AT）／高於（ABOVE）該題所要求的歷程層次。
   ========================================================================== */
const PROCESS_CUES = {
  K: ['公式', '定義', '怎麼算', '算式', '幾', '等於', '記得', '背', '步驟', '代入', '照著'],
  A: ['方法', '策略', '設', '列式', '模型', '應該用', '哪一種做法', '轉換', '先做', '拆成'],
  R: ['為什麼', '如果', '反例', '不成立', '證明', '推論', '一定嗎', '哪裡錯', '比較', '判斷', '通則', '任何']
};
function codeUtteranceProcess(text){
  const t = String(text || '');
  let best = 'K', bestN = 0;
  ['R', 'A', 'K'].forEach(function(p){
    let n = 0;
    PROCESS_CUES[p].forEach(function(c){ if (t.indexOf(c) >= 0) n++; });
    if (n > bestN){ bestN = n; best = p; }
  });
  if (!bestN) return t.length > 30 ? 'A' : 'K';
  return best;
}
function relativeProcessCode(utterance, item){
  const u = processOrder(codeUtteranceProcess(utterance));
  const o = processOrder(item.process || 'K');
  return u < o ? 'BELOW' : (u > o ? 'ABOVE' : 'AT');
}
const REL_LABEL = {BELOW:'低於題目歷程', AT:'等於題目歷程', ABOVE:'高於題目歷程'};
const REL_SHORT = {BELOW:'Q−', AT:'Q0', ABOVE:'Q+'};

/* ==========================================================================
   情感分析（詞典法）
   ========================================================================== */
const SENT_POS = ['懂了', '會了', '對耶', '原來', '有道理', '好像可以', '知道了', '簡單', '喜歡',
  '有趣', '成功', '沒問題', '應該可以', '想到了', '找到', '清楚', '謝謝', '哈', '耶'];
const SENT_NEG = ['不懂', '不會', '好難', '看不懂', '卡住', '亂', '煩', '討厭', '放棄', '錯',
  '不知道', '沒辦法', '好煩', '不行', '算不出', '想不到', '完蛋', '慘', '累'];
const SENT_NEG_MARK = ['不', '沒', '別', '無法'];
const SENT_INTENS = ['很', '超', '非常', '好', '真的', '完全', '太'];

function sentimentOf(text){
  const t = String(text || '');
  let score = 0, hits = [];
  SENT_POS.forEach(function(w){
    let i = t.indexOf(w);
    while (i >= 0){
      let v = 1;
      const pre = t.slice(Math.max(0, i - 2), i);
      if (SENT_NEG_MARK.some(function(n){ return pre.indexOf(n) >= 0; })) v = -1;
      if (SENT_INTENS.some(function(n){ return pre.indexOf(n) >= 0; })) v *= 1.5;
      score += v; hits.push((v > 0 ? '+' : '−') + w);
      i = t.indexOf(w, i + w.length);
    }
  });
  SENT_NEG.forEach(function(w){
    let i = t.indexOf(w);
    while (i >= 0){
      let v = -1;
      const pre = t.slice(Math.max(0, i - 2), i);
      if (SENT_INTENS.some(function(n){ return pre.indexOf(n) >= 0; })) v *= 1.5;
      score += v; hits.push('−' + w);
      i = t.indexOf(w, i + w.length);
    }
  });
  const norm = Math.max(-1, Math.min(1, score / 3));
  return {score: norm, hits: hits,
          label: norm > 0.2 ? '正向' : (norm < -0.2 ? '負向' : '中性')};
}

   這些是模擬資料，用來示範分析管線，不得當成實徵結果。

const DEMO_UTTER = {
  BELOW: ['這題是不是就用公式算就好？', '我先算算看好了', '這個要代進去哪裡？',
          '答案要算到小數嗎', '我記得公式是這樣', '這步是不是先移項'],

          '題目給了兩個條件，我用了面積那個', '我覺得要先把它整理成等於 0',
          '我用的是判別式那個方法', '我先確認題目在問哪一個東西'],
  ABOVE: ['如果數字換成別的，這個做法應該還是可以，除非變成負的',
          '我想不通為什麼一定要先移項，如果右邊不是 0 會怎樣',

          '我可以舉一個反例：2 乘 3 等於 6，但 2 不等於 6',
          '這一題跟前面那題很像，差別只在有沒有負根',
          '我要怎麼確定兩個根都對？我把它們都代回去了']
};
const DEMO_NOTE = ['先讀題目', '設 x = 寬', '要先移項成 =0', '檢查有沒有漏根',
                   '再讀一次題目', '這題和前面那題像', '代回去檢查'];

/* 情緒語尾：讓模擬對話帶有可分析的情緒訊號。
   各條件的情緒分布依研究構想的理論預測設定（同儕最正向、對照最平淡）。 */
const MOOD_TAIL = {
  pos: ['，我好像懂了', '，這樣就對了吧', '，有道理', '，我知道了', '，原來如此'],
  neu: ['', '', '', ''],
  neg: ['，可是我不太懂', '，我卡住了', '，這題好難', '，我不知道對不對', '，有點亂']
};
const MOOD_P = {
  tutor:   {pos:0.25, neu:0.45},
  tutee:   {pos:0.35, neu:0.45},
  peer:    {pos:0.42, neu:0.43},
  control: {pos:0.16, neu:0.44}
};
function moodTail(cond, rnd){
  const p = MOOD_P[cond] || MOOD_P.control;
  const r = rnd();
  const bucket = r < p.pos ? 'pos' : (r < p.pos + p.neu ? 'neu' : 'neg');
  const pool = MOOD_TAIL[bucket];
  return pool[Math.floor(rnd() * pool.length)];
}

function buildDemoLogs(){
  const rnd = mulberry32(778899);
  const logs = [], dialog = [];
  const asg = getAssignment('a-post');
  if (!asg) { DEMO_LOGS = []; DEMO_DIALOG = []; return; }
  const items = asg.itemIds.map(getItem).filter(Boolean);

  assignmentRoster(asg).forEach(function(sid){
    const cond = conditionOfStudent(sid);
    const klass = classOfStudent(sid);
    const stu = getUser(sid);
    const ability = stu && stu.thetaTrue != null ? stu.thetaTrue : 0;
    const eng = stu && stu.engage != null ? stu.engage : 0.5;
    let t = (asg.createdAt || Date.now()) + Math.floor(rnd() * 3600e3);
    const t0 = t;

    items.forEach(function(it){
      const proc = it.process || 'K';
      function push(type, code, extra){
        t += 900 + Math.floor(rnd() * 5200);
        const e = {t:t, rel:t - t0, sid:sid, cid:klass ? klass.id : null, cond:cond,
                   lang:'zh', aid:asg.id, iid:it.id, proc:proc, type:type, code:code};
        if (extra) Object.keys(extra).forEach(function(k){ e[k] = extra[k]; });
        logs.push(e);
        return e;
      }
      push('ENTER', null, {});
      // 逐句標記
      const nSent = splitSentences(it.stem).length;
      const nMark = 1 + Math.floor(rnd() * Math.min(3, nSent));
      for (let i = 0; i < nMark; i++) push('MARK', 'M', {sent: Math.floor(rnd() * nSent)});

      // 對話回合（對照組改為筆記）
      const base = cond === 'tutor' ? 4.2 : cond === 'tutee' ? 3.6 : cond === 'peer' ? 3.2 : 0;
      const nTurn = cond === 'control' ? 0
        : Math.max(1, Math.min(MAX_TURNS, Math.round(base * (0.55 + eng * 0.9) + (rnd() - 0.5))));

      if (cond === 'control'){
        const nNote = 1 + Math.round(2 * eng + rnd());
        for (let i = 0; i < nNote; i++){
          push('NOTE', 'N', {text: DEMO_NOTE[Math.floor(rnd() * DEMO_NOTE.length)] + moodTail(cond, rnd)});
        }
      } else {
        for (let k = 0; k < nTurn; k++){
          // 相對歷程分布依條件與能力而異
          let pAbove = 0.16 + 0.30 * eng + 0.10 * Math.max(0, ability);
          if (cond === 'tutee') pAbove += 0.18;
          if (cond === 'tutor') pAbove -= 0.04;
          let pBelow = 0.34 - 0.22 * eng - 0.10 * Math.max(0, ability);
          if (cond === 'tutor') pBelow += 0.06;
          const r = rnd();
          const rel = r < pBelow ? 'BELOW' : (r < 1 - pAbove ? 'AT' : 'ABOVE');
          const pool = DEMO_UTTER[rel];
          const text = pool[Math.floor(rnd() * pool.length)] + moodTail(cond, rnd);
          const e = push('ASK', REL_SHORT[rel], {rel:rel, text:text, turn:k + 1,
                          sent: sentimentOf(text).score});
          dialog.push({t:e.t, sid:sid, cond:cond, aid:asg.id, iid:it.id, proc:proc,
                       turn:k + 1, speaker:'student', text:text, rel:rel,
                       ucode:codeUtteranceProcess(text), sent:sentimentOf(text).score});
          const a = agentTurn(cond, it, k, rnd);
          const ea = push('AI', 'A', {qfn:a.qfn, sub:a.sub, turn:k + 1, text:a.text});
          dialog.push({t:ea.t, sid:sid, cond:cond, aid:asg.id, iid:it.id, proc:proc,
                       turn:k + 1, speaker:'agent', text:a.text, qfn:a.qfn, sub:a.sub,
                       ucode:a.process, sent:0});
          if (rnd() < 0.35) push('MARK', 'M', {sent: Math.floor(rnd() * nSent)});
        }
      }

      // 作答與打字遙測
      const nW = 1 + Math.floor(rnd() * 3);
      for (let i = 0; i < nW; i++) push('TYPE', 'W', {});
      const keys = 12 + Math.floor(rnd() * 60 * (it.type === 'cr' ? 3 : 1));
      push('TELEMETRY', null, {
        firstKeyLatency: Math.round(1200 + rnd() * 9000),
        keystrokes: keys,
        deletions: Math.round(keys * (0.06 + rnd() * 0.22)),
        longPauses: Math.floor(rnd() * 5)
      });
      if (it.type === 'mc'){
        const nO = 1 + (rnd() < 0.3 ? 1 : 0);
        for (let i = 0; i < nO; i++) push('OPTION', 'O', {});
      }
      // 送出前自我檢核：參與傾向越高勾越多
      const nC = Math.min(SELF_CHECKS.length, Math.round((0.4 + eng * 1.2) * (1 + rnd() * 2)));
      for (let i = 0; i < nC; i++) push('CHECK', 'C', {idx:i});
      push('SUBMIT', 'S', {selfCheck:nC});
    });
  });

  DEMO_LOGS = logs;
  DEMO_DIALOG = dialog;
}

/* 題幹逐句切分（供逐句標記與 MARK 事件使用） */
function splitSentences(text){
  const t = String(text || '').trim();
  function cut(str, marks){
    const out = []; let buf = '';
    for (let i = 0; i < str.length; i++){
      buf += str[i];
      if (marks.indexOf(str[i]) >= 0){ out.push(buf.trim()); buf = ''; }
    }
    if (buf.trim()) out.push(buf.trim());
    return out.filter(Boolean);
  }
  const parts = cut(t, '。？！；?!;');
  if (parts.length > 1) return parts;
  const alt = cut(t, '，,');
  return alt.length > 1 ? alt : [t];
}

/* GSEQ SDIS：每位學生每一題一段序列，以 / 結束 */
function toSDIS(){
  const L = allLogs().filter(function(e){ return e.code; });
  const bySeq = {};
  L.forEach(function(e){
    const k = e.sid + '|' + e.iid;
    (bySeq[k] = bySeq[k] || []).push(e);
  });
  const out = ['Event'];
  out.push('% KIDFORUM AaL 事件序列（示範資料為模擬）');
  out.push('% 編碼：' + BEHAVIOR_CODES.map(function(b){ return b.code + '=' + b.name; }).join('  '));
  Object.keys(bySeq).sort().forEach(function(k){
    const p = k.split('|');
    const evs = bySeq[k].sort(function(a, b){ return a.t - b.t; });
    out.push('% sid=' + p[0] + ' cond=' + conditionOfStudent(p[0]) + ' item=' + p[1]);
    out.push(evs.map(function(e){ return sdisCode(e.code); }).join(' ') + ' /');
  });
  return out.join('\n');
}
/* SDIS 的編碼名稱不接受非 ASCII，轉為安全代號 */
const SDIS_MAP = {'M':'MARK', 'O':'OPT', 'W':'WRITE', 'Q−':'QLOW', 'Q0':'QAT', 'Q+':'QHIGH',
                  'A':'AGENT', 'N':'NOTE', 'C':'CHECK', 'S':'SUBMIT'};
function sdisCode(c){ return SDIS_MAP[c] || 'OTHER'; }

/* rENA 寬表 CSV：一列一個對話回合／事件，二元編碼欄可直接餵給 ena.accumulate.data() */
function toENACsv(){
  const rows = [['sid','name','class','grade','condition','lang','assignment','item','item_process',
                 'turn','speaker','rel_code','utterance',
                 'K','A','R','BELOW','AT','ABOVE','POS','NEG','MARK','OPTION','WRITE','CHECK']];
  const logs = allLogs().slice().sort(function(a, b){ return a.t - b.t; });
  const dial = allDialog();
  const dialKey = {};
  dial.forEach(function(d){ dialKey[d.sid + '|' + d.iid + '|' + d.turn + '|' + d.speaker] = d; });

  logs.forEach(function(e){
    if (!e.code) return;
    const k = classOfStudent(e.sid);
    const d = e.turn ? dialKey[e.sid + '|' + e.iid + '|' + e.turn + '|' + (e.type === 'AI' ? 'agent' : 'student')] : null;
    const txt = (d && d.text) || e.text || '';
    const uc = d ? d.ucode : (e.code === 'A' ? (e.proc || '') : '');
    const rel = e.rel || (e.code === 'Q−' ? 'BELOW' : e.code === 'Q0' ? 'AT' : e.code === 'Q+' ? 'ABOVE' : '');
    const s = txt ? sentimentOf(txt) : {score:0};
    rows.push([
      e.sid, userName(e.sid), k ? k.name : '', k ? k.grade : '', e.cond, e.lang || 'zh',
      e.aid, e.iid, e.proc || '', e.turn || '', e.type === 'AI' ? 'agent' : (e.code === 'A' ? 'agent' : 'student'),
      rel, txt.replace(/\s+/g, ' '),
      uc === 'K' ? 1 : 0, uc === 'A' ? 1 : 0, uc === 'R' ? 1 : 0,
      rel === 'BELOW' ? 1 : 0, rel === 'AT' ? 1 : 0, rel === 'ABOVE' ? 1 : 0,
      s.score > 0.2 ? 1 : 0, s.score < -0.2 ? 1 : 0,
      e.code === 'M' ? 1 : 0, e.code === 'O' ? 1 : 0, e.code === 'W' ? 1 : 0, e.code === 'C' ? 1 : 0
    ]);
  });
  return rows.map(function(r){
    return r.map(function(c){ return '"' + String(c).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\n');
}

/* 每位學生每一題的遙測摘要（寬表） */
function toTelemetryCsv(){
  const rows = [['sid','name','class','condition','item','item_process',
                 'first_key_latency_ms','keystrokes','deletions','long_pauses',
                 'marks','option_clicks','turns','self_checks','dwell_ms','mean_sentiment']];
  const byKey = {};
  allLogs().forEach(function(e){
    const k = e.sid + '|' + e.iid;
    const r = byKey[k] = byKey[k] || {sid:e.sid, iid:e.iid, cond:e.cond, proc:e.proc,
      fkl:'', keys:'', del:'', pause:'', marks:0, opts:0, turns:0, checks:0,
      t0:e.t, t1:e.t, sent:[], };
    r.t0 = Math.min(r.t0, e.t); r.t1 = Math.max(r.t1, e.t);
    if (e.type === 'TELEMETRY'){ r.fkl = e.firstKeyLatency; r.keys = e.keystrokes; r.del = e.deletions; r.pause = e.longPauses; }
    if (e.code === 'M') r.marks++;
    if (e.code === 'O') r.opts++;
    if (e.code === 'C') r.checks++;
    if (e.type === 'ASK'){ r.turns++; if (e.sent != null) r.sent.push(e.sent); }
  });
  Object.keys(byKey).forEach(function(k){
    const r = byKey[k], kl = classOfStudent(r.sid), it = getItem(r.iid);
    rows.push([r.sid, userName(r.sid), kl ? kl.name : '', r.cond, r.iid, r.proc,
      r.fkl, r.keys, r.del, r.pause, r.marks, r.opts, r.turns, r.checks,
      r.t1 - r.t0, r.sent.length ? (r.sent.reduce(function(a, b){ return a + b; }, 0) / r.sent.length).toFixed(3) : '']);
  });
  return rows.map(function(r){
    return r.map(function(c){ return '"' + String(c).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\n');
}

function buildDemoSurveys(){
  const rnd = mulberry32(20260901);
  const out = [];
  state.classes.forEach(function(k){
    k.studentIds.forEach(function(sid){
      const stu = getUser(sid);
      const a = stu.thetaTrue || 0, e = stu.engage != null ? stu.engage : 0.5;
      const trait = {};
      CONSTRUCTS.forEach(function(c){
        const mid = (c.scale.n + 1) / 2;
        let base;
        if (c.id === 'anx')        base = mid + 0.6 - a * 0.45 + (rnd() - 0.5) * 1.1;
        else if (c.id === 'cl_in') base = mid + 0.3 - a * 0.40 + (rnd() - 0.5) * 1.0;
        else if (c.id === 'cl_ex') base = mid - 0.2 - a * 0.15 + (rnd() - 0.5) * 1.0;
        else if (c.id === 'mot_ex')base = mid + 0.2 + (rnd() - 0.5) * 1.3;
        else                       base = mid + 0.25 + a * 0.30 + e * 0.7 + (rnd() - 0.5) * 1.0;
        trait[c.id] = base;
      });

      ['pre', 'post'].forEach(function(phase){
        const cs = constructsFor(phase);
        const resp = {};
        cs.forEach(function(c){
          const eff = phase === 'post' ? (DEMO_EFFECT[k.condition] || DEMO_EFFECT.control)[c.id] || 0 : 0;
          const mu = clamp(trait[c.id] + eff, 1, c.scale.n);
          c.items.forEach(function(_, i){
            resp[c.id + '_' + i] = Math.max(1, Math.min(c.scale.n,
              Math.round(mu + (rnd() - 0.5) * 1.2)));
          });
        });
        if (phase === 'post'){
          if (k.condition !== 'control'){
            MANIP_CHECK.forEach(function(m){
              const match = (m.id === 'mc_' + k.condition);
              resp[m.id] = Math.max(1, Math.min(6, Math.round((match ? 5.0 : 2.6) + (rnd() - 0.5) * 1.4)));
            });
          }
          SUS_ITEMS.forEach(function(s){
            resp[s.id] = Math.max(1, Math.min(6, Math.round(4.4 + (rnd() - 0.5) * 1.5)));
          });
        }
        out.push({sid:sid, phase:phase, at: Date.now(), resp:resp, demo:true});
      });
    });
  });
  return out;
}

function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

/* ==========================================================================
   40-psy.js — 心理計量：簡化 Rasch 模式（JMLE）與 KIDMAP 四象限
   參考：Wright & Stone (1979) Best Test Design；
        國立臺灣師範大學心理與教育測驗研究發展中心之 KIDMAP 診斷表徵。
   ========================================================================== */

const QUAD = {
  1:{key:'q1', roman:'I',   name:'優勢概念',  short:'優勢',    desc:'難題答對，超越預期。'},
  2:{key:'q2', roman:'II',  name:'迷思概念',  short:'迷思',    desc:'能力足以答對卻答錯，最需要介入。'},
  3:{key:'q3', roman:'III', name:'合理答錯',  short:'合理錯',  desc:'難題答錯，屬合理範圍。'},
  4:{key:'q4', roman:'IV',  name:'合理答對',  short:'合理對',  desc:'簡單題答對，屬合理範圍。'}
};

function logistic(x){ return 1 / (1 + Math.exp(-x)); }

/* 由作答矩陣估計 Rasch 參數。
   X: 二維陣列 [人][題]，值為 1 / 0 / null（未作答）。 */
function estimateRasch(X, opts){
  opts = opts || {};
  const N = X.length, L = N ? X[0].length : 0;
  const theta = new Array(N).fill(0);
  const delta = new Array(L).fill(0);
  if (!N || !L) return {theta:theta, delta:delta, se:[], seItem:[], iterations:0, converged:false};

  // 原始分數與作答題數
  const pScore = [], pCount = [], iScore = [], iCount = [];
  for (let n = 0; n < N; n++){ let s = 0, c = 0;
    for (let i = 0; i < L; i++){ if (X[n][i] === null || X[n][i] === undefined) continue; c++; s += X[n][i]; }
    pScore.push(s); pCount.push(c);
  }
  for (let i = 0; i < L; i++){ let s = 0, c = 0;
    for (let n = 0; n < N; n++){ if (X[n][i] === null || X[n][i] === undefined) continue; c++; s += X[n][i]; }
    iScore.push(s); iCount.push(c);
  }

  // 極端分數調整（Wright 的 0.3 邏輯分校正），避免估計發散
  const ADJ = 0.3;
  function targetPerson(n){
    let r = pScore[n], c = pCount[n];
    if (!c) return null;
    if (r === 0) r = ADJ; else if (r === c) r = c - ADJ;
    return r;
  }
  function targetItem(i){
    let r = iScore[i], c = iCount[i];
    if (!c) return null;
    if (r === 0) r = ADJ; else if (r === c) r = c - ADJ;
    return r;
  }

  // PROX 起始值
  for (let n = 0; n < N; n++){
    const r = targetPerson(n);
    theta[n] = r === null ? 0 : Math.log(r / (pCount[n] - r));
  }
  for (let i = 0; i < L; i++){
    const r = targetItem(i);
    delta[i] = r === null ? 0 : -Math.log(r / (iCount[i] - r));
  }

  // JMLE 交替 Newton–Raphson
  const maxIt = opts.maxIt || 120, tol = opts.tol || 1e-4;
  let it = 0, converged = false;
  for (; it < maxIt; it++){
    let maxChange = 0;
    // 更新人
    for (let n = 0; n < N; n++){
      const r = targetPerson(n); if (r === null) continue;
      let E = 0, V = 0;
      for (let i = 0; i < L; i++){
        if (X[n][i] === null || X[n][i] === undefined) continue;
        const p = logistic(theta[n] - delta[i]); E += p; V += p * (1 - p);
      }
      if (V < 1e-6) V = 1e-6;
      let step = (r - E) / V;
      step = Math.max(-1, Math.min(1, step));
      theta[n] += step;
      maxChange = Math.max(maxChange, Math.abs(step));
    }
    // 更新題
    for (let i = 0; i < L; i++){
      const r = targetItem(i); if (r === null) continue;
      let E = 0, V = 0;
      for (let n = 0; n < N; n++){
        if (X[n][i] === null || X[n][i] === undefined) continue;
        const p = logistic(theta[n] - delta[i]); E += p; V += p * (1 - p);
      }
      if (V < 1e-6) V = 1e-6;
      let step = (E - r) / V;
      step = Math.max(-1, Math.min(1, step));
      delta[i] += step;
      maxChange = Math.max(maxChange, Math.abs(step));
    }
    // 將題目難度中心化為 0（設定量尺原點）
    let m = 0, k = 0;
    for (let i = 0; i < L; i++){ if (iCount[i]){ m += delta[i]; k++; } }
    if (k){ m /= k; for (let i = 0; i < L; i++) delta[i] -= m; for (let n = 0; n < N; n++) theta[n] -= m; }
    if (maxChange < tol){ converged = true; break; }
  }

  // 標準誤與適配度
  const se = [], seItem = [], infit = [], outfit = [], pInfit = [], pOutfit = [];
  for (let n = 0; n < N; n++){
    let V = 0, num = 0, den = 0, oz = 0, oc = 0;
    for (let i = 0; i < L; i++){
      if (X[n][i] === null || X[n][i] === undefined) continue;
      const p = logistic(theta[n] - delta[i]), v = p * (1 - p);
      V += v; num += Math.pow(X[n][i] - p, 2); den += v;
      oz += Math.pow(X[n][i] - p, 2) / Math.max(v, 1e-6); oc++;
    }
    se.push(V > 0 ? 1 / Math.sqrt(V) : null);
    pInfit.push(den > 0 ? num / den : null);
    pOutfit.push(oc ? oz / oc : null);
  }
  for (let i = 0; i < L; i++){
    let V = 0, num = 0, den = 0, oz = 0, oc = 0;
    for (let n = 0; n < N; n++){
      if (X[n][i] === null || X[n][i] === undefined) continue;
      const p = logistic(theta[n] - delta[i]), v = p * (1 - p);
      V += v; num += Math.pow(X[n][i] - p, 2); den += v;
      oz += Math.pow(X[n][i] - p, 2) / Math.max(v, 1e-6); oc++;
    }
    seItem.push(V > 0 ? 1 / Math.sqrt(V) : null);
    infit.push(den > 0 ? num / den : null);
    outfit.push(oc ? oz / oc : null);
  }

  return {theta:theta, delta:delta, se:se, seItem:seItem,
          infit:infit, outfit:outfit, pInfit:pInfit, pOutfit:pOutfit,
          pScore:pScore, pCount:pCount, iScore:iScore, iCount:iCount,
          iterations:it, converged:converged};
}

/* KIDMAP 四象限判定 */
function quadrantOf(theta, delta, correct){
  const expectRight = theta > delta;
  if (correct && !expectRight) return 1;
  if (!correct && expectRight) return 2;
  if (!correct && !expectRight) return 3;
  return 4;
}

/* 針對一份派題執行完整診斷 */
function diagnose(state, aid){
  const asg = state.assignments.find(function(a){ return a.id === aid; });
  if (!asg) return null;
  const items = asg.itemIds.map(getItem).filter(function(it){ return it && it.type === 'mc'; });
  // 四個班級共用同一份題本、同一次校準，條件之間才可比較
  const roster = assignmentRoster(asg);
  const done = roster.filter(function(sid){
    return state.submissions.some(function(s){ return s.aid === aid && s.sid === sid; });
  });

  const X = done.map(function(sid){
    return items.map(function(it){
      const r = state.responses.find(function(r){ return r.aid === aid && r.sid === sid && r.iid === it.id; });
      return r ? (r.correct ? 1 : 0) : null;
    });
  });

  const minN = (state.settings && state.settings.minN) || 3;
  const ready = done.length >= minN && items.length >= 3;
  const est = ready ? estimateRasch(X) : null;

  const cells = [];         // 每一「人×題」的象限
  const perItem = items.map(function(it, i){
    return {item:it, idx:i, delta: est ? est.delta[i] : null,
            infit: est ? est.infit[i] : null, outfit: est ? est.outfit[i] : null,
            q:{1:0,2:0,3:0,4:0}, n:0, right:0, distractors:{}, q2Students:[], q1Students:[]};
  });
  const perStudent = done.map(function(sid, n){
    return {sid:sid, theta: est ? est.theta[n] : null, se: est ? est.se[n] : null,
            infit: est ? est.pInfit[n] : null,
            q:{1:0,2:0,3:0,4:0}, right:0, n:0, cells:[]};
  });

  if (ready){
    done.forEach(function(sid, n){
      items.forEach(function(it, i){
        const x = X[n][i]; if (x === null) return;
        const q = quadrantOf(est.theta[n], est.delta[i], x === 1);
        const resp = state.responses.find(function(r){ return r.aid === aid && r.sid === sid && r.iid === it.id; });
        const cell = {sid:sid, iid:it.id, i:i, n:n, correct:x === 1, q:q,
                      theta:est.theta[n], delta:est.delta[i], choice: resp ? resp.choice : null,
                      p: logistic(est.theta[n] - est.delta[i])};
        cells.push(cell);
        perItem[i].q[q]++; perItem[i].n++; if (x === 1) perItem[i].right++;
        perStudent[n].q[q]++; perStudent[n].n++; if (x === 1) perStudent[n].right++;
        perStudent[n].cells.push(cell);
        if (q === 2){
          perItem[i].q2Students.push(sid);
          const c = cell.choice;
          if (c !== null && c !== undefined) perItem[i].distractors[c] = (perItem[i].distractors[c] || 0) + 1;
        }
        if (q === 1) perItem[i].q1Students.push(sid);
      });
    });
  }

  perItem.forEach(function(pi){
    pi.misRate = pi.n ? pi.q[2] / pi.n : 0;
    pi.pass = pi.n ? pi.right / pi.n : 0;
    let best = null, bestC = 0;
    Object.keys(pi.distractors).forEach(function(k){
      if (pi.distractors[k] > bestC){ bestC = pi.distractors[k]; best = parseInt(k, 10); }
    });
    pi.topDistractor = best; pi.topDistractorN = bestC;
    pi.misCode = (best !== null && pi.item.why) ? (pi.item.why[best] || null) : null;
  });

  const thr = ((state.settings && state.settings.misThreshold) || 15) / 100;
  const flagged = perItem.filter(function(p){ return p.misRate >= thr && p.q[2] > 0; })
                         .sort(function(a, b){ return b.misRate - a.misRate; });

  const totals = {1:0,2:0,3:0,4:0};
  cells.forEach(function(c){ totals[c.q]++; });

  return {
    assignment: asg, items: items, roster: roster, done: done, ready: ready, minN: minN,
    est: est, cells: cells, perItem: perItem, perStudent: perStudent,
    flagged: flagged, totals: totals,
    meanTheta: est ? mean(est.theta) : null,
    meanDelta: est ? mean(est.delta) : null
  };
}

function mean(a){ const v = a.filter(function(x){ return typeof x === 'number' && isFinite(x); });
  return v.length ? v.reduce(function(s, x){ return s + x; }, 0) / v.length : 0; }
function sd(a){ const v = a.filter(function(x){ return typeof x === 'number' && isFinite(x); });
  if (v.length < 2) return 0; const m = mean(v);
  return Math.sqrt(v.reduce(function(s, x){ return s + (x - m) * (x - m); }, 0) / (v.length - 1)); }

}

  try {
    const raw = localStorage.getItem(STORE_KEY);

      const s = JSON.parse(raw);
      if (s && s.version === 2) return s;   // 版號不符（示範資料改版）→ 重新產生
    }
  } catch (e) { /* 讀不到就重新產生示範資料 */ }

function getUser(id){ return state.users.find(function(u){ return u.id === id; }); }
function userName(id){ const u = getUser(id); return u ? u.name : id; }
function getView(id){ return state.views.find(function(v){ return v.id === id; }); }
function getNote(id){ return state.notes.find(function(n){ return n.id === id; }); }
function getAssignment(id){ return state.assignments.find(function(a){ return a.id === id; }); }
function currentUser(){ return getUser(state.ui.role) || state.users[0]; }
function getClass(id){ return state.classes.find(function(c){ return c.id === id; }); }
/* 知識建構空間的示範班級（貼文只種在這一班） */
function kbClass(){ return getClass((state.settings && state.settings.kbClassId) || 'c-1') || state.classes[0]; }
/* 目前教師視角所看的班級 */
function currentClass(){
  const me = currentUser();
  if (me.role === 'student'){ const k = classOfStudent(me.id); if (k) return k; }
  return getClass(state.ui.classId) || state.classes[0];
}
/* 一份派題涵蓋的班級與名單（支援跨班共同校準） */
function assignmentClasses(a){
  if (!a) return [];
  const ids = a.classIds || (a.classId ? [a.classId] : []);
  return ids.map(getClass).filter(Boolean);
}
function assignmentRoster(a){
  const out = [];
  assignmentClasses(a).forEach(function(c){
    c.studentIds.forEach(function(s){ if (out.indexOf(s) < 0) out.push(s); });
  });
  return out;
}
function isTeacher(){ const u = currentUser(); return u.role === 'teacher' || u.role === 'admin'; }
function scaffold(id){ return SCAFFOLDS.find(function(s){ return s.id === id; }); }
function scaffoldLabel(id){ const s = scaffold(id); return s ? s.label : ''; }

function notesOfView(vid){ return state.notes.filter(function(n){ return n.viewId === vid; }); }
function childrenOf(nid){ return state.notes.filter(function(n){ return n.buildOn === nid; }); }
function noteText(n){
  return (n.segs || []).map(function(s){ return s.text; }).join('\n');
}
function noteFullText(n){
  return n.title + '\n' + noteText(n);
}
function noteAuthors(n){ return (n.authorIds || []).map(userName).join('、'); }
function uid(p){ return p + '-' + Math.random().toString(36).slice(2, 9); }

/* 一則貼文所屬的「想法串」（idea thread）：往上追到根 */
function threadRootOf(n){
  let cur = n, guard = 0;
  while (cur && cur.buildOn && guard++ < 50){ const p = getNote(cur.buildOn); if (!p) break; cur = p; }
  return cur;
}
function threadOf(rootId){
  const out = [];
  (function walk(id, depth){
    const n = getNote(id); if (!n) return;
    out.push({note:n, depth:depth});
    childrenOf(id).sort(function(a, b){ return a.createdAt - b.createdAt; })
      .forEach(function(c){ walk(c.id, depth + 1); });
  })(rootId, 0);
  return out;
}

/* --- 寫入操作 --- */
function createNote(o){
  const n = {
    id: uid('n'), viewId: o.viewId, title: o.title || '（未命名）',
    segs: o.segs || [], authorIds: o.authorIds || [currentUser().id],
    keywords: o.keywords || [], createdAt: Date.now(), editedAt: null,
    x: o.x != null ? o.x : 60 + Math.round(Math.random() * 400),
    y: o.y != null ? o.y : 60 + Math.round(Math.random() * 300),
    kind: o.kind || 'note', buildOn: o.buildOn || null, contains: o.contains || [],
    refs: o.refs || [], itemRef: o.itemRef || null, reads: [], annotations: []
  };
  state.notes.push(n); save(); return n;
}
function updateNote(id, patch){
  const n = getNote(id); if (!n) return null;
  Object.keys(patch).forEach(function(k){ n[k] = patch[k]; });
  n.editedAt = Date.now();
  n.revisions = (n.revisions || 0) + 1;
  save(); return n;
}
function deleteNote(id){
  state.notes = state.notes.filter(function(n){ return n.id !== id; });
  state.notes.forEach(function(n){
    if (n.buildOn === id) n.buildOn = null;
    n.contains = (n.contains || []).filter(function(c){ return c !== id; });
    n.refs = (n.refs || []).filter(function(r){ return r.noteId !== id; });
  });
  save();
}
function markRead(id){
  const n = getNote(id); const me = currentUser().id;
  if (n && n.authorIds.indexOf(me) < 0 && (n.reads || []).indexOf(me) < 0){ n.reads.push(me); save(); }
}
function isUnread(n){
  const me = currentUser().id;
  return n.authorIds.indexOf(me) < 0 && (n.reads || []).indexOf(me) < 0;
}
function addAnnotation(id, text){
  const n = getNote(id); if (!n || !text.trim()) return;
  n.annotations = n.annotations || [];
  n.annotations.push({id: uid('an'), authorId: currentUser().id, text: text.trim(), at: Date.now()});
  save();
}
function createView(o){
  const v = {id: uid('v'), title: o.title, desc: o.desc || '', createdAt: Date.now(),
             origin: o.origin || null, links: o.links || []};
  state.views.push(v); save(); return v;
}

/* ==========================================================================
   橋接：由 KIDMAP 迷思題產生知識建構視圖
   —— 這是兩個平台真正接起來的地方 ——
   ========================================================================== */
function bridgeExists(aid, iid){
  return state.views.find(function(v){
    return v.origin && v.origin.aid === aid && v.origin.iid === iid;
  });
}

function buildInquiryPrompt(pi, diag){
  const it = pi.item;
  const n2 = pi.q[2], n1 = pi.q[1];
  const dis = pi.topDistractor != null ? it.options[pi.topDistractor] : null;
  const mis = pi.misCode ? MISCONCEPTIONS.find(function(m){ return m.id === pi.misCode; }) : null;
  const lines = [];
  lines.push('前測第 ' + it.no + ' 題（' + it.year + ' 年）有 ' + n2 + ' 位同學落在「迷思」象限——'
    + '照他們在其他題目上的表現，這一題本來應該答得出來，實際卻答錯了。');
  if (dis) lines.push('這些同學裡最多人選的是「' + dis + '」（' + pi.topDistractorN + ' 人）。');
  if (mis) lines.push('這通常和「' + mis.name + '」有關：' + mis.desc);
  if (n1) lines.push('另外有 ' + n1 + ' 位同學在這題超越預期答對，請他們先把自己的想法貼出來，讓大家看得到不同的思路。');
  lines.push('請大家不要只寫答案。先說你原本怎麼想，再說你現在覺得哪裡需要修正，並且盡量舉出一個能檢驗的例子。');
  return lines.join('\n');
}

function createBridgeView(diag, pi){
  const it = pi.item;
  const exist = bridgeExists(diag.assignment.id, it.id);
  if (exist) return exist;
  const mis = pi.misCode ? MISCONCEPTIONS.find(function(m){ return m.id === pi.misCode; }) : null;
  // 視圖標題刻意寫成一個「問題」而不是一個「主題」——知識建構的起點是問題。
  const v = createView({
    title: mis ? '「' + mis.name + '」什麼時候會出錯？' : ('第 ' + it.no + ' 題：我們卡在哪裡？'),
    desc: '由 ' + diag.assignment.title + ' 第 ' + it.no + ' 題的 KIDMAP 迷思象限自動開啟。',
    origin: {aid: diag.assignment.id, iid: it.id, mis: pi.misCode || null}
  });
  createNote({
    viewId: v.id, kind: 'problem',
    title: '【全班共同問題】' + shortStem(it.stem),
    authorIds: [kbClass().teacherId],
    keywords: it.tags || [],
    itemRef: {aid: diag.assignment.id, iid: it.id},
    segs: [{s: 's2', text: buildInquiryPrompt(pi, diag)}],
    x: 60, y: 40
  });
  // 把「優勢概念」的同學標成知識資源人，貼一張邀請卡
  if (pi.q1Students.length){
    createNote({
      viewId: v.id, kind: 'note',
      title: '這一題的知識資源人',
      authorIds: [kbClass().teacherId],
      keywords: ['對稱知識進展'],
      segs: [{s: 's3', text: '在這一題超越預期答對的同學：' +
        pi.q1Students.map(userName).join('、') +
        '。請你們先貼出「我當時是怎麼想的」，不要直接寫正確答案，讓大家有東西可以比較。'}],
      x: 330, y: 40
    });
  }
  save();
  return v;
}

function shortStem(s){
  const t = String(s).replace(/\s+/g, ' ').trim();
  return t.length > 22 ? t.slice(0, 22) + '…' : t;
}

/* --- 搜尋（對應 Knowledge Forum 的 Title / Scaffold / Content / Author / Date） --- */
function searchNotes(field, q){
  const s = String(q || '').trim().toLowerCase();
  if (!s) return [];
  return state.notes.filter(function(n){
    if (field === 'title')   return n.title.toLowerCase().indexOf(s) >= 0;
    if (field === 'content') return noteText(n).toLowerCase().indexOf(s) >= 0;
    if (field === 'author')  return (n.authorIds || []).some(function(a){ return userName(a).toLowerCase().indexOf(s) >= 0; });
    if (field === 'scaffold')return (n.segs || []).some(function(g){ return scaffoldLabel(g.s).toLowerCase().indexOf(s) >= 0; });
    if (field === 'keyword') return (n.keywords || []).some(function(k){ return k.toLowerCase().indexOf(s) >= 0; });
    if (field === 'date')    return fmtDate(n.createdAt).indexOf(s) >= 0;
    return false;
  });
}

/* --- 格式化 --- */
function fmtDate(ts){
  const d = new Date(ts);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function fmtDateTime(ts){
  const d = new Date(ts);
  return fmtDate(ts) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function fx(v, d){ return (v === null || v === undefined || !isFinite(v)) ? '—' : Number(v).toFixed(d === undefined ? 2 : d); }
function pct(v){ return (v === null || v === undefined || !isFinite(v)) ? '—' : Math.round(v * 100) + '%'; }
function esc(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function nl2br(s){ return esc(s).replace(/\n/g, '<br>'); }

/* ==========================================================================
   60-analytics.js — 論述分析工具箱
   對應 Knowledge Forum 的 Analytic Toolkit：貢獻、延伸、閱讀、支架、詞彙、
   社會網絡；再加上本系統新增的「認識論層次」與「雙軌評量」。
   全部離線可算，不需要任何外部模型。
   ========================================================================== */

/* --- 單則貼文的認識論層次（1–4） --- */
function cueHits(text, list){
  let n = 0;
  list.forEach(function(c){ if (text.indexOf(c) >= 0) n++; });
  return n;
}
function epistemicLevel(n){
  const t = noteFullText(n);
  const causal = cueHits(t, EPISTEMIC_CUES.causal);
  const cond = cueHits(t, EPISTEMIC_CUES.conditional);
  const counter = cueHits(t, EPISTEMIC_CUES.counter);
  const evid = cueHits(t, EPISTEMIC_CUES.evidence);
  const rev = cueHits(t, EPISTEMIC_CUES.revision);
  const scaf = (n.segs || []).map(function(s){ return s.s; });
  const hasSynth = scaf.indexOf('s5') >= 0 || scaf.indexOf('s6') >= 0 || n.kind === 'rise';
  const hasChallenge = scaf.indexOf('s4') >= 0;
  const terms = domainTermsIn(t).length;

  let lv = 1;
  if (causal + cond > 0 || t.length > 60) lv = 2;
  if ((counter > 0 || evid > 0 || hasChallenge) && causal + cond > 0) lv = 3;
  if (hasSynth && (rev > 0 || (n.refs || []).length || (n.contains || []).length || terms >= 3)) lv = 4;
  return lv;
}
function domainTermsIn(t){
  return DOMAIN_TERMS.filter(function(w){ return t.indexOf(w) >= 0; });
}

const EPI_LABEL = {1:'陳述主張', 2:'提出理由', 3:'援引證據或反例', 4:'綜整並改進理論'};

/* --- 每位學生的論述指標 --- */
function discourseStats(){
  const klass = kbClass();
  const ids = klass.studentIds;
  const byId = {};
  ids.forEach(function(sid){
    byId[sid] = {sid:sid, notes:0, buildMade:0, buildGot:0, rise:0, refs:0, ann:0,
                 reads:0, chars:0, scaffolds:{}, terms:{}, epiSum:0, epiN:0,
                 revisions:0, keywords:0, threads:{}};
  });
  const total = state.notes.length;

  state.notes.forEach(function(n){
    const lv = epistemicLevel(n);
    const t = noteFullText(n);
    const terms = domainTermsIn(t);
    (n.authorIds || []).forEach(function(a){
      const s = byId[a]; if (!s) return;
      s.notes++;
      s.chars += t.length;
      s.epiSum += lv; s.epiN++;
      s.revisions += n.revisions || 0;
      s.keywords += (n.keywords || []).length;
      s.refs += (n.refs || []).length;
      if (n.kind === 'rise') s.rise++;
      (n.segs || []).forEach(function(g){ s.scaffolds[g.s] = (s.scaffolds[g.s] || 0) + 1; });
      terms.forEach(function(w){ s.terms[w] = (s.terms[w] || 0) + 1; });
      const root = threadRootOf(n); if (root) s.threads[root.id] = true;
      if (n.buildOn){
        s.buildMade++;
        const p = getNote(n.buildOn);
        if (p) (p.authorIds || []).forEach(function(pa){ if (byId[pa] && pa !== a) byId[pa].buildGot++; });
      }
    });
    (n.reads || []).forEach(function(r){ if (byId[r]) byId[r].reads++; });
    (n.annotations || []).forEach(function(an){ if (byId[an.authorId]) byId[an.authorId].ann++; });
  });

  const arr = ids.map(function(sid){
    const s = byId[sid];
    s.epi = s.epiN ? s.epiSum / s.epiN : 0;
    s.scaffoldKinds = Object.keys(s.scaffolds).length;
    s.termCount = Object.keys(s.terms).length;
    s.threadCount = Object.keys(s.threads).length;
    s.readRate = total ? s.reads / Math.max(1, total - s.notes) : 0;
    return s;
  });

  // 以班級最大值正規化後加權合成 KB 指數
  function mx(k){ return Math.max.apply(null, arr.map(function(s){ return s[k]; }).concat([1])); }
  const M = {notes:mx('notes'), buildMade:mx('buildMade'), buildGot:mx('buildGot'),
             termCount:mx('termCount'), scaffoldKinds:6, epi:4};
  arr.forEach(function(s){
    s.kbi = Math.round(100 * (
      0.15 * (s.notes / M.notes) +
      0.20 * (s.buildMade / M.buildMade) +
      0.15 * (s.buildGot / M.buildGot) +
      0.10 * Math.min(1, s.readRate) +
      0.10 * (s.scaffoldKinds / M.scaffoldKinds) +
      0.20 * (s.epi / M.epi) +
      0.10 * (s.termCount / M.termCount)
    ));
  });
  return arr;
}

/* --- 社會網絡：誰延伸誰的想法 --- */
function snaGraph(){
  const klass = kbClass();
  const ids = klass.studentIds.slice();
  const idx = {}; ids.forEach(function(id, i){ idx[id] = i; });
  const edges = {};
  state.notes.forEach(function(n){
    if (!n.buildOn) return;
    const p = getNote(n.buildOn); if (!p) return;
    (n.authorIds || []).forEach(function(a){
      (p.authorIds || []).forEach(function(b){
        if (idx[a] === undefined || idx[b] === undefined || a === b) return;
        const k = a + '>' + b;
        edges[k] = (edges[k] || 0) + 1;
      });
    });
  });
  const list = Object.keys(edges).map(function(k){
    const p = k.split('>'); return {from:p[0], to:p[1], w:edges[k]};
  });
  const deg = {}; ids.forEach(function(id){ deg[id] = {out:0, in:0}; });
  list.forEach(function(e){ deg[e.from].out += e.w; deg[e.to].in += e.w; });
  const n = ids.length;
  const density = n > 1 ? list.length / (n * (n - 1)) : 0;
  let recip = 0;
  list.forEach(function(e){ if (edges[e.to + '>' + e.from]) recip++; });
  return {ids:ids, edges:list, deg:deg, density:density,
          reciprocity: list.length ? recip / list.length : 0,
          active: ids.filter(function(id){ return deg[id].in + deg[id].out > 0; }).length};
}

/* --- 詞彙成長：領域詞彙首次出現的累積曲線 --- */
function vocabGrowth(){
  const ns = state.notes.slice().sort(function(a, b){ return a.createdAt - b.createdAt; });
  const seen = {}; const pts = [];
  ns.forEach(function(n){
    domainTermsIn(noteFullText(n)).forEach(function(w){ seen[w] = true; });
    pts.push({t:n.createdAt, v:Object.keys(seen).length, note:n.id});
  });
  return {points:pts, terms:Object.keys(seen)};
}

/* --- 想法串的改進軌跡 --- */
function ideaImprovement(rootId){
  const seq = threadOf(rootId);
  let seen = {}; const steps = [];
  seq.forEach(function(x){
    const t = noteFullText(x.note);
    const terms = domainTermsIn(t);
    const fresh = terms.filter(function(w){ return !seen[w]; });
    fresh.forEach(function(w){ seen[w] = true; });
    steps.push({note:x.note, depth:x.depth, level:epistemicLevel(x.note),
                newTerms:fresh, scaffolds:(x.note.segs || []).map(function(s){ return s.s; })});
  });
  const levels = steps.map(function(s){ return s.level; });
  const improved = levels.length > 1 && Math.max.apply(null, levels.slice(1)) > levels[0];
  const hasChallenge = steps.some(function(s){ return s.scaffolds.indexOf('s4') >= 0; });
  const hasBetter = steps.some(function(s){ return s.scaffolds.indexOf('s5') >= 0 || s.scaffolds.indexOf('s6') >= 0; });
  return {steps:steps, improved:improved, hasChallenge:hasChallenge, hasBetter:hasBetter,
          arc: hasChallenge && hasBetter ? '完整（提出→挑戰→改進）'
             : hasChallenge ? '已被挑戰，尚未提出更好的理論'
             : hasBetter ? '已綜整，但缺少被挑戰的環節'
             : '仍停留在提出階段',
          newTermTotal: Object.keys(seen).length};
}

/* --- 雙軌評量：能力進展 × 論述參與 --- */
function dualTrack(){
  const pre = diagnose(state, 'a-pre');
  const post = diagnose(state, 'a-post');
  const ds = discourseStats();
  const dsMap = {}; ds.forEach(function(s){ dsMap[s.sid] = s; });
  const thetaPre = {}, thetaPost = {};
  if (pre && pre.ready) pre.perStudent.forEach(function(p){ thetaPre[p.sid] = p.theta; });
  if (post && post.ready) post.perStudent.forEach(function(p){ thetaPost[p.sid] = p.theta; });

  const rows = kbClass().studentIds.map(function(sid){
    const a = thetaPre[sid], b = thetaPost[sid];
    const d = (a != null && b != null) ? b - a : null;
    const st = dsMap[sid] || {kbi:0};
    return {sid:sid, thetaPre:a, thetaPost:b, delta:d, kbi:st.kbi, stats:st,
            q2Pre: pre && pre.ready ? (pre.perStudent.find(function(p){ return p.sid === sid; }) || {q:{}}).q[2] || 0 : 0,
            q2Post: post && post.ready ? (post.perStudent.find(function(p){ return p.sid === sid; }) || {q:{}}).q[2] || 0 : 0};
  });
  const dmed = median(rows.map(function(r){ return r.delta; }).filter(function(x){ return x != null; }));
  const kmed = median(rows.map(function(r){ return r.kbi; }));
  rows.forEach(function(r){
    const hiD = r.delta != null && r.delta >= dmed;
    const hiK = r.kbi >= kmed;
    r.zone = hiD && hiK ? 'A' : (!hiD && hiK ? 'B' : (hiD && !hiK ? 'C' : 'D'));
  });
  return {rows:rows, pre:pre, post:post, dmed:dmed, kmed:kmed};
}
const DUAL_ZONE = {
  A:{name:'共構轉化', desc:'論述參與高、能力也明顯進步。討論確實轉成了理解。', cls:'q1'},
  B:{name:'論述未轉化', desc:'貼文很多，但後測沒有跟上。要檢查他是否只在附和，而沒有真的改寫自己的理論。', cls:'q2'},
  C:{name:'個別成長', desc:'能力進步了，但幾乎不參與討論。可邀請他把已經懂的說出來，成為班上的知識資源。', cls:'q4'},
  D:{name:'需要介入', desc:'兩軌都低。優先安排小組指派角色與具體任務。', cls:'q3'}
};

function median(a){
  const v = a.filter(function(x){ return typeof x === 'number' && isFinite(x); }).sort(function(x, y){ return x - y; });
  if (!v.length) return 0;
  const m = Math.floor(v.length / 2);
  return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
}

/* --- 社群層級摘要 --- */
function communitySummary(){
  const ds = discourseStats();
  const g = snaGraph();
  const vg = vocabGrowth();
  const roots = state.notes.filter(function(n){ return !n.buildOn; });
  const withBuild = roots.filter(function(n){ return childrenOf(n.id).length > 0; });
  const rise = state.notes.filter(function(n){ return n.kind === 'rise'; });
  const epi = state.notes.map(epistemicLevel);
  return {
    notes: state.notes.length,
    buildOns: state.notes.filter(function(n){ return n.buildOn; }).length,
    riseAbove: rise.length,
    views: state.views.length,
    threads: roots.length,
    threadUptake: roots.length ? withBuild.length / roots.length : 0,
    contributors: ds.filter(function(s){ return s.notes > 0; }).length,
    roster: kbClass().studentIds.length,
    density: g.density,
    reciprocity: g.reciprocity,
    vocab: vg.terms.length,
    epiMean: mean(epi),
    epiDist: [1,2,3,4].map(function(l){ return epi.filter(function(x){ return x === l; }).length; }),
    kbiMean: mean(ds.map(function(s){ return s.kbi; }))
  };
}

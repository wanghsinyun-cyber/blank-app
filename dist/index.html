/* ==========================================================================
   62-process.js — 歷程層次分析
   ‧ 延宕序列分析（Lag Sequential Analysis, Bakeman & Gottman 調整殘差）
   ‧ 認知網絡分析（Epistemic Network Analysis：共現累積 → 球面正規化 → SVD 投影）
   ‧ 情感軌跡（詞典法）
   ========================================================================== */

/* ==========================================================================
   延宕序列分析
   ========================================================================== */
function lsa(opts){
  opts = opts || {};
  const codes = BEHAVIOR_ORDER;
  const idx = {}; codes.forEach(function(c, i){ idx[c] = i; });
  const n = codes.length;
  const F = codes.map(function(){ return new Array(n).fill(0); });

  // 依「同一位學生、同一題」切段，段與段之間不計轉移
  const seqs = {};
  allLogs().forEach(function(e){
    if (!e.code) return;
    if (opts.cond && e.cond !== opts.cond) return;
    const k = e.sid + '|' + e.iid;
    (seqs[k] = seqs[k] || []).push(e);
  });
  let nSeq = 0, nEvent = 0;
  Object.keys(seqs).forEach(function(k){
    const s = seqs[k].sort(function(a, b){ return a.t - b.t; });
    nSeq++; nEvent += s.length;
    for (let i = 0; i + 1 < s.length; i++){
      const a = idx[s[i].code], b = idx[s[i + 1].code];
      if (a === undefined || b === undefined) continue;
      F[a][b]++;
    }
  });

  const rowT = F.map(function(r){ return r.reduce(function(a, b){ return a + b; }, 0); });
  const colT = codes.map(function(_, j){ return F.reduce(function(a, r){ return a + r[j]; }, 0); });
  const N = rowT.reduce(function(a, b){ return a + b; }, 0);

  const Z = F.map(function(r, i){
    return r.map(function(f, j){
      if (!N || !rowT[i] || !colT[j]) return 0;
      const E = rowT[i] * colT[j] / N;
      const d = E * (1 - rowT[i] / N) * (1 - colT[j] / N);
      return d > 0 ? (f - E) / Math.sqrt(d) : 0;
    });
  });
  const Tr = F.map(function(r, i){
    return r.map(function(f){ return rowT[i] ? f / rowT[i] : 0; });
  });

  const sig = [];
  Z.forEach(function(r, i){ r.forEach(function(z, j){
    if (Math.abs(z) >= 1.96 && F[i][j] > 0) sig.push({from:codes[i], to:codes[j], z:z, f:F[i][j], p:Tr[i][j]});
  }); });
  sig.sort(function(a, b){ return Math.abs(b.z) - Math.abs(a.z); });

  return {codes:codes, F:F, Z:Z, T:Tr, rowT:rowT, colT:colT, N:N,
          sig:sig, nSeq:nSeq, nEvent:nEvent};
}

/* ==========================================================================
   認知網絡分析
   ========================================================================== */
const ENA_CODES = [
  {id:'FR',   name:'直接提取', desc:'發話停留在找出文中明確寫出來的訊息。'},
  {id:'SI',   name:'直接推論', desc:'發話把相鄰訊息連起來，做出顯而易見的推論。'},
  {id:'II',   name:'詮釋整合', desc:'發話整合全文並帶入自己的知識，形成詮釋。'},
  {id:'EE',   name:'比較評估', desc:'發話評斷內容的合理性、完整性或作者立場。'},
  {id:'EVID', name:'援引依據', desc:'指出題目中的具體條件或標記題幹。'},
  {id:'MON',  name:'自我監控', desc:'檢查、驗算、送出前自我檢核。'},
  {id:'REV',  name:'修正',     desc:'對話之後更改選項或改寫作答。'},
  {id:'POS',  name:'正向情緒', desc:'發話帶正向情緒詞。'},
  {id:'NEG',  name:'負向情緒', desc:'發話帶負向情緒詞。'}
];

/* 把日誌轉成 ENA 的「行」：每一行帶有若干個編碼 */
function enaLines(){
  const lines = [];
  const seqs = {};
  allLogs().forEach(function(e){
    if (!e.code) return;
    const k = e.sid + '|' + e.iid;
    (seqs[k] = seqs[k] || []).push(e);
  });
  Object.keys(seqs).forEach(function(k){
    const s = seqs[k].sort(function(a, b){ return a.t - b.t; });
    s.forEach(function(e, i){
      const c = {};
      if (e.type === 'ASK'){
        c[codeUtteranceProcess(e.text || '')] = 1;
        const sm = sentimentOf(e.text || '');
        if (sm.score > 0.2) c.POS = 1;
        if (sm.score < -0.2) c.NEG = 1;
        // 前後兩步之內有標記題幹 → 援引依據
        for (let j = Math.max(0, i - 2); j <= Math.min(s.length - 1, i + 2); j++){
          if (s[j].code === 'M') c.EVID = 1;
        }
      } else if (e.code === 'M'){ c.EVID = 1;
      } else if (e.code === 'C'){ c.MON = 1;
      } else if (e.code === 'O' || e.code === 'W'){
        // 對話之後才發生的修改才算「修正」
        for (let j = Math.max(0, i - 3); j < i; j++){
          if (s[j].code === 'A' || String(s[j].code).indexOf('Q') === 0) c.REV = 1;
        }
      } else if (e.code === 'N'){
        const sm = sentimentOf(e.text || '');
        c[codeUtteranceProcess(e.text || '')] = 1;
        if (sm.score > 0.2) c.POS = 1;
        if (sm.score < -0.2) c.NEG = 1;
      }
      const on = Object.keys(c);
      if (on.length) lines.push({sid:e.sid, cond:e.cond, iid:e.iid, seq:k, i:i, codes:on});
    });
  });
  return lines;
}

/* 累積共現：單位＝學生，stanza＝同一題內的移動窗（預設 4 行） */
function enaAccumulate(window){
  const W = window || 4;
  const lines = enaLines();
  const ids = ENA_CODES.map(function(c){ return c.id; });
  const pairs = [];
  for (let a = 0; a < ids.length; a++) for (let b = a + 1; b < ids.length; b++) pairs.push([a, b]);

  const bySeq = {};
  lines.forEach(function(l){ (bySeq[l.seq] = bySeq[l.seq] || []).push(l); });
  const units = {};
  Object.keys(bySeq).forEach(function(k){
    const L = bySeq[k];
    L.forEach(function(l, i){
      const win = L.slice(Math.max(0, i - W + 1), i + 1);
      const present = {};
      win.forEach(function(x){ x.codes.forEach(function(c){ present[c] = 1; }); });
      const u = units[l.sid] = units[l.sid] || {sid:l.sid, cond:l.cond, v:new Array(pairs.length).fill(0), n:0};
      pairs.forEach(function(p, pi){
        if (present[ids[p[0]]] && present[ids[p[1]]]) u.v[pi]++;
      });
      u.n++;
    });
  });

  const arr = Object.keys(units).map(function(k){ return units[k]; });
  // 球面正規化
  arr.forEach(function(u){
    const len = Math.sqrt(u.v.reduce(function(a, b){ return a + b * b; }, 0));
    u.norm = len > 0 ? u.v.map(function(x){ return x / len; }) : u.v.slice();
  });
  return {units:arr, pairs:pairs, ids:ids, W:W, lines:lines.length};
}

/* 以冪迭代求共變異數矩陣的前兩個主軸（SVD 的等價做法） */
function enaProject(acc){
  const U = acc.units;
  if (U.length < 3) return null;
  const d = acc.pairs.length;
  const mean = new Array(d).fill(0);
  U.forEach(function(u){ u.norm.forEach(function(x, i){ mean[i] += x / U.length; }); });
  const X = U.map(function(u){ return u.norm.map(function(x, i){ return x - mean[i]; }); });

  function mulCov(v){
    // (XᵀX)v，避免顯式建構 d×d 矩陣
    const t = X.map(function(row){
      let s = 0; for (let i = 0; i < d; i++) s += row[i] * v[i]; return s;
    });
    const out = new Array(d).fill(0);
    X.forEach(function(row, r){ for (let i = 0; i < d; i++) out[i] += row[i] * t[r]; });
    return out;
  }
  function power(deflate){
    let v = new Array(d).fill(0).map(function(_, i){ return Math.sin(i * 12.9898) * 0.5 + 0.5; });
    for (let it = 0; it < 220; it++){
      let w = mulCov(v);
      deflate.forEach(function(p){
        const dot = w.reduce(function(a, x, i){ return a + x * p[i]; }, 0);
        for (let i = 0; i < d; i++) w[i] -= dot * p[i];
      });
      const len = Math.sqrt(w.reduce(function(a, x){ return a + x * x; }, 0));
      if (len < 1e-12) break;
      v = w.map(function(x){ return x / len; });
    }
    return v;
  }
  const v1 = power([]);
  const v2 = power([v1]);
  function eig(v){
    const w = mulCov(v);
    return w.reduce(function(a, x, i){ return a + x * v[i]; }, 0);
  }
  const e1 = eig(v1), e2 = eig(v2);
  let tot = 0;
  X.forEach(function(row){ row.forEach(function(x){ tot += x * x; }); });

  const pts = U.map(function(u, r){
    return {sid:u.sid, cond:u.cond,
            x: X[r].reduce(function(a, x, i){ return a + x * v1[i]; }, 0),
            y: X[r].reduce(function(a, x, i){ return a + x * v2[i]; }, 0)};
  });
  return {pts:pts, v1:v1, v2:v2, var1: tot ? e1 / tot : 0, var2: tot ? e2 / tot : 0, mean:mean};
}

/* 各條件的平均網絡（邊權＝該條件單位向量的平均） */
function enaMeanNetworks(acc){
  const out = {};
  CONDITIONS.forEach(function(c){
    const U = acc.units.filter(function(u){ return u.cond === c.id; });
    if (!U.length) return;
    const v = new Array(acc.pairs.length).fill(0);
    U.forEach(function(u){ u.norm.forEach(function(x, i){ v[i] += x / U.length; }); });
    out[c.id] = {v:v, n:U.length};
  });
  return out;
}

/* ==========================================================================
   情感軌跡
   ========================================================================== */
function sentimentTrajectory(){
  const byCond = {};
  CONDITIONS.forEach(function(c){ byCond[c.id] = {turns:{}, items:{}, all:[]}; });
  allLogs().forEach(function(e){
    if (e.type !== 'ASK' && e.code !== 'N') return;
    const s = e.sent != null ? e.sent : sentimentOf(e.text || '').score;
    const b = byCond[e.cond]; if (!b) return;
    b.all.push(s);
    const tn = e.turn || 1;
    (b.turns[tn] = b.turns[tn] || []).push(s);
    (b.items[e.iid] = b.items[e.iid] || []).push(s);
  });
  const out = {};
  Object.keys(byCond).forEach(function(c){
    const b = byCond[c];
    out[c] = {
      mean: b.all.length ? mean(b.all) : null,
      n: b.all.length,
      pos: b.all.filter(function(x){ return x > 0.2; }).length,
      neg: b.all.filter(function(x){ return x < -0.2; }).length,
      byTurn: Object.keys(b.turns).sort(function(a, x){ return a - x; }).map(function(k){
        return {turn:+k, mean:mean(b.turns[k]), n:b.turns[k].length};
      }),
      byItem: Object.keys(b.items).map(function(k){
        return {iid:k, mean:mean(b.items[k]), n:b.items[k].length};
      })
    };
  });
  return out;
}

/* 相對歷程分布（RQ4 的描述統計） */
function relativeProcessProfile(){
  const out = {};
  CONDITIONS.forEach(function(c){ out[c.id] = {BELOW:0, AT:0, ABOVE:0, n:0}; });
  allLogs().forEach(function(e){
    if (e.type !== 'ASK') return;
    const rel = e.rel || (e.code === 'Q−' ? 'BELOW' : e.code === 'Q+' ? 'ABOVE' : 'AT');
    const b = out[e.cond]; if (!b) return;
    b[rel]++; b.n++;
  });
  return out;
}

/* ===== src/64-stats.js ===== */
/* ==========================================================================
   64-stats.js — 效果檢定
   ‧ 共變數分析（ANCOVA）：F、partial η²、調整後平均、Bonferroni 事後比較
   ‧ 平行多重中介的路徑分析：a、b、c'、間接效果與百分位 bootstrap 信賴區間
   說明：本模組估計的是「觀察變項」路徑模型，不是含潛在變項的結構方程模型。
   正式分析請以 Mplus／lavaan 重跑並檢驗測量模型。
   ========================================================================== */

/* --- 線性代數：最小平方解 --- */
function olsFit(X, y){
  const n = X.length, p = X[0].length;
  const XtX = [], Xty = new Array(p).fill(0);
  for (let i = 0; i < p; i++){
    XtX.push(new Array(p).fill(0));
    for (let j = 0; j < p; j++){
      let s = 0; for (let r = 0; r < n; r++) s += X[r][i] * X[r][j];
      XtX[i][j] = s;
    }
    let s2 = 0; for (let r = 0; r < n; r++) s2 += X[r][i] * y[r];
    Xty[i] = s2;
  }
  const inv = matInv(XtX);
  if (!inv) return null;
  const b = inv.map(function(row){
    return row.reduce(function(a, v, j){ return a + v * Xty[j]; }, 0);
  });
  const fit = X.map(function(row){ return row.reduce(function(a, v, j){ return a + v * b[j]; }, 0); });
  const res = y.map(function(v, i){ return v - fit[i]; });
  const ybar = mean(y);
  const ssTot = y.reduce(function(a, v){ return a + (v - ybar) * (v - ybar); }, 0);
  const ssRes = res.reduce(function(a, v){ return a + v * v; }, 0);
  const df = n - p;
  const mse = df > 0 ? ssRes / df : NaN;
  const se = b.map(function(_, j){ return Math.sqrt(Math.max(0, mse * inv[j][j])); });
  const t = b.map(function(v, j){ return se[j] > 0 ? v / se[j] : 0; });
  return {b:b, se:se, t:t, inv:inv, fit:fit, res:res, ssRes:ssRes, ssTot:ssTot,
          mse:mse, df:df, n:n, p:p, r2: ssTot > 0 ? 1 - ssRes / ssTot : 0};
}

function matInv(A){
  const n = A.length;
  const M = A.map(function(r, i){
    return r.concat(new Array(n).fill(0).map(function(_, j){ return i === j ? 1 : 0; }));
  });
  for (let c = 0; c < n; c++){
    let piv = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[piv][c])) piv = r;
    if (Math.abs(M[piv][c]) < 1e-12) return null;
    const tmp = M[c]; M[c] = M[piv]; M[piv] = tmp;
    const d = M[c][c];
    for (let j = 0; j < 2 * n; j++) M[c][j] /= d;
    for (let r = 0; r < n; r++){
      if (r === c) continue;
      const f = M[r][c];
      if (!f) continue;
      for (let j = 0; j < 2 * n; j++) M[r][j] -= f * M[c][j];
    }
  }
  return M.map(function(r){ return r.slice(n); });
}

/* --- 分布函數（供 p 值） --- */
function erf(x){
  const s = x < 0 ? -1 : 1; x = Math.abs(x);
  const a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741,
        a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;
  const t = 1 / (1 + p * x);
  const y = 1 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-x * x);
  return s * y;
}
/* 標準常態上尾機率 P(Z > z) */
function normUpper(z){ return 0.5 * (1 - erf(z / Math.SQRT2)); }
/* F 分布上尾 p：Wilson–Hilferty 近似。df 小時請以統計軟體覆核。 */
function fPvalue(F, df1, df2){
  if (!isFinite(F) || F <= 0 || df1 <= 0 || df2 <= 0) return 1;
  const a = 2 / (9 * df1), b = 2 / (9 * df2);
  const den = Math.sqrt(a + Math.pow(F, 2 / 3) * b);
  if (!(den > 0)) return 1;
  return normUpper((Math.pow(F, 1 / 3) * (1 - b) - (1 - a)) / den);
}
/* t 雙尾 p：t² ~ F(1, df)，故等於 F 的上尾 p */
function tP2(t, df){ return isFinite(t) ? fPvalue(t * t, 1, df) : NaN; }
function fmtP(p){
  if (!isFinite(p)) return '—';
  return p < .001 ? '< .001' : p.toFixed(3).replace(/^0/, '');
}

/* --- 資料集組裝：每位學生一列 --- */
function analysisDataset(){
  const rows = [];
  const pre = diagnose(state, 'a-pre'), post = diagnose(state, 'a-post');
  const thPre = {}, thPost = {};
  if (pre && pre.ready) pre.perStudent.forEach(function(p){ thPre[p.sid] = p.theta; });
  if (post && post.ready) post.perStudent.forEach(function(p){ thPost[p.sid] = p.theta; });

  state.classes.forEach(function(k){
    k.studentIds.forEach(function(sid){
      const sp = surveyScores(sid, 'pre') || {}, sq = surveyScores(sid, 'post') || {};
      const logs = allLogs().filter(function(e){ return e.sid === sid; });
      const asks = logs.filter(function(e){ return e.type === 'ASK'; });
      const rel = {BELOW:0, AT:0, ABOVE:0};
      asks.forEach(function(e){ rel[e.rel || 'AT']++; });
      const checks = logs.filter(function(e){ return e.code === 'C'; }).length;
      const marks = logs.filter(function(e){ return e.code === 'M'; }).length;
      // 情緒以「學生自己寫的文字」為準：對照組沒有對話，改採其筆記，四條件才可比較
      const voiced = logs.filter(function(e){ return e.type === 'ASK' || e.code === 'N'; });
      const sents = voiced.map(function(e){
        return e.sent != null ? e.sent : sentimentOf(e.text || '').score; });
      rows.push({
        sid:sid, name:userName(sid), cid:k.id, klass:k.name, grade:k.grade, cond:k.condition,
        thetaPre: thPre[sid], thetaPost: thPost[sid],
        gain: (thPre[sid] != null && thPost[sid] != null) ? thPost[sid] - thPre[sid] : null,
        pre: sp, post: sq,
        turns: asks.length, marks: marks, checks: checks,
        relBelow: rel.BELOW, relAt: rel.AT, relAbove: rel.ABOVE,
        relAboveRate: asks.length ? rel.ABOVE / asks.length : null,
        sentMean: sents.length ? mean(sents) : null
      });
    });
  });
  return rows;
}

/* --- ANCOVA：以條件為因子、前測為共變數 --- */
function ancova(rows, yGet, xGet){
  const data = rows.map(function(r){
    return {cond:r.cond, y:yGet(r), x: xGet ? xGet(r) : null};
  }).filter(function(d){
    return typeof d.y === 'number' && isFinite(d.y) && (!xGet || (typeof d.x === 'number' && isFinite(d.x)));
  });
  if (data.length < 12) return null;
  const conds = CONDITIONS.map(function(c){ return c.id; })
    .filter(function(c){ return data.some(function(d){ return d.cond === c; }); });
  if (conds.length < 2) return null;
  const ref = conds[conds.length - 1];              // 以對照組為參照
  const others = conds.filter(function(c){ return c !== ref; });
  const withCov = !!xGet;
  const xbar = withCov ? mean(data.map(function(d){ return d.x; })) : 0;

  function design(useCond){
    return data.map(function(d){
      const row = [1];
      if (withCov) row.push(d.x - xbar);
      if (useCond) others.forEach(function(c){ row.push(d.cond === c ? 1 : 0); });
      return row;
    });
  }
  const y = data.map(function(d){ return d.y; });
  const full = olsFit(design(true), y);
  const red = olsFit(design(false), y);
  if (!full || !red) return null;

  const dfEffect = others.length;
  const ssEffect = red.ssRes - full.ssRes;
  const F = (ssEffect / dfEffect) / full.mse;
  const p = fPvalue(F, dfEffect, full.df);
  const eta = ssEffect / (ssEffect + full.ssRes);

  // 調整後平均（在共變數的總平均處）
  const adj = {};
  conds.forEach(function(c){
    let v = full.b[0];
    const k = others.indexOf(c);
    if (k >= 0) v += full.b[(withCov ? 2 : 1) + k];
    adj[c] = v;
  });
  const nBy = {}, xBy = {};
  conds.forEach(function(c){
    const g = data.filter(function(d){ return d.cond === c; });
    nBy[c] = g.length;
    xBy[c] = withCov ? mean(g.map(function(d){ return d.x; })) : 0;
  });
  const ssw = withCov ? conds.reduce(function(a, c){
    const g = data.filter(function(d){ return d.cond === c; });
    const m = xBy[c];
    return a + g.reduce(function(s, d){ return s + (d.x - m) * (d.x - m); }, 0);
  }, 0) : 0;

  const pairs = [];
  for (let i = 0; i < conds.length; i++) for (let j = i + 1; j < conds.length; j++){
    const a = conds[i], b = conds[j];
    const diff = adj[a] - adj[b];
    let seSq = full.mse * (1 / nBy[a] + 1 / nBy[b]);
    if (withCov && ssw > 0) seSq += full.mse * Math.pow(xBy[a] - xBy[b], 2) / ssw;
    const se = Math.sqrt(seSq);
    const t = se > 0 ? diff / se : 0;
    const raw = tP2(t, full.df);
    const nComp = conds.length * (conds.length - 1) / 2;
    pairs.push({a:a, b:b, diff:diff, se:se, t:t, p:raw, pAdj: Math.min(1, raw * nComp),
                d: diff / Math.sqrt(full.mse)});
  }

  const desc = conds.map(function(c){
    const g = data.filter(function(d){ return d.cond === c; });
    return {cond:c, n:g.length, m:mean(g.map(function(d){ return d.y; })),
            sd:sd(g.map(function(d){ return d.y; })), adj:adj[c],
            xm: withCov ? xBy[c] : null};
  });

  return {conds:conds, ref:ref, F:F, df1:dfEffect, df2:full.df, p:p, eta:eta,
          adj:adj, desc:desc, pairs:pairs, mse:full.mse, n:data.length,
          covariate:withCov, covMean:xbar, r2:full.r2};
}

/* --- 平行多重中介 --- */
function mediation(rows, xCond, yGet, mediators, xGet, boot){
  const B = boot || 1500;
  const data = rows.filter(function(r){ return r.cond === xCond || r.cond === 'control'; })
    .map(function(r){
      const o = {x: r.cond === xCond ? 1 : 0, y: yGet(r), cov: xGet ? xGet(r) : 0};
      o.m = mediators.map(function(md){ return md.get(r); });
      return o;
    }).filter(function(o){
      return isFinite(o.y) && o.m.every(function(v){ return typeof v === 'number' && isFinite(v); }) &&
             (!xGet || isFinite(o.cov));
    });
  if (data.length < 20) return null;

  function run(sample){
    const withCov = !!xGet;
    const Xa = sample.map(function(o){ return withCov ? [1, o.x, o.cov] : [1, o.x]; });
    const a = mediators.map(function(_, j){
      const f = olsFit(Xa, sample.map(function(o){ return o.m[j]; }));
      return f ? f.b[1] : NaN;
    });
    const Xb = sample.map(function(o){
      return (withCov ? [1, o.x, o.cov] : [1, o.x]).concat(o.m);
    });
    const fb = olsFit(Xb, sample.map(function(o){ return o.y; }));
    if (!fb) return null;
    const off = withCov ? 3 : 2;
    const b = mediators.map(function(_, j){ return fb.b[off + j]; });
    const cp = fb.b[1];
    const Xc = sample.map(function(o){ return withCov ? [1, o.x, o.cov] : [1, o.x]; });
    const fc = olsFit(Xc, sample.map(function(o){ return o.y; }));
    return {a:a, b:b, cp:cp, c: fc ? fc.b[1] : NaN,
            ind: a.map(function(v, j){ return v * b[j]; }),
            fb:fb, fc:fc};
  }
  const point = run(data);
  if (!point) return null;

  const rnd = mulberry32(424242);
  const dist = mediators.map(function(){ return []; });
  const totDist = [];
  for (let it = 0; it < B; it++){
    const s = [];
    for (let i = 0; i < data.length; i++) s.push(data[Math.floor(rnd() * data.length)]);
    const r = run(s);
    if (!r) continue;
    let tot = 0;
    r.ind.forEach(function(v, j){ if (isFinite(v)){ dist[j].push(v); tot += v; } });
    totDist.push(tot);
  }
  function ci(arr){
    const v = arr.slice().sort(function(a, b){ return a - b; });
    if (v.length < 20) return [NaN, NaN];
    return [v[Math.floor(v.length * 0.025)], v[Math.ceil(v.length * 0.975) - 1]];
  }
  return {
    n: data.length, boot: totDist.length,
    c: point.c, cp: point.cp,
    paths: mediators.map(function(md, j){
      const c95 = ci(dist[j]);
      return {name: md.name, a: point.a[j], b: point.b[j], ind: point.ind[j],
              lo: c95[0], hi: c95[1], sig: c95[0] * c95[1] > 0};
    }),
    total: {ind: point.ind.reduce(function(a, b){ return a + b; }, 0),
            lo: ci(totDist)[0], hi: ci(totDist)[1],
            sig: ci(totDist)[0] * ci(totDist)[1] > 0}
  };
}

/* --- 可分析的結果變項清單 --- */
function outcomeList(){
  const out = [
    {id:'theta_post', name:'閱讀理解表現（後測 θ）', get:function(r){ return r.thetaPost; },
     cov:function(r){ return r.thetaPre; }, covName:'前測 θ'}
  ];
  CONSTRUCTS.forEach(function(c){
    out.push({id:c.id, name:c.name + '（後測）', get:function(r){ return r.post[c.id]; },
      cov: c.phase === 'both' ? function(r){ return r.pre[c.id]; } : null,
      covName: c.phase === 'both' ? c.name + '（前測）' : null});
  });
  out.push({id:'relAbove', name:'高於題目歷程的發話比例', get:function(r){ return r.relAboveRate; }, cov:null});
  out.push({id:'sent', name:'平均情緒分數', get:function(r){ return r.sentMean; }, cov:null});
  out.push({id:'checks', name:'自我檢核勾選數', get:function(r){ return r.checks; }, cov:null});
  return out;
}

/* ===== src/70-ai.js ===== */
/* ==========================================================================
   70-ai.js — AI 助評層
   兩套引擎並存，這是本系統在研究上的刻意設計：
   ‧ 內建規則引擎：離線、可重現、逐字可追溯到診斷資料與誘答標記。
   ‧ 外部語言模型：OpenAI Chat Completions 相容端點，提供彈性語言回饋。
   同一份 prompt 材料同時餵給兩者，便於做「人—規則—模型」三方比對。
   ========================================================================== */

function aiEngine(){ return state.settings.engine === 'llm' && state.settings.apiKey ? 'llm' : 'builtin'; }
function engineLabel(){ return aiEngine() === 'llm' ? '外部語言模型 · ' + state.settings.model : '內建規則引擎（離線可重現）'; }

function cacheKey(kind, id){ return kind + ':' + id + ':' + aiEngine(); }
function cacheGet(kind, id){ return state.aiCache[cacheKey(kind, id)]; }
function cacheSet(kind, id, val){ state.aiCache[cacheKey(kind, id)] = val; save(); }

/* --- 外部模型呼叫 --- */
async function llmChat(messages, o){
  o = o || {};
  const s = state.settings;
  if (!s.apiKey) throw new Error('尚未填入 API key。請到「系統設定」頁設定，或改用內建引擎。');
  const url = String(s.baseUrl || '').replace(/\/+$/, '') + '/chat/completions';
  let res;
  try {
    res = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + s.apiKey},
      body: JSON.stringify({model: s.model, messages: messages,
        temperature: o.temperature === undefined ? 0.4 : o.temperature,
        max_tokens: o.max_tokens || 1400})
    });
  } catch (e) {
    throw new Error('連不到 ' + url + '。線上發布版受安全政策限制無法連外部網址；請把本檔下載到電腦上開啟，或改用內建引擎。');
  }
  if (!res.ok){
    const t = await res.text().catch(function(){ return ''; });
    throw new Error('呼叫失敗（HTTP ' + res.status + '）' + (t ? '：' + t.slice(0, 200) : ''));
  }
  const j = await res.json();
  const txt = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
  if (!txt) throw new Error('沒有回傳內容，請確認模型名稱與端點正確。');
  return txt;
}

const SYS_TEACHER = '你是資深國小閱讀教學研究者，熟悉 PIRLS 四項理解歷程、KIDMAP 四象限診斷與 Rasch 測量。' +
  '請用臺灣繁體中文回答，行文像老師之間的討論，具體實用，避免空話與套語。用 Markdown 標題與清單排版，重點加粗。';
const SYS_KB = '你是知識建構（Knowledge Building, Scardamalia & Bereiter）研究者，熟悉 Knowledge Forum 的支架與想法改進歷程，' +
  '也熟悉形成性評量。請用臺灣繁體中文回答，聚焦在「想法如何被改進」而不是「答案對不對」，具體、可操作，避免空話。';

/* ==========================================================================

function materialClass(diag){
  const L = [];
  L.push('作業：' + diag.assignment.title);
  L.push('完成人數：' + diag.done.length + ' / ' + diag.roster.length);
  L.push('平均能力估計值 θ：' + fx(diag.meanTheta) + ' logit；平均試題難度 δ：' + fx(diag.meanDelta) + ' logit');
  L.push('全班四象限總題次：優勢(I) ' + diag.totals[1] + '、迷思(II) ' + diag.totals[2] +
         '、合理答錯(III) ' + diag.totals[3] + '、合理答對(IV) ' + diag.totals[4]);
  L.push('');
  L.push('【主要迷思題】');
  diag.flagged.forEach(function(pi){
    const it = pi.item;
    L.push('- 第 ' + it.no + ' 題（' + unitName(it.unit) + '，' + processName(it.process) + '，' + it.diff + '）');
    L.push('  題幹：' + it.stem);
    L.push('  選項：' + it.options.map(function(o, i){ return String.fromCharCode(65 + i) + '. ' + o; }).join('　'));
    L.push('  正解：' + String.fromCharCode(65 + it.answer) + '　難度 δ=' + fx(pi.delta) + '　全班答對率 ' + pct(pi.pass));
    L.push('  迷思(II) ' + pi.q[2] + ' 人（占作答 ' + pct(pi.misRate) + '）；優勢(I) ' + pi.q[1] + ' 人');
    if (pi.topDistractor != null){
      L.push('  迷思學生最常選：' + String.fromCharCode(65 + pi.topDistractor) + '. ' +
             it.options[pi.topDistractor] + '（' + pi.topDistractorN + ' 人）');
    }
    if (pi.misCode){
      const m = MISCONCEPTIONS.find(function(x){ return x.id === pi.misCode; });
      if (m) L.push('  題庫標記的理解失誤：' + m.name + '——' + m.desc);
    }
  });
  return L.join('\n');
}

function materialNote(n){
  const L = [];
  L.push('貼文標題：' + n.title);
  L.push('作者：' + noteAuthors(n));
  (n.segs || []).forEach(function(g){
    L.push('［' + scaffoldLabel(g.s) + '］' + g.text);
  });
  if (n.buildOn){ const p = getNote(n.buildOn); if (p) L.push('（此篇延伸自：' + p.title + '）'); }
  const kids = childrenOf(n.id);
  if (kids.length) L.push('（有 ' + kids.length + ' 篇延伸自此篇）');
  return L.join('\n');
}

function materialThread(rootId){
  const seq = threadOf(rootId);
  return seq.map(function(x){
    const pre = '　'.repeat(x.depth) + (x.depth ? '↳ ' : '● ');
    return pre + x.note.title + '（' + noteAuthors(x.note) + '）\n' +
      (x.note.segs || []).map(function(g){ return '　'.repeat(x.depth + 1) + '［' + scaffoldLabel(g.s) + '］' + g.text; }).join('\n');
  }).join('\n');
}

   1. 全班迷思深度分析

async function aiClassMisconception(diag, force){
  const id = diag.assignment.id;
  if (!force){ const c = cacheGet('class', id); if (c) return c; }
  let out;
  if (aiEngine() === 'llm'){
    out = await llmChat([
      {role:'system', content: SYS_TEACHER},
      {role:'user', content: materialClass(diag) + '\n\n請依序回覆：\n' +
        '1.【共同迷思診斷】把主要迷思題聚合起來看，找出學生共同卡住的概念。\n' +
        '2.【每一題的迷思解釋】說明為何學生會選那個誘答選項。\n' +
        '3.【具體教學策略】每個共同迷思給 2–3 個可執行的教學動作。\n' +
        '4.【轉為共構問題】針對其中最值得全班討論的 1–2 個迷思，寫出可以直接貼到知識建構空間的問題敘述。\n' +
        '5.【下一步派題建議】接下來派哪個單元或題型能繼續診斷或補救。'}
    ]);
  } else {
    out = builtinClassReport(diag);
  }
  cacheSet('class', id, out);
  return out;
}

function builtinClassReport(diag){
  const L = [];
  const byMis = {};
  diag.flagged.forEach(function(pi){
    const k = pi.misCode || 'other';
    (byMis[k] = byMis[k] || []).push(pi);
  });
  L.push('#### 1. 共同迷思診斷');
  const keys = Object.keys(byMis).sort(function(a, b){
    return sumQ2(byMis[b]) - sumQ2(byMis[a]);
  });
  if (!keys.length){
    L.push('目前沒有任何題目的迷思(II)比例超過門檻 ' + state.settings.misThreshold + '%。全班的錯誤大多落在「合理答錯」，代表是難度問題而非概念問題，可以直接進入練習與精熟。');
  }
  keys.forEach(function(k){
    const g = byMis[k];
    const m = MISCONCEPTIONS.find(function(x){ return x.id === k; });
    const students = uniq(g.reduce(function(a, pi){ return a.concat(pi.q2Students); }, []));
    L.push('**' + (m ? m.name : '其他錯誤型態') + '**（' + g.length + ' 題受影響，涉及 ' + students.length + ' 位學生）');
    if (m) L.push('- 概念描述：' + m.desc);
    L.push('- 相關題號：' + g.map(function(pi){ return '第 ' + pi.item.no + ' 題（迷思 ' + pct(pi.misRate) + '）'; }).join('、'));
    L.push('- 落在此迷思的學生：' + students.slice(0, 12).map(userName).join('、') + (students.length > 12 ? ' 等' : ''));
    L.push('');
  });

  L.push('#### 2. 每一題的迷思解釋');
  diag.flagged.forEach(function(pi){
    const it = pi.item;
    L.push('**第 ' + it.no + ' 題**（' + unitName(it.unit) + ' · ' + processName(it.process) + ' · δ=' + fx(pi.delta) + '）');
    L.push('- ' + it.stem);
    if (pi.topDistractor != null){
      L.push('- 迷思學生最常選 **' + String.fromCharCode(65 + pi.topDistractor) + '. ' + it.options[pi.topDistractor] + '**（' + pi.topDistractorN + ' 人）。');
      const m = pi.misCode ? MISCONCEPTIONS.find(function(x){ return x.id === pi.misCode; }) : null;
      if (m) L.push('- 這個選項之所以吸引人，是因為 ' + m.desc);
      else L.push('- 這個選項沒有對應到題庫既有的迷思標記，建議人工檢視學生的作答理由。');
    }
    L.push('- 命題備註：' + it.note);
    L.push('');
  });

  L.push('#### 3. 具體教學策略');
  keys.forEach(function(k){
    const m = MISCONCEPTIONS.find(function(x){ return x.id === k; });
    const acts = STRATEGY[k] || ['請學生把自己的判斷依據寫出來，再與同儕互相檢查。',
      '提供一個「答案對但理由來自常識」的作答，讓學生指出問題。',
      '要求每題都回到文本圈出依據的那一句。'];
    L.push('**' + (m ? m.name : '其他') + '**');
    acts.forEach(function(a){ L.push('- ' + a); });
    L.push('');
  });

  L.push('#### 4. 轉為共構問題');
  const top = diag.flagged.slice(0, 2);
  if (!top.length){
    L.push('目前沒有需要立即開啟共構的迷思題。');
  }
  top.forEach(function(pi){
    L.push('**第 ' + pi.item.no + ' 題 → 可直接貼到知識建構空間的問題敘述**');
    L.push('');
    L.push('> ' + buildInquiryPrompt(pi, diag).split('\n').join('\n> '));
    L.push('');
    L.push('在「派題診斷 → 迷思橋接」按下〈開啟共構視圖〉，系統會把這段話與該題一起貼進新的視圖，並自動標出可以擔任知識資源人的同學。');
    L.push('');
  });

  L.push('#### 5. 下一步派題建議');
  const units = uniq(diag.flagged.map(function(pi){ return pi.item.unit; }));
  if (units.length){
    L.push('- 補救優先單元：' + units.map(unitName).join('、') + '。');
    L.push('- 建議在共構討論結束後，用相同題組施測一次（本系統的「共構後測」），並比較每位學生的 θ 變化與論述參與，看討論是否真的轉成理解。');
  }
  const weakest = diag.perItem.slice().sort(function(a, b){ return a.pass - b.pass; })[0];
  if (weakest) L.push('- 全班答對率最低的是第 ' + weakest.item.no + ' 題（' + pct(weakest.pass) + '），若其迷思比例不高，代表是難度而非概念問題，可先做鷹架式練習。');
  L.push('');
  L.push('---');
  L.push('*本報告由內建規則引擎產生：所有數字直接來自 Rasch 估計與誘答選項標記，不含語言模型生成內容，可重現。*');
  return L.join('\n');
}

function sumQ2(list){ return list.reduce(function(s, p){ return s + p.q[2]; }, 0); }
function uniq(a){ const o = {}; const r = []; a.forEach(function(x){ if (!o[x]){ o[x] = 1; r.push(x); } }); return r; }

function builtinItemStrategy(pi){
  const it = pi.item;
  const m = pi.misCode ? MISCONCEPTIONS.find(function(x){ return x.id === pi.misCode; }) : null;
  const L = [];
  L.push('#### 學生可能的推理路徑');
  if (pi.topDistractor != null){
    L.push('選 **' + String.fromCharCode(65 + pi.topDistractor) + '. ' + it.options[pi.topDistractor] + '** 的 ' +
      pi.topDistractorN + ' 位同學，很可能是' + (m ? m.desc : '在中途跳過了一個檢驗步驟'));
  } else {
    L.push('這一題的錯誤選項分散，沒有集中的誘答，較可能是粗心或時間不足，而非單一迷思。');
  }
  L.push('');
  L.push('#### 三個教學動作');
  const acts = (pi.misCode && STRATEGY[pi.misCode]) || [
    '請兩位落在迷思象限的同學說說他們是從哪一段讀到的，先不要糾正。',
    '把四個選項各自對應到文本的哪一段標出來，讓學生看到誘答其實來自別的地方。',
    '要求每個答案都補一句「我是從第◯段第◯句看出來的」，寫不出來就回去再讀一次。'];
  acts.forEach(function(a){ L.push('- ' + a); });
  L.push('');
  L.push('#### 失誤類型判斷');
  /* 依 READING_ERRORS（E1–E8）分成四類閱讀失誤；沒有掛代碼時退回「歷程不明」。 */
  const READ_TYPE = {
    E1:'依據失誤', E7:'依據失誤',
    E2:'定位失誤', E5:'定位失誤',
    E3:'推論失誤', E4:'推論失誤', E6:'推論失誤',
    E8:'評估失誤'
  };
  const TYPE_DESC = {
    '依據失誤':'學生根本沒有回到文本，是憑常識或生活經驗作答。補讀更多文章沒有用，' +
               '要先建立「不畫出依據就不能作答」的規矩。',
    '定位失誤':'學生知道要回文本，但停在錯的段落或認錯了指涉對象。' +
               '適合用「關鍵詞 → 掃描 → 核對」的固定流程矯正。',
    '推論失誤':'學生找得到訊息，問題出在連起來的那一步——不是停在字面，就是推得超出文本能支持的範圍。' +
               '適合練習描述文本的邊界：「文章只說到……，沒有說……」。',
    '評估失誤':'學生讀得懂內容，但沒有讀出作者的態度與寫作用意。' +
               '適合用同一件事的兩種寫法對照，讓立場浮出來。',
    '歷程不明':'這一題的誘答沒有掛失誤代碼，無法判斷失誤型態。' +
               '建議先補上誘答標記——規則引擎的診斷品質完全取決於這一步。'
  };
  const type = (m && READ_TYPE[m.id]) || '歷程不明';
  L.push('**' + type + '**：' + TYPE_DESC[type]);
  L.push('');
  L.push('#### 建議的共構切入點');
  L.push('把這一題貼進知識建構空間時，不要問「正確答案是什麼」，改問「' +
    (m ? '「' + m.name + '」' : '這樣的讀法') + '在什麼情況下會讓我們讀錯？請從文章裡舉一個例子」。');
  return L.join('\n');
}

/* 內建引擎不「生成」新題——閱讀題離不開文本，憑空造題會造出沒有文本依據的題目。
   改為從現有題庫挑出「測同一項理解歷程」的題目：先取同一篇文本的，不足再跨文本補，
   讓老師拿得到可以直接用的替代題，而不是一段看起來像題目的生成文字。 */
function builtinSimilar(item){
  const sameProc = function(i){ return i.type === 'mc' && i.id !== item.id && i.process === item.process; };
  const near = ITEMS.filter(function(i){ return sameProc(i) && i.unit === item.unit; });
  const far  = ITEMS.filter(function(i){ return sameProc(i) && i.unit !== item.unit; });
  const alt = near.concat(far).slice(0, 3).map(function(i){
    return {stem:i.stem, options:i.options, answer:i.answer,
            hint:'同樣測「' + processName(i.process) + '」' +
                 (i.unit === item.unit ? '，同一篇文本' : '，取自' + textTitle(i.unit)) +
                 '。' + (i.note || '')};
  });
  return alt.length ? alt : [{stem:'（題庫裡沒有其他測同一項理解歷程的選擇題。' +
      '切換到外部語言模型可以依這篇文本即時生成；離線模式不會憑空造閱讀題。）',
    options:['—','—','—','—'], answer:0, hint:'到「系統設定」填入 OpenAI 相容端點與 API key。'}];
}

function builtinNoteFeedback(n){
  const t = noteFullText(n);
  const lv = epistemicLevel(n);
  const terms = domainTermsIn(t);
  const scaf = uniq((n.segs || []).map(function(s){ return s.s; }));
  const kids = childrenOf(n.id);
  const L = [];
  L.push('#### 對社群知識的貢獻');
  if (n.kind === 'rise') L.push('這是一則躍升貼文，把分散的想法收攏成全班可以共用的說法——社群知識因此有了可引用的版本。');
  else if (scaf.indexOf('s4') >= 0) L.push('這則貼文提出了挑戰，指出既有說法解釋不了的地方。想法要改進，必須先有人做這件事。');
  else if (scaf.indexOf('s3') >= 0) L.push('這則貼文帶進了外部資訊，讓討論不再只靠印象，而有可以檢核的依據。');
  else if (kids.length) L.push('這則貼文引出了 ' + kids.length + ' 篇延伸，是這條想法串的推進點。');
  else L.push('這則貼文提出了個人目前的想法，是後續討論可以接住的起點。');
  L.push('');
  L.push('#### 想法改進的層次');
  L.push('**第 ' + lv + ' 級 · ' + EPI_LABEL[lv] + '**');
  const reasons = [];
  if (cueHits(t, EPISTEMIC_CUES.causal) + cueHits(t, EPISTEMIC_CUES.conditional) > 0) reasons.push('有用因果或條件語句把理由說出來');
  if (cueHits(t, EPISTEMIC_CUES.counter) > 0) reasons.push('出現反例或轉折，代表在檢驗說法的界線');
  if (cueHits(t, EPISTEMIC_CUES.evidence) > 0) reasons.push('援引了課本、例子或實際計算作為依據');
  if (cueHits(t, EPISTEMIC_CUES.revision) > 0) reasons.push('有修正自己先前想法的語言');
  if ((n.refs || []).length || (n.contains || []).length) reasons.push('引用或收攏了其他人的貼文');
  L.push(reasons.length ? '判定依據：' + reasons.join('；') + '。' : '判定依據：目前只看到主張，還沒有出現理由、例子或反例。');
  if (terms.length) L.push('使用的領域詞彙：' + terms.join('、') + '。');
  L.push('');
  L.push('#### 你可以試試看');
  if (lv <= 1) L.push('- 你可以試試看在句子後面加一句「因為……」，把你為什麼這樣想寫出來，別人才有東西可以接。');
  else if (lv === 2) L.push('- 你可以試試看舉一個具體的數字例子，或找一個「照你的說法會說不通」的情況，把理由變成可以檢驗的東西。');
  else if (lv === 3) L.push('- 你可以試試看用「更好的理論」支架，把你和前面同學的說法合併寫成一個新版本，並說明新版本改掉了什麼。');
  else L.push('- 你可以試試看把這個版本貼回原本的問題貼文下面，並標出「還沒解決的部分」，讓討論有下一步。');
  if (!kids.length && n.kind !== 'problem') L.push('- 這則還沒有人延伸。你可以試試看主動去讀兩則別人的貼文並回應，通常也會有人回來讀你的。');
  L.push('');
  L.push('*本回饋由內建規則引擎依論述特徵（連接詞、反例、證據、修正語、支架使用、引用關係）計算，可重現。*');
  return L.join('\n');
}

        '3.【躍升貼文草稿】寫一則可以直接貼上去的「綜合我們的知識」貼文，要引用具體是誰說了什麼。\n' +
        '4.【誰還沒進來】從論述看，哪一類同學的想法還沒出現。'}
    ], {max_tokens:1100});
  } else {
    out = builtinThreadSynthesis(rootId);
  }
  cacheSet('thread', rootId, out);
  return out;
}

function builtinThreadSynthesis(rootId){
  const ii = ideaImprovement(rootId);
  const seq = ii.steps;
  const L = [];
  L.push('#### 這條想法串走到哪裡');
  L.push('- 共 ' + seq.length + ' 則貼文，參與者 ' +
    uniq(seq.reduce(function(a, s){ return a.concat(s.note.authorIds); }, [])).map(userName).join('、') + '。');
  L.push('- 論述層次由第 ' + seq[0].level + ' 級起，最高到第 ' + Math.max.apply(null, seq.map(function(s){ return s.level; })) + ' 級。');
  L.push('- 改進弧線：**' + ii.arc + '**。');
  L.push('- 過程中新出現的領域詞彙共 ' + ii.newTermTotal + ' 個。');
  L.push('');
  L.push('#### 還沒解決的問題');
  const opens = seq.filter(function(s){ return s.scaffolds.indexOf('s2') >= 0; });
  if (opens.length){
    opens.forEach(function(s){
      const seg = (s.note.segs || []).find(function(g){ return g.s === 's2'; });
      L.push('- ' + userName(s.note.authorIds[0]) + '：「' + (seg ? shortStem(seg.text) : s.note.title) + '」');
    });
  } else {
    L.push('- 這條串裡沒有人用「我需要理解」支架。請刻意邀請學生把還不懂的地方寫出來——沒有問題，想法就不會再往前。');
  }
  if (!ii.hasChallenge) L.push('- **缺少挑戰**：沒有人使用「這個理論無法解釋」。可以直接問：有沒有哪一個情況照現在的說法會說不通？');
  if (!ii.hasBetter) L.push('- **缺少改進**：還沒有人把大家的說法合併成新版本。');
  L.push('');
  L.push('#### 躍升貼文草稿');
  L.push('> ［綜合我們的知識］把大家的想法放在一起，我們目前同意：');
  seq.filter(function(s){ return s.level >= 3; }).slice(0, 4).forEach(function(s){
    const seg = (s.note.segs || [])[0];
    L.push('> ・' + userName(s.note.authorIds[0]) + ' 指出：' + (seg ? shortStem(seg.text) : s.note.title));
  });
  L.push('> ');
  L.push('> 還沒解決的是：' + (opens.length ? shortStem(((opens[0].note.segs || []).find(function(g){ return g.s === 's2'; }) || {}).text || '') : '（請補上一個大家還想不通的地方）'));
  L.push('');
  L.push('#### 誰還沒進來');
  const inThread = uniq(seq.reduce(function(a, s){ return a.concat(s.note.authorIds); }, []));
  const missing = kbClass().studentIds.filter(function(sid){ return inThread.indexOf(sid) < 0; });
  L.push('- 尚未在這條串發言的有 ' + missing.length + ' 位：' + missing.slice(0, 10).map(userName).join('、') + (missing.length > 10 ? ' 等' : '') + '。');
  L.push('- 若其中有人在原始題目上落在「優勢概念」象限，優先邀請他們——他們手上有全班需要的想法。');
  return L.join('\n');
}

function builtinCommunityReport(cs, dt){
  const L = [];
  const zone = function(z){ return dt.rows.filter(function(r){ return r.zone === z; }); };
  L.push('#### 社群目前的樣子');
  L.push('- ' + cs.roster + ' 位學生中有 **' + cs.contributors + ' 位**貼過文，共 ' + cs.notes + ' 則（其中延伸貼文 ' +
    cs.buildOns + ' 則、躍升貼文 ' + cs.riseAbove + ' 則），分布在 ' + cs.views + ' 個視圖。');
  L.push('- 想法串被接手率 **' + pct(cs.threadUptake) + '**：意思是有這麼高比例的起始貼文得到了回應，其餘的沒有人接。');
  L.push('- 論述層次平均 **' + fx(cs.epiMean, 2) + ' 級**，四級分布為 ' + cs.epiDist.map(function(v, i){ return (i + 1) + '級 ' + v + ' 則'; }).join('、') + '。');
  L.push('- 建構網絡密度 ' + fx(cs.density, 3) + '，互惠率 ' + pct(cs.reciprocity) + '。');
  L.push('');
  L.push('#### 三個值得注意的訊號');
  const sig = [];
  if (cs.contributors / cs.roster < 0.7) sig.push('**參與集中**：有 ' + (cs.roster - cs.contributors) + ' 位同學一則都沒貼。建構網絡看起來熱鬧，但可能只是少數人的熱鬧。');
  if (cs.threadUptake < 0.7) sig.push('**想法被丟下**：約 ' + pct(1 - cs.threadUptake) + ' 的起始貼文沒有人回應。可以指定「每人至少延伸兩則別人的貼文」作為下一次的任務。');
  if (cs.riseAbove < cs.views) sig.push('**缺少收斂**：有些視圖還沒有躍升貼文，討論散開了但沒有收回來。可在每個視圖結束前安排一次躍升活動。');
  if (cs.epiDist[0] + cs.epiDist[1] > cs.epiDist[2] + cs.epiDist[3]) sig.push('**論述停在意見層次**：一半以上的貼文只到「提出理由」為止，還沒有進到反例與證據。');
  if (zone('B').length) sig.push('**論述未轉化**：' + zone('B').length + ' 位同學貼文很多但後測沒有跟上（' + zone('B').slice(0, 5).map(function(r){ return userName(r.sid); }).join('、') + '）。要檢查他們是不是只在附和。');
  if (zone('C').length) sig.push('**沉默的高手**：' + zone('C').length + ' 位同學能力進步但幾乎不發言（' + zone('C').slice(0, 5).map(function(r){ return userName(r.sid); }).join('、') + '）。他們是最好的知識資源人選。');
  (sig.length ? sig.slice(0, 4) : ['社群指標大致均衡，可以把重心放在提高論述層次。']).forEach(function(s){ L.push('- ' + s); });
  L.push('');
  L.push('#### 下一週可以做的三件事');
  L.push('1. 在每個視圖各指定一位學生做「躍升人」，負責把該視圖的討論收成一則綜合貼文，並在課堂上唸出來。');
  L.push('2. 對 ' + DUAL_ZONE.D.name + '（' + zone('D').length + ' 人）採用指派角色：先請他們只做「我需要理解」的提問，降低發言門檻。');
  L.push('3. 把本週躍升貼文中的共同結論轉成 2–3 道新題目施測（可用「派題診斷 → 由討論命題」），檢核共同理解是否真的可遷移。');
  L.push('');
  L.push('#### 評量上的提醒');
  L.push('- **貼文數不能單獨用來給分**。本系統的 KB 指數把貼文量的權重壓在 15%，其餘來自延伸、被延伸、閱讀、支架多樣性與論述層次。');
  L.push('- **論述層次是規則判定的**（連接詞、反例、證據、修正語），它會低估口語表達好但書寫少的學生，請務必與課堂觀察並用。');
  L.push('- **θ 的變化含測量誤差**。單一學生的前後測差值若小於其標準誤的兩倍，不應解讀為真的進步。');
  return L.join('\n');
}

async function aiItemsFromDiscourse(view, force){
  if (!force){ const c = cacheGet('fromview', view.id); if (c) return c; }
  const ns = notesOfView(view.id);
  let out;
  if (aiEngine() === 'llm'){
    const mat = ns.map(function(n){ return materialNote(n); }).join('\n---\n');
    const txt = await llmChat([
      {role:'system', content:'你是資深閱讀評量命題者，同時熟悉知識建構。請嚴格輸出 JSON，不要多任何說明。'},
      {role:'user', content:'以下是一個知識建構視圖中的討論：\n' + mat +
        '\n\n請根據這些討論中形成的共同理解，命 3 道可以檢核「這個理解是否真的可遷移」的選擇題。' +
        '誘答選項要對應討論中被推翻的說法。只回傳 JSON：{"items":[{"stem":"","options":["","","",""],"answer":0,"hint":"","targets":""}]}'}
    ], {temperature:0.7, max_tokens:1400});
    const m = txt.match(/\{[\s\S]*\}/);
    if (!m) throw new Error('回傳的格式不正確，請再試一次。');
    out = JSON.parse(m[0]).items;
  } else {
    const src = view.origin && view.origin.iid ? getItem(view.origin.iid) : null;
    out = (src ? builtinSimilar(src) : []).map(function(x){
      return {stem:x.stem, options:x.options, answer:x.answer, hint:x.hint,
              targets: src ? '對應原題 ' + src.id + '：' + (src.tags || []).join('、') : ''};
    });
    if (!out.length) out = [{stem:'（這個視圖沒有連到原始題目，內建引擎無法命題。切換到外部語言模型即可依討論內容命題。）',
      options:['—','—','—','—'], answer:0, hint:'', targets:''}];
  }
  cacheSet('fromview', view.id, out);
  return out;
}

/* ==========================================================================
   極簡 Markdown 轉 HTML（只支援本系統會產生的語法）
   ========================================================================== */
function md(src){
  const lines = String(src || '').split('\n');
  const out = [];
  let inUl = false, inOl = false, inTable = false, inQuote = false;
  function closeAll(){
    if (inUl){ out.push('</ul>'); inUl = false; }
    if (inOl){ out.push('</ol>'); inOl = false; }
    if (inTable){ out.push('</tbody></table></div>'); inTable = false; }
    if (inQuote){ out.push('</blockquote>'); inQuote = false; }
  }
  function inline(s){
    return esc(s)
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
  }
  for (let i = 0; i < lines.length; i++){
    const l = lines[i];
    const t = l.trim();
    if (!t){ closeAll(); continue; }
    if (/^#{1,6}\s/.test(t)){ closeAll();
      const lv = Math.max(3, Math.min(6, t.match(/^#+/)[0].length));
      out.push('<h' + lv + '>' + inline(t.replace(/^#+\s*/, '')) + '</h' + lv + '>'); continue; }
    if (/^---+$/.test(t)){ closeAll(); out.push('<hr class="hr">'); continue; }
    if (/^\|/.test(t)){
      const cells = t.split('|').slice(1, -1).map(function(c){ return c.trim(); });
      if (cells.length && cells.every(function(c){ return /^:?-{2,}:?$/.test(c); })) continue;
      if (!inTable){ closeAll(); out.push('<div class="tablewrap"><table><tbody>'); inTable = true;
        out.push('<tr>' + cells.map(function(c){ return '<th>' + inline(c) + '</th>'; }).join('') + '</tr>'); continue; }
      out.push('<tr>' + cells.map(function(c){ return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>'); continue;
    }
    if (/^>\s?/.test(t)){ if (!inQuote){ closeAll(); out.push('<blockquote style="margin:0 0 10px;padding:8px 14px;border-left:3px solid var(--rule);color:var(--ink-2)">'); inQuote = true; }
      out.push(inline(t.replace(/^>\s?/, '')) + '<br>'); continue; }
    if (/^[-*]\s/.test(t)){ if (!inUl){ closeAll(); out.push('<ul>'); inUl = true; }
      out.push('<li>' + inline(t.replace(/^[-*]\s/, '')) + '</li>'); continue; }
    if (/^\d+\.\s/.test(t)){ if (!inOl){ closeAll(); out.push('<ol>'); inOl = true; }
      out.push('<li>' + inline(t.replace(/^\d+\.\s/, '')) + '</li>'); continue; }
    closeAll();
    out.push('<p>' + inline(t) + '</p>');
  }
  closeAll();
  return out.join('\n');
}

function itemPills(it){

/* --- KIDMAP：個別學生四象限圖 --- */
/* 學生版的四象限用語。同一份資料、同一個幾何，只換說法——
   十歲孩子看不懂 θ、δ (logit)、「迷思象限」，而且「迷思」是個標籤。
   教師端與研究端一律走預設（student=false），計算與匯出一個字不動。 */
const QUAD_STUDENT = {
  1: '比較難，你答對了',
  2: '可惜，你其實讀得懂',
  3: '比較難，這次沒答對',
  4: '你穩穩答對'
};
function quadLegendStudent(){
  return '<div class="legend">' + [1,2,3,4].map(function(q){
    return '<span><i class="swatch" style="background:var(--' + QUAD[q].key + ')"></i>' +
      esc(QUAD_STUDENT[q]) + '</span>';
  }).join('') + '</div>';
}

function kidmapSVG(diag, ps, student){
  const W = 620, H = 400, m = {t:26, r:18, b:34, l:52};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const ds = diag.perItem.map(function(p){ return p.delta; });
  let lo = Math.min.apply(null, ds.concat([ps.theta])) - 0.7;
  let hi = Math.max.apply(null, ds.concat([ps.theta])) + 0.7;
  if (!isFinite(lo) || !isFinite(hi) || hi - lo < 1){ lo = -3; hi = 3; }
  const Y = function(d){ return m.t + ih * (hi - d) / (hi - lo); };
  const yTheta = Y(ps.theta);
  const xW = m.l + iw * 0.27, xR = m.l + iw * 0.73;

  const parts = [];
  parts.push('<svg class="kidmap" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + (student ? '你這次的閱讀地圖' : 'KIDMAP 四象限圖') + '">');
  // 四個象限底色
  parts.push('<rect x="' + m.l + '" y="' + m.t + '" width="' + (iw / 2) + '" height="' + (yTheta - m.t) + '" fill="var(--q3-bg)"/>');
  parts.push('<rect x="' + (m.l + iw / 2) + '" y="' + m.t + '" width="' + (iw / 2) + '" height="' + (yTheta - m.t) + '" fill="var(--q1-bg)"/>');
  parts.push('<rect x="' + m.l + '" y="' + yTheta + '" width="' + (iw / 2) + '" height="' + (m.t + ih - yTheta) + '" fill="var(--q2-bg)"/>');
  parts.push('<rect x="' + (m.l + iw / 2) + '" y="' + yTheta + '" width="' + (iw / 2) + '" height="' + (m.t + ih - yTheta) + '" fill="var(--q4-bg)"/>');
  // 象限標籤
  parts.push('<text class="qlabel" x="' + (m.l + 8) + '" y="' + (m.t + 14) + '" fill="var(--q3)">' + (student ? QUAD_STUDENT[3] : 'III 合理答錯') + '</text>');
  parts.push('<text class="qlabel" x="' + (m.l + iw - 8) + '" y="' + (m.t + 14) + '" text-anchor="end" fill="var(--q1)">' + (student ? QUAD_STUDENT[1] : 'I 優勢概念') + '</text>');
  parts.push('<text class="qlabel" x="' + (m.l + 8) + '" y="' + (m.t + ih - 8) + '" fill="var(--q2)">' + (student ? QUAD_STUDENT[2] : 'II 迷思概念') + '</text>');
  parts.push('<text class="qlabel" x="' + (m.l + iw - 8) + '" y="' + (m.t + ih - 8) + '" text-anchor="end" fill="var(--q4)">' + (student ? QUAD_STUDENT[4] : 'IV 合理答對') + '</text>');
  // 框線與分隔
  parts.push('<rect class="axis" x="' + m.l + '" y="' + m.t + '" width="' + iw + '" height="' + ih + '" fill="none"/>');
  parts.push('<line class="axis" x1="' + (m.l + iw / 2) + '" y1="' + m.t + '" x2="' + (m.l + iw / 2) + '" y2="' + (m.t + ih) + '"/>');
  parts.push('<line class="theta" x1="' + m.l + '" y1="' + yTheta + '" x2="' + (m.l + iw) + '" y2="' + yTheta + '"/>');
  parts.push('<text x="' + (m.l + iw + 4) + '" y="' + (yTheta + 4) + '" fill="var(--accent)">' + (student ? '你' : 'θ') + '</text>');
  // δ 刻度
  for (let v = Math.ceil(lo); v <= Math.floor(hi); v++){
    parts.push('<line class="axis" x1="' + (m.l - 4) + '" y1="' + Y(v) + '" x2="' + m.l + '" y2="' + Y(v) + '"/>');
    if (!student) parts.push('<text x="' + (m.l - 8) + '" y="' + (Y(v) + 3) + '" text-anchor="end">' + v + '</text>');
  }
  parts.push('<text x="' + (m.l - 40) + '" y="' + (m.t + ih / 2) + '" transform="rotate(-90 ' + (m.l - 40) + ' ' + (m.t + ih / 2) + ')" text-anchor="middle">' + (student ? '題目的難度（上面比較難）' : '試題難度 δ (logit)') + '</text>');
  parts.push('<text x="' + xW + '" y="' + (H - 12) + '" text-anchor="middle">答錯</text>');
  parts.push('<text x="' + xR + '" y="' + (H - 12) + '" text-anchor="middle">答對</text>');
  // 資料點
  const used = {};
  ps.cells.forEach(function(c){
    const base = c.correct ? xR : xW;
    const key = Math.round(Y(c.delta) / 12);
    used[key] = (used[key] || 0);
    const off = (used[key] % 5 - 2) * 26;
    used[key]++;
    const cx = base + off, cy = Y(c.delta);
    const col = 'var(--' + QUAD[c.q].key + ')';
    parts.push('<circle cx="' + cx + '" cy="' + cy + '" r="9" fill="' + col + '" fill-opacity="0.9" stroke="var(--card)" stroke-width="1.5"><title>第 ' +
      getItem(c.iid).no + ' 題 · ' + (student ? QUAD_STUDENT[c.q]
        : QUAD[c.q].name + ' · δ=' + fx(c.delta) + ' · 預期答對率 ' + pct(c.p)) + '</title></circle>');
    parts.push('<text x="' + cx + '" y="' + (cy + 3.2) + '" text-anchor="middle" fill="var(--card)" style="font-size:9px;font-weight:600">' +
      getItem(c.iid).no + '</text>');
  });
  parts.push('</svg>');
  return parts.join('');
}

/* --- 直方圖（成績分佈） --- */
function histSVG(values, bins, label){
  const W = 460, H = 170, m = {t:10, r:10, b:26, l:28};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const lo = 0, hi = Math.max.apply(null, values.concat([1]));
  const nb = bins || 10;
  const counts = new Array(nb).fill(0);
  values.forEach(function(v){ const k = Math.min(nb - 1, Math.floor((v - lo) / (hi - lo || 1) * nb)); counts[k]++; });
  const mx = Math.max.apply(null, counts.concat([1]));
  const bw = iw / nb;
  const p = ['<svg class="kidmap" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label || '分佈') + '">'];
  counts.forEach(function(c, i){
    const h = ih * c / mx;
    p.push('<rect x="' + (m.l + i * bw + 1) + '" y="' + (m.t + ih - h) + '" width="' + (bw - 2) + '" height="' + h +
      '" fill="var(--accent)" fill-opacity="0.75"><title>' + Math.round(lo + (hi - lo) * i / nb) + '–' +
      Math.round(lo + (hi - lo) * (i + 1) / nb) + '：' + c + ' 人</title></rect>');
  });
  p.push('<line class="axis" x1="' + m.l + '" y1="' + (m.t + ih) + '" x2="' + (m.l + iw) + '" y2="' + (m.t + ih) + '"/>');
  p.push('<text x="' + m.l + '" y="' + (H - 8) + '">0</text>');
  p.push('<text x="' + (m.l + iw) + '" y="' + (H - 8) + '" text-anchor="end">' + Math.round(hi) + '</text>');
  p.push('<text x="' + (m.l + iw / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(label || '') + '</text>');
  p.push('</svg>');
  return p.join('');
}

/* --- 折線圖 --- */
function lineSVG(points, o){
  o = o || {};
  const W = o.w || 460, H = o.h || 180, m = {t:12, r:14, b:26, l:34};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  if (!points.length) return '<div class="muted small">尚無資料</div>';
  const xs = points.map(function(p){ return p.x; }), ys = points.map(function(p){ return p.y; });
  const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  const y0 = 0, y1 = Math.max.apply(null, ys) * 1.1 || 1;
  const X = function(v){ return m.l + iw * (x1 === x0 ? 0.5 : (v - x0) / (x1 - x0)); };
  const Y = function(v){ return m.t + ih * (1 - (v - y0) / (y1 - y0)); };
  const d = points.map(function(p, i){ return (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1); }).join(' ');
  const area = d + ' L' + X(points[points.length - 1].x).toFixed(1) + ' ' + (m.t + ih) + ' L' + X(points[0].x).toFixed(1) + ' ' + (m.t + ih) + ' Z';
  const p = ['<svg class="kidmap" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.label || '趨勢') + '">'];
  p.push('<path d="' + area + '" fill="var(--accent)" fill-opacity="0.10"/>');
  p.push('<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="1.8"/>');
  const last = points[points.length - 1];
  p.push('<circle cx="' + X(last.x) + '" cy="' + Y(last.y) + '" r="4" fill="var(--accent)"/>');
  p.push('<line class="axis" x1="' + m.l + '" y1="' + (m.t + ih) + '" x2="' + (m.l + iw) + '" y2="' + (m.t + ih) + '"/>');
  p.push('<text x="' + m.l + '" y="' + (H - 8) + '">' + esc(o.x0 || '') + '</text>');
  p.push('<text x="' + (m.l + iw) + '" y="' + (H - 8) + '" text-anchor="end">' + esc(o.x1 || '') + '</text>');
  p.push('<text x="' + (m.l - 6) + '" y="' + (m.t + 8) + '" text-anchor="end">' + Math.round(y1) + '</text>');
  p.push('</svg>');
  return p.join('');
}

/* --- 社會網絡圖（環形佈局） --- */
function snaSVG(g){
  const W = 620, H = 620, cx = W / 2, cy = H / 2, R = 240;
  const n = g.ids.length;
  const pos = {};
  g.ids.forEach(function(id, i){
    const a = -Math.PI / 2 + 2 * Math.PI * i / n;
    pos[id] = {x: cx + R * Math.cos(a), y: cy + R * Math.sin(a), a: a};
  });
  const p = ['<svg class="sna" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="知識建構延伸網絡">'];
  g.edges.forEach(function(e){
    const a = pos[e.from], b = pos[e.to];
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const k = 0.28;
    const qx = cx + (mx - cx) * (1 - k), qy = cy + (my - cy) * (1 - k);
    p.push('<path d="M' + a.x.toFixed(1) + ' ' + a.y.toFixed(1) + ' Q' + qx.toFixed(1) + ' ' + qy.toFixed(1) +
      ' ' + b.x.toFixed(1) + ' ' + b.y.toFixed(1) + '" fill="none" stroke="var(--accent)" stroke-opacity="' +
      Math.min(0.75, 0.25 + e.w * 0.2) + '" stroke-width="' + Math.min(4, e.w * 1.2) + '"><title>' +
      esc(userName(e.from)) + ' 延伸 ' + esc(userName(e.to)) + '（' + e.w + ' 次）</title></path>');
  });
  g.ids.forEach(function(id){
    const d = g.deg[id], tot = d.in + d.out;
    const r = 5 + Math.min(11, tot * 1.6);
    const col = tot === 0 ? 'var(--ink-4)' : (d.in >= d.out ? 'var(--q1)' : 'var(--q4)');
    const q = pos[id];
    p.push('<circle cx="' + q.x.toFixed(1) + '" cy="' + q.y.toFixed(1) + '" r="' + r + '" fill="' + col +
      '"><title>' + esc(userName(id)) + '：延伸他人 ' + d.out + ' 次、被延伸 ' + d.in + ' 次</title></circle>');
    const lx = cx + (R + 26) * Math.cos(q.a), ly = cy + (R + 26) * Math.sin(q.a);
    const anchor = Math.cos(q.a) > 0.2 ? 'start' : (Math.cos(q.a) < -0.2 ? 'end' : 'middle');
    p.push('<text x="' + lx.toFixed(1) + '" y="' + (ly + 3).toFixed(1) + '" text-anchor="' + anchor + '">' + esc(userName(id)) + '</text>');
  });
  p.push('</svg>');
  return p.join('');
}

/* --- 雙軌散布圖 --- */
function dualSVG(dt){
  const W = 620, H = 420, m = {t:22, r:20, b:40, l:52};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const rows = dt.rows.filter(function(r){ return r.delta != null; });
  if (!rows.length) return '<div class="muted small">需要前測與後測都完成才能繪製。</div>';
  const ds = rows.map(function(r){ return r.delta; });
  const lo = Math.min.apply(null, ds) - 0.2, hi = Math.max.apply(null, ds) + 0.2;
  const X = function(v){ return m.l + iw * (v - lo) / (hi - lo || 1); };
  const Y = function(v){ return m.t + ih * (1 - v / 100); };
  const xm = X(dt.dmed), ym = Y(dt.kmed);
  const p = ['<svg class="kidmap" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="雙軌評量散布圖">'];
  p.push('<rect x="' + m.l + '" y="' + m.t + '" width="' + (xm - m.l) + '" height="' + (ym - m.t) + '" fill="var(--q2-bg)"/>');
  p.push('<rect x="' + xm + '" y="' + m.t + '" width="' + (m.l + iw - xm) + '" height="' + (ym - m.t) + '" fill="var(--q1-bg)"/>');
  p.push('<rect x="' + m.l + '" y="' + ym + '" width="' + (xm - m.l) + '" height="' + (m.t + ih - ym) + '" fill="var(--q3-bg)"/>');
  p.push('<rect x="' + xm + '" y="' + ym + '" width="' + (m.l + iw - xm) + '" height="' + (m.t + ih - ym) + '" fill="var(--q4-bg)"/>');
  p.push('<text class="qlabel" x="' + (m.l + 8) + '" y="' + (m.t + 14) + '" fill="var(--q2)">B 論述未轉化</text>');
  p.push('<text class="qlabel" x="' + (m.l + iw - 8) + '" y="' + (m.t + 14) + '" text-anchor="end" fill="var(--q1)">A 共構轉化</text>');
  p.push('<text class="qlabel" x="' + (m.l + 8) + '" y="' + (m.t + ih - 8) + '" fill="var(--q3)">D 需要介入</text>');
  p.push('<text class="qlabel" x="' + (m.l + iw - 8) + '" y="' + (m.t + ih - 8) + '" text-anchor="end" fill="var(--q4)">C 個別成長</text>');
  p.push('<rect class="axis" x="' + m.l + '" y="' + m.t + '" width="' + iw + '" height="' + ih + '" fill="none"/>');
  p.push('<line class="theta" x1="' + xm + '" y1="' + m.t + '" x2="' + xm + '" y2="' + (m.t + ih) + '"/>');
  p.push('<line class="theta" x1="' + m.l + '" y1="' + ym + '" x2="' + (m.l + iw) + '" y2="' + ym + '"/>');
  rows.forEach(function(r){
    const x = X(r.delta), y = Y(r.kbi);
    p.push('<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="6" fill="var(--' + DUAL_ZONE[r.zone].cls +
      ')" fill-opacity="0.9" stroke="var(--card)" stroke-width="1.4"><title>' + esc(userName(r.sid)) +
      '　Δθ=' + fx(r.delta) + '　KB 指數=' + r.kbi + '　' + DUAL_ZONE[r.zone].name + '</title></circle>');
  });
  p.push('<text x="' + (m.l + iw / 2) + '" y="' + (H - 10) + '" text-anchor="middle">能力變化 Δθ（後測 − 前測，logit）</text>');
  p.push('<text x="18" y="' + (m.t + ih / 2) + '" transform="rotate(-90 18 ' + (m.t + ih / 2) + ')" text-anchor="middle">知識建構指數（0–100）</text>');
  p.push('<text x="' + (m.l - 8) + '" y="' + (m.t + 8) + '" text-anchor="end">100</text>');
  p.push('<text x="' + (m.l - 8) + '" y="' + (m.t + ih) + '" text-anchor="end">0</text>');
  p.push('</svg>');
  return p.join('');
}

/* --- 四象限橫條（每題） --- */
function quadBar(q, n){
  if (!n) return '<div class="bar"></div>';
  const seg = [2,1,3,4].map(function(k){
    const w = 100 * q[k] / n;
    return w > 0 ? '<i style="width:' + w + '%;background:var(--' + QUAD[k].key + ')"></i>' : '';
  }).join('');
  return '<div class="bar" style="display:flex">' + seg + '</div>';
}

/* --- AI 輸出區塊 --- */
function aiBlock(id, title, hint){
  return '<div class="card"><div class="card-h"><h3>' + esc(title) + '</h3>' +
    '<span class="pill">' + esc(engineLabel()) + '</span>' +
    '<button class="btn sm" data-act="' + esc(id) + '">開始分析</button></div>' +
    '<div class="card-p"><div id="out-' + esc(id) + '" class="muted small">' + esc(hint || '') + '</div></div></div>';
}
async function runAI(outId, fn, force){
  const box = document.getElementById('out-' + outId);
  if (!box) return;
  box.innerHTML = '<span class="muted small">分析中……</span>';
  try {
    const txt = await fn(force);
    box.className = 'ai-out';
    box.innerHTML = md(txt) +
      '<hr class="hr"><div class="row"><button class="btn sm" data-act="rerun-' + outId + '">重新分析（覆蓋快取）</button>' +
      '<span class="muted small">引擎：' + esc(engineLabel()) + '</span></div>';
  } catch (e) {
    box.className = 'ai-out';
    box.innerHTML = '<p><strong>分析失敗</strong></p><p>' + esc(e.message) + '</p>' +
      '<p class="muted small">你仍然可以在「系統設定」把引擎切回<strong>內建規則引擎</strong>，所有分析功能都能離線運作。</p>';
  }
}

/* ==========================================================================
   四項理解歷程的分布（個別與整體）＋ 質性敘述
   ========================================================================== */
function processProfile(diag, sids){
  const out = {};
  PROCESSES.forEach(function(p){ out[p.id] = {right:0, n:0, q2:0}; });
  diag.cells.forEach(function(c){
    if (sids && sids.indexOf(c.sid) < 0) return;
    const pid = getItem(c.iid).process;
    const b = out[pid]; if (!b) return;
    b.n++; if (c.correct) b.right++; if (c.q === 2) b.q2++;
  });
  PROCESSES.forEach(function(p){
    const b = out[p.id];
    b.rate = b.n ? b.right / b.n : null;
  });
  return out;
}

/* 由規則引擎產生的質性敘述：完全可重現，每一句都追得回數字 */
function processNarrative(prof, label){
  const rows = PROCESSES.map(function(p){ return {p:p, b:prof[p.id]}; })
    .filter(function(x){ return x.b.n; });
  if (!rows.length) return '尚無足夠作答資料。';
  const sorted = rows.slice().sort(function(a, b){ return b.b.rate - a.b.rate; });
  const best = sorted[0], worst = sorted[sorted.length - 1];
  const L = [];
  L.push(label + '在四項理解歷程上的表現，最強的是**' + best.p.name + '**（答對率 ' +
    pct(best.b.rate) + '），最弱的是**' + worst.p.name + '**（' + pct(worst.b.rate) + '）。');

  const gap = best.b.rate - worst.b.rate;
  if (gap < 0.12){
    L.push('四項歷程之間的落差只有 ' + Math.round(gap * 100) + ' 個百分點，剖面相當平整——' +
      '這通常代表整體閱讀量能一致，接下來可以直接提高文本難度，而不必針對特定歷程補救。');
  } else {
    L.push('落差達 ' + Math.round(gap * 100) + ' 個百分點，是明顯的歷程不均。');
    if (worst.p.order <= 2){
      L.push('值得注意的是，弱項落在**' + worst.p.name + '**這種較基礎的歷程上。' +
        '這通常不是理解力的問題，而是回到文本的習慣還沒建立——' +
        '學生憑印象作答，或找到了段落卻停在錯的句子。');
    } else {
      L.push('弱項落在**' + worst.p.name + '**這種較高階的歷程上，而基礎歷程表現尚可。' +
        '這代表學生找得到訊息，但還不習慣把訊息整合起來、或跳出文本評斷它。' +
        '這一類能力很難靠多做題目長出來，比較需要在討論中被要求說出理由。');
    }
  }
  const hi = rows.filter(function(x){ return x.b.q2 > 0; })
    .sort(function(a, b){ return (b.b.q2 / b.b.n) - (a.b.q2 / a.b.n); })[0];
  if (hi && hi.b.q2 / hi.b.n >= 0.08){
    L.push('第二象限（能力足以答對卻答錯）最集中在**' + hi.p.name + '**，占該歷程作答的 ' +
      pct(hi.b.q2 / hi.b.n) + '。這些是最值得帶進共構討論的題目——' +
      '它們不是難度問題，是讀法問題。');
  }
  return L.join('');
}

function tabProcess(diag){
  if (!diag.ready) return '<div class="empty"><h3>尚無足夠資料</h3><p>需要至少 ' + diag.minN + ' 位學生完成作答。</p></div>';
  const all = processProfile(diag, null);
  const k = currentClass();
  const inClass = diag.done.filter(function(s){ return k.studentIds.indexOf(s) >= 0; });
  const cls = processProfile(diag, inClass);

  function bars(prof, caption){
    const mx = 1;
    return '<div class="col">' + PROCESSES.map(function(p){
      const b = prof[p.id];
      if (!b.n) return '';
      return '<div class="rub-row">' +
        '<span><span aria-hidden="true">' + p.mark + '</span> ' + esc(p.name) +
        '<div class="muted" style="font-size:.8em">' + b.n + ' 題次</div></span>' +
        '<div class="bar" role="img" aria-label="' + esc(p.name) + ' 答對率 ' + pct(b.rate) + '">' +
        '<i style="width:' + (100 * b.rate / mx) + '%;background:var(--' + p.cls.replace('sc', 'sc-') + ')"></i></div>' +
        '<span class="lv">' + pct(b.rate) + '</span></div>';
    }).join('') + '</div>' +
    '<p class="muted small" style="margin-top:8px">' + esc(caption) + '</p>';
  }

  return '<div class="grid g2" style="margin-bottom:16px">' +
    '<div class="card"><div class="card-h"><h3>' + esc(k.name) + '</h3>' +
      '<span class="pill ' + (condition(k.condition).cls || '') + '">' +
      '<span aria-hidden="true">' + condition(k.condition).mark + '</span>' +
      esc(condition(k.condition).name) + '</span></div>' +
      '<div class="card-p">' + bars(cls, '本班 ' + inClass.length + ' 位學生的答對率') + '</div></div>' +
    '<div class="card"><div class="card-h"><h3>全體樣本</h3>' +
      '<span class="muted small">' + diag.done.length + ' 人 · ' + state.classes.length + ' 班</span></div>' +
      '<div class="card-p">' + bars(all, '四個班合計，作為本班的比較基準') + '</div></div>' +
  '</div>' +

  '<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>質性敘述</h3>' +
    '<span class="pill">內建規則引擎 · 可重現</span></div>' +
    '<div class="card-p"><div class="ai-out">' + md(processNarrative(cls, esc(k.name))) + '</div>' +
    '<p class="muted small" style="margin-top:10px">這段敘述由規則引擎依上面的數字產生，' +
    '每一句都追得回具體的答對率與象限比例，不含語言模型生成內容。</p></div></div>' +

  '<div class="card"><div class="card-h"><h3>每位學生的歷程剖面</h3>' +
    '<span class="muted small">依最弱歷程排序，優先看需要介入的人</span></div>' +
    '<div class="tablewrap"><table><thead><tr><th>學生</th>' +
    PROCESSES.map(function(p){
      return '<th class="n"><span aria-hidden="true">' + p.mark + '</span> ' + esc(p.name) + '</th>';
    }).join('') + '<th>剖面</th><th class="n">最弱</th></tr></thead><tbody>' +
    inClass.map(function(sid){
      const pr = processProfile(diag, [sid]);
      const rows = PROCESSES.map(function(p){ return {p:p, b:pr[p.id]}; }).filter(function(x){ return x.b.n; });
      const worst = rows.slice().sort(function(a, b){ return a.b.rate - b.b.rate; })[0];
      return {sid:sid, pr:pr, rows:rows, worst:worst};
    }).sort(function(a, b){ return (a.worst ? a.worst.b.rate : 1) - (b.worst ? b.worst.b.rate : 1); })
    .map(function(x){
      return '<tr><td>' + esc(userName(x.sid)) + '</td>' +
        PROCESSES.map(function(p){
          const b = x.pr[p.id];
          return '<td class="n">' + (b.n ? pct(b.rate) : '—') + '</td>';
        }).join('') +
        '<td style="min-width:130px"><div class="bar" style="display:flex">' +
        x.rows.map(function(r){
          return '<i style="width:' + (100 / x.rows.length) + '%;background:var(--' +
            r.p.cls.replace('sc', 'sc-') + ');opacity:' + (0.25 + 0.75 * r.b.rate).toFixed(2) + '"></i>';
        }).join('') + '</div></td>' +
        '<td class="n"><span class="pill ' + (x.worst ? x.worst.p.cls : '') + '">' +
        '<span aria-hidden="true">' + (x.worst ? x.worst.p.mark : '') + '</span>' +
        esc(x.worst ? x.worst.p.name : '—') + '</span></td></tr>';
    }).join('') + '</tbody></table></div>' +
    '<div class="card-p"><p class="muted small">剖面條的每一段代表一項歷程，顏色深淺代表答對率高低；' +
    '同時附上數字與「最弱」文字標籤，不以顏色單獨傳達訊息。' +
    '單一學生在 3–4 題上的答對率非常不穩定，這一欄用來排序與挑人談話，不適合直接當成能力估計。</p></div></div>';
}

function tabKidmap(diag){
  if (!diag.ready){
    return '<div class="empty"><h3>尚無足夠資料</h3><p>至少需要 ' + diag.minN +
      ' 位學生完成才會執行 KIDMAP，目前完成 ' + diag.done.length + ' 位。</p></div>';
  }
  // 預設先看迷思最多的學生——那是老師最需要處理的人
  const ranked = diag.perStudent.slice().sort(function(a, b){ return b.q[2] - a.q[2]; });
  const sel = (tabKidmap.sel && diag.perStudent.some(function(p){ return p.sid === tabKidmap.sel; }))
    ? tabKidmap.sel : ranked[0].sid;
  tabKidmap.sel = sel;
  const ps = diag.perStudent.find(function(p){ return p.sid === sel; }) || ranked[0];
  return '<div class="grid" style="grid-template-columns:230px minmax(0,1fr);gap:16px">' +
    '<div class="card" style="max-height:660px;overflow:auto"><div class="card-h"><h3>學生</h3>' +
    '<span class="muted small">依迷思題數排序</span></div>' +
    '<div style="padding:8px">' + ranked.map(function(p){
      return '<button class="btn sm" style="width:100%;justify-content:space-between;margin-bottom:4px;' +
        (p.sid === sel ? 'border-color:var(--accent);font-weight:600' : 'border-color:transparent') + '"' +
        ' data-act="kidmap-sel" data-id="' + p.sid + '">' + esc(userName(p.sid)) +

    }).join('') + '</div></div>' +
    '<div class="card"><div class="card-h"><h3>' + esc(userName(ps.sid)) + ' 的 KIDMAP</h3>' +
      '<span class="pill">θ = ' + fx(ps.theta) + ' ± ' + fx(ps.se) + '</span>' +
      '<span class="pill">Infit ' + fx(ps.infit) + '</span></div>' +
    '<div class="card-p">' + kidmapSVG(diag, ps) +
      '<div class="row" style="margin-top:10px">' + quadLegend() + '</div>' +
      '<hr class="hr">' +
      '<p class="small"><strong>怎麼讀這張圖：</strong>縱軸是試題難度（越上面越難），橫向分成答錯／答對兩欄，' +
      '中間那條虛線是這位學生的能力值 θ。落在<strong style="color:var(--q2)">左下（II 迷思）</strong>的題目，' +
      '照他的能力本來應該答對卻答錯了——這些題目就是他真正的概念缺口，也是本系統送進共構討論的材料。' +
      '落在<strong style="color:var(--q1)">右上（I 優勢）</strong>的題目代表他有隱藏實力，可以邀他當該題的知識資源人。</p>' +
      (ps.q[2] ? '<div class="ai-out" style="margin-top:12px"><p><strong>這位學生的迷思題：</strong></p><ul>' +
        ps.cells.filter(function(c){ return c.q === 2; }).map(function(c){
          const it = getItem(c.iid);
          return '<li>第 ' + it.no + ' 題（' + esc(shortStem(it.stem)) + '）——他選了 ' +
            (c.choice != null ? String.fromCharCode(65 + c.choice) + '. ' + esc(it.options[c.choice]) : '未作答') +
            '，正解是 ' + String.fromCharCode(65 + it.answer) + '。預期答對率 ' + pct(c.p) + '。</li>';
        }).join('') + '</ul></div>' : '<p class="small muted" style="margin-top:12px">這位學生沒有落在迷思象限的題目。</p>') +

/* --- 迷思橋接：兩個平台真正接起來的地方 --- */
function tabBridge(diag){
  if (!diag.ready) return '<div class="empty"><h3>尚無足夠資料</h3><p>需要至少 ' + diag.minN + ' 位學生完成作答。</p></div>';
  const list = diag.flagged;
  return '<div class="card card-p" style="margin-bottom:16px">' +
    '<h3>從測驗到討論：一鍵把迷思變成社群的問題</h3>' +
    '<p class="lead" style="margin-top:8px">KIDMAP 的第二象限（<span class="pill q2"><span class="dot"></span>II 迷思概念</span>）指出的是' +
    '「這個學生的能力應該答得出來，卻答錯了」——這正是最值得全班一起想清楚的真實問題。' +
    '按下〈開啟共構視圖〉，系統會建立一個 Knowledge Forum 式的視圖，把題目、誘答分析與探究問題貼進去，' +
    '同時把在該題落在<span class="pill q1"><span class="dot"></span>I 優勢概念</span>的同學標為<strong>知識資源人</strong>，' +
    '請他們先貼出自己的想法，而不是直接公布答案。</p>' +
    '<p class="muted small">門檻：迷思比例 ≥ ' + state.settings.misThreshold + '%（可在系統設定調整）。</p></div>' +
    (list.length ? list.map(function(pi){
      const it = pi.item;
      const v = bridgeExists(diag.assignment.id, it.id);
      const m = pi.misCode ? MISCONCEPTIONS.find(function(x){ return x.id === pi.misCode; }) : null;
      return '<div class="card" style="margin-bottom:14px"><div class="card-h">' +
        '<h3>第 ' + it.no + ' 題　<span class="pill q2"><span class="dot"></span>迷思 ' + pi.q[2] + ' 人 · ' + pct(pi.misRate) + '</span></h3>' +
        (v ? '<a class="btn sm" href="#/kb/' + v.id + '">進入共構視圖 →</a>'
           : '<button class="btn primary sm" data-act="bridge" data-id="' + it.id + '">開啟共構視圖</button>') + '</div>' +
        '<div class="card-p"><div class="item" style="margin-bottom:12px"><div class="stem">' + esc(it.stem) + '</div>' +
        '<div class="opts">' + it.options.map(function(o, k){
          const isAns = k === it.answer, isTop = k === pi.topDistractor;
          return '<div class="opt' + (isAns ? ' right' : (isTop ? ' wrong' : '')) + '"><b>' +
            String.fromCharCode(65 + k) + '</b><span>' + esc(o) + (isAns ? '　<span class="muted small">正解</span>' : '') +
            (isTop ? '　<span class="muted small">迷思學生最常選（' + pi.topDistractorN + ' 人）</span>' : '') + '</span></div>';
        }).join('') + '</div></div>' +
        (m ? '<p class="small"><strong>題庫標記的迷思類型：</strong>' + esc(m.name) + '——' + esc(m.desc) + '</p>' : '') +
        '<div class="grid g2" style="margin-top:10px">' +
          '<div><div class="eyebrow">落在迷思象限（待解者）</div><div class="row" style="gap:5px;margin-top:6px">' +
            pi.q2Students.map(function(s){ return '<span class="pill q2">' + esc(userName(s)) + '</span>'; }).join('') + '</div></div>' +
          '<div><div class="eyebrow">落在優勢象限（知識資源人）</div><div class="row" style="gap:5px;margin-top:6px">' +
            (pi.q1Students.map(function(s){ return '<span class="pill q1">' + esc(userName(s)) + '</span>'; }).join('') ||
             '<span class="muted small">這一題沒有人超越預期答對。</span>') + '</div></div>' +
        '</div>' +
        '<hr class="hr"><div class="eyebrow">將貼進視圖的探究問題</div>' +
        '<div class="ai-out" style="margin-top:6px">' + nl2br(buildInquiryPrompt(pi, diag)) + '</div>' +
        '</div></div>';
    }).join('') : '<div class="empty"><h3>目前沒有明顯的迷思題</h3>' +
      '<p>全班沒有出現迷思比例超過 ' + state.settings.misThreshold + '% 的題目。</p></div>');
}

/* --- 非選題評閱 --- */
function tabCR(diag){
  const crs = diag.assignment.itemIds.map(getItem).filter(function(i){ return i && i.type === 'cr'; });

  const sel = tabCR.sel || crs[0].id;
  tabCR.sel = sel;
  const it = getItem(sel);
  const rubricKey = 'rubric:' + it.id + ':' + aiEngine();
  const rubric = state.aiCache[rubricKey];
  const answers = state.responses.filter(function(r){ return r.aid === diag.assignment.id && r.iid === it.id; });

  return '<div class="row" style="margin-bottom:12px">' + crs.map(function(c){
      return '<button class="btn sm' + (c.id === sel ? ' primary' : '') + '" data-act="cr-sel" data-id="' + c.id + '">非選第 ' + c.no + ' 題</button>';

    '<div class="card" style="margin-bottom:14px"><div class="card-h"><h3>題目</h3>' +

      '<div class="card-p"><div class="stem">' + esc(it.stem) + '</div></div></div>' +

      '<span class="pill">' + esc(engineLabel()) + '</span>' +
      '<button class="btn sm" data-act="gen-rubric" data-id="' + it.id + '">' + (rubric ? '重新產生規準' : '產生規準') + '</button></div>' +
      '<div class="card-p"><div id="out-rubric" class="' + (rubric ? 'ai-out' : 'muted small') + '">' +

/* 作答與 AI 互動：列出名單，點進去用學生當時的版面唯讀重播。
   測驗結束後學生端就進不去了，這裡是教師與研究者唯一看得到那個介面的入口。 */
function tabReplay(diag){
  const a = diag.assignment;
  const dial = allDialog().filter(function(d){ return d.aid === a.id; });
  const logs = allLogs().filter(function(e){ return e.aid === a.id; });
  const rows = diag.roster.map(function(sid){
    const cond = condition(conditionOfStudent(sid));
    const said = dial.filter(function(d){ return d.sid === sid && d.speaker === 'student'; }).length;
    const marks = logs.filter(function(e){ return e.sid === sid && e.code === 'M'; }).length;
    const ans = state.responses.filter(function(r){
      return r.aid === a.id && r.sid === sid &&
             (r.choice != null || (r.text && r.text.length)); }).length;
    return {sid:sid, cond:cond, said:said, marks:marks, ans:ans, done:submitted(a.id, sid)};
  });
  const withDialog = rows.filter(function(r){ return r.said > 0; }).length;

  return '<div class="grid g4" style="margin-bottom:16px">' +
    statCard('可檢視的學生', rows.length, a.aal ? '這是評量即學習事件' : '一般測驗，沒有 AI 對話') +
    statCard('有對話記錄', withDialog, '對照組沒有 AI 夥伴，屬正常') +
    statCard('學生發話總數', dial.filter(function(d){ return d.speaker === 'student'; }).length,
             '每題上限 ' + ((state.settings && state.settings.maxTurns) || MAX_TURNS) + ' 次') +
    statCard('文句標記總數', logs.filter(function(e){ return e.code === 'M'; }).length, '學生在文本上畫的線') +
    '</div>' +

    '<div class="card card-p" style="margin-bottom:16px;border-left:3px solid var(--accent)">' +
    '<div class="eyebrow">為什麼會有這一頁</div>' +
    '<p class="small" style="margin-top:6px;max-width:74ch">評量即學習的作答介面是學生端的畫面，' +
    '測驗結束之後就沒有人進得去，教師與研究者也就看不到學生當時實際看到什麼、跟 AI 說了什麼。' +
    '點任何一位學生，就會用<strong>與他當時完全相同的版面</strong>重播——同樣的文本、同樣的兩欄、' +
    '同樣的對話卡，差別只在全部唯讀，並且多顯示對錯、誘答標記與系統的歷程編碼。' +
    '這一頁不會寫入任何事件日誌。</p></div>' +

    '<div class="card"><div class="card-h"><h3>學生名單</h3>' +
    '<span class="muted small">依發話次數排序</span></div><div class="card-p">' +
    '<div class="tablewrap"><table><thead><tr>' +
    '<th>學生</th><th>條件</th><th>作答</th><th>標記句數</th><th>發話次數</th><th>狀態</th><th></th>' +
    '</tr></thead><tbody>' +
    rows.sort(function(x, y){ return y.said - x.said; }).map(function(r){
      return '<tr><td><b>' + esc(userName(r.sid)) + '</b></td>' +
        '<td><span class="pill"><span aria-hidden="true">' + esc(r.cond.mark || '') + '</span>' +
        esc(r.cond.name) + '</span></td>' +
        '<td>' + r.ans + ' / ' + diag.assignment.itemIds.length + '</td>' +
        '<td>' + r.marks + '</td>' +
        '<td>' + (r.said || (r.cond.id === 'control' ? '—' : 0)) + '</td>' +
        '<td>' + (r.done ? '已交卷' : '<span class="muted">未交卷</span>') + '</td>' +
        '<td><a class="btn sm" href="#/inspect/' + a.id + '/' + r.sid + '">檢視 →</a></td></tr>';
    }).join('') +
    '</tbody></table></div></div></div>';
}

/* 測驗還沒交完的學生看到的門檻畫面。四個 KB 入口都先過這一關。 */
/* 測驗還沒交完的學生看到的門檻畫面。四個 KB 入口都先過這一關。
   文案依「實際擋住你的那一份作業」說話——寫死「前測」會在後測派出後變成謊話。 */
function kbGate(){

  const pend = pendingAssignments(me.id);
  const blocking = pend[0];

/* --- 視圖畫布 --- */
function viewKBCanvas(vid){
  const gate = kbGate(); if (gate) return gate;
  const v = getView(vid);
  if (!v) return '<div class="empty"><h3>找不到這個視圖</h3><a class="btn" href="#/kb">回知識建構空間</a></div>';
  const ns = notesOfView(vid);
  const it = v.origin ? getItem(v.origin.iid) : null;

  const notesHTML = ns.map(function(n){
    const scaf = (n.segs || [])[0];
    const cls = ['note', n.kind === 'problem' ? 'problem' : '', n.kind === 'rise' ? 'rise' : '',
                 isUnread(n) ? 'unread' : '', KBPICK[n.id] ? 'sel' : ''].filter(Boolean).join(' ');
    const scls = scaf ? (scaffold(scaf.s) || {}).cls : '';
    return '<div class="' + cls + ' ' + (scls || '') + '" style="left:' + n.x + 'px;top:' + n.y + 'px"' +
      ' data-note="' + n.id + '" tabindex="0" role="button" aria-label="貼文 ' + esc(n.title) + '">' +
      '<div class="nt">' + esc(n.title) + '</div>' +
      (scaf ? '<div class="small" style="color:var(--' + ((scaffold(scaf.s) || {}).cls || '').replace('sc', 'sc-') +
        ');font-size:11px;font-weight:600;margin-bottom:2px">' + esc(scaffoldLabel(scaf.s)) + '</div>' : '') +
      '<div class="nb">' + esc((scaf ? scaf.text : '').slice(0, 90)) + '</div>' +
      '<div class="nf"><span>' + esc(noteAuthors(n)) + '</span>' +
        (childrenOf(n.id).length ? '<span>↳' + childrenOf(n.id).length + '</span>' : '') +
        ((n.reads || []).length ? '<span>👁' + n.reads.length + '</span>' : '') +
        ((n.annotations || []).length ? '<span>✎' + n.annotations.length + '</span>' : '') +
      '</div></div>';
  }).join('');

  // 連線
  const pos = {};
  ns.forEach(function(n){ pos[n.id] = {x: n.x + 108, y: n.y + 40}; });
  const edges = [];
  ns.forEach(function(n){
    if (n.buildOn && pos[n.buildOn]) edges.push(curve(pos[n.buildOn], pos[n.id], 'build'));
    (n.contains || []).forEach(function(c){ if (pos[c]) edges.push(curve(pos[c], pos[n.id], 'rise')); });
    (n.refs || []).forEach(function(r){ if (pos[r.noteId]) edges.push(curve(pos[r.noteId], pos[n.id], 'ref')); });
  });

  return sectionHead(v.title, v.desc, '<a class="btn" href="#/kb">← 所有視圖</a>' +
      '<a class="btn" href="#/synth/' + v.id + '">想法串綜整</a>') +
    (it ? '<div class="card card-p" style="margin-bottom:14px;border-left:3px solid var(--q2)">' +
      '<div class="eyebrow">這個視圖從哪裡來</div>' +
      /* 學生只看到作業名稱的純文字：那條連結會直接把他帶到含 16 題正解的分析頁 */
      '<p class="small" style="margin-top:6px">來自 ' + (isTeacher() ? '<a href="#/assign/' + v.origin.aid + '">' : '<span>') +
      esc((getAssignment(v.origin.aid) || {}).title || '') + (isTeacher() ? '</a>' : '</span>') +
      ' 第 ' + it.no + ' 題的 KIDMAP 迷思象限。</p>' +
      '<div class="item"><div class="stem">' + esc(it.stem) + '</div>' +
      '<div class="muted small">' + it.options.map(function(o, k){ return String.fromCharCode(65 + k) + '. ' + esc(o); }).join('　') + '</div></div>' +
      '</div>' : '') +
    '<div class="kb-toolbar">' +
      '<button class="btn primary sm" data-act="new-note" data-id="' + v.id + '">貼一則新想法</button>' +
      '<button class="btn sm' + (KBSEL ? ' primary' : '') + '" data-act="toggle-sel">' +
        (KBSEL ? '選取中（' + Object.keys(KBPICK).length + '）' : '選取貼文做躍升') + '</button>' +
      (KBSEL && Object.keys(KBPICK).length >= 2 ?
        '<button class="btn sm" data-act="make-rise" data-id="' + v.id + '">建立躍升貼文</button>' : '') +
      '<div class="spacer"></div>' +
      '<span class="legend small">' +
        '<span><i class="swatch" style="background:var(--accent)"></i>延伸</span>' +
        '<span><i class="swatch" style="background:var(--sc-6)"></i>躍升收攏</span>' +
        '<span><i class="swatch" style="background:var(--sc-5)"></i>引用</span>' +
      '</span>' +
    '</div>' +
    '<div class="canvas" id="canvas"><div class="canvas-inner" id="canvasInner">' +
      '<svg class="edges" viewBox="0 0 1600 1100" preserveAspectRatio="none">' + edges.join('') + '</svg>' +
      notesHTML + '</div></div>' +
    '<div class="row" style="margin-top:10px"><span class="muted small">拖曳貼文可以重新安排版面，位置會存下來。' +
    '點一下貼文開啟完整內容、延伸與註記。</span></div>' +
    '<div class="card" style="margin-top:16px"><div class="card-h"><h3>這個視圖的支架使用</h3></div><div class="card-p">' +
      scaffoldUsageBar(ns) + '</div></div>';
}

function curve(a, b, cls){
  const mx = (a.x + b.x) / 2;
  return '<path class="' + cls + '" d="M' + a.x + ' ' + a.y + ' C' + mx + ' ' + a.y + ' ' + mx + ' ' + b.y + ' ' + b.x + ' ' + b.y + '"/>';
}

function scaffoldUsageBar(ns){
  const c = {};
  ns.forEach(function(n){ (n.segs || []).forEach(function(g){ c[g.s] = (c[g.s] || 0) + 1; }); });
  const mx = Math.max.apply(null, SCAFFOLDS.map(function(s){ return c[s.id] || 0; }).concat([1]));
  return '<div class="col">' + SCAFFOLDS.map(function(s){
    const n = c[s.id] || 0;
    return '<div class="rub-row"><span class="' + s.cls + '" style="border-left:3px solid;padding-left:8px">' + esc(s.label) + '</span>' +
      '<div class="bar"><i style="width:' + (100 * n / mx) + '%;background:var(--' + s.cls.replace('sc', 'sc-') + ')"></i></div>' +
      '<span class="lv">' + n + '</span></div>';
  }).join('') + '</div>' +
  '<p class="muted small" style="margin-top:10px">支架分布反映論述的形態。若「我的理論」遠多於「這個理論無法解釋」與「更好的理論」，' +
  '代表大家在各說各話，想法還沒有真的被改進。</p>';
}

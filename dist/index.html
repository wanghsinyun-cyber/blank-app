        cs.forEach(function(c){
          const eff = phase === 'post' ? (DEMO_EFFECT[k.condition] || DEMO_EFFECT.control)[c.id] || 0 : 0;
          const mu = clamp(trait[c.id] + eff, 1, c.scale.n);
          c.items.forEach(function(_, i){
            resp[c.id + '_' + i] = Math.max(1, Math.min(c.scale.n,
              Math.round(mu + (rnd() - 0.5) * 1.2)));
          });
        });
        if (phase === 'post'){
          if (k.condition !== 'control'){
            MANIP_CHECK.forEach(function(m){
              const match = (m.id === 'mc_' + k.condition);
              resp[m.id] = Math.max(1, Math.min(6, Math.round((match ? 5.0 : 2.6) + (rnd() - 0.5) * 1.4)));
            });
          }
          SUS_ITEMS.forEach(function(s){
            resp[s.id] = Math.max(1, Math.min(6, Math.round(4.4 + (rnd() - 0.5) * 1.5)));
          });
        }
        out.push({sid:sid, phase:phase, at: Date.now(), resp:resp, demo:true});
      });
    });
  });
  return out;
}

function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

/* 問卷資料匯出（長格式） */
function toSurveyCsv(){
  const rows = [['sid','name','class','grade','condition','phase','construct','dimension','mean_score','n_items']];
  (state.surveys || []).forEach(function(s){
    const k = classOfStudent(s.sid);
    const sc = scoreSurvey(s.resp);
    CONSTRUCTS.forEach(function(c){
      if (sc[c.id] == null) return;
      rows.push([s.sid, userName(s.sid), k ? k.name : '', k ? k.grade : '',
        k ? k.condition : '', s.phase, c.name, c.dim, sc[c.id].toFixed(3), c.items.length]);
    });
  });
  return rows.map(function(r){
    return r.map(function(c){ return '"' + String(c).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\n');
}

/* ===== src/40-psy.js ===== */
/* ==========================================================================
   40-psy.js — 心理計量：簡化 Rasch 模式（JMLE）與 KIDMAP 四象限
   參考：Wright & Stone (1979) Best Test Design；
        國立臺灣師範大學心理與教育測驗研究發展中心之 KIDMAP 診斷表徵。
   ========================================================================== */

const QUAD = {
  1:{key:'q1', roman:'I',   name:'優勢概念',  short:'優勢',    desc:'難題答對，超越預期。'},
  2:{key:'q2', roman:'II',  name:'迷思概念',  short:'迷思',    desc:'能力足以答對卻答錯，最需要介入。'},
  3:{key:'q3', roman:'III', name:'合理答錯',  short:'合理錯',  desc:'難題答錯，屬合理範圍。'},
  4:{key:'q4', roman:'IV',  name:'合理答對',  short:'合理對',  desc:'簡單題答對，屬合理範圍。'}
};

function logistic(x){ return 1 / (1 + Math.exp(-x)); }

/* 由作答矩陣估計 Rasch 參數。
   X: 二維陣列 [人][題]，值為 1 / 0 / null（未作答）。 */
function estimateRasch(X, opts){
  opts = opts || {};
  const N = X.length, L = N ? X[0].length : 0;
  const theta = new Array(N).fill(0);
  const delta = new Array(L).fill(0);
  if (!N || !L) return {theta:theta, delta:delta, se:[], seItem:[], iterations:0, converged:false};

  // 原始分數與作答題數
  const pScore = [], pCount = [], iScore = [], iCount = [];
  for (let n = 0; n < N; n++){ let s = 0, c = 0;
    for (let i = 0; i < L; i++){ if (X[n][i] === null || X[n][i] === undefined) continue; c++; s += X[n][i]; }
    pScore.push(s); pCount.push(c);
  }
  for (let i = 0; i < L; i++){ let s = 0, c = 0;
    for (let n = 0; n < N; n++){ if (X[n][i] === null || X[n][i] === undefined) continue; c++; s += X[n][i]; }
    iScore.push(s); iCount.push(c);
  }

  // 極端分數調整（Wright 的 0.3 邏輯分校正），避免估計發散
  const ADJ = 0.3;
  function targetPerson(n){
    let r = pScore[n], c = pCount[n];
    if (!c) return null;
    if (r === 0) r = ADJ; else if (r === c) r = c - ADJ;
    return r;
  }
  function targetItem(i){
    let r = iScore[i], c = iCount[i];
    if (!c) return null;
    if (r === 0) r = ADJ; else if (r === c) r = c - ADJ;
    return r;
  }

  // PROX 起始值
  for (let n = 0; n < N; n++){
    const r = targetPerson(n);
    theta[n] = r === null ? 0 : Math.log(r / (pCount[n] - r));
  }
  for (let i = 0; i < L; i++){
    const r = targetItem(i);
    delta[i] = r === null ? 0 : -Math.log(r / (iCount[i] - r));
  }

  // JMLE 交替 Newton–Raphson
  const maxIt = opts.maxIt || 120, tol = opts.tol || 1e-4;
  let it = 0, converged = false;
  for (; it < maxIt; it++){
    let maxChange = 0;
    // 更新人
    for (let n = 0; n < N; n++){
      const r = targetPerson(n); if (r === null) continue;
      let E = 0, V = 0;
      for (let i = 0; i < L; i++){
        if (X[n][i] === null || X[n][i] === undefined) continue;
        const p = logistic(theta[n] - delta[i]); E += p; V += p * (1 - p);
      }
      if (V < 1e-6) V = 1e-6;
      let step = (r - E) / V;
      step = Math.max(-1, Math.min(1, step));
      theta[n] += step;
      maxChange = Math.max(maxChange, Math.abs(step));
    }
    // 更新題
    for (let i = 0; i < L; i++){
      const r = targetItem(i); if (r === null) continue;
      let E = 0, V = 0;
      for (let n = 0; n < N; n++){
        if (X[n][i] === null || X[n][i] === undefined) continue;
        const p = logistic(theta[n] - delta[i]); E += p; V += p * (1 - p);
      }
      if (V < 1e-6) V = 1e-6;
      let step = (E - r) / V;
      step = Math.max(-1, Math.min(1, step));
      delta[i] += step;
      maxChange = Math.max(maxChange, Math.abs(step));
    }
    // 將題目難度中心化為 0（設定量尺原點）
    let m = 0, k = 0;
    for (let i = 0; i < L; i++){ if (iCount[i]){ m += delta[i]; k++; } }
    if (k){ m /= k; for (let i = 0; i < L; i++) delta[i] -= m; for (let n = 0; n < N; n++) theta[n] -= m; }
    if (maxChange < tol){ converged = true; break; }
  }

  // 標準誤與適配度
  const se = [], seItem = [], infit = [], outfit = [], pInfit = [], pOutfit = [];
  for (let n = 0; n < N; n++){
    let V = 0, num = 0, den = 0, oz = 0, oc = 0;
    for (let i = 0; i < L; i++){
      if (X[n][i] === null || X[n][i] === undefined) continue;
      const p = logistic(theta[n] - delta[i]), v = p * (1 - p);
      V += v; num += Math.pow(X[n][i] - p, 2); den += v;
      oz += Math.pow(X[n][i] - p, 2) / Math.max(v, 1e-6); oc++;
    }
    se.push(V > 0 ? 1 / Math.sqrt(V) : null);
    pInfit.push(den > 0 ? num / den : null);
    pOutfit.push(oc ? oz / oc : null);
  }
  for (let i = 0; i < L; i++){
    let V = 0, num = 0, den = 0, oz = 0, oc = 0;
    for (let n = 0; n < N; n++){
      if (X[n][i] === null || X[n][i] === undefined) continue;
      const p = logistic(theta[n] - delta[i]), v = p * (1 - p);
      V += v; num += Math.pow(X[n][i] - p, 2); den += v;
      oz += Math.pow(X[n][i] - p, 2) / Math.max(v, 1e-6); oc++;
    }
    seItem.push(V > 0 ? 1 / Math.sqrt(V) : null);
    infit.push(den > 0 ? num / den : null);
    outfit.push(oc ? oz / oc : null);
  }

  return {theta:theta, delta:delta, se:se, seItem:seItem,
          infit:infit, outfit:outfit, pInfit:pInfit, pOutfit:pOutfit,
          pScore:pScore, pCount:pCount, iScore:iScore, iCount:iCount,
          iterations:it, converged:converged};
}

/* KIDMAP 四象限判定 */
function quadrantOf(theta, delta, correct){
  const expectRight = theta > delta;
  if (correct && !expectRight) return 1;
  if (!correct && expectRight) return 2;
  if (!correct && !expectRight) return 3;
  return 4;
}

/* 針對一份派題執行完整診斷 */
function diagnose(state, aid){
  const asg = state.assignments.find(function(a){ return a.id === aid; });
  if (!asg) return null;
  const items = asg.itemIds.map(getItem).filter(function(it){ return it && it.type === 'mc'; });
  // 四個班級共用同一份題本、同一次校準，條件之間才可比較
  const roster = assignmentRoster(asg);
  const done = roster.filter(function(sid){
    return state.submissions.some(function(s){ return s.aid === aid && s.sid === sid; });
  });

  const X = done.map(function(sid){
    return items.map(function(it){
      const r = state.responses.find(function(r){ return r.aid === aid && r.sid === sid && r.iid === it.id; });
      /* correct 可能是 null（沒作答）——那和「沒有這一筆」一樣要跳過 */
      return (r && r.correct != null) ? (r.correct ? 1 : 0) : null;
    });
  });

  const minN = (state.settings && state.settings.minN) || 3;
  const ready = done.length >= minN && items.length >= 3;
  const est = ready ? estimateRasch(X) : null;

  const cells = [];         // 每一「人×題」的象限
  const perItem = items.map(function(it, i){
    return {item:it, idx:i, delta: est ? est.delta[i] : null,
            infit: est ? est.infit[i] : null, outfit: est ? est.outfit[i] : null,
            q:{1:0,2:0,3:0,4:0}, n:0, right:0, distractors:{}, q2Students:[], q1Students:[]};
  });
  const perStudent = done.map(function(sid, n){
    return {sid:sid, theta: est ? est.theta[n] : null, se: est ? est.se[n] : null,
            infit: est ? est.pInfit[n] : null,
            q:{1:0,2:0,3:0,4:0}, right:0, n:0, cells:[]};
  });

  if (ready){
    done.forEach(function(sid, n){
      items.forEach(function(it, i){
        const x = X[n][i]; if (x === null) return;
        const q = quadrantOf(est.theta[n], est.delta[i], x === 1);
        const resp = state.responses.find(function(r){ return r.aid === aid && r.sid === sid && r.iid === it.id; });
        const cell = {sid:sid, iid:it.id, i:i, n:n, correct:x === 1, q:q,
                      theta:est.theta[n], delta:est.delta[i], choice: resp ? resp.choice : null,
                      p: logistic(est.theta[n] - est.delta[i])};
        cells.push(cell);
        perItem[i].q[q]++; perItem[i].n++; if (x === 1) perItem[i].right++;
        perStudent[n].q[q]++; perStudent[n].n++; if (x === 1) perStudent[n].right++;
        perStudent[n].cells.push(cell);
        if (q === 2){
          perItem[i].q2Students.push(sid);
          const c = cell.choice;
          if (c !== null && c !== undefined) perItem[i].distractors[c] = (perItem[i].distractors[c] || 0) + 1;
        }
        if (q === 1) perItem[i].q1Students.push(sid);
      });
    });
  }

  perItem.forEach(function(pi){
    pi.misRate = pi.n ? pi.q[2] / pi.n : 0;
    pi.pass = pi.n ? pi.right / pi.n : 0;
    let best = null, bestC = 0;
    Object.keys(pi.distractors).forEach(function(k){
      if (pi.distractors[k] > bestC){ bestC = pi.distractors[k]; best = parseInt(k, 10); }
    });
    pi.topDistractor = best; pi.topDistractorN = bestC;
    pi.misCode = (best !== null && pi.item.why) ? (pi.item.why[best] || null) : null;
  });

  const thr = ((state.settings && state.settings.misThreshold) || 15) / 100;
  const flagged = perItem.filter(function(p){ return p.misRate >= thr && p.q[2] > 0; })
                         .sort(function(a, b){ return b.misRate - a.misRate; });

  const totals = {1:0,2:0,3:0,4:0};
  cells.forEach(function(c){ totals[c.q]++; });

  return {
    assignment: asg, items: items, roster: roster, done: done, ready: ready, minN: minN,
    est: est, cells: cells, perItem: perItem, perStudent: perStudent,
    flagged: flagged, totals: totals,
    meanTheta: est ? mean(est.theta) : null,
    meanDelta: est ? mean(est.delta) : null
  };
}

function mean(a){ const v = a.filter(function(x){ return typeof x === 'number' && isFinite(x); });
  return v.length ? v.reduce(function(s, x){ return s + x; }, 0) / v.length : 0; }
function sd(a){ const v = a.filter(function(x){ return typeof x === 'number' && isFinite(x); });
  if (v.length < 2) return 0; const m = mean(v);
  return Math.sqrt(v.reduce(function(s, x){ return s + (x - m) * (x - m); }, 0) / (v.length - 1)); }

/* ===== src/50-kb.js ===== */
/* ==========================================================================
   50-kb.js — 知識建構模型（Knowledge Forum 式）＋ 資料存取 ＋ 橋接
   橋接 = 本系統的核心：把 KIDMAP 第二象限（迷思）轉為社群的真實問題。
   ========================================================================== */

const STORE_KEY = 'kidforum.state.v1';
let state = null;

/* 代為檢視期間的落地一律擋在這裡，不再倚賴逐個呼叫點的 if。
   逐點守門補了六處，第 2 輪還是漏了 aalSay，下一個新增的寫入點還會再漏。
   守門下沉之後，逐點的 isImpersonating() 變成第二道保險而不是唯一防線。
   唯一的例外是 state.ui 本身的變更（切換身分、結束檢視），
   由 99-app.js 在呼叫前後掀開 _allowUiWrite。 */
/* --- 分頁之間的覆寫 ---
   save() 把整個 state 序列化寫出去，所以兩個分頁就是「最後寫的贏」：
   老師在 A 分頁批改非選、B 分頁開著儀表板，B 的任何一次寫入
   都會把剛打好的分數整批蓋掉，而且沒有任何提示。
   做法是每次寫出都帶上版次與分頁識別；別的分頁寫了就同步過來並說一聲。
   （這不是合併——同一秒改同一筆仍以後寫者為準；
     要守住的是「不要無聲地掉東西」。） */
const TAB_ID = 'tab-' + Math.random().toString(36).slice(2, 10) + '-' + Date.now().toString(36);
const REV_KEY = STORE_KEY + ':rev';
let STATE_REV = 0;

/* 版次要跨分頁單調遞增，所以取自磁碟而不是自己的計數器
   （兩個分頁各自 ++ 會撞號）。另存一支小鍵，免得每次寫入都要
   把整份 state 反序列化回來讀一個數字。 */
function nextRev(){
  let disk = 0;
  try { disk = parseInt(localStorage.getItem(REV_KEY) || '0', 10) || 0; } catch (e) {}
  STATE_REV = Math.max(disk, STATE_REV) + 1;
  try { localStorage.setItem(REV_KEY, String(STATE_REV)); } catch (e) {}
  return STATE_REV;
}

function adoptForeignState(next){
  if (!next || typeof next !== 'object') return;
  STATE_REV = next.rev || 0;
  const hash = location.hash;
  state = next;
  try {
    if (typeof renderShell === 'function') renderShell();
    if (typeof render === 'function'){ location.hash = hash; render(); }
    if (typeof toast === 'function') toast('另一個分頁更新了資料，這一頁已經同步。');
  } catch (e) { /* 還沒開始渲染就收到事件：資料已換好，等首次 render 即可 */ }
}

if (typeof window !== 'undefined' && window.addEventListener){
  window.addEventListener('storage', function(e){
    if (e.key !== STORE_KEY || !e.newValue) return;
    let next = null;
    try { next = JSON.parse(e.newValue); } catch (err) { return; }
    if (!next || next.writer === TAB_ID) return;      // 自己寫的不用理
    if ((next.rev || 0) <= STATE_REV) return;         // 不是更新的版本
    /* 代為檢視中不要被外部狀態拉走身分——那會讓老師莫名其妙跳出檢視 */
    if (isImpersonating()){
      if (typeof console !== 'undefined' && console.warn)
        console.warn('[KAIROS] 代為檢視期間收到另一個分頁的更新，暫不同步。');
      return;
    }
    adoptForeignState(next);
  });
}

function save(){
  if (isImpersonating() && !save._allowUiWrite){
    if (typeof console !== 'undefined' && console.warn)
      console.warn('[KAIROS] 代為檢視期間的落地被擋下', new Error().stack);
    return;
  }
  /* 版次要在序列化之前掛上去，兩個分支寫出的物件才都帶得到 */
  state.rev = nextRev();
  state.writer = TAB_ID;
  try {
    /* 代為檢視是一個「模式」，不是身分變更：模式本身不能落地。
       否則老師關掉分頁、隔天開機還是學生身分，而且不知道怎麼回來。 */
    const imp = state.ui && state.ui.impersonate;
    if (imp){
      const clone = Object.assign({}, state, {ui: Object.assign({}, state.ui, {
        role: imp.realRole, impersonate: undefined})});
      localStorage.setItem(STORE_KEY, JSON.stringify(clone));
      return;
    }
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch (e) { /* 無痕模式等情況：僅存在記憶體 */ }
}
/* 只給「進入／離開代為檢視」這一種變更用——而且只寫 ui 這一個切片。
   舊版是把守門整個掀開再 save() 整份 state：代為檢視期間任何漏了守門的
   寫入都會累積在記憶體裡，然後被〈結束檢視〉一次帶出去永久落地。
   實測過一次真實傷害：老師代為檢視時按〈再走一次（示範）〉，
   結束檢視之後那位學生的 16 筆後測作答就永久消失了。
   改成只覆蓋 prev.ui 之後，往後任何新增的寫入點忘了守門，
   也不可能再靠離開把破壞帶出來。 */
function saveUiOnly(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw){ save._allowUiWrite = true; try { save(); } finally { save._allowUiWrite = false; } return; }
    const prev = JSON.parse(raw);
    const imp = state.ui && state.ui.impersonate;
    prev.ui = Object.assign({}, state.ui, imp ? {role: imp.realRole, impersonate: undefined} : {});
    /* 這也是一次寫出，版次一樣要往前推——否則別的分頁看到 rev 沒變
       就不會同步，而磁碟上的 ui 已經換人了。 */
    prev.rev = nextRev();
    prev.writer = TAB_ID;
    localStorage.setItem(STORE_KEY, JSON.stringify(prev));
  } catch (e) { /* 無痕模式等情況：僅存在記憶體 */ }
}
/* 老師正在以某位學生的視角檢視。此時一律唯讀——
   他的閱讀、貼文、註記都不可以記到學生名下（reads 是 KB 指數的原料）。 */
function isImpersonating(){ return !!(state.ui && state.ui.impersonate); }
/* 作答紀錄與題本是否還對得起來。
   responses 存的是選項「索引」，題本一旦重排選項，舊索引就指到別的選項；
   correct 旗標卻還是舊的，於是 choice === answer 的紀錄可以是「答錯」。
   這種資料不會拋錯，只會讓 KIDMAP 的第二象限、頂誘答、失誤碼、AI 的探究提示
   全部靜靜地對到錯的地方。版號忘了加的時候，這一關是最後的攔截。 */
function responsesMatchKey(s){
  if (!s || !Array.isArray(s.responses)) return true;
  return !s.responses.some(function(r){
    if (r.choice === null || r.choice === undefined || r.correct === null) return false;
    const it = getItem(r.iid);
    if (!it || it.type !== 'mc') return false;
    return r.correct !== (r.choice === it.answer);
  });
}
function loadState(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw){
      const s = JSON.parse(raw);
      // 版號不符（示範資料改版）→ 重新產生
      if (s && s.version === STATE_VERSION){
        if (responsesMatchKey(s)){
          /* 接上磁碟上的版次，這個分頁之後寫出的版次才會比它大 */
          STATE_REV = s.rev || 0;
          return s;
        }
        console.warn('[KAIROS] 作答紀錄與現行題本的答案鍵不一致，已重新產生示範資料。');
      }
    }
  } catch (e) { /* 讀不到就重新產生示範資料 */ }
  return buildSeedState();
}
function resetState(){
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  state = buildSeedState(); save();
}

/* --- 查詢輔助 --- */
function getItem(id){ return ITEMS.find(function(i){ return i.id === id; }); }

/* 顯示用的題號＝這一題在這份派題裡的位置。
   題目改成依文本分組之後（見 30-data.js 的 allIds），ITEMS 宣告順序裡的
   it.no 就不再等於孩子看到的順序：R10–R14 的 it.no 是 10–14、位置是 11–15；
   兩題非選的 it.no 各自從 1 起算，位置卻是 10 與 16。
   作答畫面用的是位置（AAL.idx + 1），而診斷頁、知識建構空間、教師端與
   AI 提示詞用的是 it.no——於是從第 10 題開始整整差一號。前 9 題剛好對得上，
   所以不容易被發現。
   最痛的一條是「可惜的題目：第 12 題 → 全班正在討論這題」：那是診斷頁
   唯一要孩子採取的行動，而它會把他送去他當時看到的第 13 題；老師在課堂上
   說「我們看第 12 題」時講的也不是孩子螢幕上那一題。
   診斷 → 回去重讀 → 白板討論這條迴圈正是這個平台的主軸，題號在中間斷掉。
   一律以「位置」為顯示的單一真相來源；it.no 只留給題庫維護畫面。 */
function displayNo(aid, iid){
  const a = getAssignment(aid);
  if (a){
    const i = a.itemIds.indexOf(iid);
    if (i >= 0) return i + 1;
  }
  const it = getItem(iid);
  return it ? it.no : '?';
}
/* 「第 N 題」；非選題加註記，不要再用它自己那套從 1 起算的編號 */
function itemLabel(aid, iid){
  const it = getItem(iid);
  return '第 ' + displayNo(aid, iid) + ' 題' + (it && it.type === 'cr' ? '（非選）' : '');
}
function getUnit(id){ return UNITS.find(function(u){ return u.id === id; }); }
/* unitName() 定義在 30-data.js（本平台的「單元」＝「文本」）。
   這裡曾有一份讀 u.name 的舊定義，會蓋掉正確版本並印出 undefined，已移除。 */
function getUser(id){ return state.users.find(function(u){ return u.id === id; }); }
function userName(id){ const u = getUser(id); return u ? u.name : id; }
function getView(id){ return state.views.find(function(v){ return v.id === id; }); }
function getNote(id){ return state.notes.find(function(n){ return n.id === id; }); }
function getAssignment(id){ return state.assignments.find(function(a){ return a.id === id; }); }
function currentUser(){ return getUser(state.ui.role) || state.users[0]; }
function getClass(id){ return state.classes.find(function(c){ return c.id === id; }); }
/* 知識建構空間的示範班級（貼文只種在這一班） */
function kbClass(){ return getClass((state.settings && state.settings.kbClassId) || 'c-1') || state.classes[0]; }
/* 目前教師視角所看的班級 */
function currentClass(){
  const me = currentUser();
  if (me.role === 'student'){ const k = classOfStudent(me.id); if (k) return k; }
  return getClass(state.ui.classId) || state.classes[0];
}
/* 一份派題涵蓋的班級與名單（支援跨班共同校準） */
function assignmentClasses(a){
  if (!a) return [];
  const ids = a.classIds || (a.classId ? [a.classId] : []);
  return ids.map(getClass).filter(Boolean);
}
function assignmentRoster(a){
  const out = [];
  assignmentClasses(a).forEach(function(c){
    c.studentIds.forEach(function(s){ if (out.indexOf(s) < 0) out.push(s); });
  });
  return out;
}
function isTeacher(){ const u = currentUser(); return u.role === 'teacher' || u.role === 'admin'; }
function isResearcher(){ return currentUser().role === 'admin'; }
/* 學生走進教師頁時的統一擋板。文案是給十歲孩子看的，不解釋權限模型。 */
function studentBlocked(){
  return '<div class="empty"><h3>這一頁是老師看的</h3>' +
    '<p style="max-width:60ch">你的作業、討論與學習軌跡都在導覽選單裡。</p>' +
    '<a class="btn" href="#/student">回我的作業</a></div>';
}

/* 指派給這位學生、但還沒交卷的作業 */
function pendingAssignments(sid){
  return state.assignments.filter(function(a){
    return assignmentRoster(a).indexOf(sid) >= 0 &&
           !state.submissions.some(function(s){ return s.aid === a.id && s.sid === sid; });
  });
}
/* 知識建構空間在「測驗之後」才對學生開放。
   理由是系統迴圈的次序：先作答 → 才有 KIDMAP 診斷 → 才有值得討論的共同問題。
   若在作答前就看得到別人的討論，等於先看到答案，前測也就不成立了。
   教師與研究者不受此限（他們要在課前備課、課後分析）。 */
/* 注意：不分相位是刻意的——**任何**未交作業都鎖。
   因此同時派出前測與後測，會讓共構空間從前測交卷起一直鎖到後測交卷，
   等於把中間的共構階段整段關掉。派題時前後測要分兩次派。 */
function kbLocked(u){
  const me = u || currentUser();
  if (me.role !== 'student') return false;
  return pendingAssignments(me.id).length > 0;
}
function scaffold(id){ return SCAFFOLDS.find(function(s){ return s.id === id; }); }
function scaffoldLabel(id){ const s = scaffold(id); return s ? s.label : ''; }

function notesOfView(vid){ return state.notes.filter(function(n){ return n.viewId === vid; }); }
/* 某一群學生所屬班級的貼文。分析端的分子與分母都要用同一個範圍——
   分母用全站、分子只算本班，閱讀率會被系統性壓低。 */
function notesOfClass(ids){
  const cid = ids && ids.length ? (classOfStudent(ids[0]) || {}).id : null;
  const ok = {};
  state.views.forEach(function(v){ if ((v.classId || kbClass().id) === cid) ok[v.id] = 1; });
  return state.notes.filter(function(n){ return ok[n.viewId]; });
}
function childrenOf(nid){ return state.notes.filter(function(n){ return n.buildOn === nid; }); }
function noteText(n){
  return (n.segs || []).map(function(s){ return s.text; }).join('\n');
}
function noteFullText(n){
  return n.title + '\n' + noteText(n);
}
function noteAuthors(n){ return (n.authorIds || []).map(userName).join('、'); }
function uid(p){ return p + '-' + Math.random().toString(36).slice(2, 9); }

/* 一則貼文所屬的「想法串」（idea thread）：往上追到根 */
function threadRootOf(n){
  let cur = n, guard = 0;
  while (cur && cur.buildOn && guard++ < 50){ const p = getNote(cur.buildOn); if (!p) break; cur = p; }
  return cur;
}
function threadOf(rootId){
  const out = [];
  (function walk(id, depth){
    const n = getNote(id); if (!n) return;
    out.push({note:n, depth:depth});
    childrenOf(id).sort(function(a, b){ return a.createdAt - b.createdAt; })
      .forEach(function(c){ walk(c.id, depth + 1); });
  })(rootId, 0);
  return out;
}

/* --- 寫入操作 --- */
function createNote(o){
  if (isImpersonating()) return null;
  const n = {
    id: uid('n'), viewId: o.viewId, title: o.title || '（未命名）',
    segs: o.segs || [],
    /* 空陣列是 truthy，所以 `o.authorIds || [me]` 永遠不會補回本人——
       署名會被靜默清空，而貼文數、延伸數、KB 指數都掛在 authorIds 上。 */
    authorIds: (o.authorIds && o.authorIds.length) ? o.authorIds : [currentUser().id],
    keywords: o.keywords || [], createdAt: Date.now(), editedAt: null,
    x: o.x != null ? o.x : 60 + Math.round(Math.random() * 400),
    y: o.y != null ? o.y : 60 + Math.round(Math.random() * 300),
    kind: o.kind || 'note', buildOn: o.buildOn || null, contains: o.contains || [],
    refs: o.refs || [], itemRef: o.itemRef || null, reads: [], annotations: []
  };
  state.notes.push(n); save(); return n;
}
/* 修訂次數在知識建構理論裡是想法精進（idea improvement）的指標，本研究把它
   算進 KB 指數。只有真的改到內容才算一次修訂——按了更新但什麼都沒動不算，
   拖曳版面更不算（走 moveNote）。 */
const NOTE_TOUCH_KEYS = ['title','segs','keywords','authorIds','refs','buildOn','contains','itemRef'];
function updateNote(id, patch){
  if (isImpersonating()) return null;
  const n = getNote(id); if (!n) return null;
  const changed = Object.keys(patch).some(function(k){
    return NOTE_TOUCH_KEYS.indexOf(k) >= 0 && JSON.stringify(n[k]) !== JSON.stringify(patch[k]);
  });
  Object.keys(patch).forEach(function(k){ n[k] = patch[k]; });
  if (changed){
    n.editedAt = Date.now();
    n.revisions = (n.revisions || 0) + 1;
  }
  save(); return n;
}
/* 把畫布整理得整齊一點，不是想法精進。 */
function moveNote(id, x, y){
  if (isImpersonating()) return false;
  const n = getNote(id); if (!n) return false;
  n.x = x; n.y = y; save(); return true;
}
/* 回傳成功與否。呼叫端要依它決定 toast，否則會出現
   「確認框說無法復原、toast 說已刪除、貼文還在」這種三方矛盾。 */
function deleteNote(id){
  if (isImpersonating()) return false;
  state.notes = state.notes.filter(function(n){ return n.id !== id; });
  state.notes.forEach(function(n){
    if (n.buildOn === id) n.buildOn = null;
    n.contains = (n.contains || []).filter(function(c){ return c !== id; });
    n.refs = (n.refs || []).filter(function(r){ return r.noteId !== id; });
  });
  save(); return true;
}
function markRead(id){
  if (isImpersonating()) return;   // 代為檢視：不寫進學生的閱讀紀錄
  const n = getNote(id); const me = currentUser().id;
  if (n && n.authorIds.indexOf(me) < 0 && (n.reads || []).indexOf(me) < 0){ n.reads.push(me); save(); }
}
function isUnread(n){
  const me = currentUser().id;
  return n.authorIds.indexOf(me) < 0 && (n.reads || []).indexOf(me) < 0;
}
/* 回傳是否真的寫成功——呼叫端要據此決定 toast 說什麼，
   否則會出現「已加上註記」但註記區是空的。 */
function addAnnotation(id, text){
  if (isImpersonating()) return false;
  const n = getNote(id); if (!n || !text.trim()) return false;
  n.annotations = n.annotations || [];
  n.annotations.push({id: uid('an'), authorId: currentUser().id, text: text.trim(), at: Date.now()});
  save();
  return true;
}
function createView(o){
  /* 視圖一定屬於某一個班。條件是在班級層次操弄的，四個班共用一塊白板
     等於讓對照組讀得到 tutor 班的全部討論——教科書式的擴散污染。 */
  const v = {id: uid('v'), title: o.title, desc: o.desc || '', createdAt: Date.now(),
             classId: o.classId || (currentClass() || kbClass()).id,
             origin: o.origin || null, links: o.links || []};
  state.views.push(v); save(); return v;
}

/* 目前這位使用者看得到哪些視圖。
   沒有 classId 的舊視圖視為示範班（相容改版前存下來的資料）。
   教師與研究者看得到自己選定班級的；學生只看得到自己班的。 */
function viewsForViewer(){
  const me = currentUser();
  const k = isTeacher() ? currentClass() : classOfStudent(me.id);
  const kid = k ? k.id : null;
  return state.views.filter(function(v){
    return (v.classId || kbClass().id) === kid;
  });
}
function viewVisible(vid){
  return viewsForViewer().some(function(v){ return v.id === vid; });
}
/* 這位使用者看得到的貼文（用於未讀數與搜尋，兩者都不可以跨班） */
function notesForViewer(){
  const ok = {};
  viewsForViewer().forEach(function(v){ ok[v.id] = 1; });
  return state.notes.filter(function(n){ return ok[n.viewId]; });
}

/* ==========================================================================
   橋接：由 KIDMAP 迷思題產生知識建構視圖
   —— 這是兩個平台真正接起來的地方 ——
   ========================================================================== */
/* 這個班有沒有為這一題開過共構視圖。
   原本掃全站：c-1 先為第 5 題開了視圖，c-2 的老師就看到「進入共構視圖 →」，
   點下去被 viewVisible() 擋掉——而且〈開啟共構視圖〉的按鈕永遠不出現，
   他再也沒辦法為自己班開這一題。那不是死連結，是功能被別班鎖住。 */
function bridgeExists(aid, iid){
  return viewsForViewer().find(function(v){
    return v.origin && v.origin.aid === aid && v.origin.iid === iid;
  });
}

function buildInquiryPrompt(pi, diag, klass){
  const it = pi.item;
  const dis = pi.topDistractor != null ? it.options[pi.topDistractor] : null;
  const mis = pi.misCode ? MISCONCEPTIONS.find(function(m){ return m.id === pi.misCode; }) : null;
  /* 人數必須跟名單同一個範圍。原本 n2/n1 是四班全樣本（第 13 題 21 與 16），
     而名單已依班過濾只印 3 個名字——21+16=37 大於全班 24 人，孩子自己數得出矛盾。 */
  const inClass = {};
  ((klass || currentClass() || kbClass()).studentIds || []).forEach(function(s){ inClass[s] = 1; });
  const only = function(arr){ return (arr || []).filter(function(s){ return inClass[s]; }).length; };
  const lines = [];
  /* 這段字是貼給全班讀的貼文本文，不是教師報表。
     兩個必須避免的東西：
     (1) 寫死「前測」——函式明明收到了 diag，卻在後測的橋接上印「前測」；
     (2) 「落在迷思象限／本來應該答得出來」——那是當著全班的面
         對特定幾個孩子貼缺陷標籤，跟這個平台自己寫的知識建構原則相反。 */
  const n2 = only(pi.q2Students), n1 = only(pi.q1Students);
  /* 這一題本班沒有人讀法不同時，整句不要輸出——原本只有 n1 有守門。 */
  if (n2){
    lines.push('「' + diag.assignment.title + '」' + itemLabel(diag.assignment.id, it.id) + '（' + textTitle(it.unit) + '）有 ' +
      n2 + ' 位同學的讀法跟答案不一樣。我們一起看看，是哪一句話讓大家想得不同。');
    /* topDistractorN 同樣是全樣本，一起改成本班計數——
       只改兩個數字會留下第三個。 */
    if (dis){
      const dn = (pi.q2Students || []).filter(function(s){
        if (!inClass[s]) return false;
        const r = state.responses.find(function(x){
          return x.aid === diag.assignment.id && x.sid === s && x.iid === it.id; });
        return r && r.choice === pi.topDistractor;
      }).length;
      if (dn) lines.push('這些同學裡最多人選的是「' + dis + '」（' + dn + ' 人）。');
    }
    if (mis) lines.push('這常常跟「' + mis.name + '」有關：' + mis.desc);
  } else {
    lines.push('「' + diag.assignment.title + '」' + itemLabel(diag.assignment.id, it.id) + '（' + textTitle(it.unit) +
      '）值得我們一起再看一次。');
  }
  if (n1) lines.push('另外有 ' + n1 + ' 位同學這一題讀得很穩，請他們先把自己的想法貼出來，讓大家看得到不同的思路。');
  lines.push('請大家不要只寫答案。先說你原本怎麼想，再說你現在覺得哪裡需要修正，並且盡量舉出一個能檢驗的例子。');
  return lines.join('\n');
}

function createBridgeView(diag, pi){
  const it = pi.item;
  const exist = bridgeExists(diag.assignment.id, it.id);
  if (exist) return exist;
  const mis = pi.misCode ? MISCONCEPTIONS.find(function(m){ return m.id === pi.misCode; }) : null;
  /* 視圖屬於老師目前帶的那一班，名單也只能是那一班的。
     診斷是四班全樣本（共用同一次 Rasch 校準），但貼進單一班級白板的
     點名清單如果橫跨四個班兩所學校，孩子會被一群他不認識的名字包圍，
     而且那也是跨條件曝光。 */
  const k = currentClass() || kbClass();
  const inClass = {};
  (k.studentIds || []).forEach(function(sid){ inClass[sid] = 1; });
  const q1 = (pi.q1Students || []).filter(function(sid){ return inClass[sid]; });

  // 視圖標題刻意寫成一個「問題」而不是一個「主題」——知識建構的起點是問題。
  const v = createView({
    title: mis ? '「' + mis.name + '」什麼時候會出錯？' : (itemLabel(diag.assignment.id, it.id) + '：我們卡在哪裡？'),
    /* desc 是存下來的資料，學生在視圖列表與畫布抬頭都會直接讀到，
       isTeacher() 分岔救不了。教師需要的溯源資訊已經結構化存在 v.origin，
       顯示端要講 KIDMAP 就從 origin 現算。 */
    desc: '從「' + diag.assignment.title + '」' + itemLabel(diag.assignment.id, it.id) + '長出來的共同問題。',
    classId: k.id,
    origin: {aid: diag.assignment.id, iid: it.id, mis: pi.misCode || null}
  });
  createNote({
    viewId: v.id, kind: 'problem',
    title: '【全班共同問題】' + shortStem(it.stem),
    authorIds: [k.teacherId],
    keywords: it.tags || [],
    itemRef: {aid: diag.assignment.id, iid: it.id},
    segs: [{s: 's2', text: buildInquiryPrompt(pi, diag, k)}],
    x: 60, y: 40
  });
  // 在這一題讀得比較穩的同學，請他們先說自己怎麼想
  if (q1.length){
    createNote({
      viewId: v.id, kind: 'note',
      title: '這一題的知識資源人',
      authorIds: [k.teacherId],
      keywords: ['對稱知識進展'],
      segs: [{s: 's3', text: '這一題讀得很穩的同學：' + q1.map(userName).join('、') +
        '。請你們先貼出「我當時是怎麼想的」，不要直接寫正確答案，讓大家有東西可以比較。'}],
      x: 330, y: 40
    });
  }
  save();
  return v;
}

function shortStem(s){
  const t = String(s).replace(/\s+/g, ' ').trim();
  return t.length > 22 ? t.slice(0, 22) + '…' : t;
}

/* --- 搜尋（對應 Knowledge Forum 的 Title / Scaffold / Content / Author / Date） --- */
function searchNotes(field, q){
  const s = String(q || '').trim().toLowerCase();
  if (!s) return [];
  /* 搜尋也不可以跨班——列表過濾了、搜尋沒濾，那就是一條後門。 */
  return notesForViewer().filter(function(n){
    if (field === 'title')   return n.title.toLowerCase().indexOf(s) >= 0;
    if (field === 'content') return noteText(n).toLowerCase().indexOf(s) >= 0;
    if (field === 'author')  return (n.authorIds || []).some(function(a){ return userName(a).toLowerCase().indexOf(s) >= 0; });
    if (field === 'scaffold')return (n.segs || []).some(function(g){ return scaffoldLabel(g.s).toLowerCase().indexOf(s) >= 0; });
    if (field === 'keyword') return (n.keywords || []).some(function(k){ return k.toLowerCase().indexOf(s) >= 0; });
    if (field === 'date')    return fmtDate(n.createdAt).indexOf(s) >= 0;
    return false;
  });
}

/* --- 格式化 --- */
function fmtDate(ts){
  const d = new Date(ts);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function fmtDateTime(ts){
  const d = new Date(ts);
  return fmtDate(ts) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function fx(v, d){ return (v === null || v === undefined || !isFinite(v)) ? '—' : Number(v).toFixed(d === undefined ? 2 : d); }
function pct(v){ return (v === null || v === undefined || !isFinite(v)) ? '—' : Math.round(v * 100) + '%'; }
function esc(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function nl2br(s){ return esc(s).replace(/\n/g, '<br>'); }

/* ===== src/60-analytics.js ===== */
/* ==========================================================================
   60-analytics.js — 論述分析工具箱
   對應 Knowledge Forum 的 Analytic Toolkit：貢獻、延伸、閱讀、支架、詞彙、
   社會網絡；再加上本系統新增的「認識論層次」與「雙軌評量」。
   全部離線可算，不需要任何外部模型。
   ========================================================================== */

/* --- 單則貼文的認識論層次（1–4） --- */
function cueHits(text, list){
  let n = 0;
  list.forEach(function(c){ if (text.indexOf(c) >= 0) n++; });
  return n;
}
function epistemicLevel(n){
  const t = noteFullText(n);
  const causal = cueHits(t, EPISTEMIC_CUES.causal);
  const cond = cueHits(t, EPISTEMIC_CUES.conditional);
  const counter = cueHits(t, EPISTEMIC_CUES.counter);
  const evid = cueHits(t, EPISTEMIC_CUES.evidence);
  const rev = cueHits(t, EPISTEMIC_CUES.revision);
  const scaf = (n.segs || []).map(function(s){ return s.s; });
  const hasSynth = scaf.indexOf('s5') >= 0 || scaf.indexOf('s6') >= 0 || n.kind === 'rise';
  const hasChallenge = scaf.indexOf('s4') >= 0;
  const terms = domainTermsIn(t).length;

  let lv = 1;
  if (causal + cond > 0 || t.length > 60) lv = 2;
  if ((counter > 0 || evid > 0 || hasChallenge) && causal + cond > 0) lv = 3;
  if (hasSynth && (rev > 0 || (n.refs || []).length || (n.contains || []).length || terms >= 3)) lv = 4;
  return lv;
}
function domainTermsIn(t){
  return DOMAIN_TERMS.filter(function(w){ return t.indexOf(w) >= 0; });
}

const EPI_LABEL = {1:'陳述主張', 2:'提出理由', 3:'援引證據或反例', 4:'綜整並改進理論'};
/* 學生看到的版本：不可排序、不帶級數。把每個孩子的想法在社群空間裡
   標上「第 N 級」，等於當著全班替他的想法排名。 */
const EPI_LABEL_STUDENT = {1:'提出了看法', 2:'說了理由', 3:'找了證據', 4:'把大家的想法合起來'};
function epiLabelFor(n){
  const lv = epistemicLevel(n);
  return isTeacher() ? ('第 ' + lv + ' 級 · ' + EPI_LABEL[lv]) : EPI_LABEL_STUDENT[lv];
}

/* --- 每位學生的論述指標 --- */
/* ids 省略時預設是知識建構示範班——教師端的雙軌儀表板與 dualTrack()
   都靠這個範圍，而 #/dash 畫面上寫著「這一頁只涵蓋示範班」，
   改預設值會讓那句宣稱變成假的，象限中位數也會跨四個條件混算。
   要看別的母體請由呼叫端傳進來（例如學生看自己班）。 */
function discourseStats(ids){
  ids = ids || kbClass().studentIds;
  const byId = {};
  ids.forEach(function(sid){
    byId[sid] = {sid:sid, notes:0, buildMade:0, buildGot:0, rise:0, refs:0, ann:0,
                 reads:0, chars:0, scaffolds:{}, terms:{}, epiSum:0, epiN:0,
                 revisions:0, keywords:0, threads:{}};
  });
  /* 分母必須與 ids 同範圍。用全站 76 則當分母、分子只算本班的閱讀，
     每個人的閱讀率會被系統性壓到約 1/3.6——而 readRate 佔 kbi 權重 10%，
     那是依變項內部的跨範圍污染。 */
  const scoped = notesOfClass(ids);
  const total = scoped.length;

  scoped.forEach(function(n){
    const lv = epistemicLevel(n);
    const t = noteFullText(n);
    const terms = domainTermsIn(t);
    (n.authorIds || []).forEach(function(a){
      const s = byId[a]; if (!s) return;
      s.notes++;
      s.chars += t.length;
      s.epiSum += lv; s.epiN++;
      s.revisions += n.revisions || 0;
      s.keywords += (n.keywords || []).length;
      s.refs += (n.refs || []).length;
      if (n.kind === 'rise') s.rise++;
      (n.segs || []).forEach(function(g){ s.scaffolds[g.s] = (s.scaffolds[g.s] || 0) + 1; });
      terms.forEach(function(w){ s.terms[w] = (s.terms[w] || 0) + 1; });
      const root = threadRootOf(n); if (root) s.threads[root.id] = true;
      if (n.buildOn){
        s.buildMade++;
        const p = getNote(n.buildOn);
        if (p) (p.authorIds || []).forEach(function(pa){ if (byId[pa] && pa !== a) byId[pa].buildGot++; });
      }
    });
    (n.reads || []).forEach(function(r){ if (byId[r]) byId[r].reads++; });
    (n.annotations || []).forEach(function(an){ if (byId[an.authorId]) byId[an.authorId].ann++; });
  });

  const arr = ids.map(function(sid){
    const s = byId[sid];
    s.epi = s.epiN ? s.epiSum / s.epiN : 0;
    s.scaffoldKinds = Object.keys(s.scaffolds).length;
    s.termCount = Object.keys(s.terms).length;
    s.threadCount = Object.keys(s.threads).length;
    s.readRate = total ? s.reads / Math.max(1, total - s.notes) : 0;
    return s;
  });

  // 以班級最大值正規化後加權合成 KB 指數
  function mx(k){ return Math.max.apply(null, arr.map(function(s){ return s[k]; }).concat([1])); }
  const M = {notes:mx('notes'), buildMade:mx('buildMade'), buildGot:mx('buildGot'),
             termCount:mx('termCount'), scaffoldKinds:6, epi:4};
  arr.forEach(function(s){
    s.kbi = Math.round(100 * (
      0.15 * (s.notes / M.notes) +
      0.20 * (s.buildMade / M.buildMade) +
      0.15 * (s.buildGot / M.buildGot) +
      0.10 * Math.min(1, s.readRate) +
      0.10 * (s.scaffoldKinds / M.scaffoldKinds) +
      0.20 * (s.epi / M.epi) +
      0.10 * (s.termCount / M.termCount)
    ));
  });
  return arr;
}

/* --- 社會網絡：誰延伸誰的想法 --- */
function snaGraph(){
  const klass = kbClass();
  const ids = klass.studentIds.slice();
  const idx = {}; ids.forEach(function(id, i){ idx[id] = i; });
  const edges = {};
  /* 只看本班的貼文——跨班的 buildOn 不該進這張網 */
  notesOfClass(ids).forEach(function(n){
    if (!n.buildOn) return;
    const p = getNote(n.buildOn); if (!p) return;
    (n.authorIds || []).forEach(function(a){
      (p.authorIds || []).forEach(function(b){
        if (idx[a] === undefined || idx[b] === undefined || a === b) return;
        const k = a + '>' + b;
        edges[k] = (edges[k] || 0) + 1;
      });
    });
  });
  const list = Object.keys(edges).map(function(k){
    const p = k.split('>'); return {from:p[0], to:p[1], w:edges[k]};
  });
  const deg = {}; ids.forEach(function(id){ deg[id] = {out:0, in:0}; });
  list.forEach(function(e){ deg[e.from].out += e.w; deg[e.to].in += e.w; });
  const n = ids.length;
  const density = n > 1 ? list.length / (n * (n - 1)) : 0;
  let recip = 0;
  list.forEach(function(e){ if (edges[e.to + '>' + e.from]) recip++; });
  return {ids:ids, edges:list, deg:deg, density:density,
          reciprocity: list.length ? recip / list.length : 0,
          active: ids.filter(function(id){ return deg[id].in + deg[id].out > 0; }).length};
}

/* --- 詞彙成長：領域詞彙首次出現的累積曲線 --- */
function vocabGrowth(notes){
  const ns = (notes || notesOfClass(kbClass().studentIds)).slice()
    .sort(function(a, b){ return a.createdAt - b.createdAt; });
  const seen = {}; const pts = [];
  ns.forEach(function(n){
    domainTermsIn(noteFullText(n)).forEach(function(w){ seen[w] = true; });
    pts.push({t:n.createdAt, v:Object.keys(seen).length, note:n.id});
  });
  return {points:pts, terms:Object.keys(seen)};
}

/* --- 想法串的改進軌跡 --- */
function ideaImprovement(rootId){
  const seq = threadOf(rootId);
  let seen = {}; const steps = [];
  seq.forEach(function(x){
    const t = noteFullText(x.note);
    const terms = domainTermsIn(t);
    const fresh = terms.filter(function(w){ return !seen[w]; });
    fresh.forEach(function(w){ seen[w] = true; });
    steps.push({note:x.note, depth:x.depth, level:epistemicLevel(x.note),
                newTerms:fresh, scaffolds:(x.note.segs || []).map(function(s){ return s.s; })});
  });
  const levels = steps.map(function(s){ return s.level; });
  const improved = levels.length > 1 && Math.max.apply(null, levels.slice(1)) > levels[0];
  const hasChallenge = steps.some(function(s){ return s.scaffolds.indexOf('s4') >= 0; });
  const hasBetter = steps.some(function(s){ return s.scaffolds.indexOf('s5') >= 0 || s.scaffolds.indexOf('s6') >= 0; });
  return {steps:steps, improved:improved, hasChallenge:hasChallenge, hasBetter:hasBetter,
          arc: hasChallenge && hasBetter ? '完整（提出→挑戰→改進）'
             : hasChallenge ? '已被挑戰，尚未提出' + scaffoldLabel('s5')
             : hasBetter ? '已綜整，但缺少被挑戰的環節'
             : '仍停留在提出階段',
          newTermTotal: Object.keys(seen).length};
}

/* --- 雙軌評量：能力進展 × 論述參與 --- */
function dualTrack(){
  const pre = diagnose(state, 'a-pre');
  const post = diagnose(state, 'a-post');
  const ds = discourseStats();
  const dsMap = {}; ds.forEach(function(s){ dsMap[s.sid] = s; });
  const thetaPre = {}, thetaPost = {}, sePre = {}, sePost = {};
  if (pre && pre.ready) pre.perStudent.forEach(function(p){ thetaPre[p.sid] = p.theta; sePre[p.sid] = p.se; });
  if (post && post.ready) post.perStudent.forEach(function(p){ thetaPost[p.sid] = p.theta; sePost[p.sid] = p.se; });

  const rows = kbClass().studentIds.map(function(sid){
    const a = thetaPre[sid], b = thetaPost[sid];
    const d = (a != null && b != null) ? b - a : null;
    const st = dsMap[sid] || {kbi:0};
    /* 儀表板自己寫著「Δθ 小於 2×SE 不應解讀為真的進步」，然後用 Δθ 決定
       四格分區、每一格再附一句處方——系統點名孩子要優先介入，用的正是
       它剛說不可信的統計量。SE 本來就在 perStudent 裡，只是沒帶進來。 */
    const sd = (sePre[sid] != null && sePost[sid] != null)
      ? Math.sqrt(sePre[sid] * sePre[sid] + sePost[sid] * sePost[sid]) : null;
    return {sid:sid, thetaPre:a, thetaPost:b, delta:d, kbi:st.kbi, stats:st,
            sePre:sePre[sid], sePost:sePost[sid], seDelta:sd,
            sig: (d != null && sd != null) ? Math.abs(d) >= 2 * sd : false,
            q2Pre: pre && pre.ready ? (pre.perStudent.find(function(p){ return p.sid === sid; }) || {q:{}}).q[2] || 0 : 0,
            q2Post: post && post.ready ? (post.perStudent.find(function(p){ return p.sid === sid; }) || {q:{}}).q[2] || 0 : 0};
  });
  const dmed = median(rows.map(function(r){ return r.delta; }).filter(function(x){ return x != null; }));
  const kmed = median(rows.map(function(r){ return r.kbi; }));
  rows.forEach(function(r){
    const hiD = r.delta != null && r.delta >= dmed;
    const hiK = r.kbi >= kmed;
    r.zone = hiD && hiK ? 'A' : (!hiD && hiK ? 'B' : (hiD && !hiK ? 'C' : 'D'));
  });
  return {rows:rows, pre:pre, post:post, dmed:dmed, kmed:kmed};
}
const DUAL_ZONE = {
  A:{name:'共構轉化', desc:'論述參與高、能力也明顯進步。討論確實轉成了理解。', cls:'q1'},
  B:{name:'論述未轉化', desc:'貼文很多，但後測沒有跟上。要檢查他是否只在附和，而沒有真的改寫自己的理論。', cls:'q2'},
  C:{name:'個別成長', desc:'能力進步了，但幾乎不參與討論。可邀請他把已經懂的說出來，成為班上的知識資源。', cls:'q4'},
  D:{name:'需要介入', desc:'兩軌都低。優先安排小組指派角色與具體任務。', cls:'q3'}
};

function median(a){
  const v = a.filter(function(x){ return typeof x === 'number' && isFinite(x); }).sort(function(x, y){ return x - y; });
  if (!v.length) return 0;
  const m = Math.floor(v.length / 2);
  return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
}

/* --- 社群層級摘要 --- */
function communitySummary(){
  /* 全部收在同一個班級範圍內。原本分子用 state.notes（四班 76 則），
     而頁首寫著「這一頁只涵蓋示範班」、隔壁 SNA 分頁對「延伸」給出 15——
     同一個儀表板對同一件事給兩個答案。 */
  const ids = kbClass().studentIds;
  const scoped = notesOfClass(ids);
  const ds = discourseStats(ids);
  const g = snaGraph();
  const vg = vocabGrowth(scoped);
  const roots = scoped.filter(function(n){ return !n.buildOn; });
  const withBuild = roots.filter(function(n){ return childrenOf(n.id).length > 0; });
  const rise = scoped.filter(function(n){ return n.kind === 'rise'; });
  const epi = scoped.map(epistemicLevel);
  return {
    notes: scoped.length,
    buildOns: scoped.filter(function(n){ return n.buildOn; }).length,
    riseAbove: rise.length,
    views: state.views.filter(function(v){ return (v.classId || kbClass().id) === kbClass().id; }).length,
    threads: roots.length,
    threadUptake: roots.length ? withBuild.length / roots.length : 0,
    contributors: ds.filter(function(s){ return s.notes > 0; }).length,
    roster: kbClass().studentIds.length,
    density: g.density,
    reciprocity: g.reciprocity,
    vocab: vg.terms.length,
    epiMean: mean(epi),
    epiDist: [1,2,3,4].map(function(l){ return epi.filter(function(x){ return x === l; }).length; }),
    kbiMean: mean(ds.map(function(s){ return s.kbi; }))
  };
}

/* ===== src/62-process.js ===== */
/* ==========================================================================
   62-process.js — 歷程層次分析
   ‧ 延宕序列分析（Lag Sequential Analysis, Bakeman & Gottman 調整殘差）
   ‧ 認知網絡分析（Epistemic Network Analysis：共現累積 → 球面正規化 → SVD 投影）
   ‧ 情感軌跡（詞典法）
   ========================================================================== */

/* ==========================================================================
   延宕序列分析
   ========================================================================== */
function lsa(opts){
  opts = opts || {};
  const codes = BEHAVIOR_ORDER;
  const idx = {}; codes.forEach(function(c, i){ idx[c] = i; });
  const n = codes.length;
  const F = codes.map(function(){ return new Array(n).fill(0); });

  // 依「同一位學生、同一題」切段，段與段之間不計轉移
  const seqs = {};
  allLogs().forEach(function(e){
    if (!e.code) return;
    if (opts.cond && e.cond !== opts.cond) return;
    const k = e.sid + '|' + e.iid;
    (seqs[k] = seqs[k] || []).push(e);
  });
  let nSeq = 0, nEvent = 0;
  Object.keys(seqs).forEach(function(k){
    const s = seqs[k].sort(function(a, b){ return a.t - b.t; });
    nSeq++; nEvent += s.length;
    for (let i = 0; i + 1 < s.length; i++){
      const a = idx[s[i].code], b = idx[s[i + 1].code];
      if (a === undefined || b === undefined) continue;
      F[a][b]++;
    }
  });

  const rowT = F.map(function(r){ return r.reduce(function(a, b){ return a + b; }, 0); });
  const colT = codes.map(function(_, j){ return F.reduce(function(a, r){ return a + r[j]; }, 0); });
  const N = rowT.reduce(function(a, b){ return a + b; }, 0);

  const Z = F.map(function(r, i){
    return r.map(function(f, j){
      if (!N || !rowT[i] || !colT[j]) return 0;
      const E = rowT[i] * colT[j] / N;
      const d = E * (1 - rowT[i] / N) * (1 - colT[j] / N);
      return d > 0 ? (f - E) / Math.sqrt(d) : 0;
    });
  });
  const Tr = F.map(function(r, i){
    return r.map(function(f){ return rowT[i] ? f / rowT[i] : 0; });
  });

  const sig = [];
  Z.forEach(function(r, i){ r.forEach(function(z, j){
    if (Math.abs(z) >= 1.96 && F[i][j] > 0) sig.push({from:codes[i], to:codes[j], z:z, f:F[i][j], p:Tr[i][j]});
  }); });
  sig.sort(function(a, b){ return Math.abs(b.z) - Math.abs(a.z); });

  return {codes:codes, F:F, Z:Z, T:Tr, rowT:rowT, colT:colT, N:N,
          sig:sig, nSeq:nSeq, nEvent:nEvent};
}

/* ==========================================================================
   認知網絡分析
   ========================================================================== */
const ENA_CODES = [
  {id:'FR',   name:'直接提取', desc:'發話停留在找出文中明確寫出來的訊息。'},
  {id:'SI',   name:'直接推論', desc:'發話把相鄰訊息連起來，做出顯而易見的推論。'},
  {id:'II',   name:'詮釋整合', desc:'發話整合全文並帶入自己的知識，形成詮釋。'},
  {id:'EE',   name:'比較評估', desc:'發話評斷內容的合理性、完整性或作者立場。'},
  {id:'EVID', name:'援引依據', desc:'指出題目中的具體條件或標記題幹。'},
  {id:'MON',  name:'自我監控', desc:'檢查、驗算、送出前自我檢核。'},
  {id:'REV',  name:'修正',     desc:'對話之後更改選項或改寫作答。'},
  {id:'POS',  name:'正向情緒', desc:'發話帶正向情緒詞。'},
  {id:'NEG',  name:'負向情緒', desc:'發話帶負向情緒詞。'}
];

/* 把日誌轉成 ENA 的「行」：每一行帶有若干個編碼 */
function enaLines(){
  const lines = [];
  const seqs = {};
  allLogs().forEach(function(e){
    if (!e.code) return;
    const k = e.sid + '|' + e.iid;
    (seqs[k] = seqs[k] || []).push(e);
  });
  Object.keys(seqs).forEach(function(k){
    /* 「取消標記」「取消檢核」不是一次認知動作。原本 code 'M' 一律編成
       EVID（援引依據）、'C' 一律編成 MON（監控），連取消都算——
       於是反覆切換的孩子在認知網絡上看起來最會回到文本。
       寫入端記的是切換（見 34-log.js 的原則），讀取端要先把取消排掉。 */
    const s = seqs[k].filter(function(e){ return !(e.on === false || e.off === true); })
                     .sort(function(a, b){ return a.t - b.t; });
    s.forEach(function(e, i){
      const c = {};
      if (e.type === 'ASK'){
        c[codeUtteranceProcess(e.text || '')] = 1;
        const sm = sentimentOf(e.text || '');
        if (sm.score > 0.2) c.POS = 1;
        if (sm.score < -0.2) c.NEG = 1;
        // 前後兩步之內有標記題幹 → 援引依據
        for (let j = Math.max(0, i - 2); j <= Math.min(s.length - 1, i + 2); j++){
          if (s[j].code === 'M') c.EVID = 1;
        }
      } else if (e.code === 'M'){ c.EVID = 1;
      } else if (e.code === 'C'){ c.MON = 1;
      } else if (e.code === 'O' || e.code === 'W'){
        // 對話之後才發生的修改才算「修正」
        for (let j = Math.max(0, i - 3); j < i; j++){
          if (s[j].code === 'A' || String(s[j].code).indexOf('Q') === 0) c.REV = 1;
        }
      } else if (e.code === 'N'){
        const sm = sentimentOf(e.text || '');
        c[codeUtteranceProcess(e.text || '')] = 1;
        if (sm.score > 0.2) c.POS = 1;
        if (sm.score < -0.2) c.NEG = 1;
      }
      const on = Object.keys(c);
      if (on.length) lines.push({sid:e.sid, cond:e.cond, iid:e.iid, seq:k, i:i, codes:on});
    });
  });
  return lines;
}

/* 累積共現：單位＝學生，stanza＝同一題內的移動窗（預設 4 行） */
function enaAccumulate(window){
  const W = window || 4;
  const lines = enaLines();
  const ids = ENA_CODES.map(function(c){ return c.id; });
  const pairs = [];
  for (let a = 0; a < ids.length; a++) for (let b = a + 1; b < ids.length; b++) pairs.push([a, b]);

  const bySeq = {};
  lines.forEach(function(l){ (bySeq[l.seq] = bySeq[l.seq] || []).push(l); });
  const units = {};
  Object.keys(bySeq).forEach(function(k){
    const L = bySeq[k];
    L.forEach(function(l, i){
      const win = L.slice(Math.max(0, i - W + 1), i + 1);
      const present = {};
      win.forEach(function(x){ x.codes.forEach(function(c){ present[c] = 1; }); });
      const u = units[l.sid] = units[l.sid] || {sid:l.sid, cond:l.cond, v:new Array(pairs.length).fill(0), n:0};
      pairs.forEach(function(p, pi){
        if (present[ids[p[0]]] && present[ids[p[1]]]) u.v[pi]++;
      });
      u.n++;
    });
  });

  const arr = Object.keys(units).map(function(k){ return units[k]; });
  // 球面正規化
  arr.forEach(function(u){
    const len = Math.sqrt(u.v.reduce(function(a, b){ return a + b * b; }, 0));
    u.norm = len > 0 ? u.v.map(function(x){ return x / len; }) : u.v.slice();
  });
  return {units:arr, pairs:pairs, ids:ids, W:W, lines:lines.length};
}

/* 以冪迭代求共變異數矩陣的前兩個主軸（SVD 的等價做法） */
function enaProject(acc){
  const U = acc.units;
  if (U.length < 3) return null;
  const d = acc.pairs.length;
  const mean = new Array(d).fill(0);
  U.forEach(function(u){ u.norm.forEach(function(x, i){ mean[i] += x / U.length; }); });
  const X = U.map(function(u){ return u.norm.map(function(x, i){ return x - mean[i]; }); });

  function mulCov(v){
    // (XᵀX)v，避免顯式建構 d×d 矩陣
    const t = X.map(function(row){
      let s = 0; for (let i = 0; i < d; i++) s += row[i] * v[i]; return s;
    });
    const out = new Array(d).fill(0);
    X.forEach(function(row, r){ for (let i = 0; i < d; i++) out[i] += row[i] * t[r]; });
    return out;
  }
  function power(deflate){
    let v = new Array(d).fill(0).map(function(_, i){ return Math.sin(i * 12.9898) * 0.5 + 0.5; });
    for (let it = 0; it < 220; it++){
      let w = mulCov(v);
      deflate.forEach(function(p){
        const dot = w.reduce(function(a, x, i){ return a + x * p[i]; }, 0);
        for (let i = 0; i < d; i++) w[i] -= dot * p[i];
      });
      const len = Math.sqrt(w.reduce(function(a, x){ return a + x * x; }, 0));
      if (len < 1e-12) break;
      v = w.map(function(x){ return x / len; });
    }
    return v;
  }
  const v1 = power([]);
  const v2 = power([v1]);
  function eig(v){
    const w = mulCov(v);
    return w.reduce(function(a, x, i){ return a + x * v[i]; }, 0);
  }
  const e1 = eig(v1), e2 = eig(v2);
  let tot = 0;
  X.forEach(function(row){ row.forEach(function(x){ tot += x * x; }); });

  const pts = U.map(function(u, r){
    return {sid:u.sid, cond:u.cond,
            x: X[r].reduce(function(a, x, i){ return a + x * v1[i]; }, 0),
            y: X[r].reduce(function(a, x, i){ return a + x * v2[i]; }, 0)};
  });
  return {pts:pts, v1:v1, v2:v2, var1: tot ? e1 / tot : 0, var2: tot ? e2 / tot : 0, mean:mean};
}

/* 各條件的平均網絡（邊權＝該條件單位向量的平均） */
function enaMeanNetworks(acc){
  const out = {};
  CONDITIONS.forEach(function(c){
    const U = acc.units.filter(function(u){ return u.cond === c.id; });
    if (!U.length) return;
    const v = new Array(acc.pairs.length).fill(0);
    U.forEach(function(u){ u.norm.forEach(function(x, i){ v[i] += x / U.length; }); });
    out[c.id] = {v:v, n:U.length};
  });
  return out;
}

/* ==========================================================================
   情感軌跡
   ========================================================================== */
function sentimentTrajectory(){
  const byCond = {};
  CONDITIONS.forEach(function(c){ byCond[c.id] = {turns:{}, items:{}, all:[]}; });
  allLogs().forEach(function(e){
    if (e.type !== 'ASK' && e.code !== 'N') return;
    const s = e.sent != null ? e.sent : sentimentOf(e.text || '').score;
    const b = byCond[e.cond]; if (!b) return;
    b.all.push(s);
    const tn = e.turn || 1;
    (b.turns[tn] = b.turns[tn] || []).push(s);
    (b.items[e.iid] = b.items[e.iid] || []).push(s);
  });
  const out = {};
  Object.keys(byCond).forEach(function(c){
    const b = byCond[c];
    out[c] = {
      mean: b.all.length ? mean(b.all) : null,
      n: b.all.length,
      pos: b.all.filter(function(x){ return x > 0.2; }).length,
      neg: b.all.filter(function(x){ return x < -0.2; }).length,
      byTurn: Object.keys(b.turns).sort(function(a, x){ return a - x; }).map(function(k){
        return {turn:+k, mean:mean(b.turns[k]), n:b.turns[k].length};
      }),
      byItem: Object.keys(b.items).map(function(k){
        return {iid:k, mean:mean(b.items[k]), n:b.items[k].length};
      })
    };
  });
  return out;
}

/* 相對歷程分布（RQ4 的描述統計） */
function relativeProcessProfile(){
  const out = {};
  CONDITIONS.forEach(function(c){ out[c.id] = {BELOW:0, AT:0, ABOVE:0, n:0}; });
  allLogs().forEach(function(e){
    if (e.type !== 'ASK') return;
    const rel = e.rel || (e.code === 'Q−' ? 'BELOW' : e.code === 'Q+' ? 'ABOVE' : 'AT');
    const b = out[e.cond]; if (!b) return;
    b[rel]++; b.n++;
  });
  return out;
}

/* ===== src/64-stats.js ===== */
/* ==========================================================================
   64-stats.js — 效果檢定
   ‧ 共變數分析（ANCOVA）：F、partial η²、調整後平均、Bonferroni 事後比較
   ‧ 平行多重中介的路徑分析：a、b、c'、間接效果與百分位 bootstrap 信賴區間
   說明：本模組估計的是「觀察變項」路徑模型，不是含潛在變項的結構方程模型。
   正式分析請以 Mplus／lavaan 重跑並檢驗測量模型。
   ========================================================================== */

/* --- 線性代數：最小平方解 --- */
function olsFit(X, y){
  const n = X.length, p = X[0].length;
  const XtX = [], Xty = new Array(p).fill(0);
  for (let i = 0; i < p; i++){
    XtX.push(new Array(p).fill(0));
    for (let j = 0; j < p; j++){
      let s = 0; for (let r = 0; r < n; r++) s += X[r][i] * X[r][j];
      XtX[i][j] = s;
    }
    let s2 = 0; for (let r = 0; r < n; r++) s2 += X[r][i] * y[r];
    Xty[i] = s2;
  }
  const inv = matInv(XtX);
  if (!inv) return null;
  const b = inv.map(function(row){
    return row.reduce(function(a, v, j){ return a + v * Xty[j]; }, 0);
  });
  const fit = X.map(function(row){ return row.reduce(function(a, v, j){ return a + v * b[j]; }, 0); });
  const res = y.map(function(v, i){ return v - fit[i]; });
  const ybar = mean(y);
  const ssTot = y.reduce(function(a, v){ return a + (v - ybar) * (v - ybar); }, 0);
  const ssRes = res.reduce(function(a, v){ return a + v * v; }, 0);
  const df = n - p;
  const mse = df > 0 ? ssRes / df : NaN;
  const se = b.map(function(_, j){ return Math.sqrt(Math.max(0, mse * inv[j][j])); });
  const t = b.map(function(v, j){ return se[j] > 0 ? v / se[j] : 0; });
  return {b:b, se:se, t:t, inv:inv, fit:fit, res:res, ssRes:ssRes, ssTot:ssTot,
          mse:mse, df:df, n:n, p:p, r2: ssTot > 0 ? 1 - ssRes / ssTot : 0};
}

function matInv(A){
  const n = A.length;
  const M = A.map(function(r, i){
    return r.concat(new Array(n).fill(0).map(function(_, j){ return i === j ? 1 : 0; }));
  });
  for (let c = 0; c < n; c++){
    let piv = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[piv][c])) piv = r;
    if (Math.abs(M[piv][c]) < 1e-12) return null;
    const tmp = M[c]; M[c] = M[piv]; M[piv] = tmp;
    const d = M[c][c];
    for (let j = 0; j < 2 * n; j++) M[c][j] /= d;
    for (let r = 0; r < n; r++){
      if (r === c) continue;
      const f = M[r][c];
      if (!f) continue;
      for (let j = 0; j < 2 * n; j++) M[r][j] -= f * M[c][j];
    }
  }
  return M.map(function(r){ return r.slice(n); });
}

/* --- 分布函數（供 p 值） --- */
function erf(x){
  const s = x < 0 ? -1 : 1; x = Math.abs(x);
  const a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741,
        a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;
  const t = 1 / (1 + p * x);
  const y = 1 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-x * x);
  return s * y;
}
/* 標準常態上尾機率 P(Z > z) */
function normUpper(z){ return 0.5 * (1 - erf(z / Math.SQRT2)); }
/* F 分布上尾 p：Wilson–Hilferty 近似。df 小時請以統計軟體覆核。 */
function fPvalue(F, df1, df2){
  if (!isFinite(F) || F <= 0 || df1 <= 0 || df2 <= 0) return 1;
  const a = 2 / (9 * df1), b = 2 / (9 * df2);
  const den = Math.sqrt(a + Math.pow(F, 2 / 3) * b);
  if (!(den > 0)) return 1;
  return normUpper((Math.pow(F, 1 / 3) * (1 - b) - (1 - a)) / den);
}
/* t 雙尾 p：t² ~ F(1, df)，故等於 F 的上尾 p */
function tP2(t, df){ return isFinite(t) ? fPvalue(t * t, 1, df) : NaN; }
function fmtP(p){
  if (!isFinite(p)) return '—';
  return p < .001 ? '< .001' : p.toFixed(3).replace(/^0/, '');
}

/* --- 資料集組裝：每位學生一列 --- */
function analysisDataset(){
  const rows = [];
  const pre = diagnose(state, 'a-pre'), post = diagnose(state, 'a-post');
  const thPre = {}, thPost = {};
  if (pre && pre.ready) pre.perStudent.forEach(function(p){ thPre[p.sid] = p.theta; });
  if (post && post.ready) post.perStudent.forEach(function(p){ thPost[p.sid] = p.theta; });

  state.classes.forEach(function(k){
    k.studentIds.forEach(function(sid){
      const sp = surveyScores(sid, 'pre') || {}, sq = surveyScores(sid, 'post') || {};
      const logs = allLogs().filter(function(e){ return e.sid === sid; });
      const asks = logs.filter(function(e){ return e.type === 'ASK'; });
      const rel = {BELOW:0, AT:0, ABOVE:0};
      asks.forEach(function(e){ rel[e.rel || 'AT']++; });
      /* 切換型事件要折疊：取消也被算一次的話，自我檢核勾選數（真的會跑 ANCOVA）
         每題只有 5 個檢核項卻可能報出 9。見 34-log.js 的 foldedCount。 */
      const checks = foldedCount(logs, 'C', 'idx');
      const marks = foldedCount(logs, 'M', 'sent');
      // 情緒以「學生自己寫的文字」為準：對照組沒有對話，改採其筆記，四條件才可比較
      const voiced = logs.filter(function(e){ return e.type === 'ASK' || e.code === 'N'; });
      const sents = voiced.map(function(e){
        return e.sent != null ? e.sent : sentimentOf(e.text || '').score; });
      rows.push({
        sid:sid, name:userName(sid), cid:k.id, klass:k.name, grade:k.grade, cond:k.condition,
        thetaPre: thPre[sid], thetaPost: thPost[sid],
        gain: (thPre[sid] != null && thPost[sid] != null) ? thPost[sid] - thPre[sid] : null,
        pre: sp, post: sq,
        turns: asks.length, marks: marks, checks: checks,
        relBelow: rel.BELOW, relAt: rel.AT, relAbove: rel.ABOVE,
        relAboveRate: asks.length ? rel.ABOVE / asks.length : null,
        sentMean: sents.length ? mean(sents) : null
      });
    });
  });
  return rows;
}

/* --- ANCOVA：以條件為因子、前測為共變數 --- */
function ancova(rows, yGet, xGet){
  const data = rows.map(function(r){
    return {cond:r.cond, y:yGet(r), x: xGet ? xGet(r) : null};
  }).filter(function(d){
    return typeof d.y === 'number' && isFinite(d.y) && (!xGet || (typeof d.x === 'number' && isFinite(d.x)));
  });
  if (data.length < 12) return null;
  const conds = CONDITIONS.map(function(c){ return c.id; })
    .filter(function(c){ return data.some(function(d){ return d.cond === c; }); });
  if (conds.length < 2) return null;
  const ref = conds[conds.length - 1];              // 以對照組為參照
  const others = conds.filter(function(c){ return c !== ref; });
  const withCov = !!xGet;
  const xbar = withCov ? mean(data.map(function(d){ return d.x; })) : 0;

  function design(useCond){
    return data.map(function(d){
      const row = [1];
      if (withCov) row.push(d.x - xbar);
      if (useCond) others.forEach(function(c){ row.push(d.cond === c ? 1 : 0); });
      return row;
    });
  }
  const y = data.map(function(d){ return d.y; });
  const full = olsFit(design(true), y);
  const red = olsFit(design(false), y);
  if (!full || !red) return null;

  const dfEffect = others.length;
  const ssEffect = red.ssRes - full.ssRes;
  const F = (ssEffect / dfEffect) / full.mse;
  const p = fPvalue(F, dfEffect, full.df);
  const eta = ssEffect / (ssEffect + full.ssRes);

  // 調整後平均（在共變數的總平均處）
  const adj = {};
  conds.forEach(function(c){
    let v = full.b[0];
    const k = others.indexOf(c);
    if (k >= 0) v += full.b[(withCov ? 2 : 1) + k];
    adj[c] = v;
  });
  const nBy = {}, xBy = {};
  conds.forEach(function(c){
    const g = data.filter(function(d){ return d.cond === c; });
    nBy[c] = g.length;
    xBy[c] = withCov ? mean(g.map(function(d){ return d.x; })) : 0;
  });
  const ssw = withCov ? conds.reduce(function(a, c){
    const g = data.filter(function(d){ return d.cond === c; });
    const m = xBy[c];
    return a + g.reduce(function(s, d){ return s + (d.x - m) * (d.x - m); }, 0);
  }, 0) : 0;

  const pairs = [];
  for (let i = 0; i < conds.length; i++) for (let j = i + 1; j < conds.length; j++){
    const a = conds[i], b = conds[j];
    const diff = adj[a] - adj[b];
    let seSq = full.mse * (1 / nBy[a] + 1 / nBy[b]);
    if (withCov && ssw > 0) seSq += full.mse * Math.pow(xBy[a] - xBy[b], 2) / ssw;
    const se = Math.sqrt(seSq);
    const t = se > 0 ? diff / se : 0;
    const raw = tP2(t, full.df);
    const nComp = conds.length * (conds.length - 1) / 2;
    pairs.push({a:a, b:b, diff:diff, se:se, t:t, p:raw, pAdj: Math.min(1, raw * nComp),
                d: diff / Math.sqrt(full.mse)});
  }

  const desc = conds.map(function(c){
    const g = data.filter(function(d){ return d.cond === c; });
    return {cond:c, n:g.length, m:mean(g.map(function(d){ return d.y; })),
            sd:sd(g.map(function(d){ return d.y; })), adj:adj[c],
            xm: withCov ? xBy[c] : null};
  });

  return {conds:conds, ref:ref, F:F, df1:dfEffect, df2:full.df, p:p, eta:eta,
          adj:adj, desc:desc, pairs:pairs, mse:full.mse, n:data.length,
          covariate:withCov, covMean:xbar, r2:full.r2};
}

/* --- 平行多重中介 --- */
function mediation(rows, xCond, yGet, mediators, xGet, boot){
  const B = boot || 1500;
  const data = rows.filter(function(r){ return r.cond === xCond || r.cond === 'control'; })
    .map(function(r){
      const o = {x: r.cond === xCond ? 1 : 0, y: yGet(r), cov: xGet ? xGet(r) : 0};
      o.m = mediators.map(function(md){ return md.get(r); });
      return o;
    }).filter(function(o){
      return isFinite(o.y) && o.m.every(function(v){ return typeof v === 'number' && isFinite(v); }) &&
             (!xGet || isFinite(o.cov));
    });
  if (data.length < 20) return null;

  function run(sample){
    const withCov = !!xGet;
    const Xa = sample.map(function(o){ return withCov ? [1, o.x, o.cov] : [1, o.x]; });
    const a = mediators.map(function(_, j){
      const f = olsFit(Xa, sample.map(function(o){ return o.m[j]; }));
      return f ? f.b[1] : NaN;
    });
    const Xb = sample.map(function(o){
      return (withCov ? [1, o.x, o.cov] : [1, o.x]).concat(o.m);
    });
    const fb = olsFit(Xb, sample.map(function(o){ return o.y; }));
    if (!fb) return null;
    const off = withCov ? 3 : 2;
    const b = mediators.map(function(_, j){ return fb.b[off + j]; });
    const cp = fb.b[1];
    const Xc = sample.map(function(o){ return withCov ? [1, o.x, o.cov] : [1, o.x]; });
    const fc = olsFit(Xc, sample.map(function(o){ return o.y; }));
    return {a:a, b:b, cp:cp, c: fc ? fc.b[1] : NaN,
            ind: a.map(function(v, j){ return v * b[j]; }),
            fb:fb, fc:fc};
  }
  const point = run(data);
  if (!point) return null;

  const rnd = mulberry32(424242);
  const dist = mediators.map(function(){ return []; });
  const totDist = [];
  for (let it = 0; it < B; it++){
    const s = [];
    for (let i = 0; i < data.length; i++) s.push(data[Math.floor(rnd() * data.length)]);
    const r = run(s);
    if (!r) continue;
    let tot = 0;
    r.ind.forEach(function(v, j){ if (isFinite(v)){ dist[j].push(v); tot += v; } });
    totDist.push(tot);
  }
  function ci(arr){
    const v = arr.slice().sort(function(a, b){ return a - b; });
    if (v.length < 20) return [NaN, NaN];
    return [v[Math.floor(v.length * 0.025)], v[Math.ceil(v.length * 0.975) - 1]];
  }
  return {
    n: data.length, boot: totDist.length,
    c: point.c, cp: point.cp,
    paths: mediators.map(function(md, j){
      const c95 = ci(dist[j]);
      return {name: md.name, a: point.a[j], b: point.b[j], ind: point.ind[j],
              lo: c95[0], hi: c95[1], sig: c95[0] * c95[1] > 0};
    }),
    total: {ind: point.ind.reduce(function(a, b){ return a + b; }, 0),
            lo: ci(totDist)[0], hi: ci(totDist)[1],
            sig: ci(totDist)[0] * ci(totDist)[1] > 0}
  };
}

/* ==========================================================================
   70-ai.js — AI 助評層
   兩套引擎並存，這是本系統在研究上的刻意設計：
   ‧ 內建規則引擎：離線、可重現、逐字可追溯到診斷資料與誘答標記。
   ‧ 外部語言模型：OpenAI Chat Completions 相容端點，提供彈性語言回饋。
   同一份 prompt 材料同時餵給兩者，便於做「人—規則—模型」三方比對。
   ========================================================================== */

function aiEngine(){ return state.settings.engine === 'llm' && state.settings.apiKey ? 'llm' : 'builtin'; }
function engineLabel(){ return aiEngine() === 'llm' ? '外部語言模型 · ' + state.settings.model : '內建規則引擎（離線可重現）'; }

function cacheKey(kind, id){ return kind + ':' + id + ':' + aiEngine(); }
function cacheGet(kind, id){ return state.aiCache[cacheKey(kind, id)]; }
function cacheSet(kind, id, val){ state.aiCache[cacheKey(kind, id)] = val; save(); }

/* --- 外部模型呼叫 --- */
async function llmChat(messages, o){
  o = o || {};
  const s = state.settings;
  if (!s.apiKey) throw new Error('尚未填入 API key。請到「系統設定」頁設定，或改用內建引擎。');
  const url = String(s.baseUrl || '').replace(/\/+$/, '') + '/chat/completions';
  let res;
  try {
    res = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + s.apiKey},
      body: JSON.stringify({model: s.model, messages: messages,
        temperature: o.temperature === undefined ? 0.4 : o.temperature,
        max_tokens: o.max_tokens || 1400})
    });
  } catch (e) {
    throw new Error('連不到 ' + url + '。線上發布版受安全政策限制無法連外部網址；請把本檔下載到電腦上開啟，或改用內建引擎。');
  }
  if (!res.ok){
    const t = await res.text().catch(function(){ return ''; });
    throw new Error('呼叫失敗（HTTP ' + res.status + '）' + (t ? '：' + t.slice(0, 200) : ''));
  }
  const j = await res.json();
  const txt = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
  if (!txt) throw new Error('沒有回傳內容，請確認模型名稱與端點正確。');
  return txt;
}

  '也熟悉形成性評量。請用臺灣繁體中文回答，聚焦在「想法如何被改進」而不是「答案對不對」，具體、可操作，避免空話。';

/* ==========================================================================
   材料建構：把診斷資料整理成人與模型都讀得懂的文字
   ========================================================================== */
function materialClass(diag){
  const L = [];
  L.push('作業：' + diag.assignment.title);
  L.push('完成人數：' + diag.done.length + ' / ' + diag.roster.length);
  L.push('平均能力估計值 θ：' + fx(diag.meanTheta) + ' logit；平均試題難度 δ：' + fx(diag.meanDelta) + ' logit');
  L.push('全體（四班合計）四象限總題次：優勢(I) ' + diag.totals[1] + '、迷思(II) ' + diag.totals[2] +
         '、合理答錯(III) ' + diag.totals[3] + '、合理答對(IV) ' + diag.totals[4]);
  L.push('');
  L.push('【主要迷思題】');
  diag.flagged.forEach(function(pi){
    const it = pi.item;
    L.push('- ' + itemLabel(diag.assignment.id, it.id) + '（' + unitName(it.unit) + '，' + processName(it.process) + '，' + it.diff + '）');
    L.push('  題幹：' + it.stem);
    L.push('  選項：' + it.options.map(function(o, i){ return String.fromCharCode(65 + i) + '. ' + o; }).join('　'));
    L.push('  正解：' + String.fromCharCode(65 + it.answer) + '　難度 δ=' + fx(pi.delta) + '　全體（四班合計）答對率 ' + pct(pi.pass));
    L.push('  迷思(II) ' + pi.q[2] + ' 人（占作答 ' + pct(pi.misRate) + '）；優勢(I) ' + pi.q[1] + ' 人');
    if (pi.topDistractor != null){
      L.push('  迷思學生最常選：' + String.fromCharCode(65 + pi.topDistractor) + '. ' +
             it.options[pi.topDistractor] + '（' + pi.topDistractorN + ' 人）');
    }
    if (pi.misCode){
      const m = MISCONCEPTIONS.find(function(x){ return x.id === pi.misCode; });
      if (m) L.push('  題庫標記的理解失誤：' + m.name + '——' + m.desc);
    }
  });
  return L.join('\n');
}

function materialNote(n){
  const L = [];
  L.push('貼文標題：' + n.title);
  L.push('作者：' + noteAuthors(n));
  (n.segs || []).forEach(function(g){
    L.push('［' + scaffoldLabel(g.s) + '］' + g.text);
  });
  if (n.buildOn){ const p = getNote(n.buildOn); if (p) L.push('（此篇延伸自：' + p.title + '）'); }
  const kids = childrenOf(n.id);
  if (kids.length) L.push('（有 ' + kids.length + ' 篇延伸自此篇）');
  return L.join('\n');
}

function materialThread(rootId){
  const seq = threadOf(rootId);
  return seq.map(function(x){
    const pre = '　'.repeat(x.depth) + (x.depth ? '↳ ' : '● ');
    return pre + x.note.title + '（' + noteAuthors(x.note) + '）\n' +
      (x.note.segs || []).map(function(g){ return '　'.repeat(x.depth + 1) + '［' + scaffoldLabel(g.s) + '］' + g.text; }).join('\n');
  }).join('\n');
}

async function aiClassMisconception(diag, force){
  const id = diag.assignment.id;
  if (!force){ const c = cacheGet('class', id); if (c) return c; }
  let out;
  if (aiEngine() === 'llm'){
    out = await llmChat([
      {role:'system', content: SYS_TEACHER},
      {role:'user', content: materialClass(diag) + '\n\n請依序回覆：\n' +
        '1.【共同迷思診斷】把主要迷思題聚合起來看，找出學生共同卡住的概念。\n' +
        '2.【每一題的迷思解釋】說明為何學生會選那個誘答選項。\n' +
        '3.【具體教學策略】每個共同迷思給 2–3 個可執行的教學動作。\n' +
        '4.【轉為共構問題】針對其中最值得全體討論的 1–2 個迷思，寫出可以直接貼到知識建構空間的問題敘述。\n' +
        '5.【下一步派題建議】接下來派哪個單元或題型能繼續診斷或補救。'}
    ]);

  }

}

function builtinClassReport(diag){
  const L = [];
  const byMis = {};
  diag.flagged.forEach(function(pi){
    const k = pi.misCode || 'other';
    (byMis[k] = byMis[k] || []).push(pi);
  });
  L.push('#### 1. 共同迷思診斷');
  const keys = Object.keys(byMis).sort(function(a, b){
    return sumQ2(byMis[b]) - sumQ2(byMis[a]);
  });
  if (!keys.length){
    L.push('目前沒有任何題目的迷思(II)比例超過門檻 ' + state.settings.misThreshold + '%。全體（四班合計）的錯誤大多落在「合理答錯」，代表是難度問題而非概念問題，可以直接進入練習與精熟。');
  }
  keys.forEach(function(k){
    const g = byMis[k];
    const m = MISCONCEPTIONS.find(function(x){ return x.id === k; });
    const students = uniq(g.reduce(function(a, pi){ return a.concat(pi.q2Students); }, []));
    L.push('**' + (m ? m.name : '其他錯誤型態') + '**（' + g.length + ' 題受影響，涉及 ' + students.length + ' 位學生）');
    if (m) L.push('- 概念描述：' + m.desc);
    L.push('- 相關題號：' + g.map(function(pi){ return itemLabel(diag.assignment.id, pi.item.id) + '（迷思 ' + pct(pi.misRate) + '）'; }).join('、'));
    L.push('- 落在此迷思的學生：' + students.slice(0, 12).map(userName).join('、') + (students.length > 12 ? ' 等' : ''));
    L.push('');
  });

  L.push('#### 2. 每一題的迷思解釋');
  diag.flagged.forEach(function(pi){
    const it = pi.item;
    L.push('**' + itemLabel(diag.assignment.id, it.id) + '**（' + unitName(it.unit) + ' · ' + processName(it.process) + ' · δ=' + fx(pi.delta) + '）');
    L.push('- ' + it.stem);
    if (pi.topDistractor != null){
      L.push('- 迷思學生最常選 **' + String.fromCharCode(65 + pi.topDistractor) + '. ' + it.options[pi.topDistractor] + '**（' + pi.topDistractorN + ' 人）。');
      const m = pi.misCode ? MISCONCEPTIONS.find(function(x){ return x.id === pi.misCode; }) : null;
      if (m) L.push('- 這個選項之所以吸引人，是因為 ' + m.desc);
      else L.push('- 這個選項沒有對應到題庫既有的迷思標記，建議人工檢視學生的作答理由。');
    }
    L.push('- 命題備註：' + it.note);
    L.push('');
  });

  L.push('#### 3. 具體教學策略');
  keys.forEach(function(k){
    const m = MISCONCEPTIONS.find(function(x){ return x.id === k; });
    const acts = STRATEGY[k] || ['請學生把自己的判斷依據寫出來，再與同儕互相檢查。',
      '提供一個「答案對但理由來自常識」的作答，讓學生指出問題。',
      '要求每題都回到文本圈出依據的那一句。'];
    L.push('**' + (m ? m.name : '其他') + '**');
    acts.forEach(function(a){ L.push('- ' + a); });
    L.push('');
  });

  L.push('#### 4. 轉為共構問題');
  const top = diag.flagged.slice(0, 2);
  if (!top.length){
    L.push('目前沒有需要立即開啟共構的迷思題。');
  }
  top.forEach(function(pi){
    L.push('**' + itemLabel(diag.assignment.id, pi.item.id) + ' → 可直接貼到知識建構空間的問題敘述**');
    L.push('');
    L.push('> ' + buildInquiryPrompt(pi, diag, currentClass()).split('\n').join('\n> '));
    L.push('');
    L.push('在「派題診斷 → 迷思橋接」按下〈開啟共構視圖〉，系統會把這段話與該題一起貼進新的視圖，並自動標出可以擔任知識資源人的同學。');
    L.push('');
  });

  L.push('#### 5. 下一步派題建議');
  const units = uniq(diag.flagged.map(function(pi){ return pi.item.unit; }));
  if (units.length){
    L.push('- 補救優先單元：' + units.map(unitName).join('、') + '。');
    L.push('- 建議在共構討論結束後，用相同題組施測一次（本系統的「共構後測」），並比較每位學生的 θ 變化與論述參與，看討論是否真的轉成理解。');
  }
  const weakest = diag.perItem.slice().sort(function(a, b){ return a.pass - b.pass; })[0];
  if (weakest) L.push('- 全體（四班合計）答對率最低的是' + itemLabel(diag.assignment.id, weakest.item.id) + '（' + pct(weakest.pass) + '），若其迷思比例不高，代表是難度而非概念問題，可先做鷹架式練習。');
  L.push('');
  L.push('---');
  L.push('*本報告由內建規則引擎產生：所有數字直接來自 Rasch 估計與誘答選項標記，不含語言模型生成內容，可重現。*');
  return L.join('\n');
}

function sumQ2(list){ return list.reduce(function(s, p){ return s + p.q[2]; }, 0); }
function uniq(a){ const o = {}; const r = []; a.forEach(function(x){ if (!o[x]){ o[x] = 1; r.push(x); } }); return r; }

/* 八種理解失誤對應的教學動作。診斷不依賴語言模型，這張表是離線引擎的知識來源。 */

/* ==========================================================================
   2. 單題教學策略
   ========================================================================== */
async function aiItemStrategy(diag, pi, force){
  const id = diag.assignment.id + '#' + pi.item.id;
  if (!force){ const c = cacheGet('item', id); if (c) return c; }
  let out;
  if (aiEngine() === 'llm'){
    const it = pi.item;
    out = await llmChat([
      {role:'system', content:'你是資深國小閱讀教師。針對單題的理解失誤提出具體教學建議。用臺灣繁體中文，動詞驅動、短句、具體，控制在 300 字內，用 Markdown 短列點。'},
      {role:'user', content:'題幹：' + it.stem + '\n選項：' +
        it.options.map(function(o, i){ return String.fromCharCode(65 + i) + '. ' + o; }).join('　') +
        '\n正解：' + String.fromCharCode(65 + it.answer) +
        '\n迷思學生 ' + pi.q[2] + ' 人，最常選 ' + (pi.topDistractor != null ? String.fromCharCode(65 + pi.topDistractor) : '無') +
        '\n\n請回答：1. 學生選錯選項的可能推理錯誤（1–2 句）。2. 三個具體教學動作。3. 這是概念錯、程序錯還是策略錯（單選並補一句說明）。'}
    ], {max_tokens:700});
  } else {
    out = builtinItemStrategy(pi);
  }
  cacheSet('item', id, out);
  return out;
}

function builtinItemStrategy(pi){
  const it = pi.item;
  const m = pi.misCode ? MISCONCEPTIONS.find(function(x){ return x.id === pi.misCode; }) : null;
  const L = [];
  L.push('#### 學生可能的推理路徑');
  if (pi.topDistractor != null){
    L.push('選 **' + String.fromCharCode(65 + pi.topDistractor) + '. ' + it.options[pi.topDistractor] + '** 的 ' +
      pi.topDistractorN + ' 位同學，很可能是' + (m ? m.desc : '在中途跳過了一個檢驗步驟'));
  } else {
    L.push('這一題的錯誤選項分散，沒有集中的誘答，較可能是粗心或時間不足，而非單一迷思。');
  }
  L.push('');
  L.push('#### 三個教學動作');
  const acts = (pi.misCode && STRATEGY[pi.misCode]) || [
    '請兩位落在迷思象限的同學說說他們是從哪一段讀到的，先不要糾正。',
    '把四個選項各自對應到文本的哪一段標出來，讓學生看到誘答其實來自別的地方。',
    '要求每個答案都補一句「我是從第◯段第◯句看出來的」，寫不出來就回去再讀一次。'];
  acts.forEach(function(a){ L.push('- ' + a); });
  L.push('');
  L.push('#### 失誤類型判斷');
  /* 依 READING_ERRORS（E1–E8）分成四類閱讀失誤；沒有掛代碼時退回「歷程不明」。 */
  const READ_TYPE = {
    E1:'依據失誤', E7:'依據失誤',
    E2:'定位失誤', E5:'定位失誤',
    E3:'推論失誤', E4:'推論失誤', E6:'推論失誤',
    E8:'評估失誤'
  };
  const TYPE_DESC = {
    '依據失誤':'學生根本沒有回到文本，是憑常識或生活經驗作答。補讀更多文章沒有用，' +
               '要先建立「不畫出依據就不能作答」的規矩。',
    '定位失誤':'學生知道要回文本，但停在錯的段落或認錯了指涉對象。' +
               '適合用「關鍵詞 → 掃描 → 核對」的固定流程矯正。',
    '推論失誤':'學生找得到訊息，問題出在連起來的那一步——不是停在字面，就是推得超出文本能支持的範圍。' +
               '適合練習描述文本的邊界：「文章只說到……，沒有說……」。',
    '評估失誤':'學生讀得懂內容，但沒有讀出作者的態度與寫作用意。' +
               '適合用同一件事的兩種寫法對照，讓立場浮出來。',
    '歷程不明':'這一題的誘答沒有掛失誤代碼，無法判斷失誤型態。' +
               '建議先補上誘答標記——規則引擎的診斷品質完全取決於這一步。'
  };
  const type = (m && READ_TYPE[m.id]) || '歷程不明';
  L.push('**' + type + '**：' + TYPE_DESC[type]);
  L.push('');
  L.push('#### 建議的共構切入點');
  L.push('把這一題貼進知識建構空間時，不要問「正確答案是什麼」，改問「' +
    (m ? '「' + m.name + '」' : '這樣的讀法') + '在什麼情況下會讓我們讀錯？請從文章裡舉一個例子」。');
  return L.join('\n');
}

/* ==========================================================================
   3. 非選題評量規準
   ========================================================================== */
async function aiRubric(item, force){
  if (!force){ const c = cacheGet('rubric', item.id); if (c) return c; }
  let out;
  if (aiEngine() === 'llm'){
    out = await llmChat([
      {role:'system', content:'你是資深國小閱讀教師，熟悉 PIRLS 建構反應題的閱卷標準。用臺灣繁體中文，具體可操作，避免空話。'},
      {role:'user', content:'題目：' + item.stem + '\n單元：' + unitName(item.unit) +
        '\n\n請產出評量規準（Markdown）：開頭寫「滿分：N 分」；分成三個向度並標配分（回到文本、推論或評估品質、表達與論證）；最後列出 3 個常見錯誤與扣分建議。只要規準本身，不要開場白。'}
    ], {max_tokens:900});
  } else {
    out = builtinRubric(item);
  }
  cacheSet('rubric', item.id, out);
  return out;
}

function builtinRubric(item){
  const L = [];
  L.push('**滿分：6 分**');
  L.push('');
  L.push('#### 評分向度');
  L.push('| 向度 | 配分 | 給分描述 |');
  L.push('| --- | --- | --- |');
  if (item.id === 'C01'){
    /* II 詮釋整合 · II-2：思考人物行動的其他可能作法 */
    L.push('| 回到文本 | 2 | 理由明確連到故事裡的某一段（不必寫出段號，但要看得出依據來自文本）。只寫「因為他很可憐」這類沒有文本依據的理由給 0 分。 |');
    L.push('| 詮釋品質 | 3 | 提出的做法與「老先生每天搬樹是為了太太」這個已詮釋出來的動機一致；能說出這個做法會帶來什麼結果。做法與動機無關給 1 分。 |');
    L.push('| 表達與論證 | 1 | 做法與理由分得清楚，讀得出「我會做什麼」與「我為什麼這樣做」兩層。 |');
    L.push('');
    L.push('#### 扣分要點');
    L.push('- **只寫做法沒有理由**：扣 3 分。本題明確要求說明理由，理由才是評的東西。');
    L.push('- **理由來自生活經驗而非文本**（E7 以經驗代替文本）：扣 2 分，並在評語中請學生指出是從哪一段看出來的。');
    L.push('- **推論超出文本**（E4 過度推論，例如斷定阿嬤一定會康復）：扣 1 分，提醒區分「文章說的」與「我希望的」。');
  } else {
    /* EE 比較評估 · EE-3：評斷文中訊息的完整性或清晰度 */
    L.push('| 指出空缺 | 3 | 提出的問題確實是這篇文章沒有回答的，且與文章主題相關（例如「哪一種傳播方法最有效」「為什麼有些植物同時用兩種方法」）。問題與文章無關給 0 分。 |');
    L.push('| 說明不足的理由 | 2 | 能指出文章寫到哪裡為止，說明為什麼現有訊息不足以回答；有引用或轉述文中相關段落。 |');
    L.push('| 表達 | 1 | 問題寫成一個完整、可回答的問句，不是感嘆或評論。 |');
    L.push('');
    L.push('#### 扣分要點');
    L.push('- **問題其實文章有答**（E2 找錯位置）：扣 3 分，並帶學生回到該段核對。');
    L.push('- **泛泛的好奇**（「我想知道更多關於植物的事」）：扣 2 分。本題評的是能否指出**具體**的空缺。');
    L.push('- **只提問沒說明為什麼不足**：扣 2 分。說明才是比較評估歷程的證據。');
  }
  L.push('');
  L.push('*本規準由內建規則引擎依題目類型產生，請老師依班級狀況調整後再使用。*');
  return L.join('\n');
}

/* ==========================================================================
   4. 相似題生成
   ========================================================================== */
async function aiSimilarItems(item, force, exclude){
  if (!force){ const c = cacheGet('similar', item.id); if (c) return c; }
  let out;
  if (aiEngine() === 'llm'){
    const txt = await llmChat([
      {role:'system', content:'你是資深閱讀評量命題者，熟悉 PIRLS 題型與四項理解歷程。請嚴格輸出 JSON，不要多任何說明。'},
      {role:'user', content:'原題：' + item.stem + '\n選項：' +
        item.options.map(function(o, i){ return String.fromCharCode(65 + i) + '. ' + o; }).join('　') +
        '\n正解：' + String.fromCharCode(65 + item.answer) +
        '\n\n請仿造 3 道概念相同、數字或情境不同的相似題，難度與原題相近。每題四個選項，正解隨機分布，誘答要真的可能被選錯，並附一句話解題思路。' +
        '只回傳 JSON：{"items":[{"stem":"","options":["","","",""],"answer":0,"hint":""}]}'}
    ], {temperature:0.8, max_tokens:1200});
    const m = txt.match(/\{[\s\S]*\}/);
    if (!m) throw new Error('回傳的格式不正確，請再試一次。');
    out = JSON.parse(m[0]).items;
  } else {
    out = builtinSimilar(item, exclude);
  }
  /* 相似題也要過洩答篩檢。這條通道原本一次都沒過，而 #/about 對老師寫著
     「每一則回應送出前都會過一次篩檢，攔截次數本身即為忠實度指標」——
     漏掉任何一條通道，那個計數就不是可報告的指標。 */
  out = out.map(function(x){
    const g = leakGuard(x.stem + ' ' + (x.hint || ''), item);
    return g.blocked ? null : x;
  }).filter(Boolean);
  cacheSet('similar', item.id, out);
  return out;
}


/* 內建引擎不「生成」新題——閱讀題離不開文本，憑空造題會造出沒有文本依據的題目。
   改為從現有題庫挑出「測同一項理解歷程」的題目：先取同一篇文本的，不足再跨文本補，
   讓老師拿得到可以直接用的替代題，而不是一段看起來像題目的生成文字。 */
/* 離線引擎不會憑空造閱讀題——它是從題庫裡挑同一項理解歷程的既有題目。
   那些題目正在施測中（前後測是同一份 16 題），所以每一題都要帶著
   來源 id 與所屬派題出去，讓呼叫端可以明明白白告訴老師。
   exclude 讓〈再出 3 題〉真的換一批，而不是把同樣三題再列一次。 */
function builtinSimilar(item, exclude){
  const ex = exclude || [];
  const sameProc = function(i){
    return i.type === 'mc' && i.id !== item.id && i.process === item.process && ex.indexOf(i.id) < 0;
  };
  const near = ITEMS.filter(function(i){ return sameProc(i) && i.unit === item.unit; });
  const far  = ITEMS.filter(function(i){ return sameProc(i) && i.unit !== item.unit; });
  const alt = near.concat(far).slice(0, 3).map(function(i){
    const inUse = state.assignments.filter(function(a){ return a.itemIds.indexOf(i.id) >= 0; });
    return {stem:i.stem, options:i.options, answer:i.answer,
            itemId:i.id, itemNo:i.no,
            inUse: inUse.map(function(a){ return a.title; }),
            hint:'同樣測「' + processName(i.process) + '」' +
                 (i.unit === item.unit ? '，同一篇文本' : '，取自' + textTitle(i.unit)) +
                 '。' + (i.note || '')};
  });
  return alt.length ? alt : [{stem:'（題庫裡測同一項理解歷程的選擇題已經全部列出了。' +
      '切換到外部語言模型可以依這篇文本即時生成；離線模式不會憑空造閱讀題。）',
    options:['—','—','—','—'], answer:0, exhausted:true,
    /* 「系統設定」在 RESEARCHER_ONLY，教師點不進去——不要給一條死路 */
    hint:'請研究者在「系統設定」切換引擎。'}];
}

   5. 貼文形成性回饋（知識建構評量）

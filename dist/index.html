/* ==========================================================================
   84-ui-kb.js — 知識建構空間（Knowledge Forum 式）
   視圖、貼文、支架、延伸貼文、躍升貼文、引用、註記、搜尋、閱讀狀態
   ========================================================================== */

/* 模組層級的 UI 狀態。每一個都要說清楚生命週期，否則就會像躍升選取模式
   那樣跨視圖殘留，讓學生在別的視圖點貼文打不開，還能建出跨視圖的假躍升。 */
let KBSEL = null;               // 躍升選取模式：存「哪一個視圖」，換視圖或離開 #/kb 即清
let KBPICK = {};                // 被選取的貼文，與 KBSEL 同生命週期
let KBSEARCH = {field:'content', q:''};   // 離開 #/kb 時清（換視圖保留，同一次找東西）
let EDIT = null;                // 編輯中的貼文草稿，closeModal() 時清

/* 測驗還沒交完的學生看到的門檻畫面。四個 KB 入口都先過這一關。 */
/* 測驗還沒交完的學生看到的門檻畫面。四個 KB 入口都先過這一關。
   文案依「實際擋住你的那一份作業」說話——寫死「前測」會在後測派出後變成謊話。 */
function kbGate(){
  const me = currentUser();
  if (!kbLocked(me)) return '';
  const pend = pendingAssignments(me.id);
  const blocking = pend[0];
  return '<div class="empty">' +
    '<h3>先把「' + esc(blocking.title) + '」交出來，這裡就會打開</h3>' +
    '<p style="max-width:62ch">這個地方放的是全班一起想的問題，那些問題是從大家的作答整理出來的。' +
    '如果你先看到別人怎麼想，就很難知道自己本來會怎麼讀了。</p>' +
    '<p class="muted small">還沒交的有 ' + pend.length + ' 份。</p>' +
    '<div class="row" style="margin-top:14px">' +
    pend.map(function(a){
      return '<a class="btn primary" href="#/' + (a.aal ? 'aal' : 'quiz') + '/' + a.id + '">' +
        esc(a.title) + '　' + (a.aal ? '開始這節課 →' : '開始作答 →') + '</a>';
    }).join('') +
    '<a class="btn" href="#/student">回我的作業</a></div></div>';
}

/* 視圖不屬於你這一班時的空狀態。不要用「權限不足」那種說法——
   對孩子而言那不是權限問題，是「這不是我們班的白板」。 */
function kbScopeBlock(){
  return '<div class="empty"><h3>這塊白板不是你們班的</h3>' +
    '<p style="max-width:60ch">每一個班有自己的知識建構空間，' +
    '你們班的討論在這裡。</p>' +
    '<a class="btn" href="#/kb">回知識建構空間</a></div>';
}

function viewKBList(){
  const gate = kbGate(); if (gate) return gate;
  const res = KBSEARCH.q ? searchNotes(KBSEARCH.field, KBSEARCH.q) : null;
  return sectionHead('知識建構空間', '每個視圖是一塊共同的白板。想法貼上去之後就屬於社群，任何人都可以延伸、挑戰、綜整。',
    (isTeacher() ? '<button class="btn" data-act="new-view">新增視圖</button>' : '')) +
  '<div class="kb-toolbar">' +
    '<label class="small muted" for="sf">搜尋</label>' +
    '<select id="sf" style="width:auto" data-act="search-field">' +
      [['title','標題'],['scaffold','支架'],['content','內容'],['author','作者'],['keyword','關鍵詞'],['date','建立日期']]
      .map(function(o){ return '<option value="' + o[0] + '"' + (KBSEARCH.field === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') +
    '</select>' +
    '<input type="text" id="sq" placeholder="輸入關鍵字…" value="' + esc(KBSEARCH.q) + '" style="max-width:260px" data-act="search-q">' +
    (KBSEARCH.q ? '<button class="btn sm" data-act="search-clear">清除</button>' : '') +
    '<div class="spacer"></div><span class="muted small">未讀 ' + notesForViewer().filter(isUnread).length + ' 則</span>' +
  '</div>' +
  (res ? '<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>搜尋結果</h3>' +
      '<span class="muted small">' + res.length + ' 則貼文符合</span></div><div class="card-p col">' +
      (res.map(noteRow).join('') || '<div class="muted small">沒有符合的貼文。</div>') + '</div></div>' : '') +
  /* 白板依班級隔離之後，還沒有討論的班會拿到空清單。空的格線沒有任何說明，
     孩子會以為壞掉了。示範資料只種了示範班，其餘三班在示範模式下本來就是空的。 */
  (viewsForViewer().length ? '' :
    '<div class="empty"><h3>你們班的討論還沒開始</h3>' +
    '<p style="max-width:62ch">等老師把大家卡住的那一題整理出來，' +
    '它就會出現在這裡，變成一塊你們班一起想的白板。</p>' +
    '<a class="btn" href="#/student">回我的作業</a></div>') +
  '<div class="grid g2">' + viewsForViewer().map(function(v){
    const ns = notesOfView(v.id);
    const un = ns.filter(isUnread).length;
    const it = v.origin ? getItem(v.origin.iid) : null;
    return '<div class="card"><div class="card-h"><h3>' + esc(v.title) + '</h3>' +
      (un ? '<span class="pill" style="border-color:var(--accent);color:var(--accent)">未讀 ' + un + '</span>' : '') + '</div>' +
      '<div class="card-p">' +
      '<p class="small muted">' + esc(v.desc) + '</p>' +
      /* 同上：學生版用中性色與中性語彙，不用紅色的迷思 pill。 */
      (it ? '<div class="pill ' + (isTeacher() ? 'q2' : '') + '" style="margin-bottom:8px">' +
            '<span class="dot"></span>' +
            (isTeacher() ? '源自迷思題：' : '大家在討論：') + itemLabel(v.origin.aid, it.id) + '</div>' : '') +
      '<div class="row small muted" style="gap:14px">' +
        '<span>' + ns.length + ' 則貼文</span>' +
        '<span>' + ns.filter(function(n){ return n.buildOn; }).length + ' 則延伸</span>' +
        '<span>' + ns.filter(function(n){ return n.kind === 'rise'; }).length + ' 則躍升</span>' +
        '<span>' + uniq(ns.reduce(function(a, n){ return a.concat(n.authorIds); }, [])).length + ' 位作者</span>' +
      '</div>' +
      (v.links && v.links.length ? '<div class="small muted" style="margin-top:8px">連結視圖：' +
        v.links.map(function(l){ const t = getView(l); return t ? '<a href="#/kb/' + l + '">' + esc(t.title) + '</a>' : ''; }).join('、') + '</div>' : '') +
      '<div class="row" style="margin-top:12px"><a class="btn primary sm" href="#/kb/' + v.id + '">進入視圖</a>' +
      (isTeacher() ? '<a class="btn sm" href="#/synth/' + v.id + '">想法串綜整</a>' : '') + '</div>' +
      '</div></div>';
  }).join('') + '</div>';
}

function noteRow(n){
  const v = getView(n.viewId);
  return '<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--rule-soft);padding-bottom:8px">' +
    '<div><a href="#/note/' + n.id + '"><b>' + esc(n.title) + '</b></a>' +
    '<div class="muted small">' + esc(noteAuthors(n)) + '　·　' + (v ? esc(v.title) : '') + '　·　' + fmtDate(n.createdAt) + '</div></div>' +
    '<span class="pill">' + esc(epiLabelFor(n)) + '</span></div>';
}

/* --- 視圖畫布 --- */
function viewKBCanvas(vid){
  const gate = kbGate(); if (gate) return gate;
  const v = getView(vid);
  if (!v) return '<div class="empty"><h3>找不到這個視圖</h3><a class="btn" href="#/kb">回知識建構空間</a></div>';
  /* 列表過濾擋不住直接打網址。條件是在班級層次操弄的，
     讓對照組讀得到 tutor 班的討論就是擴散污染。 */
  if (!viewVisible(vid)) return kbScopeBlock();
  /* 先清再組。選取模式綁在視圖上，換視圖就結束——否則工具列會寫著
     「選取中（2）」而畫布上沒有任何貼文帶外框，點貼文也打不開詳頁。 */
  if (KBSEL && KBSEL !== vid){ KBSEL = null; KBPICK = {}; }
  const ns = notesOfView(vid);
  const it = v.origin ? getItem(v.origin.iid) : null;

  const notesHTML = ns.map(function(n){
    const scaf = (n.segs || [])[0];
    const cls = ['note', n.kind === 'problem' ? 'problem' : '', n.kind === 'rise' ? 'rise' : '',
                 isUnread(n) ? 'unread' : '', KBPICK[n.id] ? 'sel' : ''].filter(Boolean).join(' ');
    const scls = scaf ? (scaffold(scaf.s) || {}).cls : '';
    /* aria-label 會吞掉整張卡的內容，改用 labelledby + describedby。
       但 role="button" 的 Children Presentational 為 true——卡內所有子節點的
       語意都被移除，所以 .nf（未讀、作者、回應／閱讀／註記數）也必須被
       describedby 明確參照，否則報讀器一律拿不到。 */
    /* 座標存的是 viewBox 單位（100% 字級下的 px），畫成 rem 讓整張畫布
       隨字級等比縮放——貼文寬度本來就會長，座標不跟著長就會互相重疊。 */
    return '<div class="' + cls + ' ' + (scls || '') +
      '" style="left:' + (n.x / 20) + 'rem;top:' + (n.y / 20) + 'rem"' +
      ' data-note="' + n.id + '" tabindex="0" role="button"' +
      /* 只有在選取模式下才是「可切換」的按鈕。非選取模式輸出 aria-pressed
         會讓報讀器把每一張貼文都唸成「未按下」。 */
      (KBSEL === v.id ? ' aria-pressed="' + (KBPICK[n.id] ? 'true' : 'false') + '"' : '') +
      ' aria-labelledby="nt-' + n.id + '" aria-describedby="nb-' + n.id + ' nf-' + n.id + '">' +
      '<div class="nt" id="nt-' + n.id + '">' + esc(n.title) + '</div>' +
      (scaf ? '<div class="small" style="color:var(--' + ((scaffold(scaf.s) || {}).cls || '').replace('sc', 'sc-') +
        ');font-size:0.55rem;font-weight:600;margin-bottom:2px">' + esc(scaffoldLabel(scaf.s)) + '</div>' : '') +
      '<div class="nb" id="nb-' + n.id + '">' + esc((scaf ? scaf.text : '').slice(0, 90)) + '</div>' +
      /* 未讀原本只用一條顏色細線傳達（1.4.1），補一個記號與報讀器文字。
         放在 .nf 那一列，不要放標題前——卡片只有 13.2rem 寬，會提早折行。 */
      '<div class="nf" id="nf-' + n.id + '">' +
        (isUnread(n) ? '<span class="sr-only">未讀。</span>' +
                       '<span class="unread-dot" aria-hidden="true">●</span>' : '') +
        '<span>' + esc(noteAuthors(n)) + '</span>' +
        /* 符號各補一段報讀器文字，否則會被唸成符號名 */
        (childrenOf(n.id).length ? '<span><span aria-hidden="true">↳</span>' + childrenOf(n.id).length +
          '<span class="sr-only"> 則回應</span></span>' : '') +
        ((n.reads || []).length ? '<span><span aria-hidden="true">👁</span>' + n.reads.length +
          '<span class="sr-only"> 人已讀</span></span>' : '') +
        ((n.annotations || []).length ? '<span><span aria-hidden="true">✎</span>' + n.annotations.length +
          '<span class="sr-only"> 則註記</span></span>' : '') +
      '</div></div>';
  }).join('');

  // 連線
  const pos = {};
  /* 連線畫在 viewBox 0 0 1600 1100 的座標系裡，那是固定的：畫布改用 rem
     之後整張圖等比縮放，錨點不可以再乘上當下的字級（乘了的話，
     改字級不會重繪畫布，座標會停在改字級前的值）。
     264 就是 13.2rem 在 100% 字級下的值，也就是一個 viewBox 單位的卡寬。 */
  const NOTE_W = 264;
  ns.forEach(function(n){ pos[n.id] = {x: n.x + NOTE_W / 2 - 24, y: n.y + 40}; });
  const edges = [];
  ns.forEach(function(n){
    if (n.buildOn && pos[n.buildOn]) edges.push(curve(pos[n.buildOn], pos[n.id], 'build'));
    (n.contains || []).forEach(function(c){ if (pos[c]) edges.push(curve(pos[c], pos[n.id], 'rise')); });
    (n.refs || []).forEach(function(r){ if (pos[r.noteId]) edges.push(curve(pos[r.noteId], pos[n.id], 'ref')); });
  });

  return sectionHead(v.title, v.desc, '<a class="btn" href="#/kb">← 所有視圖</a>' +
      (isTeacher() ? '<a class="btn" href="#/synth/' + v.id + '">想法串綜整</a>' : '')) +
    (it ? '<div class="card card-p" style="margin-bottom:14px;border-left:3px solid var(--q2)">' +
      '<div class="eyebrow">這個視圖從哪裡來</div>' +
      /* 學生只看到作業名稱的純文字：那條連結會直接把他帶到含 16 題正解的分析頁 */
      '<p class="small" style="margin-top:6px">來自 ' + (isTeacher() ? '<a href="#/assign/' + v.origin.aid + '">' : '<span>') +
      esc((getAssignment(v.origin.aid) || {}).title || '') + (isTeacher() ? '</a>' : '</span>') +
      /* 「迷思」是教師與研究端的術語，不放在學生每天要進來的社群空間裡。
         在這裡把一張視圖標成「源自迷思題」，等於當著全班的面宣告這是
         「大家答錯的那題」——與知識建構論「真實想法、真實問題」的預設相反。 */
      (isTeacher() ? ' ' + itemLabel(v.origin.aid, it.id) + '的 KIDMAP 迷思象限。</p>'
                   : ' ' + itemLabel(v.origin.aid, it.id) + '。這一題有不少同學讀法不一樣，所以拿出來一起想。</p>') +
      '<div class="item"><div class="stem">' + esc(it.stem) + '</div>' +
      '<div class="muted small">' + it.options.map(function(o, k){ return String.fromCharCode(65 + k) + '. ' + esc(o); }).join('　') + '</div></div>' +
      '</div>' : '') +
    '<div class="kb-toolbar">' +
      '<button class="btn primary sm" data-act="new-note" data-id="' + v.id + '">貼一則新想法</button>' +
      '<button class="btn sm' + (KBSEL === v.id ? ' primary' : '') +
        '" data-act="toggle-sel" data-id="' + v.id + '">' +
        (KBSEL === v.id ? '選取中（' + Object.keys(KBPICK).length + '）' : '選取貼文做躍升') + '</button>' +
      (KBSEL === v.id && Object.keys(KBPICK).length >= 2 ?
        '<button class="btn sm" data-act="make-rise" data-id="' + v.id + '">建立躍升貼文</button>' : '') +
      '<div class="spacer"></div>' +
      '<span class="legend small">' +
        '<span><i class="swatch" style="background:var(--accent)"></i>延伸</span>' +
        '<span><i class="swatch" style="background:var(--sc-6)"></i>躍升收攏</span>' +
        '<span><i class="swatch" style="background:var(--sc-5)"></i>引用</span>' +
      '</span>' +
    '</div>' +
    '<div class="canvas" id="canvas"><div class="canvas-inner" id="canvasInner">' +
      '<svg class="edges" viewBox="0 0 1600 1100" preserveAspectRatio="none">' + edges.join('') + '</svg>' +
      notesHTML + '</div></div>' +
    '<div class="row" style="margin-top:10px"><span class="muted small">拖曳貼文可以重新安排版面，位置會存下來。' +
    '點一下貼文開啟完整內容、延伸與註記。</span></div>' +
    '<div class="card" style="margin-top:16px"><div class="card-h"><h3>這個視圖的支架使用</h3></div><div class="card-p">' +
      scaffoldUsageBar(ns) + '</div></div>';
}

function curve(a, b, cls){
  const mx = (a.x + b.x) / 2;
  return '<path class="' + cls + '" d="M' + a.x + ' ' + a.y + ' C' + mx + ' ' + a.y + ' ' + mx + ' ' + b.y + ' ' + b.x + ' ' + b.y + '"/>';
}

function scaffoldUsageBar(ns){
  const c = {};
  ns.forEach(function(n){ (n.segs || []).forEach(function(g){ c[g.s] = (c[g.s] || 0) + 1; }); });
  const mx = Math.max.apply(null, SCAFFOLDS.map(function(s){ return c[s.id] || 0; }).concat([1]));
  return '<div class="col">' + SCAFFOLDS.map(function(s){
    const n = c[s.id] || 0;
    return '<div class="rub-row"><span class="' + s.cls + '" style="border-left:3px solid;padding-left:8px">' + esc(s.label) + '</span>' +
      '<div class="bar"><i style="width:' + (100 * n / mx) + '%;background:var(--' + s.cls.replace('sc', 'sc-') + ')"></i></div>' +
      '<span class="lv">' + n + '</span></div>';
  }).join('') + '</div>' +
  '<p class="muted small" style="margin-top:10px">支架分布反映論述的形態。若「' + esc(scaffoldLabel('s1')) + '」遠多於「' + esc(scaffoldLabel('s4')) + '」與「' + esc(scaffoldLabel('s5')) + '」，' +
  '代表大家在各說各話，想法還沒有真的被改進。</p>';
}

/* --- 貼文詳頁 --- */
function viewNote(nid){
  const gate = kbGate(); if (gate) return gate;
  const n = getNote(nid);
  if (!n) return '<div class="empty"><h3>找不到這則貼文</h3><a class="btn" href="#/kb">回知識建構空間</a></div>';
  /* 直接打網址也要擋，而且要在 markRead 之前——否則光是打開別班的貼文，
     就會把自己寫進那則貼文的 reads（那是 KB 指數的原料）。 */
  if (!viewVisible(n.viewId)) return kbScopeBlock();
  markRead(nid);
  const v = getView(n.viewId);
  const root = threadRootOf(n);
  const seq = threadOf(root.id);
  const fb = cacheGet('note', n.id);
  const me = currentUser();
  /* 畫面要反映守門。按鈕留著、按下去被擋，使用者收到的是假成功；
     按鈕直接消失又會讓老師找不到平常有的那顆鈕，所以要說一句。 */
  const canEdit = !isImpersonating() && (n.authorIds.indexOf(me.id) >= 0 || isTeacher());

  return sectionHead(n.title, (v ? v.title + '　·　' : '') + noteAuthors(n) + '　·　' + fmtDateTime(n.createdAt),
    '<a class="btn" href="#/kb/' + n.viewId + '">← 回視圖</a>' +
    (canEdit ? '<button class="btn sm" data-act="edit-note" data-id="' + n.id + '">編輯</button>' : '')) +
  (isImpersonating() ? '<div class="card card-p" style="margin-bottom:12px">' +
    '<p class="small" style="margin:0">代為檢視中，只能看不能改——編輯、刪除、加註記與' +
    '「重做這節課」都停用了，' +
    '你的操作不會記到這位學生名下。</p></div>' : '') +
  '<div class="grid split" style="--cols:minmax(0,1.6fr) minmax(280px,1fr);gap:16px">' +
  '<div class="col">' +
    noteFullHTML(n, true) +
    '<div class="card"><div class="card-h"><h3>這條想法串</h3>' +
      '<span class="muted small">' + seq.length + ' 則</span></div><div class="card-p">' +
      seq.map(function(x){
        const cur = x.note.id === n.id;
        return '<div style="margin-left:' + (x.depth * 16) + 'px;margin-bottom:8px">' +
          '<div class="row" style="gap:8px"><span class="pill">' + (x.depth ? '↳' : '●') + '</span>' +
          (cur ? '<b>' + esc(x.note.title) + '</b>' : '<a href="#/note/' + x.note.id + '">' + esc(x.note.title) + '</a>') +
          '<span class="muted small">' + esc(noteAuthors(x.note)) + '</span>' +
          '<span class="pill">' + esc(epiLabelFor(x.note)) + '</span></div></div>';
      }).join('') + '</div></div>' +
    '<div class="card"><div class="card-h"><h3>延伸這則想法</h3></div><div class="card-p">' +
      '<div class="sc-btns" style="margin-bottom:10px">' + SCAFFOLDS.map(function(s){
        return '<button class="sc-btn ' + s.cls + '" data-act="buildon" data-id="' + n.id + '" data-sc="' + s.id + '">' +
          esc(s.label) + '</button>';
      }).join('') + '</div>' +
      '<p class="muted small">選一個支架開始寫。支架不是格式要求，是提醒你這一則想做的事：提出理論、指出不懂的地方、' +
      '帶進新資訊、挑戰現有說法、提出更好的版本，或把大家的想法綜整起來。</p></div></div>' +
  '</div>' +
  '<div class="col">' +
    /* 整張卡只給教師。它會給貼文作者「一個可以立刻做的下一步」——那就是
       個人化鷹架，四個條件都拿得到、不限次數、在 MAX_TURNS 之外，
       對照組因此會變成第四種處理。學生端唯一的 AI 通道是作答頁的夥伴。 */
    (isTeacher()
      ? '<div class="card"><div class="card-h"><h3>AI 形成性回饋</h3>' +
        '<button class="btn sm" data-act="ai-note" data-id="' + n.id + '">' + (fb ? '重新分析' : '分析') + '</button></div>' +
        '<div class="card-p"><div id="out-ai-note" class="' + (fb ? 'ai-out' : 'muted small') + '">' +
        (fb ? md(fb) : '會評這則貼文對社群知識的貢獻、想法改進落在哪一級，以及可以立刻做的下一步。不會直接給答案。') +
        '</div></div></div>'
      : '') +
    '<div class="card"><div class="card-h"><h3>註記</h3><span class="muted small">' + (n.annotations || []).length + ' 則</span></div>' +
      '<div class="card-p col">' + ((n.annotations || []).map(function(a){
        return '<div style="border-left:2px solid var(--rule);padding-left:10px">' +
          '<div class="muted small">' + esc(userName(a.authorId)) + '　' + fmtDate(a.at) + '</div>' +
          '<div class="small">' + nl2br(a.text) + '</div></div>';
      }).join('') || '<div class="muted small">還沒有人加註記。</div>') +
      '<div class="field" style="margin-top:8px"><textarea id="annText" placeholder="加一則註記（不會改動原貼文）"></textarea>' +
      '<button class="btn sm" data-act="add-ann" data-id="' + n.id + '">送出註記</button></div>' +
      '</div></div>' +
    '<div class="card"><div class="card-h"><h3>閱讀情形</h3></div><div class="card-p">' +
      '<div class="row" style="gap:5px">' + ((n.reads || []).map(function(r){
        return '<span class="pill">' + esc(userName(r)) + '</span>'; }).join('') || '<span class="muted small">還沒有人讀過。</span>') + '</div>' +
      '<p class="muted small" style="margin-top:10px">閱讀紀錄用來看社群是否真的在互相參照，不作為給分依據。</p></div></div>' +
  '</div></div>';
}

function noteFullHTML(n, full){
  const it = n.itemRef ? getItem(n.itemRef.iid) : null;
  return '<div class="card"><div class="card-p">' +
    '<div class="row" style="justify-content:space-between;margin-bottom:10px">' +
      '<span class="row" style="gap:6px">' +
        (n.kind === 'problem' ? '<span class="pill q2"><span class="dot"></span>共同問題</span>' : '') +
        (n.kind === 'rise' ? '<span class="pill" style="color:var(--sc-6);border-color:var(--sc-6)">躍升貼文</span>' : '') +
        '<span class="pill">' + esc(epiLabelFor(n)) + '</span>' +
      '</span>' +
      '<span class="meta">' + fmtDateTime(n.createdAt) + (n.editedAt ? '（已修改）' : '') + '</span>' +
    '</div>' +
    (n.segs || []).map(function(g){
      const s = scaffold(g.s) || {cls:'', label:''};
      return '<div class="sc-seg ' + s.cls + '"><span class="lab">' + esc(s.label) + '</span>' + nl2br(g.text) + '</div>';
    }).join('') +
    (it ? '<div class="item" style="margin-top:10px"><div class="eyebrow">連結的題目</div>' +
      '<div class="stem">' + esc(it.stem) + '</div></div>' : '') +
    ((n.refs || []).length ? '<div style="margin-top:10px"><div class="eyebrow">引用</div>' +
      n.refs.map(function(r){
        const t = getNote(r.noteId);
        return '<blockquote style="margin:6px 0;padding:6px 12px;border-left:3px solid var(--sc-5)">「' +
          esc(r.quote) + '」<div class="muted small">— <a href="#/note/' + r.noteId + '">' +
          esc(t ? t.title : '已刪除的貼文') + '</a></div></blockquote>';
      }).join('') + '</div>' : '') +
    ((n.contains || []).length ? '<div style="margin-top:10px"><div class="eyebrow">這則躍升收攏了</div>' +
      '<div class="row" style="gap:6px;margin-top:6px">' + n.contains.map(function(c){
        const t = getNote(c);
        return t ? '<a class="pill" href="#/note/' + c + '">' + esc(t.title) + '</a>' : '';
      }).join('') + '</div></div>' : '') +
    ((n.keywords || []).length ? '<div class="row" style="gap:5px;margin-top:10px">' +
      n.keywords.map(function(k){ return '<span class="pill">#' + esc(k) + '</span>'; }).join('') + '</div>' : '') +
    '<div class="meta" style="margin-top:12px">作者：' + esc(noteAuthors(n)) +
      '　·　被延伸 ' + childrenOf(n.id).length + ' 次　·　閱讀 ' + (n.reads || []).length + ' 人次</div>' +
    '</div></div>';
}

/* --- 貼文編輯器 --- */
function openNoteEditor(o){
  EDIT = {
    id: o.id || null,
    viewId: o.viewId,
    title: o.title || '',
    segs: o.segs && o.segs.length ? o.segs.slice() : [{s: o.scaffold || 's1', text:''}],
    keywords: (o.keywords || []).join('、'),
    authorIds: o.authorIds || [currentUser().id],
    buildOn: o.buildOn || null,
    contains: o.contains || [],
    refs: o.refs || [],
    kind: o.kind || 'note',
    x: o.x, y: o.y
  };
  renderEditor();
}

function renderEditor(opts){
  const parent = EDIT.buildOn ? getNote(EDIT.buildOn) : null;
  /* 引用清單同樣不可跨班——跨班引用會在 SNA 裡建出不存在的連結，
     而且會讓對照組讀到三個 AI 組的貼文標題。 */
  const others = notesForViewer().filter(function(n){ return n.id !== EDIT.id; });
  modal(
    '<div class="modal-h"><h3>' + (EDIT.id ? '編輯貼文' : (EDIT.kind === 'rise' ? '建立躍升貼文' : (parent ? '延伸：' + esc(parent.title) : '貼一則新想法'))) + '</h3>' +
    '<button class="btn sm ghost" data-act="close-modal">關閉</button></div>' +
    '<div class="modal-b col">' +
    (parent ? '<div class="ai-out small"><strong>你正在延伸：</strong>' + esc(parent.title) + '<br>' +
      esc(shortStem(noteText(parent))) + '</div>' : '') +
    '<div class="field"><label for="ntitle">標題</label>' +
      '<input id="ntitle" type="text" value="' + esc(EDIT.title) + '" placeholder="用一句話說出你的想法，不要只寫「我的答案」"></div>' +
    '<div><div class="eyebrow" style="margin-bottom:6px">支架段落</div>' +
    EDIT.segs.map(function(g, i){
      const s = scaffold(g.s) || SCAFFOLDS[0];
      return '<div class="sc-seg ' + s.cls + '" style="margin-bottom:12px">' +
        '<div class="row" style="margin-bottom:6px">' +
        '<select data-act="seg-sc" data-i="' + i + '" style="width:auto">' + SCAFFOLDS.map(function(x){
          return '<option value="' + x.id + '"' + (x.id === g.s ? ' selected' : '') + '>' + esc(x.label) + '</option>';
        }).join('') + '</select>' +
        '<span class="muted small">' + esc(s.hint) + '</span><div class="spacer"></div>' +
        (EDIT.segs.length > 1 ? '<button class="btn sm ghost" data-act="seg-del" data-i="' + i + '">移除</button>' : '') +
        '</div>' +
        '<textarea data-act="seg-text" data-i="' + i + '" placeholder="' + esc(s.hint) + '">' + esc(g.text) + '</textarea>' +
        '</div>';
    }).join('') +
    '<button class="btn sm" data-act="seg-add">＋ 再加一個支架段落</button></div>' +
    '<div class="field"><label for="nkw">關鍵詞（用、分隔）</label>' +
      '<input id="nkw" type="text" value="' + esc(EDIT.keywords) + '" placeholder="伏筆、線索、證據"></div>' +
    /* 共同作者：核取方塊，不是 <select multiple>。
       原生 multiple select 在不按 Ctrl／⌘ 時單點會「取代」整個選取集合——
       平板觸控與鍵盤使用者點第二個名字就會把自己刪掉，而 canEdit 要求
       本人在 authorIds 裡，於是他再也編輯不回來。核取方塊沒有這個行為。
       名單只列同班同學：班級＝實驗條件，跨班共同署名會同時污染兩個條件的
       知識建構依變項。本人固定顯示、不可取消。 */
    (function(){
      const me = currentUser();
      const mates = ((isTeacher() ? currentClass() : classOfStudent(me.id)) || {studentIds:[]}).studentIds || [];
      const pick = mates.filter(function(sid){ return sid !== me.id; });
      return '<div class="field"><span class="lbl">共同作者</span>' +
        '<p class="muted small" style="margin:2px 0 6px">' + esc(userName(me.id)) +
        '（你）一定會列在作者裡。要一起署名的同學再勾起來。</p>' +
        '<div class="authpick" role="group" aria-label="共同作者">' + pick.map(function(sid){
          return '<label class="opt"><input type="checkbox" data-act="auth-pick" value="' + sid + '"' +
            (EDIT.authorIds.indexOf(sid) >= 0 ? ' checked' : '') + '>' +
            '<span>' + esc(userName(sid)) + '</span></label>';
        }).join('') + '</div></div>';
    })() +
    '<div class="field"><label for="nref">引用其他貼文</label>' +
      '<select id="nref" style="width:100%"><option value="">（不引用）</option>' +
      others.map(function(n){ return '<option value="' + n.id + '">' + esc(n.title) + ' — ' + esc(noteAuthors(n)) + '</option>'; }).join('') +
      '</select><input id="nquote" type="text" placeholder="引用的句子" style="margin-top:6px"></div>' +
    '</div>' +
    '<div class="modal-f"><button class="btn" data-act="close-modal">取消</button>' +
    (EDIT.id ? '<button class="btn danger" data-act="del-note" data-id="' + EDIT.id + '">刪除這則</button>' : '') +
    '<button class="btn primary" data-act="save-note">貼上去</button></div>',
    {wide:false, focus:(opts && opts.focus) || null});
}

function collectEditor(){
  const t = $('#ntitle'); if (t) EDIT.title = t.value;
  const k = $('#nkw'); if (k) EDIT.keywords = k.value;
  /* 本人恆在作者名單裡，而且排第一。少了這一行，孩子一次誤點就把
     自己的貼文永久交給別人（canEdit 需要本人在名單內，沒有復原路徑）。 */
  const me = currentUser().id;
  const picked = $$('[data-act="auth-pick"]:checked').map(function(el){ return el.value; });
  EDIT.authorIds = [me].concat(picked.filter(function(x){ return x !== me; }));
  $$('[data-act="seg-text"]').forEach(function(el){ EDIT.segs[+el.dataset.i].text = el.value; });
  const r = $('#nref'), q = $('#nquote');
  if (r && r.value && q && q.value.trim()){
    EDIT.refs = [{noteId:r.value, quote:q.value.trim()}];
  }
}

function saveEditor(){
  collectEditor();
  if (!EDIT.title.trim()){ toast('請先給這則貼文一個標題。'); return; }
  if (!EDIT.segs.some(function(g){ return g.text.trim(); })){ toast('至少寫一段內容再貼上去。'); return; }
  const kws = EDIT.keywords.split(/[、,，\s]+/).filter(Boolean);
  const payload = {title:EDIT.title.trim(), segs:EDIT.segs.filter(function(g){ return g.text.trim(); }),
                   keywords:kws, authorIds:EDIT.authorIds, refs:EDIT.refs};
  if (EDIT.id){
    const n2 = updateNote(EDIT.id, payload);
    toast(n2 ? '已更新。' : '代為檢視時不能替學生改貼文。');
  } else {
    const n = createNote(Object.assign({viewId:EDIT.viewId, buildOn:EDIT.buildOn, kind:EDIT.kind,
      contains:EDIT.contains, x:EDIT.x, y:EDIT.y}, payload));
    /* createNote 在代為檢視時回 null。不檢查的話會先跳「已貼上去」的成功訊息，
       再在 n.id 丟 TypeError——使用者看到的是「大聲的假成功」。 */
    if (!n){ closeModal(); EDIT = null; toast('代為檢視時不能替學生貼想法。'); return; }
    toast('已貼上去。想法現在屬於社群了。');
    closeModal(); EDIT = null; go('#/note/' + n.id); return;
  }
  closeModal(); EDIT = null; render();
}

function dashDual(){
  const dt = dualTrack();
  const zones = ['A','B','C','D'];
  const counts = {}; zones.forEach(function(z){ counts[z] = dt.rows.filter(function(r){ return r.zone === z; }).length; });
  return '<div class="grid split" style="--cols:minmax(0,1.15fr) minmax(300px,.85fr);gap:16px">' +
    '<div class="card"><div class="card-h"><h3>能力變化 × 論述參與</h3>' +
      '<span class="muted small">分界線為 ' + esc(kbClass().name) + ' 的中位數</span></div>' +
      '<div class="card-p">' + dualSVG(dt) + '</div></div>' +
    '<div class="col">' + zones.map(function(z){
      const Z = DUAL_ZONE[z];
      const rows = dt.rows.filter(function(r){ return r.zone === z; });
      return '<div class="card"><div class="card-p">' +
        '<div class="row" style="justify-content:space-between;margin-bottom:6px">' +
        '<span class="pill ' + Z.cls + '"><span class="dot"></span>' + z + '　' + Z.name + '</span>' +
        '<span class="num" style="font-size:1rem;font-weight:600">' + counts[z] + '</span></div>' +
        '<p class="small muted">' + esc(Z.desc) + '</p>' +
        /* 處方卡不能只給人數：這一格裡有幾位的 Δθ 根本在測量誤差範圍內，
           老師要先知道，才不會照著一個不可信的數字安排介入。 */
        (function(){
          const ns = rows.filter(function(r){ return r.delta != null && !r.sig; }).length;
          return ns ? '<p class="small" style="color:var(--warn);margin:4px 0 0">其中 ' + ns +
            ' 位的變化在測量誤差範圍內，不宜當成真的進步或退步。</p>' : '';
        })() +
        '<div class="row" style="gap:5px;margin-top:6px">' + rows.map(function(r){
          return '<button type="button" class="pill" data-act="asrole" data-id="' + r.sid + '">' +
            esc(userName(r.sid)) + '</button>'; }).join('') + '</div>' +
        '</div></div>';
    }).join('') + '</div></div>' +
    '<div class="card" style="margin-top:16px"><div class="card-p">' +
    '<h4>為什麼要兩軸一起看</h4>' +
    '<p class="small" style="margin-top:8px;max-width:70ch">只看 Δθ，會把安靜自學的學生與帶著全班往前走的學生看成一樣；' +
    '只看貼文量，會把熱心但沒有改變理解的參與誤判為學習。B 區（論述多但沒進步）與 C 區（進步但不發言）是兩種完全不同的教學處方，' +
    '而它們在任何單軌系統裡都看不見。</p>' +
    '<p class="muted small">注意：Δθ 帶有測量誤差。若某位學生的 Δθ 小於其 θ 標準誤的兩倍，不應解讀為真的進步。</p>' +
    '</div></div>';
}

  A:{name:'你把討論變成了自己的理解',
     desc:'你在課堂上說出來的想法，後測也看得出來變化。繼續這樣讀。'},
  B:{name:'你講了很多，下一步是把它變成自己的',
     desc:'你貼了不少想法。試著挑一則你同意的，寫出「我為什麼也這樣想」的理由，而不只是說「我同意」。'},
  C:{name:'你自己讀懂了，還沒說出來',
     desc:'你的理解有進步。班上有同學正卡在你已經想通的地方，把你的想法貼出去，他們會需要。'},
  D:{name:'這節課還在起步',
     desc:'先挑一題你最有話想說的，用「我的想法」支架貼一則就好。一則就夠。'}
};

function viewMyGrowth(){
  const me = currentUser();
  if (me.role !== 'student') return '<div class="empty"><h3>這一頁是學生看的</h3>' +
    '<a class="btn" href="#/teacher">回教師後台</a></div>';

  /* 與 viewResult 同一道門檻，理由相同：這一頁會說「比課前有沒有進步：有往上」，
     那是比分數更直接的績效回饋，而它就掛在側欄，整份問卷期間都點得到。
     這裡原本連「有沒有交卷」都沒查。 */
  if (submitted('a-post', me.id) && !surveyOf(me.id, 'post')){
    return '<div class="empty"><h3>先把這節課的問卷填完</h3>' +
      '<p style="max-width:60ch">問卷問的是你剛剛上這節課的感覺。先看到自己有沒有進步再回答，' +
      '你的感覺就會被那個結果帶著走——所以我們把這一頁先收起來。填完就會打開。</p>' +
      '<div class="row" style="margin-top:14px">' +
      '<a class="btn primary" href="#/survey/post">去填課後問卷 →</a>' +
      '<a class="btn" href="#/student">回我的作業</a></div></div>';
  }

  /* 不走 dualTrack()：那一份只涵蓋知識建構示範班（settings.kbClassId）的 24 人，
     其餘 72 人會直接撞到空狀態。diagnose 的 roster 是四班 96 人，四個條件都有資料。 */
  const pre  = diagnose(state, 'a-pre');
  const post = diagnose(state, 'a-post');
  const pp = pre  && pre.ready  ? pre.perStudent.find(function(p){ return p.sid === me.id; })  : null;
  const qp = post && post.ready ? post.perStudent.find(function(p){ return p.sid === me.id; }) : null;
  if (!pp && !qp) return '<div class="empty"><h3>還沒有可以看的紀錄</h3>' +
    '<p style="max-width:60ch">你的紀錄要等前測與後測都完成之後才算得出來。</p>' +
    '<a class="btn" href="#/student">回我的作業</a></div>';

  /* 母體是「自己班」，不是示範班。用預設範圍的話，示範班以外的 72 位學生
     一律拿到空物件——左卡寫「貼出想法 0」，右卡同一畫面卻寫「我貼過 1 則」。 */
  const myClass = classOfStudent(me.id);
  const mates = myClass ? myClass.studentIds : [];
  const dsAll = discourseStats(mates);
  const ds = dsAll.find(function(s){ return s.sid === me.id; }) || {};
  /* 也要依班——否則被跨班掛名的孩子首頁「我貼的想法」+1、點進去卻被守門擋掉 */
  const myNotes = notesForViewer().filter(function(n){ return n.authorIds.indexOf(me.id) >= 0; });
  const thetaPre  = pp ? pp.theta : null;
  const thetaPost = qp ? qp.theta : null;
  const delta = (thetaPre != null && thetaPost != null) ? thetaPost - thetaPre : null;
  /* 「還沒有這份測驗的資料」不是 0。寫成 0 的話，後測都還沒發生，
     孩子就被一張綠色卡片告知「本來會卻答錯的題數 3 → 0」——
     那正好污染後測本身與課後問卷要量的自我效能。 */
  const q2Pre  = pp ? pp.q[2] : null;
  const q2Post = qp ? qp.q[2] : null;

  /* 這一班有沒有討論紀錄。沒有的話走降級版面，但卡片數與尺寸一模一樣，
     四個條件看到的版面幾何必須相同，否則介面差異會混進依變項。 */
  const classNotes = state.notes.filter(function(n){
    return n.authorIds.some(function(a){ return mates.indexOf(a) >= 0; }); });
  const hasKB = classNotes.length > 0;

  let zone = 'D';
  if (hasKB){
    /* 切點用同班同學的中位數，不用全體 */
    const all = dsAll;
    const kbis = all.map(function(s){ return s.kbi; }).sort(function(a, b){ return a - b; });
    const kmed = kbis.length ? kbis[Math.floor(kbis.length / 2)] : 0;
    const deltas = mates.map(function(sid){
      const a = pre  && pre.ready  ? pre.perStudent.find(function(p){ return p.sid === sid; })  : null;
      const b = post && post.ready ? post.perStudent.find(function(p){ return p.sid === sid; }) : null;
      return (a && b) ? b.theta - a.theta : null;
    }).filter(function(x){ return x != null; }).sort(function(a, b){ return a - b; });
    const dmed = deltas.length ? deltas[Math.floor(deltas.length / 2)] : 0;
    const dHigh = delta != null && delta >= dmed;      // 算不出來一律歸「低」
    /* 沒有資料就不是高參與。少了後兩個條件，kmed 為 0 時 0>=0 恆真，
       班上只要有任何一則貼文，一個字都沒貼的孩子也會被誇「你把討論
       變成了自己的理解」。 */
    const kHigh = all.length > 0 && (ds.notes || 0) > 0 && (ds.kbi || 0) >= kmed;
    zone = dHigh ? (kHigh ? 'A' : 'C') : (kHigh ? 'B' : 'D');
  }
  const Z = DUAL_ZONE_STUDENT[zone];

  return sectionHead('我的學習軌跡', me.name) +
    '<div class="grid g4" style="margin-bottom:16px">' +
      /* 這一頁原本把 Rasch 的 logit 原值直接印給十歲孩子看
         （「這次讀懂的程度 -1.95」「比課前進步 -2.99」）。第 1 輪把
         #/result 的 θ 換成星等，這一頁漏掉了——本輪回報密度最高的一條。
         負數對孩子沒有意義，而且那是一個可以互相比較的數字。 */
      /* 後測還沒有資料時不要 fallback 到前測：值會是前測的星等、
         副標卻寫「等課後那份做完」——同一張卡上兩個不同的測量。 */
      statCard('這次讀得怎麼樣',
        thetaPost != null ? readingStars(thetaPost, post && post.meanTheta) : '—',
        thetaPost != null ? '五顆星是這次讀得最穩的' : '等課後那份做完') +
      statCard('比課前有沒有進步',
        delta == null ? '—' : (delta > 0.15 ? '有往上' : (delta < -0.15 ? '這次比較不順' : '差不多')),
        delta == null ? '等課後那份做完'
          : (delta > 0.15 ? '課後比課前讀得更穩了'
            : (delta < -0.15 ? '一次結果不代表什麼，回去看看哪幾題卡住'
              : '前後差不多')),
        delta != null && delta > 0.15 ? 'good' : '') +
      /* good 樣式要同時看 Δθ：θ 掉下去時 q2 也可能一起減少，
         那時標綠會跟旁邊的「這次比較不順」互相矛盾。 */
      statCard('可惜的題目',
        (q2Pre == null || q2Post == null) ? '—' : (q2Pre + ' → ' + q2Post),
        (q2Post == null) ? '等課後那份做完' : '這些是最值得回頭看的題目',
        (q2Post != null && q2Pre != null && delta != null && delta > 0.15 && q2Post < q2Pre) ? 'good' : '') +
      (hasKB
        ? statCard('討論參與度', ds.kbi || 0, '把想法貼出來、也接住別人的想法')
        : statCard('討論參與度', '—', '你們班的知識建構空間還沒有討論紀錄')) +
    '</div>' +
    '<div class="grid g2">' +
      '<div class="card"><div class="card-p">' +
        (hasKB
          ? '<div class="pill"><span aria-hidden="true">◆</span>' + esc(Z.name) + '</div>' +
            '<p class="small" style="margin-top:10px">' + esc(Z.desc) + '</p>'
          : '<div class="pill"><span aria-hidden="true">◆</span>這節課還在起步</div>' +
            '<p class="small" style="margin-top:10px">你們班的知識建構空間還沒有討論紀錄。' +
            '等大家開始貼想法之後，這裡會告訴你你的想法被接住了幾次。</p>') +
        '<hr class="hr">' +
        '<h4>你在討論裡做了什麼</h4>' +
        '<div class="col" style="margin-top:8px">' +
        [['貼出想法', ds.notes || 0], ['接住別人的想法', ds.buildMade || 0],
         ['你的想法被接住', ds.buildGot || 0], ['讀過別人的貼文', ds.reads || 0],
         ['用過幾種開頭句', (ds.scaffoldKinds || 0) + ' / 6'],
         ['用到的關鍵詞', ds.termCount || 0],
         ['說理的深度', fx(ds.epi, 1) + ' / 4']].map(function(p){
          return '<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--rule-soft);padding-bottom:5px">' +
            '<span class="small">' + p[0] + '</span><span class="num">' + p[1] + '</span></div>';
        }).join('') + '</div>' +
      '</div></div>' +
      '<div class="card"><div class="card-h"><h3>我貼過的想法</h3><span class="muted small">' + myNotes.length + ' 則</span></div>' +
      '<div class="card-p col">' + (myNotes.map(function(n){
        return '<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--rule-soft);padding-bottom:6px">' +
          '<a href="#/note/' + n.id + '">' + esc(n.title) + '</a>' +
          '<span class="pill">' + esc(epiLabelFor(n)) + '</span></div>';
      }).join('') || '<div class="muted small">還沒貼過想法。到知識建構空間貼第一則吧。</div>') + '</div></div>' +
    '</div>';
}

function viewStudent(){
  const me = currentUser();
  const k = classOfStudent(me.id);
  const inClass = !!k;
  if (!inClass) return '<div class="empty"><h3>這個帳號不在示範班級裡</h3>' +

  const asgs = state.assignments.slice().sort(function(a, b){ return b.createdAt - a.createdAt; });
  /* 同上：消費端也要依班 */

  const cond = condition(k.condition);

      /* 四條件的卡片結構要逐項對位：同一條左邊框、eyebrow、h3、兩段 p。
         少一個 h3、少一條邊條，卡片高度就不同，底下的統計卡與作業清單

      : '<div class="card card-p" style="margin-bottom:16px;border-left:3px solid var(--ink-4)">' +

          /* 課後問卷還沒送出時，這張卡片本身就不能印分數——

          (done ? (surveyPending

                : draftN ? '<span class="pill q4"><span class="dot"></span>寫到一半 · 已寫 ' + draftN + ' / ' + n + ' 題</span>'

           示範模式下補一顆「再走一次」，讓人看得到這套流程長什麼樣子；

        '<div class="row">' + (done
          ? (surveyPending
              ? '<a class="btn primary" href="#/survey/post">去填課後問卷 →</a>'
              : '<a class="btn" href="#/result/' + a.id + '">看我這次讀得怎麼樣</a>') +
            (state.demoSeed !== false && a.aal && !isImpersonating()
              ? ' <button class="btn sm" data-act="redo-demo" data-id="' + a.id +
                '">再走一次（示範）</button>' : '')
          : '<a class="btn primary" href="#/' + (a.aal ? 'aal' : 'quiz') + '/' + a.id + '">' +
            (draftN ? '接著上次繼續 →' : (a.aal ? '開始這節課 →' : '開始作答 →')) + '</a>') + '</div>' +
        '</div></div></div>';
    }).join('') + '</div>' +
    '<div class="card" style="margin-top:16px"><div class="card-p">' +
    '<h4>作答之後會發生什麼</h4>' +
    '<p class="small" style="margin-top:6px;max-width:70ch">系統會用所有做過這份題目的同學（四個班一起）估出每題的難度與你的能力，' +
    '把「你本來應該答得出來卻答錯」的題目標出來。這些題目不會只變成一個紅色叉叉——' +
    '系統會把它整理出來變成全班的共同問題，貼到知識建構空間，讓大家一起把它想清楚。</p></div></div>';
}

/* 「交過卷」——純存在檢查。流程與統計用這個就夠了。 */
function submitted(aid, sid){
  return state.submissions.some(function(s){ return s.aid === aid && s.sid === sid; });
}

/* 這份派題他實際作答了幾題（選擇題有選、建構反應題有寫）。 */
function answeredCount(aid, sid){
  return state.responses.filter(function(r){
    return r.aid === aid && r.sid === sid &&
           (r.choice != null || (r.text && String(r.text).trim()));
  }).length;
}

/* 可以打開答案卡了嗎。
   `submitted()` 是純存在檢查——只要有一筆 submission，即使 0 題作答，
   前測與後測的完整正解都會攤開。而前後測是同一份題本、教室裡的平板螢幕
   是公開的，所以這是測驗安全問題，不是體驗問題。
   門檻用「實際作答比例」而不是「有沒有那一筆紀錄」。 */
function keyUnlocked(aid, sid){
  const a = getAssignment(aid);
  if (!a) return false;
  if (!submitted(aid, sid)) return false;
  const total = a.itemIds.length;
  if (!total) return false;
  const ratio = (state.settings && state.settings.keyUnlockRatio != null)
    ? state.settings.keyUnlockRatio : 0.5;
  if (answeredCount(aid, sid) / total < ratio) return false;
  return classKeyReleased(aid, sid);
}

/* 答案卡的班級層級釋出條件。
   原本只看學生自己：第一個交卷的孩子按下按鈕的當下，同教室還有 23 人
   在同一份題本上作答，而他接下來十分鐘沒事做、螢幕朝著旁邊。
   函式上方的註解自己寫著「教室裡的平板螢幕是公開的」，但實作只擋住
   「0 題作答」那一種情形。洩題方向是先做完的流向還在做的，
   會讓 θ 與班級（＝條件）綁在一起。
   規則：同班每一位都交了才開。有人缺席就永遠開不了，所以再給一個
   不需要人工介入的出口——過了這份派題的截止時間也開。
   （跨班仍共用同一份題本，四個班若不同天施測，班與班之間的口耳相傳
     不是軟體擋得住的；這裡守的是同一間教室裡的當下。） */
function classKeyReleased(aid, sid){
  const a = getAssignment(aid);
  if (!a) return false;
  if (a.due && Date.now() > a.due) return true;
  const k = classOfStudent(sid);
  if (!k || !k.studentIds || !k.studentIds.length) return true;
  return k.studentIds.every(function(x){ return submitted(aid, x); });
}
/* 還沒開的話，是差在誰身上——文案要講得出真正的條件 */
function classKeyPending(aid, sid){
  const k = classOfStudent(sid);
  if (!k) return 0;
  return k.studentIds.filter(function(x){ return !submitted(aid, x); }).length;
}

/* --- 作答 --- */
function viewQuiz(aid){
  const a = getAssignment(aid);
  const me = currentUser();
  if (!a) return '<div class="empty"><h3>找不到這份作業</h3><a class="btn" href="#/student">回我的作業</a></div>';
  /* 交完卷再走回作答頁：用 go() 會把 #/quiz/aid 疊進歷史，成績頁按〈上一頁〉
     回到這裡又被送回去，兩頁之間原地打轉，孩子出不去。
     但也不能改叫 replaceHash()——它自己會 render 一次，等這個函式回傳 ''
     之後外層的 render() 又把畫面清空，而 replaceState 不觸發 hashchange，
     沒有任何東西會再把它補回來，結果是一片空白。
     只換網址、順手把 ROUTE 對齊，然後在同一次 render 裡直接回傳成績頁。 */
  if (submitted(aid, me.id)){
    const want = '#/result/' + aid;
    if (location.hash !== want && window.history && history.replaceState){
      try {
        history.replaceState(null, '', want);
        if (typeof parseRoute === 'function') ROUTE = parseRoute();
      } catch (e) {}
    }
    return viewResult(aid);
  }
  if (!QUIZ || QUIZ.aid !== aid) QUIZ = {aid:aid, answers:{}, texts:{}, strokes:{}};

  const items = a.itemIds.map(getItem).filter(Boolean);
  const answered = Object.keys(QUIZ.answers).length;
  const mcCount = items.filter(function(i){ return i.type === 'mc'; }).length;

  return sectionHead(a.title, a.desc || '', '<a class="btn" href="#/student">← 回作業列表</a>') +
    '<div class="kb-toolbar"><span class="muted small">已作答 ' + answered + ' / ' + mcCount + ' 題</span>' +
    '<div class="bar" style="flex:1;max-width:280px"><i style="width:' + (100 * answered / Math.max(1, mcCount)) + '%"></i></div>' +
    '<div class="spacer"></div><button class="btn primary sm" data-act="quiz-submit" data-id="' + aid + '">交卷</button></div>' +
    /* 前測（以及任何非 AAL 的派題）走這一支，而這一支從來沒有渲染文章。
       16 題全部是文本依賴題——「小昀第一次發現柚子樹位置不對，是在什麼時候？」
       在沒有文章的畫面上只能用猜的。實測：畫面印得出全部題幹，
       卻找不到兩篇文章的任何一段；後測的 AAL 版面則兩篇都在。
       前測 θ 是 ANCOVA 的共變數——量到的若是猜測而不是理解，
       整個組間比較的基線就不成立。
       題目已經依文本分組（見 30-data.js 的 allIds），所以在每一組前面
       放它自己的文章即可。這裡刻意不做逐句標記：那是 AAL 的操弄成分，
       前測四個條件必須一致，不能把處遇帶進基線。 */
    '<div class="col">' + (function(){
      const out = [];
      let curUnit = null;
      items.forEach(function(it, idx){
        if (it.unit !== curUnit){
          curUnit = it.unit;
          const tx = getText(curUnit);
          if (tx){
            out.push('<div class="card"><div class="card-h">' +
              '<h3>' + esc(tx.title) + '</h3>' +
              '<span class="pill">' + esc(tx.genre) + '</span></div>' +
              '<div class="card-p">' +
              (tx.intro ? '<p class="muted small">' + esc(tx.intro) + '</p>' : '') +
              tx.paras.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('') +
              '</div></div>');
          }
        }
        out.push(renderQuizItem(it, idx));
      });
      return out.join('');
    })() + '</div>' +
    '<div class="row" style="margin-top:16px;justify-content:flex-end">' +
    '<button class="btn primary" data-act="quiz-submit" data-id="' + aid + '">交卷</button></div>';

  function renderQuizItem(it, idx){
      if (it.type === 'cr'){
        return '<div class="card"><div class="card-p">' +
          '<div class="row" style="justify-content:space-between;margin-bottom:6px">' +
          '<b>第 ' + (idx + 1) + ' 題　非選題</b>' +
          '<span class="row">' + itemPillsStudent(it) + '</span></div>' +
          '<div class="stem">' + esc(it.stem) + '</div>' +
          '<div class="field"><label>請寫出你的解題過程與說明</label>' +
          '<textarea style="min-height:120px" data-act="quiz-text" data-id="' + it.id + '">' + esc(QUIZ.texts[it.id] || '') + '</textarea></div>' +
          '<div class="field" style="margin-top:10px"><label>也可以直接手寫（老師評閱時看得到）</label>' +
          '<canvas class="pad" data-pad="' + it.id + '" height="240"></canvas>' +
          '<div class="row" style="margin-top:6px">' +
            '<label class="small muted">筆色</label><input type="color" value="#12161c" data-act="pad-color" data-id="' + it.id + '" style="width:44px;padding:2px">' +
            '<label class="small muted">筆寬</label><input type="range" min="1" max="8" value="2" data-act="pad-width" data-id="' + it.id + '" style="width:100px">' +
            '<button class="btn sm" data-act="pad-undo" data-id="' + it.id + '">復原</button>' +
            '<button class="btn sm" data-act="pad-clear" data-id="' + it.id + '">清空</button>' +
          '</div></div>' +
          '</div></div>';
      }
      const chosen = QUIZ.answers[it.id];
      return '<div class="card"><div class="card-p">' +
        '<div class="row" style="justify-content:space-between;margin-bottom:6px">' +
        '<b>第 ' + (idx + 1) + ' 題</b>' +
        '<span class="row">' + itemPillsStudent(it) + '</span></div>' +
        '<div class="stem">' + esc(it.stem) + '</div>' +
        '<div class="opts">' + it.options.map(function(o, k){
          return '<label class="opt' + (chosen === k ? ' chosen' : '') + '">' +
            '<input type="radio" name="q-' + it.id + '" data-act="quiz-pick" data-id="' + it.id + '" data-k="' + k + '"' +
            (chosen === k ? ' checked' : '') + '>' +
            '<b>' + String.fromCharCode(65 + k) + '</b><span>' + esc(o) + '</span></label>';
        }).join('') + '</div></div></div>';
  }
}

/* θ 是 logit，對十歲孩子沒有意義。轉成「和班上比起來」的五顆星，
   純呈現層——原始 θ 只留在 data-theta 與匯出裡，計算完全不動。 */
function readingStars(theta, mean){
  const d = theta - (mean || 0);
  const n = d >= 1 ? 5 : d >= 0.35 ? 4 : d >= -0.35 ? 3 : d >= -1 ? 2 : 1;
  /* role="img" + aria-label：沒有 role 的 <span> 是 generic，
     ARIA 禁止替它命名，報讀器只會唸出五個星星符號。
     暗星原本只靠 inline opacity:.25（對比 1.73:1，而且高對比模式覆寫不到），
     改用實心／空心的形狀差異，不只靠顏色（1.4.1）。 */
  return '<span role="img" data-theta="' + fx(theta) + '" aria-label="五顆星裡的第 ' + n + ' 顆">' +
    '<span aria-hidden="true">' + '★★★★★'.slice(0, n) +
    '<span class="star-dim">' + '☆☆☆☆☆'.slice(n) + '</span></span></span>';
}

/* --- 個人診斷 --- */
function viewResult(aid){
  const me = currentUser();
  const a = getAssignment(aid);
  if (!a) return '<div class="empty"><h3>找不到這份作業</h3></div>';
  /* 沒交卷就看不到這一頁。學生交完卷本來就會被導到 #/result/<aid>，
     所以這個網址的樣式他一定看過——沒有這道門檻，作答到一半改網址
     就拿到整份正解。用空狀態不要用 go()：go() 會 push 歷史，
     並與 viewAaL 的「已交卷 → 導向 result」反向導向對撞。 */
  if (!isTeacher() && !submitted(aid, me.id)){
    return '<div class="empty"><h3>這一份還沒交</h3>' +
      '<p style="max-width:60ch">交出去之後，這裡會告訴你哪幾題讀得很穩、哪幾題值得回去再讀一次。</p>' +
      '<div class="row" style="margin-top:14px">' +
      '<a class="btn primary" href="#/' + (a.aal ? 'aal' : 'quiz') + '/' + a.id + '">' +
      (a.aal ? '回去把這節課做完 →' : '回去作答 →') + '</a>' +
      '<a class="btn" href="#/student">回我的作業</a></div></div>';
  }
  /* 課後問卷還沒送出之前，這一頁不能開。
     surveyGate() 只擋了一個方向（沒交卷不能填問卷），反方向完全沒有門檻：
     孩子從問卷任何一段按側欄回「我的作業」，同一畫面上「去填課後問卷」旁邊
     就是「看我這次讀得怎麼樣」，點進去拿到「選擇題答對 12 / 16　75%」、
     五顆星等與閱讀地圖，看完再回頭把問卷填完。
     而課後問卷裡的 eff（含「我相信我可以在這次閱讀測驗拿到不錯的成績」）、
     anx、mot_in／mot_ex 是 phase:'both' 的前後測配對依變項——
     先看到分數再作答，量到的是績效回饋不是介入效果。
     更麻煩的是「會不會繞這一趟」是孩子自選的，與能力、作答節奏、
     進而與條件共變，四組被污染的比例並不對等。 */
  if (!isTeacher() && submitted('a-post', me.id) && !surveyOf(me.id, 'post')){
    return '<div class="empty"><h3>先把這節課的問卷填完</h3>' +
      '<p style="max-width:60ch">問卷問的是你剛剛上這節課的感覺。先看到分數再回答，' +
      '你的感覺就會被分數帶著走——所以我們把這一頁先收起來。填完就會打開。</p>' +
      '<div class="row" style="margin-top:14px">' +
      '<a class="btn primary" href="#/survey/post">去填課後問卷 →</a>' +
      '<a class="btn" href="#/student">回我的作業</a></div></div>';
  }
  /* 前測診斷在後測交卷之前不給正解——後測用的是同一份題本。
     前半在上面那道門檻之後看似冗餘，但它是日後放寬門檻時的第二道保險，成本為零。
     四象限、星等與「可惜的題目 → 全班正在討論這題」都保留：
     它們只需要題號，不洩題，而那正是讓孩子回去重讀的動機來源。 */
  /* 用實際作答比例當門檻，不是「有沒有那筆 submission」。
     前測的正解另外要等後測也真的作答過才開（同一份題本）。 */
  const keyLocked = !keyUnlocked(aid, me.id) ||
                    (aid === 'a-pre' && !keyUnlocked('a-post', me.id));
  const diag = diagnose(state, aid);
  const mine = state.responses.filter(function(r){ return r.aid === aid && r.sid === me.id; });
  const mc = mine.filter(function(r){ return r.correct !== null && r.correct !== undefined; });
  const right = mc.filter(function(r){ return r.correct; }).length;
  const ps = diag && diag.ready ? diag.perStudent.find(function(p){ return p.sid === me.id; }) : null;

  return sectionHead('我這次讀得怎麼樣', a.title, '<a class="btn" href="#/student">← 回我的作業</a>') +
    /* 學生端不出現 θ、δ (logit)、KIDMAP、迷思象限——十歲孩子看不懂，
       而且「迷思」是個標籤。同一份資料，換一套對他說話的說法；
       底層的 ps.theta、ps.cells 與所有匯出一個字不動。 */
    '<div class="grid g4" style="margin-bottom:16px">' +
      /* 分母是他實際作答的題數（缺答現在寫 null、不進 mc）。
       不講清楚的話，只答一題的孩子會看到「1 / 1」而更困惑。 */
    /* 一題都沒作答時不要印「0 / 0　0%」，也不要餵 readingStars——
       那會憑空給出 ★★★☆☆。太少就明說太少。 */
    (mc.length
      ? statCard('選擇題答對', right + ' / ' + mc.length,
          (function(){
            const total = a.itemIds.map(getItem).filter(function(i){ return i && i.type === 'mc'; }).length;
            const miss = total - mc.length;
            return pct(right / Math.max(1, mc.length)) + (miss ? '　另外 ' + miss + ' 題沒有作答' : '');
          })())
      : statCard('選擇題答對', '—', '這一次作答的題目太少')) +
      statCard('我這次的閱讀力', (ps && mc.length) ? readingStars(ps.theta, diag.meanTheta) : '—',
        !mc.length ? '這一次作答的題目太少，畫不出來'
                   : (ps ? '和所有做過的同學比起來的位置' : '需要更多人完成')) +
      statCard('可惜的題目', ps ? ps.q[2] : '—', '這幾題你其實讀得懂，只是這次沒答對') +
      statCard('厲害的題目', ps ? ps.q[1] : '—', '這幾題比較難，你答對了', 'good') +
    '</div>' +
    (ps ? '<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>你這次的閱讀地圖</h3>' +
      '<span class="muted small">每一個圓點是一題</span></div><div class="card-p">' +
      kidmapSVG(diag, ps, true) + '<div class="row" style="margin-top:10px">' + quadLegendStudent() + '</div>' +
      (ps.q[2] ? '<div class="ai-out" style="margin-top:12px"><p><strong>有 ' + ps.q[2] +
        ' 題很可惜。</strong>看你其他題的表現，這幾題你其實讀得懂。回去把題目再讀一次，' +
        '找找看你當時是漏了哪一句。</p>' +
        '<ul>' + ps.cells.filter(function(c){ return c.q === 2; }).map(function(c){
          const it = getItem(c.iid);
          /* 只找本班的視圖。掃全站的話，c-3 的孩子會看到「全班正在討論這題 →」
             指向 c-1 的白板，點下去被守門擋掉——而那句話是對他說的。 */
          const v = viewsForViewer().find(function(v){ return v.origin && v.origin.iid === it.id; });
          return '<li>' + itemLabel(aid, it.id) + '：' + esc(shortStem(it.stem)) +
            (v ? '　<a href="#/kb/' + v.id + '">全班正在討論這題 →</a>' : '') + '</li>';
        }).join('') + '</ul></div>' : '') +
      (ps.q[1] ? '<div class="ai-out" style="margin-top:10px"><p><strong>有 ' + ps.q[1] +
        ' 題你很厲害。</strong>這幾題比較難，你答對了。' +
        '到知識建構空間把你的想法貼出來——班上有同學正卡在同一題。</p></div>' : '') +
      '</div></div>'
      : '<div class="card card-p" style="margin-bottom:16px"><p class="muted small">班上還沒有夠多人做完，' +
        '所以還畫不出你的閱讀地圖。等大家都交了再回來看。</p></div>') +
    '<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>逐題檢視</h3>' +
    (keyLocked ? '<span class="pill"><span class="dot"></span>答案還沒打開</span>' : '') + '</div>' +
    /* 文案要講真正的條件。原本寫「這一節課上完之後」，而實際條件是
       「同班每一位都交了（或過了截止時間）」——講錯條件的等待訊息，
       孩子會以為壞掉了。 */
    (keyLocked ? '<div class="card-p"><p class="small" style="max-width:70ch;margin:0">' +
      (function(){
        const pend = classKeyPending(aid, me.id);
        if (pend > 0) return '班上還有 ' + pend + ' 位同學在寫。等大家都交完，' +
          '這裡就會打開，讓你看到每一題的四個選項、正確答案和你當時選的。' +
          '現在先看上面的閱讀地圖——它已經告訴你哪幾題值得回去重讀。';
        return '等課後那一份也做完，這裡就會打開，' +
          '讓你看到每一題的四個選項、正確答案和你當時選的。' +
          '現在先看上面的閱讀地圖——它已經告訴你哪幾題值得回去重讀。';
      })() + '</p></div>' : '') +
    '<div class="card-p col">' + a.itemIds.map(getItem).filter(function(i){ return i && i.type === 'mc'; }).map(function(it){
      const r = mine.find(function(x){ return x.iid === it.id; });
      const c = diag && diag.ready && ps ? ps.cells.find(function(x){ return x.iid === it.id; }) : null;
      return '<div class="item"><div class="row" style="justify-content:space-between">' +
        '<b>' + itemLabel(aid, it.id) + '</b>' +
        /* 三態，不是兩態：沒作答不等於答錯。把缺答畫成紅色的「答錯」，
           孩子會以為自己寫了而且寫壞了。 */
        (!r || r.choice == null
           ? '<span class="pill"><span class="dot"></span>這一題你沒有作答</span>'
           : (c ? '<span class="pill ' + QUAD[c.q].key + '"><span class="dot"></span>' +
                  esc(QUAD_STUDENT[c.q]) + '</span>'
                : (r.correct ? '<span class="pill q1"><span class="dot"></span>答對</span>'
                             : '<span class="pill q2"><span class="dot"></span>答錯</span>'))) + '</div>' +
        '<div class="stem">' + esc(it.stem) + '</div>' +
        /* 前測的正解在後測交卷之前不打開：兩次測量用的是同一份題本，
           在中間逐題發答案卡，Δθ 就混入記憶效應，而記憶量與「有沒有來看
           診斷頁」相關，也就與投入程度、進而與條件相關。 */
        (keyLocked ? '' :
        '<div class="opts">' + it.options.map(function(o, k){
          const isAns = k === it.answer, isMine = r && r.choice === k;
          return '<div class="opt' + (isAns ? ' right' : (isMine ? ' wrong' : '')) + '"><b>' +
            String.fromCharCode(65 + k) + '</b><span>' + esc(o) +
            (isAns ? '　<span class="muted small">正解</span>' : '') +
            (isMine && !isAns ? '　<span class="muted small">你選的</span>' : '') + '</span></div>';
        }).join('') + '</div>') +
        '</div>';
    }).join('') + '</div></div>' +
    crResultBlock(aid, me.id, keyLocked);
}

function crResultBlock(aid, sid, keyLocked){
  const a = getAssignment(aid);
  const crs = a.itemIds.map(getItem).filter(function(i){ return i && i.type === 'cr'; });
  if (!crs.length) return '';
  return '<div class="card"><div class="card-h"><h3>非選題</h3></div><div class="card-p col">' +
    crs.map(function(it){
      const r = state.responses.find(function(x){ return x.aid === aid && x.sid === sid && x.iid === it.id; });
      return '<div class="note-full"><b>' + itemLabel(aid, it.id) + '</b>' +
        '<div class="stem">' + esc(it.stem) + '</div>' +
        /* 前測與後測是同兩題建構反應題。在後測交卷前把自己前測寫的整段
           作文讀回來，等於直接抄一次——兩題的 Δ 會歸零。 */
        (keyLocked
          ? '<p class="muted small" style="margin-top:6px">這一節課上完之後，這裡會打開，' +
            '讓你看到自己當時寫了什麼。</p>'
          : '<div class="ai-out" style="white-space:pre-wrap">' + esc((r && r.text) || '（未作答）') + '</div>') +
        '<div class="row" style="margin-top:8px">' +
        (r && r.score !== null && r.score !== undefined
          ? '<span class="pill q1"><span class="dot"></span>得分 ' + r.score + ' / 6</span>'
          : '<span class="pill">等待老師評閱</span>') +

/* 離線引擎挑出來的「相似題」是題庫裡的**現役題目**，不是新生成的。
   前後測用的是同一份 16 題，老師把它們印成隔天的練習卷就是先發答案卡，
   而他原本沒有任何線索知道自己踩到了——介面從頭到尾用「出題／生成」
   的措辭，唯一的線索藏在要另外展開的〈解題思路〉裡。 */
showSimilar._seen = {};
async function showSimilar(iid, force){
  const box = document.getElementById('sim-' + iid);
  if (!box) return;
  box.innerHTML = '<p class="muted small" style="margin-top:8px">整理中……</p>';
  if (!force) showSimilar._seen[iid] = [];
  try {
    const items = await aiSimilarItems(getItem(iid), !!force, showSimilar._seen[iid] || []);
    const exhausted = items.length === 1 && items[0].exhausted;
    (items || []).forEach(function(x){
      if (x.itemId && (showSimilar._seen[iid] || []).indexOf(x.itemId) < 0) showSimilar._seen[iid].push(x.itemId);
    });
    box.innerHTML = '<div class="col" style="margin-top:10px">' +
      (exhausted ? '' :
        '<div class="card card-p" style="border-left:3px solid var(--crit)">' +
        '<p class="small" style="margin:0"><strong>這些是題庫裡的現役題目，不是新生成的。</strong>' +
        '前測與後測用的是同一份題本——把它們印給學生練習，等於先發答案卡。' +
        '這一區只供你自己備課參考。</p></div>') +
      items.map(function(x, i){
      return '<div class="item" style="background:var(--shade)">' +
        '<div class="eyebrow">' + (x.itemId
          ? '題庫第 ' + x.itemNo + ' 題（' + esc(x.itemId) + '）' +
            (x.inUse && x.inUse.length ? '　·　目前用於：' + esc(x.inUse.join('、')) : '')
          : '參考題 ' + (i + 1)) + '</div>' +
        '<div class="stem">' + esc(x.stem) + '</div>' +
        '<div class="opts">' + x.options.map(function(o, k){
          return '<label class="opt" data-act="sim-pick" data-i="' + i + '" data-k="' + k + '" data-ans="' + x.answer +
            '" data-iid="' + iid + '"><b>' + String.fromCharCode(65 + k) + '</b><span>' + esc(o) + '</span></label>';
        }).join('') + '</div>' +
        '<div class="small muted" id="simfb-' + iid + '-' + i + '" style="margin-top:6px"></div>' +
        '<details style="margin-top:6px"><summary class="small muted" style="cursor:pointer">命題備註</summary>' +
        '<div class="small" style="margin-top:4px">' + esc(x.hint || '') + '</div></details>' +
        '</div>';
    }).join('') + '<div class="row"><span class="muted small">引擎：' + esc(engineLabel()) + '</span>' +
    /* 一顆按不動的按鈕比一顆按了沒反應的按鈕誠實 */
    '<button class="btn sm" data-act="similar-again" data-id="' + iid + '"' +
      (exhausted ? ' disabled' : '') + '>換一批</button></div></div>';
  } catch (e) {
    box.innerHTML = '<p class="small" style="margin-top:8px"><strong>取不到題目：</strong>' + esc(e.message) + '</p>';
  }
}

/* --- 手寫板 --- */
const PADS = {};
function initPads(){
  $$('canvas[data-pad]').forEach(function(cv){
    const id = cv.dataset.pad;
    if (cv._init) return;
    cv._init = true;
    const dpr = window.devicePixelRatio || 1;
    function size(){
      const w = cv.clientWidth || 600;
      cv.width = w * dpr; cv.height = 240 * dpr;
      const ctx = cv.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      redraw(id);
    }
    PADS[id] = PADS[id] || {strokes:[], color:'#12161c', width:2, cv:cv};
    PADS[id].cv = cv;
    size();
    window.addEventListener('resize', size);
    let cur = null;
    cv.addEventListener('pointerdown', function(e){
      cv.setPointerCapture(e.pointerId);
      const r = cv.getBoundingClientRect();
      cur = {color:PADS[id].color, width:PADS[id].width, pts:[[e.clientX - r.left, e.clientY - r.top]]};
      PADS[id].strokes.push(cur);
    });
    cv.addEventListener('pointermove', function(e){
      if (!cur) return;
      const r = cv.getBoundingClientRect();
      cur.pts.push([e.clientX - r.left, e.clientY - r.top]);
      redraw(id);
    });
    cv.addEventListener('pointerup', function(){ cur = null; if (QUIZ) QUIZ.strokes[id] = PADS[id].strokes; });
    cv.addEventListener('pointerleave', function(){ cur = null; });
    /* 與畫布同一個坑：手勢被瀏覽器接管時會送 pointercancel，
       不處理的話同一次捲動會在計算紙上留下一條假筆畫。 */
    cv.addEventListener('pointercancel', function(){ cur = null; });
  });
}
function redraw(id){
  const p = PADS[id]; if (!p || !p.cv) return;
  const ctx = p.cv.getContext('2d');
  ctx.clearRect(0, 0, p.cv.width, p.cv.height);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  p.strokes.forEach(function(s){
    ctx.strokeStyle = s.color; ctx.lineWidth = s.width;
    ctx.beginPath();
    s.pts.forEach(function(pt, i){ if (i) ctx.lineTo(pt[0], pt[1]); else ctx.moveTo(pt[0], pt[1]); });
    ctx.stroke();
  });
}

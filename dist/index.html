      '<span class="muted small">已選 ' + Object.keys(WIZ.items).length + ' 題</span><div class="spacer"></div>' +
      '<button class="btn primary" data-act="wiz-next"' + (Object.keys(WIZ.items).length ? '' : ' disabled') +
      '>下一步：派給學生 →</button></div></div>';
  }

  if (WIZ.step === 3){
    body = '<div class="card card-p"><h3>派題細節</h3>' +
      '<div class="col" style="max-width:520px;margin-top:12px">' +
      '<div class="field"><label for="wt">作業標題</label><input id="wt" type="text" value="' + esc(WIZ.title) +
        '" placeholder="例：八上 · 一元二次方程式練習"></div>' +
      '<div class="field"><label for="wd">說明（給學生的提示，可留空）</label><textarea id="wd">' + esc(WIZ.desc) + '</textarea></div>' +
      '<div class="field"><label for="wp">階段</label><select id="wp">' +
        '<option value="pre"' + (WIZ.phase === 'pre' ? ' selected' : '') + '>前測（診斷用，會進入迷思橋接）</option>' +
        '<option value="post"' + (WIZ.phase === 'post' ? ' selected' : '') + '>共構後測（與前測比較 Δθ）</option></select></div>' +
      '<div class="field"><label for="wdue">截止時間</label><input id="wdue" type="datetime-local" value="' + esc(WIZ.due) + '"></div>' +
      '</div><hr class="hr"><div class="row"><button class="btn" data-act="wiz-back">← 上一步</button>' +
      '<span class="muted small">將派出 ' + Object.keys(WIZ.items).length + ' 題給全部 ' + state.classes.length + ' 個班級</span>' +
      '<div class="spacer"></div><button class="btn primary" data-act="wiz-submit">派出這份作業</button></div></div>';
  }

  return sectionHead('建立派題', '從康軒單元開始，三個步驟完成派題。', '<a class="btn" href="#/teacher">回教師後台</a>') +
    '<div class="steps">' + steps.map(function(s, i){
      return '<div class="step' + (WIZ.step === i + 1 ? ' on' : '') + '"><b>' + (i + 1) + '</b>' + s + '</div>';
    }).join('') + '</div>' + body;
}

/* ==========================================================================
   派題分析
   ========================================================================== */
function viewAssign(aid){
  const diag = diagnose(state, aid);
  if (!diag) return '<div class="empty"><h3>找不到這份派題</h3><p>它可能已刪除。</p><a class="btn" href="#/teacher">回教師後台</a></div>';
  const a = diag.assignment;
  const tabs = [
    ['overview', '成績總覽'],
    ['kidmap', 'KIDMAP 診斷'],
    ['items', '每題四象限'],
    ['bridge', '迷思橋接'],
    ['cr', '非選評閱'],
    ['ai', 'AI 深度分析']
  ];
  let body = '';
  if (TAB === 'overview') body = tabOverview(diag);
  else if (TAB === 'kidmap') body = tabKidmap(diag);
  else if (TAB === 'items') body = tabItems(diag);
  else if (TAB === 'bridge') body = tabBridge(diag);
  else if (TAB === 'cr') body = tabCR(diag);
  else body = tabAI(diag);

  return sectionHead(a.title, (a.phase === 'post' ? '共構後測' : '前測') + '　·　' +
      diag.done.length + ' / ' + diag.roster.length + ' 位已交　·　' + diag.items.length + ' 道選擇題',
      '<a class="btn" href="#/teacher">回教師後台</a>') +
    '<div class="tabs">' + tabs.map(function(t){
      return '<button data-act="tab" data-id="' + t[0] + '" aria-selected="' + (TAB === t[0]) + '">' + t[1] + '</button>';
    }).join('') + '</div>' + body;
}

function tabOverview(diag){
  const scores = diag.perStudent.map(function(p){ return p.right; });
  const nItems = diag.items.length;
  if (!diag.done.length) return '<div class="empty"><h3>還沒有學生作答</h3><p>把班級加入代碼發給學生，作答後這裡會顯示。</p></div>';
  return '<div class="grid g4" style="margin-bottom:16px">' +
    statCard('班級平均', fx(mean(scores) / nItems * 100, 1) + '<span style="font-size:15px">%</span>', '答對 ' + fx(mean(scores), 1) + ' / ' + nItems + ' 題') +
    statCard('已交作答', diag.done.length, '未完成 ' + (diag.roster.length - diag.done.length) + ' 人') +
    statCard('迷思題次', diag.totals[2], '占全部作答 ' + pct(diag.totals[2] / Math.max(1, diag.cells.length)), diag.totals[2] ? 'crit' : '') +
    statCard('優勢題次', diag.totals[1], '超越預期答對', 'good') +
  '</div>' +
  '<div class="grid g2">' +
    '<div class="card"><div class="card-h"><h3>成績分佈</h3></div><div class="card-p">' +
      histSVG(scores, Math.min(10, nItems), '答對題數（滿分 ' + nItems + '）') + '</div></div>' +
    '<div class="card"><div class="card-h"><h3>全班四象限分佈</h3>' +
      '<span class="muted small">排列方式與 KIDMAP 圖一致</span></div><div class="card-p">' +
      // 依 KIDMAP 圖上的位置排列：左上 III、右上 I、左下 II、右下 IV
      '<div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">' + [3,1,2,4].map(function(q){
        return '<div class="stat"><div class="k">' + QUAD[q].roman + ' ' + QUAD[q].name + '</div>' +
          '<div class="v" style="color:var(--' + QUAD[q].key + ')">' + diag.totals[q] + '</div>' +
          '<div class="s">' + esc(QUAD[q].desc) + '</div></div>';
      }).join('') + '</div>' +
      '<p class="muted small" style="margin-top:12px">用簡化 Rasch 模式從全班作答估出每題難度 δ 與每位學生能力 θ，' +
      '再把每一個「人 × 題」的結果分成四象限。<strong>迷思概念（II）</strong>指能力足以答對卻答錯，是最需要老師介入的格子。</p>' +
    '</div></div>' +
  '</div>' +
  '<div class="card" style="margin-top:16px"><div class="card-h"><h3>學生表現</h3><span class="muted small">依能力估計值排序</span></div>' +
  '<div class="tablewrap"><table><thead><tr><th>學生</th><th class="n">答對</th><th class="n">θ</th><th class="n">SE</th>' +
  '<th class="n">Infit</th><th>四象限</th><th class="n">迷思</th><th></th></tr></thead><tbody>' +
  diag.perStudent.slice().sort(function(a, b){ return (b.theta || 0) - (a.theta || 0); }).map(function(p){
    return '<tr><td>' + esc(userName(p.sid)) + '</td><td class="n">' + p.right + '/' + p.n + '</td>' +
      '<td class="n">' + fx(p.theta) + '</td><td class="n">' + fx(p.se) + '</td><td class="n">' + fx(p.infit) + '</td>' +
      '<td style="min-width:110px">' + quadBar(p.q, p.n) + '</td>' +
      '<td class="n" style="color:var(--q2)">' + p.q[2] + '</td>' +
      '<td><button class="btn sm" data-act="kidmap-one" data-id="' + p.sid + '">KIDMAP</button></td></tr>';
  }).join('') + '</tbody></table></div></div>';
}

function tabKidmap(diag){
  if (!diag.ready){
    return '<div class="empty"><h3>尚無足夠資料</h3><p>至少需要 ' + diag.minN +
      ' 位學生完成才會執行 KIDMAP，目前完成 ' + diag.done.length + ' 位。</p></div>';
  }
  // 預設先看迷思最多的學生——那是老師最需要處理的人
  const ranked = diag.perStudent.slice().sort(function(a, b){ return b.q[2] - a.q[2]; });
  const sel = (tabKidmap.sel && diag.perStudent.some(function(p){ return p.sid === tabKidmap.sel; }))
    ? tabKidmap.sel : ranked[0].sid;
  tabKidmap.sel = sel;
  const ps = diag.perStudent.find(function(p){ return p.sid === sel; }) || ranked[0];
  return '<div class="grid" style="grid-template-columns:230px minmax(0,1fr);gap:16px">' +
    '<div class="card" style="max-height:660px;overflow:auto"><div class="card-h"><h3>學生</h3>' +
    '<span class="muted small">依迷思題數排序</span></div>' +
    '<div style="padding:8px">' + ranked.map(function(p){
      return '<button class="btn sm" style="width:100%;justify-content:space-between;margin-bottom:4px;' +
        (p.sid === sel ? 'border-color:var(--accent);font-weight:600' : 'border-color:transparent') + '"' +
        ' data-act="kidmap-sel" data-id="' + p.sid + '">' + esc(userName(p.sid)) +
        '<span class="num" style="color:var(--q2)">' + (p.q[2] || '') + '</span></button>';
    }).join('') + '</div></div>' +
    '<div class="card"><div class="card-h"><h3>' + esc(userName(ps.sid)) + ' 的 KIDMAP</h3>' +
      '<span class="pill">θ = ' + fx(ps.theta) + ' ± ' + fx(ps.se) + '</span>' +
      '<span class="pill">Infit ' + fx(ps.infit) + '</span></div>' +
    '<div class="card-p">' + kidmapSVG(diag, ps) +
      '<div class="row" style="margin-top:10px">' + quadLegend() + '</div>' +
      '<hr class="hr">' +
      '<p class="small"><strong>怎麼讀這張圖：</strong>縱軸是試題難度（越上面越難），橫向分成答錯／答對兩欄，' +
      '中間那條虛線是這位學生的能力值 θ。落在<strong style="color:var(--q2)">左下（II 迷思）</strong>的題目，' +
      '照他的能力本來應該答對卻答錯了——這些題目就是他真正的概念缺口，也是本系統送進共構討論的材料。' +
      '落在<strong style="color:var(--q1)">右上（I 優勢）</strong>的題目代表他有隱藏實力，可以邀他當該題的知識資源人。</p>' +
      (ps.q[2] ? '<div class="ai-out" style="margin-top:12px"><p><strong>這位學生的迷思題：</strong></p><ul>' +
        ps.cells.filter(function(c){ return c.q === 2; }).map(function(c){
          const it = getItem(c.iid);
          return '<li>第 ' + it.no + ' 題（' + esc(shortStem(it.stem)) + '）——他選了 ' +
            (c.choice != null ? String.fromCharCode(65 + c.choice) + '. ' + esc(it.options[c.choice]) : '未作答') +
            '，正解是 ' + String.fromCharCode(65 + it.answer) + '。預期答對率 ' + pct(c.p) + '。</li>';
        }).join('') + '</ul></div>' : '<p class="small muted" style="margin-top:12px">這位學生沒有落在迷思象限的題目。</p>') +
    '</div></div></div>';
}

function tabItems(diag){
  if (!diag.ready) return '<div class="empty"><h3>尚無足夠資料</h3><p>等更多學生作答後才能顯示每題分析。</p></div>';
  const rows = diag.perItem.slice().sort(function(a, b){ return b.misRate - a.misRate; });
  return '<div class="card"><div class="card-h"><h3>全班每題四象限分佈</h3>' +
    '<span class="muted small">依迷思(II)比例由高至低排序</span>' + '</div>' +
    '<div class="tablewrap"><table><thead><tr><th>題號</th><th>單元</th><th class="n">δ</th><th class="n">答對率</th>' +
    '<th>四象限</th><th class="n">迷思</th><th>迷思誘答</th><th class="n">Outfit</th><th></th></tr></thead><tbody>' +
    rows.map(function(pi){
      const it = pi.item;
      const m = pi.misCode ? MISCONCEPTIONS.find(function(x){ return x.id === pi.misCode; }) : null;
      return '<tr><td><b>第 ' + it.no + ' 題</b><div class="muted small">' + it.year + ' 年 · ' + esc(it.diff) + '</div></td>' +
        '<td class="small">' + esc(unitName(it.unit)) + '</td>' +
        '<td class="n">' + fx(pi.delta) + '</td><td class="n">' + pct(pi.pass) + '</td>' +
        '<td style="min-width:120px">' + quadBar(pi.q, pi.n) + '</td>' +
        '<td class="n"' + (pi.misRate >= 0.15 ? ' style="color:var(--q2);font-weight:600"' : '') + '>' +
          pi.q[2] + '（' + pct(pi.misRate) + '）</td>' +
        '<td class="small">' + (pi.topDistractor != null
          ? String.fromCharCode(65 + pi.topDistractor) + '. ' + esc(pi.item.options[pi.topDistractor]) +
            (m ? '<div class="muted" style="font-size:11.5px">' + esc(m.name) + '</div>' : '')
          : '<span class="muted">—</span>') + '</td>' +
        '<td class="n">' + fx(pi.outfit) + '</td>' +
        '<td><button class="btn sm" data-act="item-strategy" data-id="' + it.id + '">教學策略</button></td></tr>';
    }).join('') + '</tbody></table></div>' +
    '<div class="card-p"><div class="row">' + quadLegend() + '</div>' +
    '<p class="muted small" style="margin-top:10px">Outfit MNSQ 接近 1 代表該題與 Rasch 模式相符；明顯大於 1.3 表示有異常作答型態，' +
    '通常正是迷思或猜測造成的，值得優先檢視。</p></div></div>';
}

/* --- 迷思橋接：兩個平台真正接起來的地方 --- */
function tabBridge(diag){
  if (!diag.ready) return '<div class="empty"><h3>尚無足夠資料</h3><p>需要至少 ' + diag.minN + ' 位學生完成作答。</p></div>';
  const list = diag.flagged;
  return '<div class="card card-p" style="margin-bottom:16px">' +
    '<h3>從測驗到討論：一鍵把迷思變成社群的問題</h3>' +
    '<p class="lead" style="margin-top:8px">KIDMAP 的第二象限（<span class="pill q2"><span class="dot"></span>II 迷思概念</span>）指出的是' +
    '「這個學生的能力應該答得出來，卻答錯了」——這正是最值得全班一起想清楚的真實問題。' +
    '按下〈開啟共構視圖〉，系統會建立一個 Knowledge Forum 式的視圖，把題目、誘答分析與探究問題貼進去，' +
    '同時把在該題落在<span class="pill q1"><span class="dot"></span>I 優勢概念</span>的同學標為<strong>知識資源人</strong>，' +
    '請他們先貼出自己的想法，而不是直接公布答案。</p>' +
    '<p class="muted small">門檻：迷思比例 ≥ ' + state.settings.misThreshold + '%（可在系統設定調整）。</p></div>' +
    (list.length ? list.map(function(pi){
      const it = pi.item;
      const v = bridgeExists(diag.assignment.id, it.id);
      const m = pi.misCode ? MISCONCEPTIONS.find(function(x){ return x.id === pi.misCode; }) : null;
      return '<div class="card" style="margin-bottom:14px"><div class="card-h">' +
        '<h3>第 ' + it.no + ' 題　<span class="pill q2"><span class="dot"></span>迷思 ' + pi.q[2] + ' 人 · ' + pct(pi.misRate) + '</span></h3>' +
        (v ? '<a class="btn sm" href="#/kb/' + v.id + '">進入共構視圖 →</a>'
           : '<button class="btn primary sm" data-act="bridge" data-id="' + it.id + '">開啟共構視圖</button>') + '</div>' +
        '<div class="card-p"><div class="item" style="margin-bottom:12px"><div class="stem">' + esc(it.stem) + '</div>' +
        '<div class="opts">' + it.options.map(function(o, k){
          const isAns = k === it.answer, isTop = k === pi.topDistractor;
          return '<div class="opt' + (isAns ? ' right' : (isTop ? ' wrong' : '')) + '"><b>' +
            String.fromCharCode(65 + k) + '</b><span>' + esc(o) + (isAns ? '　<span class="muted small">正解</span>' : '') +
            (isTop ? '　<span class="muted small">迷思學生最常選（' + pi.topDistractorN + ' 人）</span>' : '') + '</span></div>';
        }).join('') + '</div></div>' +
        (m ? '<p class="small"><strong>題庫標記的迷思類型：</strong>' + esc(m.name) + '——' + esc(m.desc) + '</p>' : '') +
        '<div class="grid g2" style="margin-top:10px">' +
          '<div><div class="eyebrow">落在迷思象限（待解者）</div><div class="row" style="gap:5px;margin-top:6px">' +
            pi.q2Students.map(function(s){ return '<span class="pill q2">' + esc(userName(s)) + '</span>'; }).join('') + '</div></div>' +
          '<div><div class="eyebrow">落在優勢象限（知識資源人）</div><div class="row" style="gap:5px;margin-top:6px">' +
            (pi.q1Students.map(function(s){ return '<span class="pill q1">' + esc(userName(s)) + '</span>'; }).join('') ||
             '<span class="muted small">這一題沒有人超越預期答對。</span>') + '</div></div>' +
        '</div>' +
        '<hr class="hr"><div class="eyebrow">將貼進視圖的探究問題</div>' +
        '<div class="ai-out" style="margin-top:6px">' + nl2br(buildInquiryPrompt(pi, diag)) + '</div>' +
        '</div></div>';
    }).join('') : '<div class="empty"><h3>目前沒有明顯的迷思題</h3>' +
      '<p>全班沒有出現迷思比例超過 ' + state.settings.misThreshold + '% 的題目。</p></div>');
}

/* --- 非選題評閱 --- */
function tabCR(diag){
  const crs = diag.assignment.itemIds.map(getItem).filter(function(i){ return i && i.type === 'cr'; });
  if (!crs.length) return '<div class="empty"><h3>這份作業沒有非選題</h3><p>下次派題時可以在題型中加入非選題。</p></div>';
  const sel = tabCR.sel || crs[0].id;
  tabCR.sel = sel;
  const it = getItem(sel);
  const rubricKey = 'rubric:' + it.id + ':' + aiEngine();
  const rubric = state.aiCache[rubricKey];
  const answers = state.responses.filter(function(r){ return r.aid === diag.assignment.id && r.iid === it.id; });

  return '<div class="row" style="margin-bottom:12px">' + crs.map(function(c){
      return '<button class="btn sm' + (c.id === sel ? ' primary' : '') + '" data-act="cr-sel" data-id="' + c.id + '">非選第 ' + c.no + ' 題</button>';
    }).join('') + '</div>' +
    '<div class="card" style="margin-bottom:14px"><div class="card-h"><h3>題目</h3>' +
      '<span class="pill">' + it.year + ' 年 · ' + esc(unitName(it.unit)) + '</span></div>' +
      '<div class="card-p"><div class="stem">' + esc(it.stem) + '</div></div></div>' +
    '<div class="card" style="margin-bottom:14px"><div class="card-h"><h3>評量規準</h3>' +
      '<span class="pill">' + esc(engineLabel()) + '</span>' +
      '<button class="btn sm" data-act="gen-rubric" data-id="' + it.id + '">' + (rubric ? '重新產生規準' : '產生規準') + '</button></div>' +
      '<div class="card-p"><div id="out-rubric" class="' + (rubric ? 'ai-out' : 'muted small') + '">' +
      (rubric ? md(rubric) : '尚未撰寫評量規準。點右上〈產生規準〉開始，之後仍可自行修改。') + '</div></div></div>' +
    '<div class="card"><div class="card-h"><h3>逐生評閱</h3><span class="muted small">分數與評語會即時儲存</span></div>' +
    '<div class="card-p col">' + answers.map(function(r){
      return '<div class="note-full"><div class="row" style="justify-content:space-between;margin-bottom:8px">' +
        '<b>' + esc(userName(r.sid)) + '</b>' +
        '<span class="row"><label class="small muted">給分</label>' +
        '<input type="number" min="0" max="6" step="1" style="width:72px" value="' + (r.score === null ? '' : r.score) +
        '" data-act="cr-score" data-sid="' + r.sid + '" data-iid="' + it.id + '" data-aid="' + diag.assignment.id + '">' +
        '<span class="muted small">/ 6</span></span></div>' +
        '<div class="ai-out" style="white-space:pre-wrap;font-family:var(--f-mono);font-size:12.5px">' + esc(r.text || '（未作答）') + '</div>' +
        '<div class="field" style="margin-top:8px"><label>給學生的評語</label>' +
        '<textarea style="min-height:56px" data-act="cr-comment" data-sid="' + r.sid + '" data-iid="' + it.id +
        '" data-aid="' + diag.assignment.id + '" placeholder="可留空">' + esc(r.comment || '') + '</textarea></div>' +
        '</div>';
    }).join('') + '</div></div>';
}

function tabAI(diag){
  const cached = cacheGet('class', diag.assignment.id);
  return '<div class="card" style="margin-bottom:14px"><div class="card-h">' +
    '<h3>請 AI 一次看完整份 KIDMAP 診斷</h3>' +
    '<span class="pill">' + esc(engineLabel()) + '</span>' +
    '<button class="btn primary sm" data-act="ai-class">' + (cached ? '重新分析' : '開始分析') + '</button></div>' +
    '<div class="card-p"><div id="out-ai-class" class="' + (cached ? 'ai-out' : 'muted small') + '">' +
    (cached ? md(cached) : '會分析全班共同迷思、逐題誘答成因、具體教學策略，並把最值得討論的迷思寫成可直接貼進知識建構空間的問題敘述。') +
    '</div></div></div>' +
    '<div class="card card-p"><h4>兩套引擎的差別</h4>' +
    '<p class="small" style="margin-top:6px"><strong>內建規則引擎</strong>直接讀 Rasch 估計值與題庫的誘答標記，' +
    '輸出完全可重現、每一句都能追溯到資料，適合寫進研究報告；<strong>外部語言模型</strong>語言較自然、能處理沒有標記的例外情況，' +
    '但同一份資料兩次結果可能不同。研究上建議兩者都跑一次並比對差異。</p>' +
    '<p class="muted small">切換引擎請到「系統設定」。</p></div>';
}

/* ===== src/84-ui-kb.js ===== */
/* ==========================================================================
   84-ui-kb.js — 知識建構空間（Knowledge Forum 式）
   視圖、貼文、支架、延伸貼文、躍升貼文、引用、註記、搜尋、閱讀狀態
   ========================================================================== */

let KBSEL = false;              // 躍升選取模式
let KBPICK = {};                // 被選取的貼文
let KBSEARCH = {field:'content', q:''};
let EDIT = null;                // 編輯中的貼文草稿

function viewKBList(){
  const res = KBSEARCH.q ? searchNotes(KBSEARCH.field, KBSEARCH.q) : null;
  return sectionHead('知識建構空間', '每個視圖是一塊共同的白板。想法貼上去之後就屬於社群，任何人都可以延伸、挑戰、綜整。',
    (isTeacher() ? '<button class="btn" data-act="new-view">新增視圖</button>' : '')) +
  '<div class="kb-toolbar">' +
    '<label class="small muted" for="sf">搜尋</label>' +
    '<select id="sf" style="width:auto" data-act="search-field">' +
      [['title','標題'],['scaffold','支架'],['content','內容'],['author','作者'],['keyword','關鍵詞'],['date','建立日期']]
      .map(function(o){ return '<option value="' + o[0] + '"' + (KBSEARCH.field === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') +
    '</select>' +
    '<input type="text" id="sq" placeholder="輸入關鍵字…" value="' + esc(KBSEARCH.q) + '" style="max-width:260px" data-act="search-q">' +
    (KBSEARCH.q ? '<button class="btn sm" data-act="search-clear">清除</button>' : '') +
    '<div class="spacer"></div><span class="muted small">未讀 ' + state.notes.filter(isUnread).length + ' 則</span>' +
  '</div>' +
  (res ? '<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>搜尋結果</h3>' +
      '<span class="muted small">' + res.length + ' 則貼文符合</span></div><div class="card-p col">' +
      (res.map(noteRow).join('') || '<div class="muted small">沒有符合的貼文。</div>') + '</div></div>' : '') +
  '<div class="grid g2">' + state.views.map(function(v){
    const ns = notesOfView(v.id);
    const un = ns.filter(isUnread).length;
    const it = v.origin ? getItem(v.origin.iid) : null;
    return '<div class="card"><div class="card-h"><h3>' + esc(v.title) + '</h3>' +
      (un ? '<span class="pill" style="border-color:var(--accent);color:var(--accent)">未讀 ' + un + '</span>' : '') + '</div>' +
      '<div class="card-p">' +
      '<p class="small muted">' + esc(v.desc) + '</p>' +
      (it ? '<div class="pill q2" style="margin-bottom:8px"><span class="dot"></span>源自迷思題：第 ' + it.no + ' 題</div>' : '') +
      '<div class="row small muted" style="gap:14px">' +
        '<span>' + ns.length + ' 則貼文</span>' +
        '<span>' + ns.filter(function(n){ return n.buildOn; }).length + ' 則延伸</span>' +
        '<span>' + ns.filter(function(n){ return n.kind === 'rise'; }).length + ' 則躍升</span>' +
        '<span>' + uniq(ns.reduce(function(a, n){ return a.concat(n.authorIds); }, [])).length + ' 位作者</span>' +
      '</div>' +
      (v.links && v.links.length ? '<div class="small muted" style="margin-top:8px">連結視圖：' +
        v.links.map(function(l){ const t = getView(l); return t ? '<a href="#/kb/' + l + '">' + esc(t.title) + '</a>' : ''; }).join('、') + '</div>' : '') +
      '<div class="row" style="margin-top:12px"><a class="btn primary sm" href="#/kb/' + v.id + '">進入視圖</a>' +
      '<a class="btn sm" href="#/synth/' + v.id + '">想法串綜整</a></div>' +
      '</div></div>';
  }).join('') + '</div>';
}

function noteRow(n){
  const v = getView(n.viewId);
  return '<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--rule-soft);padding-bottom:8px">' +
    '<div><a href="#/note/' + n.id + '"><b>' + esc(n.title) + '</b></a>' +
    '<div class="muted small">' + esc(noteAuthors(n)) + '　·　' + (v ? esc(v.title) : '') + '　·　' + fmtDate(n.createdAt) + '</div></div>' +
    '<span class="pill">第 ' + epistemicLevel(n) + ' 級</span></div>';
}

/* --- 視圖畫布 --- */
function viewKBCanvas(vid){
  const v = getView(vid);
  if (!v) return '<div class="empty"><h3>找不到這個視圖</h3><a class="btn" href="#/kb">回知識建構空間</a></div>';
  const ns = notesOfView(vid);
  const it = v.origin ? getItem(v.origin.iid) : null;

  const notesHTML = ns.map(function(n){
    const scaf = (n.segs || [])[0];
    const cls = ['note', n.kind === 'problem' ? 'problem' : '', n.kind === 'rise' ? 'rise' : '',
                 isUnread(n) ? 'unread' : '', KBPICK[n.id] ? 'sel' : ''].filter(Boolean).join(' ');
    const scls = scaf ? (scaffold(scaf.s) || {}).cls : '';
    return '<div class="' + cls + ' ' + (scls || '') + '" style="left:' + n.x + 'px;top:' + n.y + 'px"' +
      ' data-note="' + n.id + '" tabindex="0" role="button" aria-label="貼文 ' + esc(n.title) + '">' +
      '<div class="nt">' + esc(n.title) + '</div>' +
      (scaf ? '<div class="small" style="color:var(--' + ((scaffold(scaf.s) || {}).cls || '').replace('sc', 'sc-') +
        ');font-size:11px;font-weight:600;margin-bottom:2px">' + esc(scaffoldLabel(scaf.s)) + '</div>' : '') +
      '<div class="nb">' + esc((scaf ? scaf.text : '').slice(0, 90)) + '</div>' +
      '<div class="nf"><span>' + esc(noteAuthors(n)) + '</span>' +
        (childrenOf(n.id).length ? '<span>↳' + childrenOf(n.id).length + '</span>' : '') +
        ((n.reads || []).length ? '<span>👁' + n.reads.length + '</span>' : '') +
        ((n.annotations || []).length ? '<span>✎' + n.annotations.length + '</span>' : '') +
      '</div></div>';
  }).join('');

  // 連線
  const pos = {};
  ns.forEach(function(n){ pos[n.id] = {x: n.x + 108, y: n.y + 40}; });
  const edges = [];
  ns.forEach(function(n){
    if (n.buildOn && pos[n.buildOn]) edges.push(curve(pos[n.buildOn], pos[n.id], 'build'));
    (n.contains || []).forEach(function(c){ if (pos[c]) edges.push(curve(pos[c], pos[n.id], 'rise')); });
    (n.refs || []).forEach(function(r){ if (pos[r.noteId]) edges.push(curve(pos[r.noteId], pos[n.id], 'ref')); });
  });

  return sectionHead(v.title, v.desc, '<a class="btn" href="#/kb">← 所有視圖</a>' +
      '<a class="btn" href="#/synth/' + v.id + '">想法串綜整</a>') +
    (it ? '<div class="card card-p" style="margin-bottom:14px;border-left:3px solid var(--q2)">' +
      '<div class="eyebrow">這個視圖從哪裡來</div>' +
      '<p class="small" style="margin-top:6px">來自 <a href="#/assign/' + v.origin.aid + '">' +
      esc((getAssignment(v.origin.aid) || {}).title || '') + '</a> 第 ' + it.no + ' 題的 KIDMAP 迷思象限。</p>' +
      '<div class="item"><div class="stem">' + esc(it.stem) + '</div>' +
      '<div class="muted small">' + it.options.map(function(o, k){ return String.fromCharCode(65 + k) + '. ' + esc(o); }).join('　') + '</div></div>' +
      '</div>' : '') +
    '<div class="kb-toolbar">' +
      '<button class="btn primary sm" data-act="new-note" data-id="' + v.id + '">貼一則新想法</button>' +
      '<button class="btn sm' + (KBSEL ? ' primary' : '') + '" data-act="toggle-sel">' +
        (KBSEL ? '選取中（' + Object.keys(KBPICK).length + '）' : '選取貼文做躍升') + '</button>' +
      (KBSEL && Object.keys(KBPICK).length >= 2 ?
        '<button class="btn sm" data-act="make-rise" data-id="' + v.id + '">建立躍升貼文</button>' : '') +
      '<div class="spacer"></div>' +
      '<span class="legend small">' +
        '<span><i class="swatch" style="background:var(--accent)"></i>延伸</span>' +
        '<span><i class="swatch" style="background:var(--sc-6)"></i>躍升收攏</span>' +
        '<span><i class="swatch" style="background:var(--sc-5)"></i>引用</span>' +
      '</span>' +
    '</div>' +
    '<div class="canvas" id="canvas"><div class="canvas-inner" id="canvasInner">' +
      '<svg class="edges" viewBox="0 0 1600 1100" preserveAspectRatio="none">' + edges.join('') + '</svg>' +
      notesHTML + '</div></div>' +
    '<div class="row" style="margin-top:10px"><span class="muted small">拖曳貼文可以重新安排版面，位置會存下來。' +
    '點一下貼文開啟完整內容、延伸與註記。</span></div>' +
    '<div class="card" style="margin-top:16px"><div class="card-h"><h3>這個視圖的支架使用</h3></div><div class="card-p">' +
      scaffoldUsageBar(ns) + '</div></div>';
}

function curve(a, b, cls){
  const mx = (a.x + b.x) / 2;
  return '<path class="' + cls + '" d="M' + a.x + ' ' + a.y + ' C' + mx + ' ' + a.y + ' ' + mx + ' ' + b.y + ' ' + b.x + ' ' + b.y + '"/>';
}

function scaffoldUsageBar(ns){
  const c = {};
  ns.forEach(function(n){ (n.segs || []).forEach(function(g){ c[g.s] = (c[g.s] || 0) + 1; }); });
  const mx = Math.max.apply(null, SCAFFOLDS.map(function(s){ return c[s.id] || 0; }).concat([1]));
  return '<div class="col">' + SCAFFOLDS.map(function(s){
    const n = c[s.id] || 0;
    return '<div class="rub-row"><span class="' + s.cls + '" style="border-left:3px solid;padding-left:8px">' + esc(s.label) + '</span>' +
      '<div class="bar"><i style="width:' + (100 * n / mx) + '%;background:var(--' + s.cls.replace('sc', 'sc-') + ')"></i></div>' +
      '<span class="lv">' + n + '</span></div>';
  }).join('') + '</div>' +
  '<p class="muted small" style="margin-top:10px">支架分布反映論述的形態。若「我的理論」遠多於「這個理論無法解釋」與「更好的理論」，' +
  '代表大家在各說各話，想法還沒有真的被改進。</p>';
}

/* --- 貼文詳頁 --- */
function viewNote(nid){
  const n = getNote(nid);
  if (!n) return '<div class="empty"><h3>找不到這則貼文</h3><a class="btn" href="#/kb">回知識建構空間</a></div>';
  markRead(nid);
  const v = getView(n.viewId);
  const root = threadRootOf(n);
  const seq = threadOf(root.id);
  const fb = cacheGet('note', n.id);
  const me = currentUser();
  const canEdit = n.authorIds.indexOf(me.id) >= 0 || isTeacher();

  return sectionHead(n.title, (v ? v.title + '　·　' : '') + noteAuthors(n) + '　·　' + fmtDateTime(n.createdAt),
    '<a class="btn" href="#/kb/' + n.viewId + '">← 回視圖</a>' +
    (canEdit ? '<button class="btn sm" data-act="edit-note" data-id="' + n.id + '">編輯</button>' : '')) +
  '<div class="grid" style="grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px">' +
  '<div class="col">' +
    noteFullHTML(n, true) +
    '<div class="card"><div class="card-h"><h3>這條想法串</h3>' +
      '<span class="muted small">' + seq.length + ' 則</span></div><div class="card-p">' +
      seq.map(function(x){
        const cur = x.note.id === n.id;
        return '<div style="margin-left:' + (x.depth * 16) + 'px;margin-bottom:8px">' +
          '<div class="row" style="gap:8px"><span class="pill">' + (x.depth ? '↳' : '●') + '</span>' +
          (cur ? '<b>' + esc(x.note.title) + '</b>' : '<a href="#/note/' + x.note.id + '">' + esc(x.note.title) + '</a>') +
          '<span class="muted small">' + esc(noteAuthors(x.note)) + '</span>' +
          '<span class="pill">第 ' + epistemicLevel(x.note) + ' 級</span></div></div>';
      }).join('') + '</div></div>' +
    '<div class="card"><div class="card-h"><h3>延伸這則想法</h3></div><div class="card-p">' +
      '<div class="sc-btns" style="margin-bottom:10px">' + SCAFFOLDS.map(function(s){
        return '<button class="sc-btn ' + s.cls + '" data-act="buildon" data-id="' + n.id + '" data-sc="' + s.id + '">' +
          esc(s.label) + '</button>';
      }).join('') + '</div>' +
      '<p class="muted small">選一個支架開始寫。支架不是格式要求，是提醒你這一則想做的事：提出理論、指出不懂的地方、' +
      '帶進新資訊、挑戰現有說法、提出更好的版本，或把大家的想法綜整起來。</p></div></div>' +
  '</div>' +
  '<div class="col">' +
    '<div class="card"><div class="card-h"><h3>AI 形成性回饋</h3>' +
      '<button class="btn sm" data-act="ai-note" data-id="' + n.id + '">' + (fb ? '重新分析' : '分析') + '</button></div>' +
      '<div class="card-p"><div id="out-ai-note" class="' + (fb ? 'ai-out' : 'muted small') + '">' +
      (fb ? md(fb) : '會評這則貼文對社群知識的貢獻、想法改進落在哪一級，以及可以立刻做的下一步。不會直接給答案。') +
      '</div></div></div>' +
    '<div class="card"><div class="card-h"><h3>註記</h3><span class="muted small">' + (n.annotations || []).length + ' 則</span></div>' +
      '<div class="card-p col">' + ((n.annotations || []).map(function(a){
        return '<div style="border-left:2px solid var(--rule);padding-left:10px">' +
          '<div class="muted small">' + esc(userName(a.authorId)) + '　' + fmtDate(a.at) + '</div>' +
          '<div class="small">' + nl2br(a.text) + '</div></div>';
      }).join('') || '<div class="muted small">還沒有人加註記。</div>') +
      '<div class="field" style="margin-top:8px"><textarea id="annText" placeholder="加一則註記（不會改動原貼文）"></textarea>' +
      '<button class="btn sm" data-act="add-ann" data-id="' + n.id + '">送出註記</button></div>' +
      '</div></div>' +
    '<div class="card"><div class="card-h"><h3>閱讀情形</h3></div><div class="card-p">' +
      '<div class="row" style="gap:5px">' + ((n.reads || []).map(function(r){
        return '<span class="pill">' + esc(userName(r)) + '</span>'; }).join('') || '<span class="muted small">還沒有人讀過。</span>') + '</div>' +
      '<p class="muted small" style="margin-top:10px">閱讀紀錄用來看社群是否真的在互相參照，不作為給分依據。</p></div></div>' +
  '</div></div>';
}

function noteFullHTML(n, full){
  const it = n.itemRef ? getItem(n.itemRef.iid) : null;
  return '<div class="card"><div class="card-p">' +
    '<div class="row" style="justify-content:space-between;margin-bottom:10px">' +
      '<span class="row" style="gap:6px">' +
        (n.kind === 'problem' ? '<span class="pill q2"><span class="dot"></span>共同問題</span>' : '') +
        (n.kind === 'rise' ? '<span class="pill" style="color:var(--sc-6);border-color:var(--sc-6)">躍升貼文</span>' : '') +
        '<span class="pill">第 ' + epistemicLevel(n) + ' 級 · ' + EPI_LABEL[epistemicLevel(n)] + '</span>' +
      '</span>' +
      '<span class="meta">' + fmtDateTime(n.createdAt) + (n.editedAt ? '（已修改）' : '') + '</span>' +
    '</div>' +
    (n.segs || []).map(function(g){
      const s = scaffold(g.s) || {cls:'', label:''};
      return '<div class="sc-seg ' + s.cls + '"><span class="lab">' + esc(s.label) + '</span>' + nl2br(g.text) + '</div>';
    }).join('') +
    (it ? '<div class="item" style="margin-top:10px"><div class="eyebrow">連結的題目</div>' +
      '<div class="stem">' + esc(it.stem) + '</div></div>' : '') +
    ((n.refs || []).length ? '<div style="margin-top:10px"><div class="eyebrow">引用</div>' +
      n.refs.map(function(r){
        const t = getNote(r.noteId);
        return '<blockquote style="margin:6px 0;padding:6px 12px;border-left:3px solid var(--sc-5)">「' +
          esc(r.quote) + '」<div class="muted small">— <a href="#/note/' + r.noteId + '">' +
          esc(t ? t.title : '已刪除的貼文') + '</a></div></blockquote>';
      }).join('') + '</div>' : '') +
    ((n.contains || []).length ? '<div style="margin-top:10px"><div class="eyebrow">這則躍升收攏了</div>' +
      '<div class="row" style="gap:6px;margin-top:6px">' + n.contains.map(function(c){
        const t = getNote(c);
        return t ? '<a class="pill" href="#/note/' + c + '">' + esc(t.title) + '</a>' : '';
      }).join('') + '</div></div>' : '') +
    ((n.keywords || []).length ? '<div class="row" style="gap:5px;margin-top:10px">' +
      n.keywords.map(function(k){ return '<span class="pill">#' + esc(k) + '</span>'; }).join('') + '</div>' : '') +
    '<div class="meta" style="margin-top:12px">作者：' + esc(noteAuthors(n)) +
      '　·　被延伸 ' + childrenOf(n.id).length + ' 次　·　閱讀 ' + (n.reads || []).length + ' 人次</div>' +
    '</div></div>';
}

/* --- 貼文編輯器 --- */
function openNoteEditor(o){
  EDIT = {
    id: o.id || null,
    viewId: o.viewId,
    title: o.title || '',
    segs: o.segs && o.segs.length ? o.segs.slice() : [{s: o.scaffold || 's1', text:''}],
    keywords: (o.keywords || []).join('、'),
    authorIds: o.authorIds || [currentUser().id],
    buildOn: o.buildOn || null,
    contains: o.contains || [],
    refs: o.refs || [],
    kind: o.kind || 'note',
    x: o.x, y: o.y
  };
  renderEditor();
}

function renderEditor(){
  const parent = EDIT.buildOn ? getNote(EDIT.buildOn) : null;
  const others = state.notes.filter(function(n){ return n.id !== EDIT.id; });
  modal(
    '<div class="modal-h"><h3>' + (EDIT.id ? '編輯貼文' : (EDIT.kind === 'rise' ? '建立躍升貼文' : (parent ? '延伸：' + esc(parent.title) : '貼一則新想法'))) + '</h3>' +
    '<button class="btn sm ghost" data-act="close-modal">關閉</button></div>' +
    '<div class="modal-b col">' +
    (parent ? '<div class="ai-out small"><strong>你正在延伸：</strong>' + esc(parent.title) + '<br>' +
      esc(shortStem(noteText(parent))) + '</div>' : '') +
    '<div class="field"><label for="ntitle">標題</label>' +
      '<input id="ntitle" type="text" value="' + esc(EDIT.title) + '" placeholder="用一句話說出你的想法，不要只寫「我的答案」"></div>' +
    '<div><div class="eyebrow" style="margin-bottom:6px">支架段落</div>' +
    EDIT.segs.map(function(g, i){
      const s = scaffold(g.s) || SCAFFOLDS[0];
      return '<div class="sc-seg ' + s.cls + '" style="margin-bottom:12px">' +
        '<div class="row" style="margin-bottom:6px">' +
        '<select data-act="seg-sc" data-i="' + i + '" style="width:auto">' + SCAFFOLDS.map(function(x){
          return '<option value="' + x.id + '"' + (x.id === g.s ? ' selected' : '') + '>' + esc(x.label) + '</option>';
        }).join('') + '</select>' +
        '<span class="muted small">' + esc(s.hint) + '</span><div class="spacer"></div>' +
        (EDIT.segs.length > 1 ? '<button class="btn sm ghost" data-act="seg-del" data-i="' + i + '">移除</button>' : '') +
        '</div>' +
        '<textarea data-act="seg-text" data-i="' + i + '" placeholder="' + esc(s.hint) + '">' + esc(g.text) + '</textarea>' +
        '</div>';
    }).join('') +
    '<button class="btn sm" data-act="seg-add">＋ 再加一個支架段落</button></div>' +
    '<div class="field"><label for="nkw">關鍵詞（用、分隔）</label>' +
      '<input id="nkw" type="text" value="' + esc(EDIT.keywords) + '" placeholder="平方根、負根、反例"></div>' +
    '<div class="field"><label for="nauth">共同作者</label>' +
      '<select id="nauth" multiple size="4">' + state.users.filter(function(u){ return u.role !== 'admin'; }).map(function(u){
        return '<option value="' + u.id + '"' + (EDIT.authorIds.indexOf(u.id) >= 0 ? ' selected' : '') + '>' + esc(u.name) + '</option>';
      }).join('') + '</select><span class="muted small">按住 Ctrl／⌘ 可以多選。知識建構鼓勵共同署名。</span></div>' +
    '<div class="field"><label for="nref">引用其他貼文</label>' +
      '<select id="nref" style="width:100%"><option value="">（不引用）</option>' +
      others.map(function(n){ return '<option value="' + n.id + '">' + esc(n.title) + ' — ' + esc(noteAuthors(n)) + '</option>'; }).join('') +
      '</select><input id="nquote" type="text" placeholder="引用的句子" style="margin-top:6px"></div>' +
    '</div>' +
    '<div class="modal-f"><button class="btn" data-act="close-modal">取消</button>' +
    (EDIT.id ? '<button class="btn danger" data-act="del-note" data-id="' + EDIT.id + '">刪除這則</button>' : '') +
    '<button class="btn primary" data-act="save-note">貼上去</button></div>', {wide:false});
}

function collectEditor(){
  const t = $('#ntitle'); if (t) EDIT.title = t.value;
  const k = $('#nkw'); if (k) EDIT.keywords = k.value;
  const a = $('#nauth');
  if (a) EDIT.authorIds = Array.prototype.slice.call(a.selectedOptions).map(function(o){ return o.value; });
  $$('[data-act="seg-text"]').forEach(function(el){ EDIT.segs[+el.dataset.i].text = el.value; });
  const r = $('#nref'), q = $('#nquote');
  if (r && r.value && q && q.value.trim()){
    EDIT.refs = [{noteId:r.value, quote:q.value.trim()}];
  }
}

function saveEditor(){
  collectEditor();
  if (!EDIT.title.trim()){ toast('請先給這則貼文一個標題。'); return; }
  if (!EDIT.segs.some(function(g){ return g.text.trim(); })){ toast('至少寫一段內容再貼上去。'); return; }
  const kws = EDIT.keywords.split(/[、,，\s]+/).filter(Boolean);
  const payload = {title:EDIT.title.trim(), segs:EDIT.segs.filter(function(g){ return g.text.trim(); }),
                   keywords:kws, authorIds:EDIT.authorIds, refs:EDIT.refs};
  if (EDIT.id){
    updateNote(EDIT.id, payload);
    toast('已更新。');
  } else {
    const n = createNote(Object.assign({viewId:EDIT.viewId, buildOn:EDIT.buildOn, kind:EDIT.kind,
      contains:EDIT.contains, x:EDIT.x, y:EDIT.y}, payload));
    toast('已貼上去。想法現在屬於社群了。');
    closeModal(); EDIT = null; go('#/note/' + n.id); return;
  }
  closeModal(); EDIT = null; render();
}

function viewSynth(vid){

  viewSynth.sel = sel;

        (cached ? md(cached) : '會判讀這條想法串走到哪裡、還有哪些問題沒解決，並給一則可以直接貼上去的躍升貼文草稿。') +

  return sectionHead('雙軌評量儀表板', '把 KIDMAP 的能力估計與知識建構的論述指標放在同一張圖上。',

/* --- 手寫板 --- */
const PADS = {};
function initPads(){
  $$('canvas[data-pad]').forEach(function(cv){
    const id = cv.dataset.pad;
    if (cv._init) return;
    cv._init = true;
    const dpr = window.devicePixelRatio || 1;
    function size(){
      const w = cv.clientWidth || 600;
      cv.width = w * dpr; cv.height = 240 * dpr;
      const ctx = cv.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      redraw(id);
    }
    PADS[id] = PADS[id] || {strokes:[], color:'#12161c', width:2, cv:cv};
    PADS[id].cv = cv;
    size();
    window.addEventListener('resize', size);
    let cur = null;
    cv.addEventListener('pointerdown', function(e){
      cv.setPointerCapture(e.pointerId);
      const r = cv.getBoundingClientRect();
      cur = {color:PADS[id].color, width:PADS[id].width, pts:[[e.clientX - r.left, e.clientY - r.top]]};
      PADS[id].strokes.push(cur);
    });
    cv.addEventListener('pointermove', function(e){
      if (!cur) return;
      const r = cv.getBoundingClientRect();
      cur.pts.push([e.clientX - r.left, e.clientY - r.top]);
      redraw(id);
    });
    cv.addEventListener('pointerup', function(){ cur = null; if (QUIZ) QUIZ.strokes[id] = PADS[id].strokes; });
    cv.addEventListener('pointerleave', function(){ cur = null; });
  });
}
function redraw(id){
  const p = PADS[id]; if (!p || !p.cv) return;
  const ctx = p.cv.getContext('2d');
  ctx.clearRect(0, 0, p.cv.width, p.cv.height);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  p.strokes.forEach(function(s){
    ctx.strokeStyle = s.color; ctx.lineWidth = s.width;
    ctx.beginPath();
    s.pts.forEach(function(pt, i){ if (i) ctx.lineTo(pt[0], pt[1]); else ctx.moveTo(pt[0], pt[1]); });
    ctx.stroke();
  });
}

        '<p class="muted small" style="margin-top:8px">' + esc(it.note) + '</p>' +

    '<div class="card" style="margin-top:16px"><div class="card-h"><h3>迷思概念代碼表</h3></div>' +
    '<div class="tablewrap"><table><thead><tr><th>代碼</th><th>名稱</th><th>描述</th><th class="n">相關題數</th></tr></thead><tbody>' +
    MISCONCEPTIONS.map(function(m){
      const n = ITEMS.filter(function(i){ return Object.keys(i.why || {}).some(function(k){ return i.why[k] === m.id; }); }).length;
      return '<tr><td class="num">' + m.id + '</td><td>' + esc(m.name) + '</td><td class="small">' + esc(m.desc) +
        '</td><td class="n">' + n + '</td></tr>';
    }).join('') + '</tbody></table></div>' +
    '<div class="card-p"><p class="muted small">誘答選項掛上迷思代碼，是本系統能在<strong>不依賴語言模型</strong>的情況下' +

}

/* ==========================================================================
   92-ui-aal.js — 評量即學習事件的作答介面
   版面：左＝題幹（逐句可標記）＋計算紙；右＝作答區＋AI 夥伴對話區。

let AAL = null;

function aalInit(aid){
  const a = getAssignment(aid);
  const me = currentUser();
  AAL = {
    aid: aid, me: me.id,
    cond: conditionOfStudent(me.id),
    idx: 0,
    items: a.itemIds.map(getItem).filter(Boolean),
    answers: {}, texts: {}, notes: {}, marks: {}, checks: {}, turns: {},
    tele: {}, drafts: {}, t0: Date.now()
  };
}

function aalItem(){ return AAL.items[AAL.idx]; }
function aalTurns(iid){ return AAL.turns[iid] = AAL.turns[iid] || []; }
function aalStudentTurns(iid){
  return aalTurns(iid).filter(function(t){ return t.speaker === 'student'; }).length;
}
function aalTele(iid){
  return AAL.tele[iid] = AAL.tele[iid] || {firstKeyLatency:null, keystrokes:0, deletions:0,
    longPauses:0, lastKey:null, enter:Date.now(), prevLen:0};
}

function aalLog(type, code, extra){
  const it = aalItem();
  const k = classOfStudent(AAL.me);
  const e = {t:Date.now(), rel:Date.now() - AAL.t0, sid:AAL.me, cid:k ? k.id : null,
             cond:AAL.cond, lang:'zh', aid:AAL.aid, iid:it.id, proc:it.process || 'K',
             type:type, code:code};
  if (extra) Object.keys(extra).forEach(function(x){ e[x] = extra[x]; });
  logEvent(e);
  return e;
}

function viewAaL(aid){
  const a = getAssignment(aid);
  const me = currentUser();
  if (!a) return '<div class="empty"><h3>找不到這個評量事件</h3><a class="btn" href="#/student">回我的作業</a></div>';
  if (me.role !== 'student') return '<div class="empty"><h3>請切換成學生身分</h3>' +
    '<p>評量即學習事件是學生端的畫面。用右上角的身分選單換成班上任何一位同學，就會看到他被分派到的條件。</p></div>';
  if (submitted(aid, me.id)) { go('#/result/' + aid); return ''; }
  if (!AAL || AAL.aid !== aid || AAL.me !== me.id) aalInit(aid);

  const it = aalItem();
  const cond = condition(AAL.cond);
  const sents = splitSentences(it.stem);
  const marks = AAL.marks[it.id] = AAL.marks[it.id] || [];
  const turns = aalTurns(it.id);
  const used = aalStudentTurns(it.id);
  const maxT = (state.settings && state.settings.maxTurns) || MAX_TURNS;
  const proc = processOf(it.process || 'K');

  return '<div class="row" style="justify-content:space-between;align-items:flex-end;margin-bottom:12px">' +
      '<div><h2>' + esc(a.title) + '</h2>' +
      '<div class="muted small">' + esc(me.name) + '　·　' + esc((classOfStudent(me.id) || {}).name || '') +
      '　·　夥伴條件：<b>' + esc(cond.name) + '</b></div></div>' +
      '<div class="row"><span class="pill">第 ' + (AAL.idx + 1) + ' / ' + AAL.items.length + ' 題</span>' +
      '<button class="btn sm" data-act="aal-prev"' + (AAL.idx ? '' : ' disabled') + '>← 上一題</button>' +
      '<button class="btn sm" data-act="aal-next"' + (AAL.idx < AAL.items.length - 1 ? '' : ' disabled') + '>下一題 →</button>' +
      '<button class="btn primary sm" data-act="aal-submit">交卷</button></div>' +
    '</div>' +

    '<div class="aal">' +
    /* ---- 左欄：題幹逐句標記 ＋ 計算紙 ---- */
    '<div class="aal-text card"><div class="card-h"><h3>題目</h3>' +
      '<span class="pill">' + it.year + ' 年 · ' + esc(it.diff) + '</span>' +
      '<span class="pill ' + proc.cls + '">' + esc(proc.name) + '</span></div>' +
      '<div class="card-p">' +
      '<p class="muted small">點一下句子，標記你正在看的條件。標記只有你看得到，不會影響分數。</p>' +
      '<div class="sentences">' + sents.map(function(s, i){
        return '<span class="sent' + (marks.indexOf(i) >= 0 ? ' on' : '') + '" data-act="aal-mark" data-i="' + i + '">' +
          esc(s) + '</span>';
      }).join('') + '</div>' +
      '<hr class="hr">' +
      '<div class="eyebrow">計算紙</div>' +
      '<canvas class="pad" data-pad="aal-' + it.id + '" height="220"></canvas>' +
      '<div class="row" style="margin-top:6px">' +
        '<button class="btn sm" data-act="pad-undo" data-id="aal-' + it.id + '">復原</button>' +
        '<button class="btn sm" data-act="pad-clear" data-id="aal-' + it.id + '">清空</button>' +
      '</div>' +
    '</div></div>' +

    /* ---- 右欄：作答區 ＋ 對話／筆記 ---- */
    '<div class="aal-side">' +
      '<div class="card"><div class="card-h"><h3>我的作答</h3></div><div class="card-p">' +
      (it.type === 'mc'
        ? '<div class="opts">' + it.options.map(function(o, k){
            return '<label class="opt' + (AAL.answers[it.id] === k ? ' chosen' : '') + '">' +
              '<input type="radio" name="aal-' + it.id + '" data-act="aal-pick" data-k="' + k + '"' +
              (AAL.answers[it.id] === k ? ' checked' : '') + '>' +
              '<b>' + String.fromCharCode(65 + k) + '</b><span>' + esc(o) + '</span></label>';
          }).join('') + '</div>'
        : '<textarea data-act="aal-text" style="min-height:150px" placeholder="寫出你的解題過程與說明">' +
          esc(AAL.texts[it.id] || '') + '</textarea>') +
      '</div></div>' +

      (AAL.cond === 'control' ? aalNotePane(it) : aalDialogPane(it, cond, turns, used, maxT)) +

      '<div class="card"><div class="card-h"><h3>送出前自我檢核</h3>' +
        '<span class="muted small">勾不勾由你決定</span></div><div class="card-p col">' +
        SELF_CHECKS.map(function(c, i){
          const on = (AAL.checks[it.id] || []).indexOf(i) >= 0;
          return '<label class="opt" style="align-items:center"><input type="checkbox" data-act="aal-check" data-i="' + i + '"' +
            (on ? ' checked' : '') + '><span>' + esc(c) + '</span></label>';
        }).join('') +

function aalDialogPane(it, cond, turns, used, maxT){
  const left = maxT - used;
  return '<div class="card aal-chat"><div class="card-h">' +
    '<h3>我的夥伴：' + esc(cond.name) + '</h3>' +
    '<span class="pill">還可以說 ' + Math.max(0, left) + ' 次</span></div>' +
    '<div class="card-p">' +
    '<div class="chat" id="aalChat">' +
      '<div class="msg agent"><b>' + esc(cond.name) + '</b>' + esc(cond.frame) + '</div>' +
      turns.map(function(t){
        return '<div class="msg ' + (t.speaker === 'student' ? 'me' : 'agent') + '">' +
          (t.speaker === 'agent' ? '<b>' + esc(cond.name) + '</b>' : '') + esc(t.text) + '</div>';
      }).join('') +
      (left <= 0 ? '<div class="msg sys">這一題的對話次數用完了。換下一題會重新計算。</div>' : '') +
    '</div>' +
    '<div class="row" style="margin-top:10px;gap:6px">' +
      '<input type="text" id="aalSay" placeholder="' + (left > 0 ? '說說你現在的想法…' : '這一題已經聊完了') +
      '"' + (left > 0 ? '' : ' disabled') + ' style="flex:1">' +
      '<button class="btn primary sm" data-act="aal-say"' + (left > 0 ? '' : ' disabled') + '>送出</button>' +
    '</div>' +
    '<p class="muted small" style="margin-top:8px">夥伴不會告訴你答案，也不會說你對或錯——它只會一直問你怎麼想的。</p>' +
    '</div></div>';
}

function aalNotePane(it){
  return '<div class="card aal-chat"><div class="card-h"><h3>我的筆記</h3>' +
    '<span class="muted small">只有你看得到</span></div><div class="card-p">' +
    '<textarea data-act="aal-note" style="min-height:210px" placeholder="把你想到的、卡住的地方寫下來">' +
    esc(AAL.notes[it.id] || '') + '</textarea>' +
    '<p class="muted small" style="margin-top:8px">這一節沒有 AI 夥伴。版面與其他班完全一樣，' +
    '只是把對話區換成同樣大小的筆記區。</p>' +
    '</div></div>';
}

/* --- 互動處理 --- */
function aalMark(i){
  const it = aalItem();
  const m = AAL.marks[it.id] = AAL.marks[it.id] || [];
  const k = m.indexOf(i);
  if (k >= 0) m.splice(k, 1); else m.push(i);
  aalLog('MARK', 'M', {sent:i, on: k < 0});
  render();
}

function aalPick(k){
  const it = aalItem();
  const first = AAL.answers[it.id] === undefined;
  AAL.answers[it.id] = k;
  if (first) AAL.drafts[it.id] = {first: k, final: k};
  else AAL.drafts[it.id].final = k;
  aalLog('OPTION', 'O', {choice:k, changed: !first});
  render();
}

function aalTypeTelemetry(iid, value){
  const t = aalTele(iid);
  const now = Date.now();
  if (t.firstKeyLatency === null) t.firstKeyLatency = now - t.enter;
  if (t.lastKey && now - t.lastKey >= 3000) t.longPauses++;
  t.lastKey = now;
  if (value.length < t.prevLen) t.deletions += (t.prevLen - value.length);
  else t.keystrokes += (value.length - t.prevLen);
  t.prevLen = value.length;
}

async function aalSay(){
  const box = document.getElementById('aalSay');
  if (!box) return;
  const text = box.value.trim();
  if (!text) return;
  const it = aalItem();
  const maxT = (state.settings && state.settings.maxTurns) || MAX_TURNS;
  const used = aalStudentTurns(it.id);
  if (used >= maxT){ toast('這一題的對話次數用完了。'); return; }

  const rel = relativeProcessCode(text, it);
  const sm = sentimentOf(text);
  aalTurns(it.id).push({speaker:'student', text:text, rel:rel, at:Date.now()});
  const e = aalLog('ASK', REL_SHORT[rel], {text:text, rel:rel, turn:used + 1, sent:sm.score});
  state.dialog = state.dialog || [];
  state.dialog.push({t:e.t, sid:AAL.me, cond:AAL.cond, aid:AAL.aid, iid:it.id,
    proc:it.process, turn:used + 1, speaker:'student', text:text, rel:rel,
    ucode:codeUtteranceProcess(text), sent:sm.score});
  box.value = '';
  render();

  let reply;
  if (aiEngine() === 'llm'){
    try {
      const raw = await llmChat([
        {role:'system', content: composePrompt(AAL.cond, it.process || 'K', TURN_SCHEDULE[Math.min(used, TURN_SCHEDULE.length - 1)])},
        {role:'user', content:'【題目】' + it.stem + '\n【學生剛剛說】' + text}
      ], {max_tokens:200, temperature:0.7});
      const g = leakGuard(raw, it);
      reply = {text:g.text, qfn:TURN_SCHEDULE[Math.min(used, TURN_SCHEDULE.length - 1)],
               sub:null, engine:'llm', blocked:g.blocked, hits:g.hits};
    } catch (err) {
      reply = agentTurn(AAL.cond, it, used);
      reply.fallback = err.message;
    }
  } else {
    reply = agentTurn(AAL.cond, it, used);
  }

  aalTurns(it.id).push({speaker:'agent', text:reply.text, at:Date.now()});
  const ea = aalLog('AI', 'A', {text:reply.text, qfn:reply.qfn, sub:reply.sub,
    turn:used + 1, engine:reply.engine, blocked: !!reply.blocked});
  state.dialog.push({t:ea.t, sid:AAL.me, cond:AAL.cond, aid:AAL.aid, iid:it.id,
    proc:it.process, turn:used + 1, speaker:'agent', text:reply.text,
    qfn:reply.qfn, sub:reply.sub, ucode:reply.process || it.process, sent:0});
  save();
  render();
  const c = document.getElementById('aalChat');
  if (c) c.scrollTop = c.scrollHeight;
}

function aalSubmit(){
  const a = getAssignment(AAL.aid), me = currentUser();
  const mcs = AAL.items.filter(function(i){ return i.type === 'mc'; });
  const missing = mcs.filter(function(i){ return AAL.answers[i.id] === undefined; });
  if (missing.length && !confirm('還有 ' + missing.length + ' 題沒作答，確定要交卷嗎？')) return;

  AAL.items.forEach(function(it){
    state.responses = state.responses.filter(function(r){
      return !(r.aid === AAL.aid && r.sid === me.id && r.iid === it.id); });
    const t = AAL.tele[it.id];
    if (t){
      logEvent({t:Date.now(), rel:Date.now() - AAL.t0, sid:me.id,
        cid:(classOfStudent(me.id) || {}).id, cond:AAL.cond, lang:'zh', aid:AAL.aid,
        iid:it.id, proc:it.process, type:'TELEMETRY',
        firstKeyLatency:t.firstKeyLatency, keystrokes:t.keystrokes,
        deletions:t.deletions, longPauses:t.longPauses});
    }
    const nC = (AAL.checks[it.id] || []).length;
    logEvent({t:Date.now(), rel:Date.now() - AAL.t0, sid:me.id,
      cid:(classOfStudent(me.id) || {}).id, cond:AAL.cond, lang:'zh', aid:AAL.aid,
      iid:it.id, proc:it.process, type:'SUBMIT', code:'S', selfCheck:nC,
      draftFirst:(AAL.drafts[it.id] || {}).first, draftFinal:(AAL.drafts[it.id] || {}).final});

    if (it.type === 'cr'){
      state.responses.push({aid:AAL.aid, sid:me.id, iid:it.id, text:AAL.texts[it.id] || '',
        strokes:(PADS['aal-' + it.id] && PADS['aal-' + it.id].strokes.length) ? PADS['aal-' + it.id].strokes : null,
        score:null, comment:'', correct:null});
    } else {
      const c = AAL.answers[it.id];
      state.responses.push({aid:AAL.aid, sid:me.id, iid:it.id,
        choice: c === undefined ? null : c, correct: c === it.answer});
    }
  });
  state.submissions = state.submissions.filter(function(s){ return !(s.aid === AAL.aid && s.sid === me.id); });
  state.submissions.push({aid:AAL.aid, sid:me.id, at:Date.now()});
  save();
  const aid = AAL.aid;
  AAL = null;
  toast('已交卷。接下來是這節課的問卷。');
  go('#/survey/post');
}

function surveySubmit(phase){
  const me = currentUser();
  const cs = constructsFor(phase);
  const need = cs.reduce(function(a, c){ return a + c.items.length; }, 0);
  const got = cs.reduce(function(a, c){
    return a + c.items.filter(function(_, i){ return SURVEY.resp[c.id + '_' + i]; }).length; }, 0);
  if (got < need && !confirm('還有 ' + (need - got) + ' 題沒作答，確定要送出嗎？')) return;

  // 操弄檢核與使用感受用固定鍵存回原本的 id
  const resp = Object.assign({}, SURVEY.resp);
  MANIP_CHECK.forEach(function(m, i){ if (resp['mc_x_' + i]) resp[m.id] = resp['mc_x_' + i]; });
  SUS_ITEMS.forEach(function(s, i){ if (resp['sys_x_' + i]) resp[s.id] = resp['sys_x_' + i]; });

  state.surveys = (state.surveys || []).filter(function(s){
    return !(s.sid === me.id && s.phase === phase); });
  state.surveys.push({sid:me.id, phase:phase, at:Date.now(), resp:resp});
  save();
  SURVEY = null;
  toast('問卷已送出，謝謝你。');
  go('#/student');
}

function doReassign(){
  const seed = Math.floor(Math.random() * 900000) + 100000;
  const rnd = mulberry32(seed);
  const conds = CONDITIONS.map(function(c){ return c.id; });
  const strata = {};
  state.classes.forEach(function(c){ (strata[c.grade] = strata[c.grade] || []).push(c); });
  // 全體條件序列先洗牌，再在各分層內依序發放，確保條件在分層間平均
  let pool = [];
  const per = Math.ceil(state.classes.length / conds.length);
  for (let i = 0; i < per; i++) pool = pool.concat(conds);
  for (let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1)); const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
  }
  let k = 0;
  Object.keys(strata).sort().forEach(function(g){
    strata[g].forEach(function(c){ c.condition = pool[k++]; });
  });
  state.assignmentLog = state.assignmentLog || [];
  state.assignmentLog.push({at:Date.now(), seed:seed, stratify:'grade',
    map: state.classes.map(function(c){ return {cid:c.id, cond:c.condition}; })});
  save();
  buildDemoLogs();
  toast('已重新分派（種子 ' + seed + '）。示範日誌已依新條件重算。');
}

/* ---------- LSA ---------- */

  const sel = rLSA.cond || 'all';
  rLSA.cond = sel;
  const r = lsa(sel === 'all' ? {} : {cond:sel});
  return '<div class="card card-p" style="margin-bottom:16px">' +
    '<h3>延宕序列分析（Lag Sequential Analysis）</h3>' +
    '<p class="lead" style="margin-top:8px">把每位學生在每一題內的事件排成序列，計算相鄰兩個行為的轉移次數，' +
    '再以 Bakeman & Gottman 的<strong>調整殘差</strong>判定哪些轉移顯著高於／低於期望值（|z| ≥ 1.96）。' +
    '顯著為正的轉移代表前一個行為<strong>促進</strong>了後一個行為。</p>' +
    '<div class="row" style="margin-top:10px">' +
    '<label class="small muted">條件</label><select data-act="lsa-cond" style="width:auto">' +
    '<option value="all"' + (sel === 'all' ? ' selected' : '') + '>全部</option>' +
    CONDITIONS.map(function(c){
      return '<option value="' + c.id + '"' + (sel === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>';
    }).join('') + '</select>' +
    '<span class="muted small">序列 ' + r.nSeq + ' 段 · 事件 ' + r.nEvent + ' 次 · 轉移 ' + r.N + ' 次</span></div></div>' +

    '<div class="grid" style="grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:16px">' +
    '<div class="card"><div class="card-h"><h3>調整殘差矩陣</h3>' +
    '<span class="muted small">列＝前一個行為，欄＝後一個行為</span></div>' +
    '<div class="tablewrap"><table><thead><tr><th>z</th>' +
    r.codes.map(function(c){ return '<th class="n">' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    r.codes.map(function(c, i){
      return '<tr><th style="position:static">' + esc(c) + '<div class="muted" style="font-size:10px;font-weight:400">' +
        esc(behaviorName(c)) + '</div></th>' +
        r.codes.map(function(_, j){
          const z = r.Z[i][j];
          const on = Math.abs(z) >= 1.96;
          const col = z > 0 ? 'var(--q1)' : 'var(--q2)';
          return '<td class="n"' + (on ? ' style="font-weight:700;color:' + col + ';background:' +
            (z > 0 ? 'var(--q1-bg)' : 'var(--q2-bg)') + '"' : ' style="color:var(--ink-4)"') + '>' +
            (r.F[i][j] ? z.toFixed(2) : '—') + '</td>';
        }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>' +
    '<div class="card-p"><p class="muted small">粗體格子為顯著（|z| ≥ 1.96）。' +
    '綠色＝促進性轉移，紅色＝抑制性轉移。</p></div></div>' +

    '<div class="col">' +
      '<div class="card"><div class="card-h"><h3>顯著轉移（依 |z| 排序）</h3></div>' +
      '<div class="tablewrap"><table><thead><tr><th>轉移</th><th class="n">次數</th><th class="n">條件機率</th><th class="n">z</th></tr></thead><tbody>' +
      r.sig.slice(0, 14).map(function(s){
        return '<tr><td><b>' + esc(s.from) + ' → ' + esc(s.to) + '</b>' +
          '<div class="muted" style="font-size:11px">' + esc(behaviorName(s.from)) + ' → ' + esc(behaviorName(s.to)) + '</div></td>' +
          '<td class="n">' + s.f + '</td><td class="n">' + pct(s.p) + '</td>' +
          '<td class="n" style="color:' + (s.z > 0 ? 'var(--q1)' : 'var(--q2)') + ';font-weight:600">' +
          s.z.toFixed(2) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      (r.sig.length ? '' : '<div class="card-p muted small">沒有顯著轉移。</div>') + '</div>' +
      '<div class="card"><div class="card-h"><h3>行為編碼</h3></div><div class="card-p">' +
      '<div class="tablewrap"><table><tbody>' + BEHAVIOR_CODES.map(function(b){

function condColor(id){
  return id === 'tutor' ? 'var(--sc-1)' : id === 'tutee' ? 'var(--sc-3)'
       : id === 'peer' ? 'var(--sc-5)' : 'var(--ink-4)';
}

function enaSVG(proj){
  const W = 560, H = 460, m = 40;
  const xs = proj.pts.map(function(p){ return p.x; }), ys = proj.pts.map(function(p){ return p.y; });
  const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  const y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  const X = function(v){ return m + (W - 2 * m) * (v - x0) / ((x1 - x0) || 1); };
  const Y = function(v){ return H - m - (H - 2 * m) * (v - y0) / ((y1 - y0) || 1); };
  const p = ['<svg class="kidmap" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="ENA 投影空間">'];
  p.push('<rect class="axis" x="' + m + '" y="' + m + '" width="' + (W - 2 * m) + '" height="' + (H - 2 * m) + '" fill="none"/>');
  p.push('<line class="theta" x1="' + X(0) + '" y1="' + m + '" x2="' + X(0) + '" y2="' + (H - m) + '"/>');
  p.push('<line class="theta" x1="' + m + '" y1="' + Y(0) + '" x2="' + (W - m) + '" y2="' + Y(0) + '"/>');
  // 各條件形心
  CONDITIONS.forEach(function(c){
    const g = proj.pts.filter(function(q){ return q.cond === c.id; });
    if (!g.length) return;
    g.forEach(function(q){
      p.push('<circle cx="' + X(q.x).toFixed(1) + '" cy="' + Y(q.y).toFixed(1) + '" r="4.5" fill="' +
        condColor(c.id) + '" fill-opacity="0.55" stroke="var(--card)" stroke-width="1"><title>' +
        esc(userName(q.sid)) + '（' + esc(condition(c.id).name) + '）</title></circle>');
    });
    const cx = mean(g.map(function(q){ return q.x; })), cy = mean(g.map(function(q){ return q.y; }));
    p.push('<circle cx="' + X(cx).toFixed(1) + '" cy="' + Y(cy).toFixed(1) + '" r="9" fill="none" stroke="' +
      condColor(c.id) + '" stroke-width="2.5"/>');
    p.push('<text x="' + X(cx).toFixed(1) + '" y="' + (Y(cy) - 14).toFixed(1) + '" text-anchor="middle" fill="' +
      condColor(c.id) + '" style="font-weight:600">' + esc(condition(c.id).name) + '</text>');
  });
  p.push('<text x="' + (W / 2) + '" y="' + (H - 10) + '" text-anchor="middle">SVD 第一維</text>');
  p.push('<text x="14" y="' + (H / 2) + '" transform="rotate(-90 14 ' + (H / 2) + ')" text-anchor="middle">SVD 第二維</text>');
  p.push('</svg>');
  return p.join('');
}

function enaNetSVG(acc, v){
  const W = 240, H = 240, cx = 120, cy = 120, R = 82;
  const ids = acc.ids;
  const pos = ids.map(function(_, i){
    const a = -Math.PI / 2 + 2 * Math.PI * i / ids.length;
    return {x:cx + R * Math.cos(a), y:cy + R * Math.sin(a), a:a};
  });
  const mx = Math.max.apply(null, v.concat([1e-9]));
  const p = ['<svg class="sna" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="平均認知網絡">'];
  acc.pairs.forEach(function(pr, i){
    const w = v[i] / mx;
    if (w < 0.06) return;
    p.push('<line x1="' + pos[pr[0]].x.toFixed(1) + '" y1="' + pos[pr[0]].y.toFixed(1) +
      '" x2="' + pos[pr[1]].x.toFixed(1) + '" y2="' + pos[pr[1]].y.toFixed(1) +
      '" stroke="var(--accent)" stroke-opacity="' + (0.15 + w * 0.7).toFixed(2) +
      '" stroke-width="' + (0.6 + w * 4).toFixed(2) + '"><title>' +
      esc(ENA_CODES[pr[0]].name) + ' — ' + esc(ENA_CODES[pr[1]].name) + '</title></line>');
  });
  ids.forEach(function(id, i){
    p.push('<circle cx="' + pos[i].x.toFixed(1) + '" cy="' + pos[i].y.toFixed(1) +
      '" r="4" fill="var(--ink-3)"/>');
    const lx = cx + (R + 16) * Math.cos(pos[i].a), ly = cy + (R + 16) * Math.sin(pos[i].a);
    const an = Math.cos(pos[i].a) > 0.25 ? 'start' : (Math.cos(pos[i].a) < -0.25 ? 'end' : 'middle');
    p.push('<text x="' + lx.toFixed(1) + '" y="' + (ly + 3).toFixed(1) + '" text-anchor="' + an + '">' +
      esc(ENA_CODES[i].name) + '</text>');
  });
  p.push('</svg>');
  return p.join('');
}

function sentTrajSVG(tr){
  const W = 520, H = 260, m = {t:16, r:16, b:34, l:44};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const maxT = 6;
  // 依實際資料自動縮放（最小 ±0.15），否則詞典法的分數都擠在中線附近看不出差異
  const all = [];
  CONDITIONS.forEach(function(c){
    const d = tr[c.id]; if (!d) return;
    d.byTurn.forEach(function(x){ if (x.turn <= maxT) all.push(x.mean); });
  });
  const span = Math.max(0.15, Math.max.apply(null, all.map(Math.abs).concat([0.05])) * 1.25);
  const X = function(t){ return m.l + iw * (t - 1) / (maxT - 1); };
  const Y = function(v){ return m.t + ih * (1 - (v + span) / (2 * span)); };
  const p = ['<svg class="kidmap" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="情緒軌跡">'];
  p.push('<rect class="axis" x="' + m.l + '" y="' + m.t + '" width="' + iw + '" height="' + ih + '" fill="none"/>');
  p.push('<line class="theta" x1="' + m.l + '" y1="' + Y(0) + '" x2="' + (m.l + iw) + '" y2="' + Y(0) + '"/>');
  [span, 0, -span].forEach(function(v){
    p.push('<text x="' + (m.l - 8) + '" y="' + (Y(v) + 3) + '" text-anchor="end">' +
      (v > 0 ? '+' : '') + v.toFixed(2) + '</text>');
  });
  for (let t = 1; t <= maxT; t++){
    p.push('<text x="' + X(t) + '" y="' + (H - 12) + '" text-anchor="middle">' + t + '</text>');
  }
  CONDITIONS.forEach(function(c){
    const d = tr[c.id]; if (!d || !d.byTurn.length) return;
    const pts = d.byTurn.filter(function(x){ return x.turn <= maxT; });
    if (pts.length < 2) return;
    const path = pts.map(function(x, i){
      return (i ? 'L' : 'M') + X(x.turn).toFixed(1) + ' ' + Y(x.mean).toFixed(1); }).join(' ');
    p.push('<path d="' + path + '" fill="none" stroke="' + condColor(c.id) + '" stroke-width="2"/>');
    pts.forEach(function(x){
      p.push('<circle cx="' + X(x.turn).toFixed(1) + '" cy="' + Y(x.mean).toFixed(1) + '" r="3.5" fill="' +
        condColor(c.id) + '"><title>' + esc(c.name) + ' 第 ' + x.turn + ' 回合：' + fx(x.mean, 2) +
        '（n=' + x.n + '）</title></circle>');
    });
  });
  p.push('<text x="' + (m.l + iw / 2) + '" y="' + (H - 2) + '" text-anchor="middle">回合</text>');
  p.push('</svg>');
  return p.join('');
}

  rStats.sel = sel;
  const o = outs.find(function(x){ return x.id === sel; }) || outs[0];
  const res = ancova(rows, o.get, o.cov);

  const medY = outs.find(function(x){ return x.id === 'theta_post'; });
  const mediators = ['mot_in', 'eff', 'cl_ge', 'eng_c', 'anx'].map(function(id){
    const c = constructById(id);
    return {name:c.name, get:function(r){ return r.post[id]; }};

  return '<div class="card card-p" style="margin-bottom:16px">' +
    '<h3>共變數分析與中介路徑</h3>' +

    '報告 F、p、partial η² 與 Bonferroni 校正後的事後比較；再以平行多重中介的路徑分析估計' +
    '「條件 → 動機性變項 → 表現」的間接效果，信賴區間以百分位 bootstrap 求得。</p>' +
    '<p class="muted small">本模組估計的是<strong>觀察變項</strong>路徑模型，不是含潛在變項的結構方程模型；' +

/* --- 畫布拖曳 --- */
function initCanvasDrag(){
  const inner = $('#canvasInner'); if (!inner) return;
  let drag = null;
  inner.addEventListener('pointerdown', function(e){
    const el = e.target.closest('.note'); if (!el) return;
    const n = getNote(el.dataset.note); if (!n) return;
    drag = {el:el, n:n, sx:e.clientX, sy:e.clientY, ox:n.x, oy:n.y, moved:false};
    el.setPointerCapture(e.pointerId);
  });
  inner.addEventListener('pointermove', function(e){
    if (!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
    if (!drag.moved) return;
    drag.el.style.left = Math.max(0, drag.ox + dx) + 'px';
    drag.el.style.top = Math.max(0, drag.oy + dy) + 'px';
  });
  inner.addEventListener('pointerup', function(e){
    if (!drag) return;
    const d = drag; drag = null;
    if (d.moved){
      updateNote(d.n.id, {x: parseInt(d.el.style.left, 10), y: parseInt(d.el.style.top, 10)});
      render();
    } else if (KBSEL){
      if (KBPICK[d.n.id]) delete KBPICK[d.n.id]; else KBPICK[d.n.id] = true;
      render();
    } else {
      go('#/note/' + d.n.id);
    }
  });
  inner.addEventListener('keydown', function(e){
    const el = e.target.closest('.note');
    if (el && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); go('#/note/' + el.dataset.note); }
  });
}

                right:p.right, n:p.n, quadrants:p.q};
      }),

                pass:i.pass, misRate:i.misRate, quadrants:i.q, misCode:i.misCode,
                topDistractor:i.topDistractor, q2Students:i.q2Students, q1Students:i.q1Students};
      }),
      cells: d.cells.map(function(c){

    assignments: state.assignments, responses: state.responses, submissions: state.submissions,
    views: state.views,
    notes: state.notes.map(function(n){
      return Object.assign({}, n, {epistemicLevel: epistemicLevel(n),
        domainTerms: domainTermsIn(noteFullText(n)), text: noteText(n)});
    }),
    diagnostics: {pre: packDiag(pre), post: packDiag(post)},
    discourse: discourseStats(),
    network: snaGraph(),
    community: communitySummary(),
    dualTrack: dt.rows.map(function(r){
      return {sid:r.sid, name:userName(r.sid), thetaPre:r.thetaPre, thetaPost:r.thetaPost,
              delta:r.delta, kbi:r.kbi, zone:r.zone, zoneName:DUAL_ZONE[r.zone].name};
    }),
    /* --- 評量即學習：設計、歷程與效果 --- */
    aal: {
      conditions: CONDITIONS,
      processes: PROCESSES,
      subprocesses: SUBPROCESSES,
      questionFunctions: QFUNCTIONS,
      turnSchedule: TURN_SCHEDULE,
      maxTurns: (state.settings && state.settings.maxTurns) || MAX_TURNS,
      promptModules: {
        backbone: PROMPT_BACKBONE,
        roles: PROMPT_ROLE,
        processes: PROCESSES.reduce(function(o, p){ o[p.id] = promptProcessModule(p.id); return o; }, {})
      },
      itemProcess: ITEM_PROCESS,
      assignmentLog: state.assignmentLog,
      behaviorCodes: BEHAVIOR_CODES,
      enaCodes: ENA_CODES,
      selfChecks: SELF_CHECKS
    },
    instruments: CONSTRUCTS.map(function(c){
      return {id:c.id, name:c.name, dim:c.dim, scale:c.scale.n, phase:c.phase, source:c.src,
              items:c.items, note:'自撰示範題項，非已驗證量表'};
    }),
    surveys: (state.surveys || []).map(function(s){
      return {sid:s.sid, name:userName(s.sid), phase:s.phase,
              condition:(classOfStudent(s.sid) || {}).condition,
              raw:s.resp, scores:scoreSurvey(s.resp)};
    }),
    logs: allLogs(),
    dialogue: allDialog(),
    processAnalytics: {
      lsa: (function(){ const r = lsa(); return {codes:r.codes, F:r.F, Z:r.Z, sig:r.sig, N:r.N}; })(),
      lsaByCondition: CONDITIONS.reduce(function(o, c){
        const r = lsa({cond:c.id});
        o[c.id] = {N:r.N, sig:r.sig}; return o;
      }, {}),
      ena: (function(){
        const acc = enaAccumulate(4); const pr = enaProject(acc);
        return {codes:ENA_CODES.map(function(c){ return c.id; }), window:acc.W,
                pairs:acc.pairs, units:acc.units.map(function(u){
                  return {sid:u.sid, cond:u.cond, vector:u.norm}; }),
                projection: pr ? {var1:pr.var1, var2:pr.var2,
                  points:pr.pts} : null,
                meanNetworks: enaMeanNetworks(acc)};
      })(),

    },

<button class="skip" id="skipLink" type="button">跳至主要內容</button>
<div class="app">
  <header class="topbar">
    <div class="brand"><b>KAIROS</b><span>契機 · 評量即學習平台</span></div>
    <span class="chip-demo">示範資料（模擬班級）</span>
    <div class="spacer"></div>
    <div class="row" style="gap:8px">
      <span class="row" id="classWrap" style="gap:6px">
        <label class="small muted" for="classSel">班級</label>
        <select id="classSel" style="width:auto"></select>
      </span>
      <label class="small muted" for="who">身分</label>
      <select id="who" style="width:auto"></select>
      <label class="sr-only" for="fsSel">字級</label>
      <select id="fsSel" style="width:auto" title="字級">
        <option value="1">字級 100%</option>
        <option value="1.25">字級 125%</option>
        <option value="1.5">字級 150%</option>
        <option value="1.75">字級 175%</option>
      </select>
      <button class="btn sm ghost" id="contrastBtn" aria-pressed="false" title="切換高對比模式">高對比</button>
      <button class="btn sm ghost" id="themeBtn" title="切換外觀（自動／淺色／深色）" aria-label="切換外觀（自動／淺色／深色）"><span aria-hidden="true">◐</span></button>
    </div>
  </header>
  <div class="main">
    <nav class="rail" id="rail" aria-label="主要導覽"></nav>
    <main class="stage" id="stage" tabindex="-1"><div class="wrap" id="view"></div></main>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot" role="status" aria-live="polite"></div>
